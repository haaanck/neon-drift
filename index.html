    ctx.fillStyle = grad;
    ctx.fillRect(-4, -beamH, 8, beamH);

    // Ascending Twin Energy Helix Spirals
    ctx.save();
    ctx.strokeStyle = sk.col; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (var hy = 0; hy < beamH; hy += 6){
      var hx = Math.sin((hy - G.t * 180) * 0.05) * 8;
      if (hy === 0) ctx.moveTo(hx, -hy); else ctx.lineTo(hx, -hy);
    }
    ctx.stroke();
    ctx.beginPath();
    for (var hy2 = 0; hy2 < beamH; hy2 += 6){
      var hx2 = Math.sin((hy2 - G.t * 180) * 0.05 + Math.PI) * 8;
      if (hy2 === 0) ctx.moveTo(hx2, -hy2); else ctx.lineTo(hx2, -hy2);
    }
    ctx.stroke();
    ctx.restore();

    // 2. Pulsing Ground Projection Halo & Circuit Runes
    var haloR = 26 + Math.sin(G.t*7)*5;
    ctx.beginPath(); ctx.ellipse(0, 18, haloR, haloR*0.5, 0, 0, TAU);
    ctx.strokeStyle = sk.col; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 18, haloR * 0.6, haloR*0.3, 0, 0, TAU);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1; ctx.stroke();

    // 3. Dual Concentric Celestial Gimbal Rings in 3D Perspective
    ctx.save();
    ctx.rotate(sc.rot);
    ctx.beginPath();
    ctx.ellipse(0, 0, 22, 10, sc.rot * 0.7, 0, TAU);
    ctx.strokeStyle = sk.col; ctx.lineWidth = 2; ctx.stroke();
    for (var gv = 0; gv < 4; gv++){
      var gva = gv * (TAU/4) + sc.rot * 0.7;
      ctx.beginPath(); ctx.arc(Math.cos(gva)*22, Math.sin(gva)*10, 2.5, 0, TAU);
      ctx.fillStyle = '#ffffff'; ctx.fill();
    }
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 8, -sc.rot * 1.2, 0, TAU);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();

    // 4. Faceted Quantum Crystal Polyhedron
    ctx.save();
    var crystalPulse = 0.88 + Math.sin(G.t * 7) * 0.12;
    ctx.scale(crystalPulse, crystalPulse);
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(13, -5); ctx.lineTo(13, 7);
    ctx.lineTo(0, 18); ctx.lineTo(-13, 7); ctx.lineTo(-13, -5);
    ctx.closePath();
    ctx.fillStyle = sk.col; ctx.globalAlpha = 0.45; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.globalAlpha = 0.95; ctx.stroke();

    // Inner glowing plasma heart
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU);
    ctx.fillStyle = '#ffffff'; ctx.shadowColor = sk.col; ctx.shadowBlur = 12; ctx.fill();
    ctx.shadowBlur = 0;

    // 5. Floating 3D Holographic Icon inside the crystal!
    drawIcon(sk.icon, 0, 0, 14, '#05060a');
    ctx.restore();

    // Floating Holographic Tag
    ctx.textAlign = 'center';
    ctx.font = 'bold 12px ui-monospace,monospace';
    ctx.strokeStyle = 'rgba(5, 6, 14, 0.9)'; ctx.lineWidth = 3;
    ctx.strokeText('ACTIVE SKILL: ' + sk.name, 0, -32);
    ctx.fillStyle = sk.col;
    ctx.fillText('ACTIVE SKILL: ' + sk.name, 0, -32);

    ctx.font = 'bold 10px ui-monospace,monospace';
    ctx.strokeText('[WALK NEAR TO EQUIP]', 0, -16);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('[WALK NEAR TO EQUIP]', 0, -16);
    ctx.restore();
  }


  /* floating combat text with kinetic pop-in bounce */
  ctx.textAlign = 'center';
  for (var ti = 0; ti < G.texts.length; ti++){
    var tx = G.texts[ti];
    // Dynamic pop-in bounce: scales up quickly on spawn, then smoothly floats
    var bounceScale = tx.life > 0.52 ? 1 + (tx.life - 0.52) * 1.5 : Math.max(0.68, tx.life / 0.52);

    ctx.save();
    ctx.translate(tx.x, tx.y);
    ctx.scale(bounceScale, bounceScale);
    ctx.globalAlpha = Math.min(1, tx.life * 1.8);
    ctx.font = 'bold ' + tx.size + 'px ui-monospace,monospace';

    // Bold shadow stroke for instant readability against neon FX
    ctx.strokeStyle = 'rgba(5, 6, 14, 0.9)';
    ctx.lineWidth = 3.5;
    ctx.strokeText(tx.txt, 0, 0);

    ctx.fillStyle = tx.col;
    ctx.fillText(tx.txt, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* screen flash */
  if (G.flash > 0.01){
    ctx.fillStyle = 'rgba(255,255,255,' + (G.flash*0.5) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  /* vignette */
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  /* Phase 2 Cosmic Horror Abyss Leviathan Vignette */
  if (G.boss && (G.boss.phase2 || G.boss.phase === 2) && !G.boss.dormant && G.boss.hp > 0 && G.boss.bossType === 'abyss'){
    var bPulse = 0.5 + 0.5 * Math.sin(G.t * 7.5);
    var bossVigGrad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.22, W/2, H/2, Math.max(W,H)*0.75);
    bossVigGrad.addColorStop(0, 'rgba(20, 0, 8, 0)');
    bossVigGrad.addColorStop(0.55, 'rgba(60, 0, 20, ' + (0.12 + bPulse * 0.08) + ')');
    bossVigGrad.addColorStop(1.0, 'rgba(15, 0, 5, ' + (0.55 + bPulse * 0.22) + ')');
    ctx.fillStyle = bossVigGrad;
    ctx.fillRect(0, 0, W, H);
  }

  /* Phase 2 Bio-Nightmare Voracis Void Gargantua Vignette */
  if (G.boss && (G.boss.phase2 || G.boss.phase === 2) && G.boss.hp > 0 && G.boss.bossType === 'voracis'){
    var vpPulse = 0.5 + 0.5 * Math.sin(G.t * 8.5);
    var voracisVigGrad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.20, W/2, H/2, Math.max(W,H)*0.78);
    voracisVigGrad.addColorStop(0, 'rgba(40, 0, 10, 0)');
    voracisVigGrad.addColorStop(0.55, 'rgba(140, 0, 35, ' + (0.16 + vpPulse * 0.12) + ')');
    voracisVigGrad.addColorStop(1.0, 'rgba(30, 0, 8, ' + (0.62 + vpPulse * 0.24) + ')');
    ctx.fillStyle = voracisVigGrad;
    ctx.fillRect(0, 0, W, H);
  }

  /* damage vignette */
  var lowHp = p.hp / p.maxhp;
  var pulse = lowHp < 0.35 ? (0.35 - lowHp) * (0.7 + Math.sin(G.t*7)*0.3) : 0;
  var v = Math.max(G.vig, pulse);
  if (v > 0.01){
    var grd = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.25, W/2, H/2, Math.max(W,H)*0.72);
    grd.addColorStop(0, 'rgba(255,40,70,0)');
    grd.addColorStop(1, 'rgba(255,40,70,' + (v*0.55) + ')');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  }

  /* scanlines */
  ctx.globalAlpha = 0.045;
  ctx.fillStyle = '#000000';
  for (var sy2 = 0; sy2 < H; sy2 += 3) ctx.fillRect(0, sy2, W, 1);
  ctx.globalAlpha = 1;

  drawHUD();
  drawBuffTray();
  drawSkillSwapTray();
  if (G.state === 'pause') drawPause();
  if (G.state === 'levelup') drawCards();
  if (G.state === 'dead') drawDead();
  if (G.state === 'victory') drawVictory();
  if (G.state === 'godmode') drawGodModeModal();
  updateCursor();
}

function drawMinimap(){
  var mw = 114, mh = 114;
  var mx = W - mw - 20, my = Math.round((H - mh - 16) / 2);
  var panelH = mh + 26;
  var p = G.player;
  if (!p) return;

  ctx.save();
  ctx.fillStyle = 'rgba(5, 6, 14, 0.88)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(mx, my, mw, panelH, 8);
  else ctx.rect(mx, my, mw, panelH);
  ctx.fill();
  ctx.strokeStyle = 'rgba(53, 240, 255, 0.45)';
  ctx.lineWidth = 1.5; ctx.stroke();

  // Corner tech ticks
  ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 2;
  var cl = 6;
  var cs = [[mx, my, 1, 1], [mx+mw, my, -1, 1], [mx, my+panelH, 1, -1], [mx+mw, my+panelH, -1, -1]];
  for (var ci = 0; ci < 4; ci++){
    var q = cs[ci];
    ctx.beginPath();
    ctx.moveTo(q[0] + q[2]*cl, q[1]);
    ctx.lineTo(q[0], q[1]);
    ctx.lineTo(q[0], q[1] + q[3]*cl);
    ctx.stroke();
  }

  // Radar sweep line
  var sweepA = (G.t * 2.5) % TAU;
  var pad = 8;
  var innerW = mw - pad*2, innerH = mh - pad*2;
  var cx = mx + pad + innerW/2, cy = my + pad + innerH/2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(sweepA)*48, cy + Math.sin(sweepA)*48);
  ctx.strokeStyle = 'rgba(53, 240, 255, 0.18)';
  ctx.lineWidth = 1; ctx.stroke();

  // Arena boundary box
  var scale = innerW / ARENA;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.strokeRect(mx + pad, my + pad, innerW, innerH);

  // Interior clipped rendering to prevent blips from bleeding outside boundary
  ctx.save();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(mx + pad, my + pad, innerW, innerH, 4);
  else ctx.rect(mx + pad, my + pad, innerW, innerH);
  if (ctx.clip) ctx.clip();

  // Interactive Map POIs on minimap
  if (G.boostRings){
    ctx.strokeStyle = '#35f0ff'; ctx.lineWidth = 1;
    for (var bri = 0; bri < G.boostRings.length; bri++){
      var br = G.boostRings[bri];
      var bx = mx + pad + br.x * scale;
      var by = my + pad + br.y * scale;
      ctx.beginPath(); ctx.arc(bx, by, 2.2, 0, TAU); ctx.stroke();
    }
  }

  if (G.wormholes){
    for (var whi = 0; whi < G.wormholes.length; whi++){
      var wh = G.wormholes[whi];
      var wx = mx + pad + wh.x * scale;
      var wy = my + pad + wh.y * scale;
      ctx.fillStyle = wh.col;
      ctx.beginPath(); ctx.arc(wx, wy, 2.4, 0, TAU);
      ctx.fill();
    }
  }

  // Astral Void Rift on minimap
  var miniRift = (G.astralRift && G.astralRift.active) ? G.astralRift : ((G.astralVoidRift && G.astralVoidRift.active) ? G.astralVoidRift : null);
  if (miniRift){
    var mrx = mx + pad + miniRift.x * scale;
    var mry = my + pad + miniRift.y * scale;
    var mrPulse = 3.2 + Math.sin(G.t * 8) * 1.2;
    ctx.fillStyle = '#bf55ec';
    ctx.beginPath(); ctx.arc(mrx, mry, mrPulse, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#35f0ff'; ctx.lineWidth = 1.2; ctx.stroke();
  }

  if (G.salvagePods){
    for (var spi = 0; spi < G.salvagePods.length; spi++){
      var sp = G.salvagePods[spi];
      var spx = mx + pad + sp.x * scale;
      var spy = my + pad + sp.y * scale;
      ctx.fillStyle = sp.looted ? 'rgba(120, 140, 160, 0.4)' : sp.col;
      ctx.fillRect(spx - 1.8, spy - 1.8, 3.6, 3.6);
    }
  }

  if (G.minerals){
    for (var mii = 0; mii < G.minerals.length; mii++){
      var mn = G.minerals[mii];
      if (mn.hp <= 0) continue;
      var mnx = mx + pad + mn.x * scale;
      var mny = my + pad + mn.y * scale;
      ctx.fillStyle = mn.col;
      ctx.fillRect(mnx - 0.8, mny - 0.8, 1.6, 1.6);
    }
  }

  // Entities on minimap
  if (G.skillCores){
    for (var sci = 0; sci < G.skillCores.length; sci++){
      var sc = G.skillCores[sci];
      var sx = mx + pad + sc.x * scale;
      var sy = my + pad + sc.y * scale;
      var sk = ACTIVE_SKILLS[sc.skillId];
      ctx.fillStyle = sk ? sk.col : '#35f0ff';
      ctx.beginPath(); ctx.arc(sx, sy, 3.5, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.stroke();
    }
  }

  for (var ei = 0; ei < G.enemies.length; ei++){
    var en = G.enemies[ei];
    if (en.hp <= 0) continue;
    var ex = mx + pad + en.x * scale;
    var ey = my + pad + en.y * scale;
    if (en.isBoss){
      var bPulse = 4.5 + Math.sin(G.t * 8) * 1.5;
      ctx.fillStyle = en.color;
      ctx.beginPath(); ctx.arc(ex, ey, bPulse, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.fillStyle = en.color;
      ctx.fillRect(ex - 1.2, ey - 1.2, 2.4, 2.4);
    }
  }

  var px = mx + pad + p.x * scale;
  var py = my + pad + p.y * scale;
  ctx.fillStyle = '#35f0ff';
  ctx.beginPath(); ctx.arc(px, py, 2.8, 0, TAU); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(p.aim)*6, py + Math.sin(p.aim)*6);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore(); // End interior clip

  ctx.textAlign = 'center';
  ctx.font = 'bold 9px ui-monospace,monospace';
  ctx.fillStyle = '#9fb6c8';
  var hostiles = G.enemies.filter(function(e){ return e.hp > 0; }).length;
  ctx.fillText('RADAR SCAN (' + hostiles + ')', mx + mw/2, my + pad + innerH + 11);

  // Micro legend with colored square swatches neatly enclosed in panel
  ctx.font = 'bold 8px ui-monospace,monospace';
  ctx.textAlign = 'left';
  var legY = my + pad + innerH + 22;
  // Cyan: Player
  ctx.fillStyle = '#35f0ff';
  ctx.fillRect(mx + 8, legY - 5, 5, 5);
  ctx.fillText('YOU', mx + 15, legY);
  // Red: Foe
  ctx.fillStyle = '#ff4d6d';
  ctx.fillRect(mx + 42, legY - 5, 5, 5);
  ctx.fillText('FOE', mx + 49, legY);
  // Gold: Apex
  ctx.fillStyle = '#ffe066';
  ctx.fillRect(mx + 76, legY - 5, 5, 5);
  ctx.fillText('APEX', mx + 83, legY);

  ctx.restore();
}

function drawOffscreenIndicators(){
  var p = G.player;
  if (!p) return;
  var marginLeft = 36;
  var marginRight = 158;
  var marginTop = 78;
  var marginBottom = 76;

  function renderPointer(targetX, targetY, col, label){
    var dx = targetX - p.x, dy = targetY - p.y;
    var dist = Math.hypot(dx, dy);

    var sx = W/2 + (targetX - G.camX) * ZOOM;
    var sy = H/2 + (targetY - G.camY) * ZOOM;

    if (sx >= marginLeft && sx <= W - marginRight && sy >= marginTop && sy <= H - marginBottom) return;

    var ang = Math.atan2(sy - H/2, sx - W/2);
    var edgeX = W/2, edgeY = H/2;
    var cos = Math.cos(ang), sin = Math.sin(ang);
    var effectiveTop = (cos < -0.3) ? 116 : marginTop;
    var xDist = (cos > 0 ? (W/2 - marginRight) : (-W/2 + marginLeft)) / (cos || 0.0001);
    var yDist = (sin > 0 ? (H/2 - marginBottom) : (-H/2 + effectiveTop)) / (sin || 0.0001);
    var dRay = Math.min(Math.abs(xDist), Math.abs(yDist));
    edgeX += cos * dRay;
    edgeY += sin * dRay;

    ctx.save();
    ctx.translate(edgeX, edgeY);

    ctx.rotate(ang);
    ctx.fillStyle = col;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-6, -8);
    ctx.lineTo(-2, 0);
    ctx.lineTo(-6, 8);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 10px ui-monospace,monospace';
    var textY = clamp(edgeY + (sin > 0 ? -14 : 15), effectiveTop + 10, H - marginBottom - 4);
    var textX = clamp(edgeX + (cos > 0 ? -10 : 10), marginLeft + 40, W - marginRight - 10);

    ctx.strokeStyle = 'rgba(5, 6, 14, 0.95)'; ctx.lineWidth = 3.5;
    var distText = Math.round(dist) + 'm';
    var fullLabel = label + ' [' + distText + ']';
    ctx.strokeText(fullLabel, textX, textY);
    ctx.fillStyle = col;
    ctx.fillText(fullLabel, textX, textY);
    ctx.restore();
  }

  if (G.boss && G.boss.hp > 0){
    var bossLabel = G.boss.dormant ? 'TITAN STASIS EGG' : ('APEX ' + G.boss.name);
    renderPointer(G.boss.x, G.boss.y, G.boss.color, bossLabel);
  }

  var offRift = (G.astralRift && G.astralRift.active) ? G.astralRift : ((G.astralVoidRift && G.astralVoidRift.active) ? G.astralVoidRift : null);
  if (offRift){
    renderPointer(offRift.x, offRift.y, '#bf55ec', 'ASTRAL VOID RIFT');
  }

  if (G.skillCores){
    for (var i = 0; i < G.skillCores.length; i++){
      var sc = G.skillCores[i];
      var sk = sc.skill || (sc.skillId && ACTIVE_SKILLS[sc.skillId]) || null;
      var skName = sk ? sk.name : 'SKILL CORE';
      renderPointer(sc.x, sc.y, sk ? sk.col : '#35f0ff', '[E] ' + skName);
    }
  }

  if (G.salvagePods){
    for (var spi = 0; spi < G.salvagePods.length; spi++){
      var sp = G.salvagePods[spi];
      if (sp.looted) continue;
      var sdist = Math.hypot(sp.x - p.x, sp.y - p.y);
      if (sdist <= 1500){
        renderPointer(sp.x, sp.y, sp.col, sp.name);
      }
    }
  }

  if (G.wormholes){
    for (var whi = 0; whi < G.wormholes.length; whi++){
      var wh = G.wormholes[whi];
      var wdist = Math.hypot(wh.x - p.x, wh.y - p.y);
      if (wdist <= 1100){
        renderPointer(wh.x, wh.y, wh.col, 'WARP ' + wh.id);
      }
    }
  }

  if (G.enemies.length <= 3 && !G.boss){
    for (var j = 0; j < G.enemies.length; j++){
      var en = G.enemies[j];
      if (en.hp > 0){
        renderPointer(en.x, en.y, en.color || '#ff4d6d', (en.type || 'hostile').toUpperCase());
      }
    }
  }
}

function drawTrainingDock(){
  if (!G || G.mode !== 'training') return;
  G.trainingButtons = [];

  var dockOpen = (G.trainingDockOpen !== false);
  var cat = G.trainingCategory || 'enemies';

  if (!dockOpen){
    // Collapsed Dock Tab at top center
    var tabW = 210, tabH = 30;
    var tabX = (W - tabW) / 2, tabY = 12;
    var isHoverTab = mouse.active && mouse.x >= tabX && mouse.x <= tabX + tabW && mouse.y >= tabY && mouse.y <= tabY + tabH;

    ctx.save();
    ctx.fillStyle = isHoverTab ? 'rgba(53, 240, 255, 0.35)' : 'rgba(8, 14, 28, 0.92)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(tabX, tabY, tabW, tabH, 6);
    else ctx.rect(tabX, tabY, tabW, tabH);
    ctx.fill();
    ctx.strokeStyle = isHoverTab ? '#ffffff' : '#35f0ff';
    ctx.lineWidth = isHoverTab ? 2 : 1.2;
    ctx.stroke();

    drawIcon('target', tabX + 18, tabY + 15, 12, isHoverTab ? '#ffffff' : '#35f0ff');
    ctx.textAlign = 'left';
    ctx.font = 'bold 11px ui-monospace,monospace';
    ctx.fillStyle = isHoverTab ? '#ffffff' : '#35f0ff';
    ctx.fillText('TRAINING DOCK [C]', tabX + 32, tabY + 19);

    G.trainingButtons.push({
      x: tabX, y: tabY, w: tabW, h: tabH,
      action: function(){ G.trainingDockOpen = true; sound.choose(); }
    });
    ctx.restore();
    return;
  }

  // Expanded Dock Console
  var dockW = Math.min(880, W - 28);
  var dockH = 82;
  var dockX = (W - dockW) / 2, dockY = 10;

  ctx.save();
  ctx.fillStyle = 'rgba(6, 11, 24, 0.94)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(dockX, dockY, dockW, dockH, 8);
  else ctx.rect(dockX, dockY, dockW, dockH);
  ctx.fill();
  ctx.strokeStyle = '#35f0ff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Tech corners
  var cbl = 6;
  ctx.strokeStyle = '#ffe066';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(dockX, dockY + cbl); ctx.lineTo(dockX, dockY); ctx.lineTo(dockX + cbl, dockY);
  ctx.moveTo(dockX + dockW - cbl, dockY); ctx.lineTo(dockX + dockW, dockY); ctx.lineTo(dockX + dockW, dockY + cbl);
  ctx.moveTo(dockX, dockY + dockH - cbl); ctx.lineTo(dockX, dockY + dockH); ctx.lineTo(dockX + cbl, dockY + dockH);
  ctx.moveTo(dockX + dockW - cbl, dockY + dockH); ctx.lineTo(dockX + dockW, dockY + dockH); ctx.lineTo(dockX + dockW, dockY + dockH - cbl);
  ctx.stroke();

  // Top Bar: Categories + Controls
  var topY = dockY + 7;
  var tabs = [
    { id: 'enemies', label: '1. ENEMIES', icon: 'crosshair', col: '#35f0ff' },
    { id: 'bosses',  label: '2. BOSSES',  icon: 'skull',     col: '#e0aaff' },
    { id: 'tools',   label: '3. UTILITIES',icon: 'chip',     col: '#ffe066' }
  ];

  var tabX = dockX + 12;
  for (var ti = 0; ti < tabs.length; ti++){
    var tb = tabs[ti];
    var isSel = (cat === tb.id);
    var tw = 120, th = 26;
    var isHover = mouse.active && mouse.x >= tabX && mouse.x <= tabX + tw && mouse.y >= topY && mouse.y <= topY + th;

    ctx.fillStyle = isSel ? 'rgba(53, 240, 255, 0.30)' : (isHover ? 'rgba(255, 255, 255, 0.12)' : 'rgba(255, 255, 255, 0.04)');
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(tabX, topY, tw, th, 4);
    else ctx.rect(tabX, topY, tw, th);
    ctx.fill();
    ctx.strokeStyle = isSel ? tb.col : (isHover ? '#ffffff' : 'rgba(255, 255, 255, 0.18)');
    ctx.lineWidth = isSel ? 1.5 : 1;
    ctx.stroke();

    drawIcon(tb.icon, tabX + 14, topY + 13, 11, isSel ? tb.col : (isHover ? '#ffffff' : '#829bb0'));
    ctx.textAlign = 'left';
    ctx.font = (isSel ? 'bold ' : '') + '11px ui-monospace,monospace';
    ctx.fillStyle = isSel ? '#ffffff' : (isHover ? '#ffffff' : '#829bb0');
    ctx.fillText(tb.label, tabX + 28, topY + 17);

    (function(tabId){
      G.trainingButtons.push({
        x: tabX, y: topY, w: tw, h: th,
        action: function(){ G.trainingCategory = tabId; sound.choose(); }
      });
    })(tb.id);

    tabX += tw + 6;
  }

  // Quick Action: Collapse Button
  var colW = 68, colH = 24;
  var colX = dockX + dockW - colW - 12;
  var isHoverCol = mouse.active && mouse.x >= colX && mouse.x <= colX + colW && mouse.y >= topY && mouse.y <= topY + colH;
  ctx.fillStyle = isHoverCol ? 'rgba(255, 255, 255, 0.20)' : 'rgba(255, 255, 255, 0.06)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(colX, topY, colW, colH, 4);
  else ctx.rect(colX, topY, colW, colH);
  ctx.fill();
  ctx.strokeStyle = isHoverCol ? '#ffffff' : 'rgba(255, 255, 255, 0.25)';
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillStyle = isHoverCol ? '#ffffff' : '#9fb6c8';
  ctx.fillText('HIDE [C]', colX + colW / 2, topY + 16);
  G.trainingButtons.push({
    x: colX, y: topY, w: colW, h: colH,
    action: function(){ G.trainingDockOpen = false; sound.choose(); }
  });

  // Home Button on Dock
  var hmW = 76, hmH = 24;
  var hmX = colX - hmW - 8;
  var isHoverHm = mouse.active && mouse.x >= hmX && mouse.x <= hmX + hmW && mouse.y >= topY && mouse.y <= topY + hmH;
  ctx.fillStyle = isHoverHm ? 'rgba(255, 77, 109, 0.32)' : 'rgba(255, 77, 109, 0.12)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(hmX, topY, hmW, hmH, 4);
  else ctx.rect(hmX, topY, hmW, hmH);
  ctx.fill();
  ctx.strokeStyle = isHoverHm ? '#ffffff' : '#ff4d6d';
  ctx.stroke();
  drawIcon('home', hmX + 12, topY + 12, 10, isHoverHm ? '#ffffff' : '#ff4d6d');
  ctx.textAlign = 'left';
  ctx.font = 'bold 10px ui-monospace,monospace';
  ctx.fillStyle = isHoverHm ? '#ffffff' : '#ff4d6d';
  ctx.fillText('HOME [H]', hmX + 23, topY + 16);
  G.trainingButtons.push({
    x: hmX, y: topY, w: hmW, h: hmH,
    action: function(){ goToTitle(); sound.choose(); }
  });

  // Hostile Count indicator
  var hostCount = G.enemies.length;
  ctx.textAlign = 'right';
  ctx.font = '11px ui-monospace,monospace';
  ctx.fillStyle = hostCount > 0 ? '#ffe066' : '#657e92';
  ctx.fillText('HOSTILES: ' + hostCount, hmX - 14, topY + 17);

  // Row 2: Category Items
  var row2Y = dockY + 42;
  var actions = [];

  if (cat === 'enemies'){
    actions = [
      { label: '+ DRIFTER', col: '#ff5400', act: function(){ spawnTrainingEnemy('drifter'); } },
      { label: '+ BRUTE', col: '#ff4d6d', act: function(){ spawnTrainingEnemy('brute'); } },
      { label: '+ SHOOTER', col: '#ffe066', act: function(){ spawnTrainingEnemy('shooter'); } },
      { label: '+ SPLITTER', col: '#00f5d4', act: function(){ spawnTrainingEnemy('splitter'); } },
      { label: '+ SHARD', col: '#e0aaff', act: function(){ spawnTrainingEnemy('shard'); } },
      { label: '+ MINION', col: '#35f0ff', act: function(){ spawnTrainingEnemy('minion_geom'); } },
      { label: '+ CARAPACE', col: '#35f0ff', act: function(){ spawnTrainingEnemy('carapace'); } },
      { label: '+ MANTIS', col: '#bf55ec', act: function(){ spawnTrainingEnemy('mantis'); } },
      { label: '+ SPOREPOD', col: '#ff9f1c', act: function(){ spawnTrainingEnemy('sporepod'); } },
      { label: '+ COLOSSUS', col: '#ff3565', act: function(){ spawnTrainingEnemy('colossus'); } },
      { label: '+ SQUAD x5', col: '#ff9f1c', act: function(){
          var types = ['drifter', 'brute', 'shooter', 'splitter', 'shard'];
          for (var si = 0; si < 5; si++) spawnTrainingEnemy(types[si % types.length]);
        }
      }
    ];
  } else if (cat === 'bosses'){
    actions = [
      { label: 'VORACIS', col: '#ff0033', act: function(){ spawnTrainingBoss('voracis', true); } },
      { label: 'ABYSS TITAN', col: '#e0aaff', act: function(){ spawnTrainingBoss('abyss', true); } },
      { label: 'AEGIS PRIME', col: '#ff9f1c', act: function(){ spawnTrainingBoss('aegis', true); } },
      { label: 'VOID REAPER', col: '#bf55ec', act: function(){ spawnTrainingBoss('void', true); } },
      { label: 'POLYGON OVERMIND', col: '#00f5d4', act: function(){ spawnTrainingBoss('vector', true); } },
      { label: 'VOLT COLOSSUS', col: '#35f0ff', act: function(){ spawnTrainingBoss('volt', true); } },
      { label: 'SOLAR PHOENIX', col: '#ff5400', act: function(){ spawnTrainingBoss('inferno', true); } },
      { label: 'NEXUS OVERLORD', col: '#ffe066', act: function(){ spawnTrainingBoss('nexus', true); } },
      { label: 'STASIS EGG', col: '#829bb0', act: function(){ spawnTrainingBoss('abyss', false); } }
    ];
  } else if (cat === 'tools'){
    var isGod = !!G.trainingInvulnerable;
    actions = [
      { label: 'PURGE HOSTILES', col: '#ff4d6d', act: function(){ clearTrainingHostiles(); } },
      { label: isGod ? 'GOD MODE: ACTIVE' : 'GOD MODE: OFF', col: isGod ? '#3ddc97' : '#829bb0', act: function(){
          G.trainingInvulnerable = !G.trainingInvulnerable;
          sound.choose();
          addText(G.player.x, G.player.y - 30, G.trainingInvulnerable ? 'GOD MODE ON' : 'GOD MODE OFF', G.trainingInvulnerable ? '#3ddc97' : '#829bb0', 18);
        }
      },
      { label: 'FULL REPAIR', col: '#3ddc97', act: function(){
          G.player.hp = G.player.maxhp;
          if (G.player.maxShield) G.player.shield = G.player.maxShield;
          burst(G.player.x, G.player.y, '#3ddc97', 24);
          if (sound.goldOrb) sound.goldOrb();
          addText(G.player.x, G.player.y - 30, 'HULL & SHIELD REPAIRED', '#3ddc97', 18);
        }
      },
      { label: '+1 LEVEL', col: '#b388ff', act: function(){
          G.player.xp = G.player.xpNext;
          addXp(1);
          sound.choose();
        }
      },
      { label: 'DROP SKILL CORE', col: '#35f0ff', act: function(){
          dropRandomSkillCore(G.player.x + rnd(-80, 80), G.player.y + rnd(-80, 80));
          sound.choose();
        }
      }
    ];
  }

  // Draw action buttons
  var actGap = 6;
  var actTotalW = dockW - 24;
  var actBtnW = (actTotalW - actGap * (actions.length - 1)) / actions.length;
  var actBtnH = 30;
  var actBtnX = dockX + 12;

  for (var ai = 0; ai < actions.length; ai++){
    var aObj = actions[ai];
    var isHoverAct = mouse.active && mouse.x >= actBtnX && mouse.x <= actBtnX + actBtnW && mouse.y >= row2Y && mouse.y <= row2Y + actBtnH;

    ctx.fillStyle = isHoverAct ? 'rgba(255, 255, 255, 0.22)' : 'rgba(255, 255, 255, 0.06)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(actBtnX, row2Y, actBtnW, actBtnH, 4);
    else ctx.rect(actBtnX, row2Y, actBtnW, actBtnH);
    ctx.fill();

    ctx.strokeStyle = isHoverAct ? '#ffffff' : aObj.col;
    ctx.lineWidth = isHoverAct ? 1.8 : 1;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = 'bold 10px ui-monospace,monospace';
    ctx.fillStyle = isHoverAct ? '#ffffff' : aObj.col;
    ctx.fillText(aObj.label, actBtnX + actBtnW / 2, row2Y + 19);

    (function(actionFn){
      G.trainingButtons.push({
        x: actBtnX, y: row2Y, w: actBtnW, h: actBtnH,
        action: actionFn
      });
    })(aObj.act);

    actBtnX += actBtnW + actGap;
  }

  ctx.restore();
}

function drawHUD(){
  var p = G.player;
  if (!p) return;

  /* Boss Warning Banner */
  if (G.waveState === 'boss_warning'){
    ctx.save();
    ctx.textAlign = 'center';
    var pulse = 0.6 + Math.sin(G.t * 12) * 0.4;
    ctx.shadowBlur = 24; ctx.shadowColor = '#ff4d6d';
    ctx.font = 'bold 34px ui-monospace,monospace';
    ctx.fillStyle = '#ff4d6d';
    ctx.globalAlpha = pulse;
    ctx.fillText('APEX HOSTILE INCOMING', W/2, H * 0.32);
    drawIcon('hazard', W/2 - 240, H * 0.32 - 10, 24, '#ff4d6d');
    drawIcon('hazard', W/2 + 240, H * 0.32 - 10, 24, '#ff4d6d');

    ctx.shadowBlur = 0;
    ctx.font = 'bold 14px ui-monospace,monospace';
    ctx.fillStyle = '#ffe066';
    ctx.fillText('HOSTILE ANOMALY DETECTED', W/2, H * 0.32 + 30);
    ctx.restore();
  }

  /* Active Skill Pod [Q] Positioned Above Radar (Middle Right Edge) */
  var mw = 114, mh = 114;
  var skW = mw;
  var skH = 46;
  var mx = W - mw - 20, my = Math.round((H - mh - 16) / 2);
  var sx = mx;
  var sy = my - skH - 12;

  G.skillRectQ = { x: sx, y: sy, w: skW, h: skH };
  G.skillRectE = null;
  G.skillRect = G.skillRectQ;

  var isBuffActive = (G.buffTray && G.buffTray.active);
  var sData = p.skills ? p.skills.q : null;
  var sk = sData ? sData.skill : null;

  ctx.save();
  ctx.fillStyle = 'rgba(6, 10, 22, 0.90)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(sx, sy, skW, skH, 6);
  else ctx.rect(sx, sy, skW, skH);
  ctx.fill();

  // Artisanal specular edge highlight & mechanical corner rivets
  ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.fillRect(sx + 4, sy + 1, skW - 8, 1);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
  ctx.fillRect(sx + 3, sy + 3, 1.5, 1.5);
  ctx.fillRect(sx + skW - 4.5, sy + 3, 1.5, 1.5);

  // Keycap Badge [Q] (Left side with tactile 3D bevels)
  var kw = 18, kh = 18;
  var kx = sx + 6, ky = sy + (skH - kh)/2;
  ctx.fillStyle = (sk && sData.cd <= 0) ? sk.col : 'rgba(255, 255, 255, 0.12)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(kx, ky, kw, kh, 4);
  else ctx.rect(kx, ky, kw, kh);
  ctx.fill();
  ctx.strokeStyle = sk ? sk.col : '#5a7080'; ctx.lineWidth = 1; ctx.stroke();

  // Tactile keycap specular and shadow bevel
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(kx + 1, ky + kh - 1); ctx.lineTo(kx + 1, ky + 1); ctx.lineTo(kx + kw - 1, ky + 1); ctx.stroke();
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.beginPath(); ctx.moveTo(kx + 1, ky + kh - 1); ctx.lineTo(kx + kw - 1, ky + kh - 1); ctx.lineTo(kx + kw - 1, ky + 1); ctx.stroke();

  ctx.textAlign = 'center';
  ctx.font = 'bold 11px ui-monospace,monospace';
  ctx.fillStyle = (sk && sData.cd <= 0) ? '#05060a' : '#ffffff';
  ctx.fillText('Q', kx + kw/2, ky + 13);

  if (sk){
    var ready = (sData.cd <= 0);
    ctx.strokeStyle = ready ? sk.col : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = ready ? 1.8 : 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(sx, sy, skW, skH, 6);
    else ctx.rect(sx, sy, skW, skH);
    ctx.stroke();

    // Circular Icon Bay with recessed bezel socket
    var bayX = sx + 34, bayY = sy + skH/2;
    ctx.fillStyle = ready ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath(); ctx.arc(bayX, bayY, 10, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(bayX, bayY, 11, 0, TAU); ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)'; ctx.lineWidth = 1; ctx.stroke();
    drawIcon(sk.icon, bayX, bayY, 13, ready ? sk.col : '#829bb0');

    // Radial cooldown sweep overlay on icon bay
    if (!ready && sData.maxCd > 0){
      var cdAngleFrac = clamp(sData.cd / (sData.maxCd || 10), 0, 1);
      ctx.beginPath();
      ctx.moveTo(bayX, bayY);
      ctx.arc(bayX, bayY, 10, -Math.PI / 2, -Math.PI / 2 + TAU * cdAngleFrac, false);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fill();
    }

    // Skill Name & Status
    ctx.textAlign = 'left';
    var skDisplayName = (sk.name.split(' ')[0] || sk.name).toUpperCase();
    var nameFont = (skDisplayName.length > 7 ? 'bold 8.5px ' : 'bold 9.5px ') + 'ui-monospace,monospace';
    ctx.font = nameFont;
    ctx.fillStyle = ready ? '#ffffff' : '#9fb6c8';
    ctx.fillText(skDisplayName, sx + 48, sy + 18);

    ctx.font = 'bold 8.5px ui-monospace,monospace';
    var barTrackW = skW - 54;
    if (sData.activeT > 0){
      ctx.fillStyle = '#ffe066';
      ctx.fillText('ACTIVE ' + sData.activeT.toFixed(1) + 's', sx + 48, sy + 30);
      // Glowing Active Duration progress bar
      ctx.fillStyle = 'rgba(255, 224, 102, 0.18)';
      ctx.fillRect(sx + 48, sy + 35, barTrackW, 3);
      var actDur = sk.duration || 5.0;
      var actFrac = clamp(sData.activeT / actDur, 0, 1);
      ctx.fillStyle = '#ffe066';
      ctx.fillRect(sx + 48, sy + 35, barTrackW * actFrac, 3);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.fillRect(sx + 48, sy + 35, barTrackW * actFrac, 1);
    } else if (ready){
      ctx.fillStyle = sk.col;
      ctx.fillText('READY', sx + 48, sy + 32);
    } else {
      ctx.fillStyle = '#8fa8be';
      ctx.fillText('CD ' + sData.cd.toFixed(1) + 's', sx + 48, sy + 30);
      // Cooldown progress bar with background track
      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.fillRect(sx + 48, sy + 35, barTrackW, 3);
      var cdFrac = clamp(1 - (sData.cd / (sData.maxCd || 10)), 0, 1);
      ctx.fillStyle = sk.col;
      ctx.fillRect(sx + 48, sy + 35, barTrackW * cdFrac, 3);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.fillRect(sx + 48, sy + 35, barTrackW * cdFrac, 1);
    }
  } else {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(sx, sy, skW, skH, 6);
    else ctx.rect(sx, sy, skW, skH);
    ctx.stroke();

    drawIcon('lock', sx + 34, sy + skH/2, 11, '#5a7080');

    ctx.textAlign = 'left';
    ctx.font = 'bold 9.5px ui-monospace,monospace';
    ctx.fillStyle = '#64748b';
    ctx.fillText('VACANT', sx + 48, sy + 21);
    ctx.font = '8px ui-monospace,monospace';
    ctx.fillText('SKILL SLOT', sx + 48, sy + 32);
  }
  ctx.restore();

  /* Centered Bottom Bay: Passive Buff Telemetry Strip (Centered Horizontally) */
  var deckY = H - 56;
  var midW = Math.min(W - 36, 760);
  var midX = Math.round((W - midW) / 2);
  if (!isBuffActive && midW > 120){
    ctx.save();
    ctx.fillStyle = 'rgba(6, 10, 22, 0.78)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(midX, deckY, midW, skH, 6);
    else ctx.rect(midX, deckY, midW, skH);
    ctx.fill();

    // Brushed metal sheen gradient
    var pSheen = ctx.createLinearGradient(midX, deckY, midX, deckY + 14);
    pSheen.addColorStop(0, 'rgba(255, 255, 255, 0.07)');
    pSheen.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = pSheen;
    ctx.fillRect(midX + 2, deckY + 1, midW - 4, 14);

    ctx.strokeStyle = 'rgba(53, 240, 255, 0.28)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Artisanal corner rivets
    ctx.fillStyle = 'rgba(53, 240, 255, 0.45)';
    ctx.fillRect(midX + 4, deckY + 4, 2, 2);
    ctx.fillRect(midX + midW - 6, deckY + 4, 2, 2);
    ctx.fillRect(midX + 4, deckY + skH - 6, 2, 2);
    ctx.fillRect(midX + midW - 6, deckY + skH - 6, 2, 2);

    // Subtle side accents
    ctx.fillStyle = 'rgba(53, 240, 255, 0.6)';
    ctx.fillRect(midX + 5, deckY + 8, 2, skH - 16);
    ctx.fillRect(midX + midW - 7, deckY + 8, 2, skH - 16);

    drawIcon('chip', midX + 22, deckY + skH / 2, 14, '#35f0ff');

    var upgKeys = (p.upgrades) ? Object.keys(p.upgrades) : [];
    var totalBuffs = 0;
    var upgList = [];
    for (var ui = 0; ui < upgKeys.length; ui++){
      var uname = upgKeys[ui];
      var count = p.upgrades[uname];
      totalBuffs += count;
      upgList.push(count > 1 ? (uname + ' x' + count) : uname);
    }

    var titleText = 'PASSIVE MATRIX [' + totalBuffs + ']';
    var detailText = upgList.length > 0 ? upgList.join('  •  ') : 'NO PASSIVE MODS INSTALLED  •  DEFEAT ENEMIES TO HARVEST XP';

    // Tactile micro-swatch dot
    ctx.fillStyle = '#35f0ff';
    ctx.beginPath(); ctx.arc(midX + 34, deckY + 15, 2, 0, TAU); ctx.fill();

    ctx.textAlign = 'left';
    ctx.font = 'bold 11px ui-monospace,monospace';
    ctx.fillStyle = '#35f0ff';
    ctx.fillText(titleText, midX + 40, deckY + 18);

    var maxDetailW = midW - 165;
    ctx.font = '10px ui-monospace,monospace';
    ctx.fillStyle = '#9fb6c8';
    var curDetail = detailText;
    var dtm = ctx.measureText ? ctx.measureText(curDetail) : null;
    if (dtm && typeof dtm.width === 'number' && dtm.width > maxDetailW){
      while (curDetail.length > 6 && ctx.measureText(curDetail + '..') && ctx.measureText(curDetail + '..').width > maxDetailW){
        curDetail = curDetail.slice(0, -1);
      }
      curDetail += '..';
    }
    ctx.fillText(curDetail, midX + 40, deckY + 34);

    var xpNeeded = Math.max(0, p.xpNext - p.xp);
    ctx.textAlign = 'right';
    ctx.font = 'bold 10px ui-monospace,monospace';
    ctx.fillStyle = '#ffe066';
    ctx.fillText('LV ' + p.lvl + ' // NEXT: ' + xpNeeded + ' XP', midX + midW - 16, deckY + 21);

    var xpBarW = Math.min(85, Math.floor(midW * 0.16)), xpBarH = 4;
    var xpBarX = midX + midW - 16 - xpBarW;
    var xpBarY = deckY + 27;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fillRect(xpBarX, xpBarY, xpBarW, xpBarH);
    var xpFrac = clamp(p.xp / p.xpNext, 0, 1);
    ctx.fillStyle = '#b388ff';
    ctx.fillRect(xpBarX, xpBarY, xpBarW * xpFrac, xpBarH);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.fillRect(xpBarX, xpBarY, xpBarW * xpFrac, 1);
    ctx.restore();
  }

  /* Cockpit & Controls Anchor Metrics */
  var bw = Math.min(270, Math.max(210, Math.floor(W * 0.28)));
  var bh = (p.maxShield > 0) ? 74 : 62;
  var bx0 = 16, by0 = 16;
  var leftCockpitEnd = bx0 + bw;
  var rightControlsStart = W - 16 - (G.godModeUnlocked ? 192 : 92);

  if (G.mode === 'training'){
    drawTrainingDock();
    if (G.boss){
      var b = G.boss;
      var bProgress = clamp(b.hp / b.maxhp, 0, 1);
      var bBarW = Math.min(420, W * 0.85), bBarH = 28;
      var bBarX = (W - bBarW) / 2;
      var bBarY = (G.trainingDockOpen !== false) ? 96 : 48;
      ctx.save();
      ctx.fillStyle = 'rgba(6, 11, 24, 0.92)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bBarX, bBarY, bBarW, bBarH, 5);
      else ctx.rect(bBarX, bBarY, bBarW, bBarH);
      ctx.fill();
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 1.2;
      ctx.stroke();

      drawIcon('skull', bBarX + 16, bBarY + 14, 12, b.color);
      ctx.textAlign = 'left';
      ctx.font = 'bold 11px ui-monospace,monospace';
      ctx.fillStyle = b.color;
      ctx.fillText(b.name, bBarX + 30, bBarY + 18);

      ctx.textAlign = 'right';
      ctx.font = 'bold 11px ui-monospace,monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(Math.ceil(b.hp) + '/' + b.maxhp + ' HP (' + Math.ceil(bProgress * 100) + '%)', bBarX + bBarW - 12, bBarY + 18);

      ctx.fillStyle = b.color;
      ctx.fillRect(bBarX + 2, bBarY + bBarH - 3, (bBarW - 4) * bProgress, 2);
      ctx.restore();
    }
  } else {
  /* Top-Center Tactical Incubator & Apex Boss Combat Console */
  var isSec2Wave = (G.sector === 2 && G.wave >= 6 && G.wave <= 9);
  var pillW = Math.min(W - 32, ((G.boss && !G.boss.dormant) || isSec2Wave) ? 390 : 340);
  var pillH = 46;
  var pillX = Math.round((W - pillW) / 2);
  var pillY = 16;
  if (pillX < leftCockpitEnd + 10 || pillX + pillW > rightControlsStart - 10){
    pillY = by0 + bh + 10;
  }

  ctx.save();
  ctx.fillStyle = 'rgba(7, 11, 22, 0.92)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(pillX, pillY, pillW, pillH, 8);
  else ctx.rect(pillX, pillY, pillW, pillH);
  ctx.fill();

  // Artisanal specular sheen across top edge

    var aimCol = (p.aimAssistBonus && p.aimAssistBonus > 0) ? '#ffe066' : '#35f0ff';
    var aimLabel = (p.aimAssistBonus && p.aimAssistBonus > 0) ? 'FOCUS' : 'AIM';
    drawIcon('reticle', curBadgeX + 5, curSubY + 6, 9, aimCol);
    ctx.fillStyle = aimCol;
    ctx.fillText(aimLabel, curBadgeX + 13, curSubY + 10);
    var aimTm = ctx.measureText ? ctx.measureText(aimLabel) : null;
    curBadgeX += (aimTm && typeof aimTm.width === 'number') ? (aimTm.width + 18) : 42;
  }

  if (p.godMode && curBadgeX + 38 <= bx0 + bw){
    drawIcon('shield', curBadgeX + 5, curSubY + 6, 9, '#ffe066');
    ctx.fillStyle = '#ffe066';
    ctx.fillText('GOD', curBadgeX + 13, curSubY + 10);
  }
  ctx.restore();

  // Top-Right Control Bar: Pause [P], Audio Mute [M], Debug [G]
  var pbW = 34, pbH = 28;
  var pbX = W - pbW - 16, pbY = 16;
  G.pauseBtnRect = { x: pbX, y: pbY, w: pbW, h: pbH };

  var isPbHover = mouse.active && mouse.x >= pbX && mouse.x <= pbX + pbW && mouse.y >= pbY && mouse.y <= pbY + pbH;
  ctx.save();
  ctx.fillStyle = isPbHover ? 'rgba(53, 240, 255, 0.25)' : 'rgba(5, 6, 14, 0.85)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(pbX, pbY, pbW, pbH, 5);
  else ctx.rect(pbX, pbY, pbW, pbH);
  ctx.fill();
  ctx.strokeStyle = isPbHover ? '#ffffff' : 'rgba(53, 240, 255, 0.55)';
  ctx.lineWidth = isPbHover ? 1.5 : 1;
  ctx.stroke();

  // Two vertical pause bars
  ctx.fillStyle = isPbHover ? '#ffffff' : '#35f0ff';
  ctx.fillRect(pbX + 11, pbY + 8, 3, 12);
  ctx.fillRect(pbX + 20, pbY + 8, 3, 12);
  ctx.restore();

  // Audio Toggle Pill Button [M]
  var haW = 34, haH = 28;
  var haX = pbX - haW - 8, haY = 16;
  G.hudAudioRect = { x: haX, y: haY, w: haW, h: haH };
  var isHaHover = mouse.active && mouse.x >= haX && mouse.x <= haX + haW && mouse.y >= haY && mouse.y <= haY + haH;
  ctx.save();
  ctx.fillStyle = isHaHover ? 'rgba(53, 240, 255, 0.25)' : 'rgba(5, 6, 14, 0.85)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(haX, haY, haW, haH, 5);
  else ctx.rect(haX, haY, haW, haH);
  ctx.fill();
  ctx.strokeStyle = isHaHover ? '#ffffff' : (audioMuted ? '#ff4d6d' : 'rgba(53, 240, 255, 0.55)');
  ctx.lineWidth = isHaHover ? 1.5 : 1;
  ctx.stroke();
  drawIcon(audioMuted ? 'mute' : 'audio', haX + 17, haY + 14, 13, isHaHover ? '#ffffff' : (audioMuted ? '#ff4d6d' : '#35f0ff'));
  ctx.restore();

  // God Mode HUD Access Pill
  if (G.godModeUnlocked){
    var gHudW = 92, gHudH = 28;
    var gHudX = haX - gHudW - 8, gHudY = 16;
    G.hudGodModeRect = { x: gHudX, y: gHudY, w: gHudW, h: gHudH };
    var isHoverG = mouse.active && mouse.x >= gHudX && mouse.x <= gHudX + gHudW && mouse.y >= gHudY && mouse.y <= gHudY + gHudH;
    ctx.save();
    ctx.fillStyle = isHoverG ? 'rgba(255, 224, 102, 0.35)' : 'rgba(255, 224, 102, 0.15)';
    ctx.strokeStyle = isHoverG ? '#ffffff' : '#ffe066';
    ctx.lineWidth = isHoverG ? 2 : 1.2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(gHudX, gHudY, gHudW, gHudH, 5);
    else ctx.rect(gHudX, gHudY, gHudW, gHudH);
    ctx.fill(); ctx.stroke();
    drawIcon('chip', gHudX + 14, gHudY + 14, 12, isHoverG ? '#ffffff' : '#ffe066');
    ctx.textAlign = 'left';
    ctx.fillStyle = isHoverG ? '#ffffff' : '#ffe066';
    ctx.font = 'bold 11px ui-monospace,monospace';
    ctx.fillText('DEBUG [G]', gHudX + 26, gHudY + 18);
    ctx.restore();
  }

  // Top-Right Mission Telemetry Console
  var trW = 140, trH = 68;
  var trX = W - trW - 16, trY = 52;
  ctx.save();
  ctx.fillStyle = 'rgba(7, 11, 22, 0.88)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(trX, trY, trW, trH, 7);
  else ctx.rect(trX, trY, trW, trH);
  ctx.fill();
  ctx.strokeStyle = 'rgba(53, 240, 255, 0.35)';
  ctx.lineWidth = 1;
  ctx.stroke();

  var m = Math.floor(G.t / 60), s = Math.floor(G.t % 60);
  var timeStr = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  drawIcon('clock', trX + 16, trY + 15, 12, '#35f0ff');
  ctx.textAlign = 'right';
  ctx.font = 'bold 13px ui-monospace,monospace';
  ctx.fillStyle = '#35f0ff';
  ctx.fillText(timeStr, trX + trW - 12, trY + 19);

  drawIcon('crosshair', trX + 16, trY + 34, 11, '#9fb6c8');
  ctx.font = 'bold 11px ui-monospace,monospace';
  ctx.fillStyle = '#9fb6c8';
  ctx.fillText('PURGED ' + G.kills, trX + trW - 12, trY + 38);

  var dashReady = (!p.dashT || p.dashT <= 0);
  drawIcon('dash', trX + 16, trY + 52, 11, dashReady ? '#35f0ff' : '#657e92');
  ctx.font = 'bold 10px ui-monospace,monospace';
  ctx.fillStyle = dashReady ? '#35f0ff' : '#657e92';
  ctx.fillText(dashReady ? 'DASH READY' : 'DASH ' + (p.dashT || 0).toFixed(1) + 's', trX + trW - 12, trY + 56);
  ctx.restore();

  /* streak */
  if (G.streak > 2){
    var streakCol = G.streak >= 20 ? '#35f0ff' : (G.streak >= 15 ? '#b388ff' : (G.streak >= 10 ? '#ff4d6d' : (G.streak >= 5 ? '#ff9f1c' : '#ffe066')));
    var streakTitle = G.streak >= 20 ? 'APEX GODLIKE' : (G.streak >= 15 ? 'RAMPAGE' : (G.streak >= 10 ? 'ULTRA KILL' : (G.streak >= 5 ? 'MEGA KILL' : 'COMBO')));
    var streakBoxY = by0 + bh + 12;
    var streakBoxW = 124, streakBoxH = 34;
    ctx.save();
    ctx.fillStyle = 'rgba(6, 11, 24, 0.88)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(16, streakBoxY, streakBoxW, streakBoxH, 6);
    else ctx.rect(16, streakBoxY, streakBoxW, streakBoxH);
    ctx.fill();
    ctx.strokeStyle = streakCol;
    ctx.lineWidth = 1.2;
    ctx.stroke();

    drawIcon('flame', 30, streakBoxY + streakBoxH / 2, 14, streakCol);
    ctx.textAlign = 'left';
    ctx.font = 'bold 18px ui-monospace,monospace';
    ctx.fillStyle = streakCol;
    ctx.globalAlpha = Math.min(1, G.streakT);
    ctx.fillText('x' + G.streak, 44, streakBoxY + 18);
    ctx.font = 'bold 9px ui-monospace,monospace';
    ctx.fillStyle = '#9fb6c8';
    ctx.fillText(streakTitle, 44, streakBoxY + 29);
    ctx.restore();
  }

  drawMinimap();
  drawOffscreenIndicators();
}

function drawPause(){
  G.pauseT = (G.pauseT || 0);

  // Dark tinted frosted backdrop
  ctx.fillStyle = 'rgba(5, 6, 14, 0.84)';
  ctx.fillRect(0, 0, W, H);

  // Central tactical pause card
  var cw = Math.min(540, W * 0.94);
  var ch = G.godModeUnlocked ? 440 : 405;
  var cx0 = (W - cw) / 2;
  var cy0 = (H - ch) / 2;

  ctx.save();
  // Card background
  ctx.fillStyle = 'rgba(8, 12, 22, 0.95)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(cx0, cy0, cw, ch, 10);
  else ctx.rect(cx0, cy0, cw, ch);
  ctx.fill();

  // Artisanal specular header sheen gradient
  var pSheen = ctx.createLinearGradient(cx0, cy0, cx0, cy0 + 32);
  pSheen.addColorStop(0, 'rgba(53, 240, 255, 0.08)');
  pSheen.addColorStop(1, 'rgba(53, 240, 255, 0)');
  ctx.fillStyle = pSheen;
  ctx.fillRect(cx0 + 2, cy0 + 1, cw - 4, 32);

  // Outer glowing border
  var borderPulse = 0.55 + Math.sin(G.pauseT * 3) * 0.2;
  ctx.strokeStyle = 'rgba(53, 240, 255, ' + borderPulse + ')';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Hardware corner studs
  ctx.fillStyle = '#ffe066';
  ctx.fillRect(cx0 + 6, cy0 + 6, 2, 2);
  ctx.fillRect(cx0 + cw - 8, cy0 + 6, 2, 2);
  ctx.fillRect(cx0 + 6, cy0 + ch - 8, 2, 2);
  ctx.fillRect(cx0 + cw - 8, cy0 + ch - 8, 2, 2);

  // Tech corner brackets
  var bl = 16;
  var corners = [[cx0, cy0, 1, 1], [cx0 + cw, cy0, -1, 1], [cx0, cy0 + ch, 1, -1], [cx0 + cw, cy0 + ch, -1, -1]];
  ctx.strokeStyle = '#ffe066';
  ctx.lineWidth = 2.5;
  for (var ci = 0; ci < 4; ci++){
    var c = corners[ci];
    ctx.beginPath();
    ctx.moveTo(c[0] + c[2]*bl, c[1]);
    ctx.lineTo(c[0], c[1]);
    ctx.lineTo(c[0], c[1] + c[3]*bl);
    ctx.stroke();
  }

  // Header tag with vector chip icon (No emojis!)
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px ui-monospace,monospace';
  ctx.fillStyle = '#ffe066';
  drawIcon('chip', W/2 - 120, cy0 + 35, 12, '#ffe066');
  ctx.fillText('TACTICAL SUSPENSION // SYSTEMS STANDBY', W/2 + 8, cy0 + 39);

  // Big Title
  ctx.font = 'bold 36px ui-monospace,monospace';
  ctx.fillStyle = '#35f0ff';
  ctx.shadowColor = '#35f0ff';
  ctx.shadowBlur = 18;
  ctx.fillText('PAUSED', W/2, cy0 + 78);
  ctx.shadowBlur = 0;

  // Divider line
  ctx.strokeStyle = 'rgba(53, 240, 255, 0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx0 + 40, cy0 + 96);
  ctx.lineTo(cx0 + cw - 40, cy0 + 96);
  ctx.stroke();

  // Mission Telemetry Grid (Stats box)
  var p = G.player;
  var m = Math.floor(G.t / 60), s = Math.floor(G.t % 60);
  var timeStr = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  var qName = (p.skills && p.skills.q && p.skills.q.skill) ? p.skills.q.skill.name : 'EMPTY';
  var qSk = (p.skills && p.skills.q && p.skills.q.skill) ? p.skills.q.skill : null;
  var totalUpgrades = (p.upgrades ? Object.keys(p.upgrades).reduce(function(a, k){ return a + p.upgrades[k]; }, 0) : 0);

  var statY = cy0 + 124;
  var col1 = cx0 + 44, col2 = cx0 + cw / 2 + 10;
  var colW = Math.floor(cw / 2 - 50);

  function drawStat(iconName, x, y, label, val, valCol){
    // Recessed telemetry pod slot
    ctx.fillStyle = 'rgba(5, 9, 18, 0.55)';
    ctx.fillRect(x - 2, y - 13, colW + 4, 18);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 0.8;
    ctx.strokeRect(x - 2, y - 13, colW + 4, 18);

    drawIcon(iconName, x + 6, y - 4, 11, valCol || '#35f0ff');
    ctx.fillStyle = '#829bb0';
    ctx.font = '11px ui-monospace,monospace';
    ctx.textAlign = 'left';
    ctx.fillText(label, x + 20, y);
    ctx.fillStyle = valCol || '#ffffff';
    ctx.font = 'bold 12px ui-monospace,monospace';
    ctx.textAlign = 'right';
    ctx.fillText(val, x + colW, y);
  }

  var bossStatText = (G.sector === 2) ?
    (G.boss ? (G.boss.hp <= 0 ? 'SLAIN' : (G.boss.phase2 ? 'PHASE 2' : 'APEX ACTIVE')) : ('WAVE ' + G.wave + '/10')) :
    (G.boss && !G.boss.dormant ? 'HATCHED' : ('STASIS: WAVE ' + Math.min(5, G.wave || 1) + '/5'));
  drawStat(G.sector === 2 ? 'skull' : 'egg', col1, statY, G.sector === 2 ? 'SECTOR 2 STATUS' : 'TITAN STATUS', bossStatText, '#ffe066');
  drawStat('clock',   col2, statY,      'TIME ACTIVE', timeStr, '#35f0ff');
  drawStat('crosshair', col1, statY + 26, 'HOSTILES PURGED', '' + G.kills, '#35f0ff');
  drawStat('flame',   col2, statY + 26, 'COMBAT STREAK', 'x' + G.streak + ' (MAX x' + G.best + ')', '#ffe066');
  drawStat('heart',   col1, statY + 52, 'HULL INTEGRITY', 'LV ' + p.lvl + ' (' + Math.ceil(p.hp) + '/' + p.maxhp + ' HP)', '#3ddc97');
  drawStat('reticle', col2, statY + 52, 'TARGET SYSTEM', 'SMOOTH AIM ASSIST', '#35f0ff');
  drawStat(qSk ? qSk.icon : 'lock', col1, statY + 78, 'SLOT [Q]', qName, qSk ? qSk.col : '#829bb0');
  drawStat('chip', col2, statY + 78, 'PASSIVE MATRIX', '' + totalUpgrades + ' INSTALLED', '#35f0ff');

  // Divider before buttons
  ctx.strokeStyle = 'rgba(53, 240, 255, 0.25)';
  ctx.beginPath();
  ctx.moveTo(cx0 + 40, cy0 + 236);
  ctx.lineTo(cx0 + cw - 40, cy0 + 236);
  ctx.stroke();

  // Action Buttons: Row 1 (Resume, Restart, Home Screen)
  var gap1 = 10;
  var btnW = (cw - 80 - gap1 * 2) / 3;
  var btnH = 46;
  var btnY = cy0 + 242;

  // 1. Resume Button
  var resX = cx0 + 40;
  G.pauseResumeRect = { x: resX, y: btnY, w: btnW, h: btnH };
  var isResHover = mouse.active && mouse.x >= resX && mouse.x <= resX + btnW && mouse.y >= btnY && mouse.y <= btnY + btnH;
  ctx.fillStyle = isResHover ? 'rgba(53, 240, 255, 0.32)' : 'rgba(53, 240, 255, 0.12)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(resX, btnY, btnW, btnH, 6);
  else ctx.rect(resX, btnY, btnW, btnH);
  ctx.fill();
  ctx.strokeStyle = isResHover ? '#ffffff' : '#35f0ff';
  ctx.lineWidth = isResHover ? 2 : 1.5;
  ctx.stroke();

  // Tactile 3D button bevel
  ctx.fillStyle = isResHover ? 'rgba(255, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.22)';
  ctx.fillRect(resX + 3, btnY + 1, btnW - 6, 1);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(resX + 3, btnY + btnH - 1, btnW - 6, 1);

  drawIcon('play', resX + btnW / 2 - 38, btnY + 16, 12, isResHover ? '#ffffff' : '#35f0ff');
  ctx.textAlign = 'center';
  ctx.font = 'bold 12px ui-monospace,monospace';
  ctx.fillStyle = isResHover ? '#ffffff' : '#35f0ff';
  ctx.fillText('RESUME', resX + btnW / 2 + 8, btnY + 20);
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillStyle = isResHover ? '#ffffff' : '#829bb0';
  ctx.fillText('[P] / [ESC]', resX + btnW / 2, btnY + 35);

  // 2. Restart Button
  var rstX = resX + btnW + gap1;
  G.pauseRestartRect = { x: rstX, y: btnY, w: btnW, h: btnH };
  var isRstHover = mouse.active && mouse.x >= rstX && mouse.x <= rstX + btnW && mouse.y >= btnY && mouse.y <= btnY + btnH;
  ctx.fillStyle = isRstHover ? 'rgba(255, 159, 28, 0.32)' : 'rgba(255, 159, 28, 0.12)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(rstX, btnY, btnW, btnH, 6);
  else ctx.rect(rstX, btnY, btnW, btnH);
  ctx.fill();
  ctx.strokeStyle = isRstHover ? '#ffffff' : '#ff9f1c';
  ctx.lineWidth = isRstHover ? 2 : 1.5;
  ctx.stroke();

  // Tactile 3D button bevel
  ctx.fillStyle = isRstHover ? 'rgba(255, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.22)';
  ctx.fillRect(rstX + 3, btnY + 1, btnW - 6, 1);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(rstX + 3, btnY + btnH - 1, btnW - 6, 1);

  drawIcon('restart', rstX + btnW / 2 - 40, btnY + 16, 12, isRstHover ? '#ffffff' : '#ff9f1c');
  ctx.textAlign = 'center';
  ctx.font = 'bold 12px ui-monospace,monospace';
  ctx.fillStyle = isRstHover ? '#ffffff' : '#ff9f1c';
  ctx.fillText('RESTART', rstX + btnW / 2 + 8, btnY + 20);
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillStyle = isRstHover ? '#ffffff' : '#829bb0';
  ctx.fillText('PRESS [R]', rstX + btnW / 2, btnY + 35);

  // 3. Home Screen Button
  var hmX = rstX + btnW + gap1;
  G.pauseHomeRect = { x: hmX, y: btnY, w: btnW, h: btnH };
  var isHmHover = mouse.active && mouse.x >= hmX && mouse.x <= hmX + btnW && mouse.y >= btnY && mouse.y <= btnY + btnH;
  ctx.fillStyle = isHmHover ? 'rgba(255, 77, 109, 0.32)' : 'rgba(255, 77, 109, 0.12)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(hmX, btnY, btnW, btnH, 6);
  else ctx.rect(hmX, btnY, btnW, btnH);
  ctx.fill();
  ctx.strokeStyle = isHmHover ? '#ffffff' : '#ff4d6d';
  ctx.lineWidth = isHmHover ? 2 : 1.5;
  ctx.stroke();

  // Tactile 3D button bevel
  ctx.fillStyle = isHmHover ? 'rgba(255, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.22)';
  ctx.fillRect(hmX + 3, btnY + 1, btnW - 6, 1);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(hmX + 3, btnY + btnH - 1, btnW - 6, 1);

  drawIcon('home', hmX + btnW / 2 - 44, btnY + 16, 12, isHmHover ? '#ffffff' : '#ff4d6d');
  ctx.textAlign = 'center';
  ctx.font = 'bold 12px ui-monospace,monospace';
  ctx.fillStyle = isHmHover ? '#ffffff' : '#ff4d6d';
  ctx.fillText('HOME', hmX + btnW / 2 + 6, btnY + 20);
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillStyle = isHmHover ? '#ffffff' : '#829bb0';
  ctx.fillText('PRESS [H]', hmX + btnW / 2, btnY + 35);

  // Row 2: Secondary Training Room button & Audio Mute Toggle
  var trnY = btnY + btnH + 10;
  var trnGap = 10;
  var audioW = 140;
  var trnW = cw - 80 - audioW - trnGap;
  var trnX = cx0 + 40;
  var audioX = trnX + trnW + trnGap;
  G.pauseTrainingRect = { x: trnX, y: trnY, w: trnW, h: 34 };
  G.pauseAudioRect = { x: audioX, y: trnY, w: audioW, h: 34 };

  var isTrnHover = mouse.active && mouse.x >= trnX && mouse.x <= trnX + trnW && mouse.y >= trnY && mouse.y <= trnY + 34;
  ctx.fillStyle = isTrnHover ? 'rgba(157, 78, 221, 0.35)' : 'rgba(157, 78, 221, 0.14)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(trnX, trnY, trnW, 34, 6);
  else ctx.rect(trnX, trnY, trnW, 34);
  ctx.fill();
  ctx.strokeStyle = isTrnHover ? '#ffffff' : '#c77dff';
  ctx.lineWidth = isTrnHover ? 2 : 1.2;
  ctx.stroke();

  drawIcon('target', trnX + trnW / 2 - 96, trnY + 17, 12, isTrnHover ? '#ffffff' : '#c77dff');
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px ui-monospace,monospace';
  ctx.fillStyle = isTrnHover ? '#ffffff' : '#c77dff';
  ctx.fillText('TRAINING MATRIX [X]', trnX + trnW / 2 + 8, trnY + 21);

  // Audio Toggle Button
  var isAudHover = mouse.active && mouse.x >= audioX && mouse.x <= audioX + audioW && mouse.y >= trnY && mouse.y <= trnY + 34;
  var audCol = audioMuted ? '#ff4d6d' : '#3ddc97';
  ctx.fillStyle = isAudHover ? (audioMuted ? 'rgba(255, 77, 109, 0.32)' : 'rgba(61, 220, 151, 0.32)') : (audioMuted ? 'rgba(255, 77, 109, 0.12)' : 'rgba(61, 220, 151, 0.12)');
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(audioX, trnY, audioW, 34, 6);
  else ctx.rect(audioX, trnY, audioW, 34);
  ctx.fill();
  ctx.strokeStyle = isAudHover ? '#ffffff' : audCol;
  ctx.lineWidth = isAudHover ? 2 : 1.2;
  ctx.stroke();

  drawIcon(audioMuted ? 'mute' : 'audio', audioX + 22, trnY + 17, 12, isAudHover ? '#ffffff' : audCol);
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px ui-monospace,monospace';
  ctx.fillStyle = isAudHover ? '#ffffff' : audCol;
  ctx.fillText(audioMuted ? 'MUTED [M]' : 'AUDIO [M]', audioX + audioW / 2 + 8, trnY + 21);

  // Row 3: God Mode Button (if unlocked)
  var isGodHover = false;
  if (G.godModeUnlocked){
    var godY = trnY + 34 + 8;
    var godW = cw - 80;
    var godX = cx0 + 40;
    G.pauseGodModeRect = { x: godX, y: godY, w: godW, h: 30 };
    isGodHover = mouse.active && mouse.x >= godX && mouse.x <= godX + godW && mouse.y >= godY && mouse.y <= godY + 30;
    ctx.fillStyle = isGodHover ? 'rgba(255, 224, 102, 0.35)' : 'rgba(255, 224, 102, 0.15)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(godX, godY, godW, 30, 6);
    else ctx.rect(godX, godY, godW, 30);
    ctx.fill();
    ctx.strokeStyle = isGodHover ? '#ffffff' : '#ffe066';
    ctx.lineWidth = isGodHover ? 2 : 1.2;
    ctx.stroke();

    drawIcon('chip', godX + godW / 2 - 130, godY + 15, 12, isGodHover ? '#ffffff' : '#ffe066');
    ctx.textAlign = 'center';
    ctx.font = 'bold 11px ui-monospace,monospace';
    ctx.fillStyle = isGodHover ? '#ffffff' : '#ffe066';
    ctx.fillText('DEBUG KERNEL STAT MANIPULATOR [G]', godX + godW / 2 + 8, godY + 19);
  }

  // Tactile pause menu hover chime (distinct button tracking)
  var curPauseHoverId = isResHover ? 'res' : (isRstHover ? 'rst' : (isHmHover ? 'home' : (isTrnHover ? 'trn' : (isAudHover ? 'aud' : (isGodHover ? 'god' : null)))));
  if (curPauseHoverId){
    if (G._lastPauseHoverId !== curPauseHoverId){
      G._lastPauseHoverId = curPauseHoverId;
      if (sound && sound.hover) sound.hover();
    }
  } else {
    G._lastPauseHoverId = null;
  }

  // Controls Quick Hint Bar (Cleanly wrapped inside pause card)
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillStyle = '#7a94a8';
  var hintY = cy0 + (G.godModeUnlocked ? 388 : 358);
  ctx.fillText('CONTROLS: [WASD] Move  •  [ARROWS] Directional Fire  •  [SPACE] Dash', W / 2, hintY);
  ctx.fillText('[Q] Active Skill  •  [P] Pause  •  [H] Home  •  [M] Audio', W / 2, hintY + 14);

  ctx.restore();
}

function drawBuffTray(){
  if (!G.buffTray || (!G.buffTray.active && G.buffTray.animY > H + 160)) return;

  var cards = G.buffTray.cards || [];
  if (!cards.length) return;

  var cardY = G.buffTray.animY;
  var ch = 44;
  var gap = 12;
  var maxTrayW = Math.min(W - 80, 720);
  var cw = Math.min(220, Math.floor((maxTrayW - gap * (cards.length - 1)) / cards.length));
  var totalW = cw * cards.length + gap * (cards.length - 1);
  var startX = Math.round((W - totalW) / 2);

  ctx.save();

  var hoveredCard = null;
  for (var hi = 0; hi < cards.length; hi++){
    var hx = startX + hi * (cw + gap);
    if (mouse && mouse.active && mouse.x >= hx && mouse.x <= hx + cw && mouse.y >= cardY && mouse.y <= cardY + ch){
      hoveredCard = cards[hi];
      break;
    }
  }

  // Floating compact prompt above cards (Rendered only when not hovering a card to prevent visual overlap)
  if (!hoveredCard){
    var promptY = cardY - 9;
    var pulse = 0.85 + Math.sin(G.t * 8) * 0.15;
    ctx.save();
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 11px ui-monospace,monospace';
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, Math.max(0, (H - cardY + 50) / 100)) * pulse;
    var promptText;
    if (G.pendingSkill){
      promptText = 'CORE CAPACITY REACHED // ' + G.pendingSkill.name.toUpperCase() + ' (CD ' + G.pendingSkill.cd + 's) // CHOOSE REPLACEMENT';
    } else {
      var queueText = (G.queue > 1 ? ('  [+' + (G.queue - 1) + ' READY]') : '');
      promptText = 'UPGRADES // SELECT [1] [2] [3] OR CLICK' + queueText;
    }
    ctx.fillText(promptText, W / 2, promptY);
    ctx.restore();
  }

  // Draw small, sleek compact cards with clear single-word names
  for (var i = 0; i < cards.length; i++){
    var c = cards[i];
    var cx = startX + i * (cw + gap);
    c.rect = { x: cx, y: cardY, w: cw, h: ch };

    var isHover = (hoveredCard === c);
    if (isHover){
      if (G._lastHoverBuffCard !== i){
        G._lastHoverBuffCard = i;
        if (sound && sound.hover) sound.hover();
      }
    }
    var isSkill = c.u.isSkill || false;
    var themeCol = isSkill ? '#b388ff' : '#35f0ff';
    var drawY = isHover ? cardY - 4 : cardY;

    ctx.save();

    // 1. Sleek compact glass fill with artisanal specular edge highlight
    ctx.fillStyle = isHover ? 'rgba(25, 45, 75, 0.75)' : 'rgba(8, 16, 30, 0.48)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(cx, drawY, cw, ch, 6);
    else ctx.rect(cx, drawY, cw, ch);
    ctx.fill();

    // Artisanal top specular glint & vertical micro-accent swatch
    ctx.fillStyle = isHover ? 'rgba(255, 255, 255, 0.45)' : 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(cx + 4, drawY + 1, cw - 8, 1);
    ctx.fillStyle = isHover ? '#ffe066' : themeCol;
    ctx.fillRect(cx + 2, drawY + 8, 2, ch - 16);

    // Subtle gloss edge
    if (isHover){
      ctx.fillStyle = 'rgba(255, 224, 102, 0.35)';
      ctx.fillRect(cx + 6, drawY + 1, cw - 12, 1);
    }

    // 2. High-glow border
    ctx.strokeStyle = isHover ? '#ffe066' : (isSkill ? 'rgba(179, 136, 255, 0.85)' : 'rgba(53, 240, 255, 0.75)');
    ctx.lineWidth = isHover ? 2 : 1.2;
    ctx.shadowBlur = isHover ? 12 : 5;
    ctx.shadowColor = isHover ? '#ffe066' : themeCol;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 3. Keycap Badge [1], [2], [3] (Left side with tactile 3D bevels)
    var badgeW = 24, badgeH = 22;
    var badgeX = cx + 8, badgeY = drawY + (ch - badgeH) / 2;
    ctx.fillStyle = isHover ? '#ffe066' : 'rgba(255, 224, 102, 0.18)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 4);
    else ctx.rect(badgeX, badgeY, badgeW, badgeH);
    ctx.fill();
    ctx.strokeStyle = isHover ? '#ffe066' : 'rgba(255, 224, 102, 0.6)';
    ctx.lineWidth = 1; ctx.stroke();

    // Tactile keycap bevel
    ctx.strokeStyle = isHover ? 'rgba(255, 255, 255, 0.6)' : 'rgba(255, 255, 255, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(badgeX + 1, badgeY + badgeH - 1); ctx.lineTo(badgeX + 1, badgeY + 1); ctx.lineTo(badgeX + badgeW - 1, badgeY + 1); ctx.stroke();
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.beginPath(); ctx.moveTo(badgeX + 1, badgeY + badgeH - 1); ctx.lineTo(badgeX + badgeW - 1, badgeY + badgeH - 1); ctx.lineTo(badgeX + badgeW - 1, badgeY + 1); ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = 'bold 11px ui-monospace,monospace';
    ctx.fillStyle = isHover ? '#050811' : '#ffe066';
    ctx.fillText('[' + (i + 1) + ']', badgeX + badgeW / 2, badgeY + 15);

    // 4. Vector Icon
    var iconX = cx + 44, iconY = drawY + ch / 2;
    drawIcon(c.u.icon, iconX, iconY, 16, isHover ? '#ffe066' : themeCol);

    // 5. Clear One-Word Name (responsive font measurement to avoid pill collision)
    var displayName = (c.u.isSkill ? c.u.name : (c.u.name.split(' ')[0] || c.u.name)).toUpperCase();
    var catW = 42, catH = 18;
    var maxNameW = cw - catW - 68;
    ctx.textAlign = 'left';
    ctx.font = 'bold 11px ui-monospace,monospace';
    var dnm = ctx.measureText ? ctx.measureText(displayName) : null;
    if (dnm && typeof dnm.width === 'number' && dnm.width > maxNameW){
      ctx.font = 'bold 10px ui-monospace,monospace';
    }
    ctx.fillStyle = isHover ? '#ffe066' : '#ffffff';
    ctx.fillText(displayName, cx + 58, drawY + 27);

    // 6. Category pill badge (Right side: BUFF or SKILL)
    var catX = cx + cw - catW - 8, catY = drawY + (ch - catH) / 2;
    ctx.fillStyle = isSkill ? 'rgba(179, 136, 255, 0.22)' : 'rgba(53, 240, 255, 0.18)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(catX, catY, catW, catH, 3);
    else ctx.rect(catX, catY, catW, catH);
    ctx.fill();
    ctx.strokeStyle = isSkill ? 'rgba(179, 136, 255, 0.7)' : 'rgba(53, 240, 255, 0.6)';
    ctx.lineWidth = 1; ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = 'bold 9px ui-monospace,monospace';
    ctx.fillStyle = isSkill ? '#b388ff' : '#35f0ff';
    ctx.fillText(isSkill ? 'SKILL' : 'BUFF', catX + catW / 2, catY + 13);

    ctx.restore();
  }

  if (!hoveredCard) G._lastHoverBuffCard = -1;

  // Floating Description Tooltip (Rendered ONLY when player hovers on a buff/skill)
  if (hoveredCard && hoveredCard.u && hoveredCard.u.desc){
    var hr = hoveredCard.rect;
    ctx.save();
    ctx.font = 'bold 11px ui-monospace,monospace';
    var htm = ctx.measureText ? ctx.measureText(hoveredCard.u.desc) : null;
    var textW = (htm && typeof htm.width === 'number') ? htm.width : 200;
    var tipW = Math.max(hr.w, textW + 28);
    var tipH = 26;
    var tipX = clamp(hr.x + hr.w/2 - tipW/2, 10, W - tipW - 10);
    var tipY = hr.y - tipH - 8;

    ctx.fillStyle = 'rgba(6, 12, 24, 0.95)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(tipX, tipY, tipW, tipH, 5);
    else ctx.rect(tipX, tipY, tipW, tipH);
    ctx.fill();

    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 1.3;
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(hoveredCard.u.desc, tipX + tipW / 2, tipY + 17);
    ctx.restore();
  }

  ctx.restore();
}

function drawCards(){
  ctx.fillStyle = 'rgba(5,6,10,0.85)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#35f0ff';
  ctx.font = 'bold 30px ui-monospace,monospace';
  ctx.fillText('LEVEL ' + G.player.lvl, W/2, H*0.20);
  ctx.fillStyle = '#9fb6c8';
  ctx.font = '13px ui-monospace,monospace';
  ctx.fillText('choose an upgrade  -  click or press 1 / 2 / 3', W/2, H*0.20 + 24);

  // Tactical enhancement banner
  var threatBoxW = Math.min(520, W * 0.85);
  ctx.fillStyle = 'rgba(53, 240, 255, 0.12)';
  ctx.fillRect((W - threatBoxW)/2, H*0.20 + 34, threatBoxW, 26);
  ctx.strokeStyle = '#35f0ff'; ctx.lineWidth = 1.5;
  ctx.strokeRect((W - threatBoxW)/2, H*0.20 + 34, threatBoxW, 26);
  ctx.font = 'bold 11px ui-monospace,monospace';
  ctx.fillStyle = '#35f0ff';
  drawIcon('chip', W/2 - 190, H*0.20 + 47, 12, '#35f0ff');
  ctx.fillText('TACTICAL SYNCHRONIZATION // SELECT COMBAT ENHANCEMENT', W/2 + 8, H*0.20 + 51);

  var cw = Math.min(230, (W - 90)/3), ch = 210, gap = 18;
  var total = cw*3 + gap*2;
  var x0 = (W - total)/2, y0 = H*0.35;

  var anyCardHover = false;
  for (var i = 0; i < G.cards.length; i++){
    var c = G.cards[i];
    var x = x0 + i*(cw + gap);
    c.rect = { x:x, y:y0, w:cw, h:ch };

    var isHover = (mouse && mouse.active && mouse.x >= x && mouse.x <= x + cw && mouse.y >= y0 && mouse.y <= y0 + ch);
    if (isHover){
      anyCardHover = true;
      if (G._lastHoverLevelCard !== i){
        G._lastHoverLevelCard = i;
        if (sound && sound.hover) sound.hover();
      }
    }

    var pop = 1 - Math.pow(1 - c.born, 3);
    var oy = (1 - pop) * 40 - (isHover ? 6 : 0);

    ctx.save();
    ctx.translate(x + cw/2, y0 + oy + ch/2);
    ctx.scale(0.9 + pop*0.1, 0.9 + pop*0.1);
    ctx.globalAlpha = pop;
    ctx.translate(-cw/2, -ch/2);

    ctx.fillStyle = isHover ? 'rgba(53, 240, 255, 0.16)' : 'rgba(53, 240, 255, 0.06)';
    ctx.fillRect(0, 0, cw, ch);
    ctx.strokeStyle = isHover ? '#ffe066' : 'rgba(53, 240, 255, 0.9)';
    ctx.lineWidth = isHover ? 2.5 : 2;
    if (isHover){
      ctx.shadowColor = '#ffe066';
      ctx.shadowBlur = 14;
    }
    ctx.strokeRect(1, 1, cw - 2, ch - 2);
    ctx.shadowBlur = 0;

    /* corner ticks */
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 3;
    var cl = 14;
    var cs = [[0,0,1,1],[cw,0,-1,1],[0,ch,1,-1],[cw,ch,-1,-1]];
    for (var ci = 0; ci < 4; ci++){
      var q = cs[ci];
      ctx.beginPath();
      ctx.moveTo(q[0] + q[2]*cl, q[1]);
      ctx.lineTo(q[0], q[1]);
      ctx.lineTo(q[0], q[1] + q[3]*cl);
      ctx.stroke();
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 12px ui-monospace,monospace';
    ctx.fillText('[' + (i+1) + ']', cw/2, 24);

    drawIcon(c.u.icon, cw/2, 62, 34, '#35f0ff');

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 15px ui-monospace,monospace';
    var words = c.u.name.split(' ');
    ctx.fillText(words[0], cw/2, 108);
    if (words[1]) ctx.fillText(words[1], cw/2, 126);

    ctx.fillStyle = '#9fb6c8';
    ctx.font = '12px ui-monospace,monospace';
    var dw = c.u.desc.split(' ');
    var line = '', ly = 158;
    for (var w = 0; w < dw.length; w++){
      if ((line + dw[w]).length > 22){ ctx.fillText(line.trim(), cw/2, ly); ly += 17; line = ''; }
      line += dw[w] + ' ';
    }
    ctx.fillText(line.trim(), cw/2, ly);
    ctx.restore();
  }
  if (!anyCardHover) G._lastHoverLevelCard = -1;
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
}

function drawVictory(){
  // Non-intrusive floating HUD: Keeps boss death animation, arena, and map 100% visible
  var p = G.player;
  var m = Math.floor(G.t / 60), s = Math.floor(G.t % 60);
  var timeStr = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;

  ctx.save();

  // Top sleek telemetry banner
  var barH = 48;
  ctx.fillStyle = 'rgba(4, 8, 16, 0.75)';
  ctx.fillRect(0, 0, W, barH);
  ctx.strokeStyle = 'rgba(61, 220, 151, 0.65)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, barH);
  ctx.lineTo(W, barH);
  ctx.stroke();

  // Trophy icons and victory title
  var vicTopTitle = (G.sector === 2) ? 'SECTOR 02 PURGED // APEX GARGANTUA SLAIN' : 'SECTOR PURGED // APEX TITAN SLAIN';
  ctx.font = 'bold 16px ui-monospace,monospace';
  var vtm = ctx.measureText ? ctx.measureText(vicTopTitle) : null;
  var titleHalfW = (vtm && typeof vtm.width === 'number') ? (vtm.width / 2 + 18) : 210;
  var leftTrophyX = Math.max(18, W / 2 - titleHalfW);
  var rightTrophyX = Math.min(W - 18, W / 2 + titleHalfW);
  drawIcon('trophy', leftTrophyX, 24, 15, '#ffe066');
  drawIcon('trophy', rightTrophyX, 24, 15, '#ffe066');
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3ddc97';
  ctx.shadowColor = '#3ddc97';
  ctx.shadowBlur = 10;
  ctx.fillText(vicTopTitle, W/2, 22);
  ctx.shadowBlur = 0;

  // Sub-telemetry readout
  ctx.font = 'bold 10px ui-monospace,monospace';
  ctx.fillStyle = '#ffe066';
  ctx.fillText('TIME ' + timeStr + '   KILLS ' + G.kills + '   STREAK x' + G.best + '   HULL LV ' + (p ? p.lvl : 1), W/2, 38);

  // Mission Debrief Summary Card (Active when victory animation stabilizes at t >= 2.5)
  if ((G.victoryTimer || 0) >= 2.5 && !G.victoryDismissed){

    var vch = 186;
    var vcx = (W - vcw) / 2;
    var vcy = (H - vch) / 2 - 24;

    ctx.save();
    ctx.fillStyle = 'rgba(6, 12, 22, 0.92)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(vcx, vcy, vcw, vch, 8);
    else ctx.rect(vcx, vcy, vcw, vch);
    ctx.fill();

    // Artisanal debrief specular sheen & corner brackets
    var vSheen = ctx.createLinearGradient(vcx, vcy, vcx, vcy + 24);
    vSheen.addColorStop(0, 'rgba(61, 220, 151, 0.12)');
    vSheen.addColorStop(1, 'rgba(61, 220, 151, 0)');
    ctx.fillStyle = vSheen;
    ctx.fillRect(vcx + 2, vcy + 1, vcw - 4, 24);

    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(vcx, vcy + 6); ctx.lineTo(vcx, vcy); ctx.lineTo(vcx + 6, vcy);
    ctx.moveTo(vcx + vcw - 6, vcy); ctx.lineTo(vcx + vcw, vcy); ctx.lineTo(vcx + vcw, vcy + 6);
    ctx.stroke();

    var vpPulse = 0.6 + Math.sin(G.t * 3) * 0.3;
    ctx.strokeStyle = 'rgba(61, 220, 151, ' + vpPulse + ')';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    drawIcon('trophy', W / 2 - 140, vcy + 28, 14, '#ffe066');
    drawIcon('trophy', W / 2 + 140, vcy + 28, 14, '#ffe066');

    ctx.textAlign = 'center';
    ctx.font = 'bold 16px ui-monospace,monospace';
    ctx.fillStyle = '#3ddc97';
    ctx.shadowColor = '#3ddc97';

    ctx.font = 'bold 11px ui-monospace,monospace';

    ctx.stroke();

    ctx.fillText('PEAK COMBAT STREAK: x' + G.best + '    FINAL HULL: LV ' + (p ? p.lvl : 1), W / 2, vcy + 108);

    ctx.fillStyle = '#3ddc97';
    ctx.font = 'bold 10px ui-monospace,monospace';

    ctx.fill();
    ctx.strokeStyle = b.col; ctx.lineWidth = 1; ctx.stroke();

    ctx.beginPath(); ctx.moveTo(kx + 1, ky + kh - 1); ctx.lineTo(kx + 1, ky + 1); ctx.lineTo(kx + kw - 1, ky + 1); ctx.stroke();
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.beginPath(); ctx.moveTo(kx + 1, ky + kh - 1); ctx.lineTo(kx + kw - 1, ky + kh - 1); ctx.lineTo(kx + kw - 1, ky + 1); ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = 'bold 11px ui-monospace,monospace';
    ctx.fillStyle = isHover ? '#050811' : b.col;
    ctx.fillText(b.keyText, kx + kw / 2, ky + 15);

    // Icon & Label
    var iconX = r.x + (btnW < 125 ? 36 : 44);
    drawIcon(b.icon, iconX, r.y + r.h / 2, btnW < 125 ? 12 : 14, isHover ? '#ffffff' : b.col);
    ctx.textAlign = 'left';
    var labelX = r.x + (btnW < 125 ? 48 : 58);
    var labelFont = (btnW < 125 ? 'bold 10px ' : 'bold 12px ') + 'ui-monospace,monospace';
    ctx.font = labelFont;
    ctx.fillStyle = isHover ? '#ffffff' : b.col;
    ctx.fillText(b.label, labelX, r.y + (btnW < 125 ? 25 : 26));
  }

  ctx.restore();
}

function drawDead(){
  // Frosted dark cyberpunk vignette
  ctx.fillStyle = 'rgba(5, 7, 14, 0.88)';
  ctx.fillRect(0, 0, W, H);

  var cw = Math.min(520, W * 0.92);
  var ch = 430;
  var cx0 = (W - cw) / 2;
  var cy0 = (H - ch) / 2;

  ctx.save();
  // Card background
  ctx.fillStyle = 'rgba(12, 10, 20, 0.96)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(cx0, cy0, cw, ch, 10);
  else ctx.rect(cx0, cy0, cw, ch);
  ctx.fill();

  // Artisanal warning hazard header sheen
  var dSheen = ctx.createLinearGradient(cx0, cy0, cx0, cy0 + 28);
  dSheen.addColorStop(0, 'rgba(255, 77, 109, 0.14)');
  dSheen.addColorStop(1, 'rgba(255, 77, 109, 0)');
  ctx.fillStyle = dSheen;
  ctx.fillRect(cx0 + 2, cy0 + 1, cw - 4, 28);

  // Crimson outer glowing border
  var pulse = 0.6 + Math.sin(G.t * 4) * 0.25;
  ctx.strokeStyle = 'rgba(255, 77, 109, ' + pulse + ')';
  ctx.lineWidth = 2.2;
  ctx.shadowColor = '#ff4d6d';
  ctx.shadowBlur = 16;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Tech corner brackets & hardware bolt studs
  ctx.fillStyle = '#ffe066';
  ctx.fillRect(cx0 + 6, cy0 + 6, 2, 2);
  ctx.fillRect(cx0 + cw - 8, cy0 + 6, 2, 2);
  ctx.fillRect(cx0 + 6, cy0 + ch - 8, 2, 2);
  ctx.fillRect(cx0 + cw - 8, cy0 + ch - 8, 2, 2);

  var bl = 16;
  var corners = [[cx0, cy0, 1, 1], [cx0 + cw, cy0, -1, 1], [cx0, cy0 + ch, 1, -1], [cx0 + cw, cy0 + ch, -1, -1]];
  ctx.strokeStyle = '#ffe066';
  ctx.lineWidth = 2.5;
  for (var ci = 0; ci < 4; ci++){
    var c = corners[ci];
    ctx.beginPath();
    ctx.moveTo(c[0] + c[2]*bl, c[1]);
    ctx.lineTo(c[0], c[1]);
    ctx.lineTo(c[0], c[1] + c[3]*bl);
    ctx.stroke();
  }

  // Header tag with hazard icons (Zero emojis!)
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px ui-monospace,monospace';
  ctx.fillStyle = '#ff4d6d';
  drawIcon('hazard', W/2 - 130, cy0 + 34, 13, '#ff4d6d');
  drawIcon('hazard', W/2 + 130, cy0 + 34, 13, '#ff4d6d');
  ctx.fillText('CRITICAL FAILURE // HULL COMPROMISED', W/2, cy0 + 38);

  // Big Signal Lost Title
  ctx.font = 'bold 38px ui-monospace,monospace';
  ctx.fillStyle = '#ff4d6d';
  ctx.shadowColor = '#ff4d6d';
  ctx.shadowBlur = 20;
  ctx.fillText('SIGNAL LOST', W/2, cy0 + 80);
  ctx.shadowBlur = 0;

  // Divider line
  ctx.strokeStyle = 'rgba(255, 77, 109, 0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx0 + 40, cy0 + 98);
  ctx.lineTo(cx0 + cw - 40, cy0 + 98);
  ctx.stroke();

  // Telemetry Diagnostic Grid
  var m = Math.floor(G.t / 60), s = Math.floor(G.t % 60);
  var timeStr = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  var statY = cy0 + 126;
  var col1 = cx0 + 44, col2 = cx0 + cw / 2 + 10;
  var colW = Math.floor(cw / 2 - 50);

  function drawDeadStat(iconName, x, y, label, val, valCol){
    // Recessed telemetry pod slot
    ctx.fillStyle = 'rgba(6, 4, 12, 0.55)';
    ctx.fillRect(x - 2, y - 13, colW + 4, 18);
    ctx.strokeStyle = 'rgba(255, 77, 109, 0.12)';
    ctx.lineWidth = 0.8;
    ctx.strokeRect(x - 2, y - 13, colW + 4, 18);

    drawIcon(iconName, x + 6, y - 4, 11, valCol || '#35f0ff');
    ctx.fillStyle = '#829bb0';
    ctx.font = '11px ui-monospace,monospace';
