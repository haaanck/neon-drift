            vy: Math.sin(sda) * (isP2 ? 480 : 390),
            r: 6.0, dmg: b.dmg * (isP2 ? 0.60 : 0.48),
            life: 3.2, ang: sda, col: bCol, kind: bKind, isBossBullet: true
          });
        }
      }
    } else if (b.shadowDashing > 0){
      // Shadow Dash predatory lunge forward
      b.vx = ux * b.spd * 3.3;
      b.vy = uy * b.spd * 3.3;
      b.ang = angLerp(b.ang, Math.atan2(dy, dx), Math.min(1, dt * 16));
      b.shadowTrail = b.shadowTrail || [];
      if (Math.random() < 0.75){
        b.shadowTrail.push({ x: b.x, y: b.y, ang: b.ang, a: 0.85 });
      }
      burst(b.x + rnd(-12, 12), b.y + rnd(-12, 12), '#ff0055', 2);
    } else {
      b.vx = ux * b.spd * (isP2 ? 1.65 : 1.20);
      b.vy = uy * b.spd * (isP2 ? 1.65 : 1.20);
      b.ang = angLerp(b.ang, Math.atan2(dy, dx), Math.min(1, dt * (isP2 ? 8.5 : 6.0)));
    }

    if (b.attackT <= 0){
      b.attackT = isEnraged ? 0.70 : 1.0;
      var count = isEnraged ? 18 : 12;
      var spread = isEnraged ? 0.70 : 0.52;
      var pCol = isEnraged ? '#ff0055' : '#e0aaff';
      var pKind = isEnraged ? 'eclipse_shard' : 'void_shard';
      fireBossBulletSpread(b, count, spread, isEnraged ? 510 : 440, b.dmg * 0.55, pCol, pKind);
    }
    if (b.specialT <= 0){
      b.specialT = isEnraged ? 2.8 : 4.0;
      var rCount = isEnraged ? 36 : 26;
      var rCol = isEnraged ? '#ff4d6d' : '#e0aaff';
      fireBossBulletRing(b, rCount, 360, b.dmg * 0.50, rCol, 'void_comet');
      shockwave(b.x, b.y, rCol, 340, 5);
      if (sound.skillNova) sound.skillNova();
    }
  } else if (b.bossType === 'voracis'){
    // --- APEX BOSS: VORACIS THE VOID GARGANTUA (The World-Eater) ---
    var isP2 = (b.phase2 || isEnraged);

    // Heartbeat Dread Audio & Proximity Tension in Phase 2
    if (isP2){
      b.heartbeatTimer = (b.heartbeatTimer !== undefined ? b.heartbeatTimer : 0.8) - dt;
      if (b.heartbeatTimer <= 0){
        var proxFrac = clamp(d / 720, 0.28, 1.0);
        b.heartbeatTimer = 0.28 + proxFrac * 0.40;
        if (sound.heartbeat) sound.heartbeat();
        G.vig = Math.max(G.vig, 0.28);
      }

      // Close-range writhing tendril flurry lashing
      if (d < b.r * 1.45){
        hurtPlayer(70 * dt, Math.atan2(p.y - b.y, p.x - b.x));
        if (Math.random() < 0.25){
          burst(p.x, p.y, '#ff0033', 2);
          G.vig = Math.max(G.vig, 0.40);
        }
      }
    }

    // Decay phantom shadow afterimages
    if (b.shadowTrail && b.shadowTrail.length > 0){
      for (var sti = b.shadowTrail.length - 1; sti >= 0; sti--){
        b.shadowTrail[sti].a -= dt * 2.5;
        if (b.shadowTrail[sti].a <= 0) b.shadowTrail.splice(sti, 1);
      }
    }

    // Update breathing rib flex
    b.ribFlex = Math.sin(b.phaseT * 3.5) * 0.14;

    // Raptorial Scythe Cleave Attack Loop
    b.scytheTimer = (b.scytheTimer !== undefined ? b.scytheTimer : 3.2) - dt;
    if (b.scytheSlashT > 0){
      b.scytheSlashT -= dt;
      if (b.scytheSlashT <= 0) b.scytheSlashing = null;
    }
    if (b.scytheTimer <= 0 && b.scytheSlashT <= 0 && b.skillPhase !== 'active'){
      b.scytheTimer = isP2 ? rnd(2.2, 3.0) : rnd(3.0, 4.2);
      b.scytheSlashing = Math.random() < 0.5 ? 'left' : 'right';
      b.scytheSlashT = 0.50;
      if (sound.scytheSwoosh) sound.scytheSwoosh();
      else if (sound.surge) sound.surge();
      if (typeof triggerRumble === 'function') triggerRumble(0.5, 140);
      // Scythe cleave hit detection on forward arc (180 deg)
      var pAngleToBoss = Math.atan2(p.y - b.y, p.x - b.x);
      var angleDiff = Math.abs(angDist(b.ang, pAngleToBoss));
      if (d < b.r * 1.65 && angleDiff < Math.PI * 0.55){
        if (p.inv <= 0){
          hurtPlayer(isP2 ? 45 : 32, pAngleToBoss);
          burst(p.x, p.y, isP2 ? '#ff0033' : '#ffe066', 8);
          shockwave(p.x, p.y, isP2 ? '#ff0033' : '#ffe066', 80, 2);
        } else {
          // Dodged with timed dash!
          if (sound.lock) sound.lock();
          addText(p.x, p.y - 20, 'CLOSE CALL // EVADED!', '#3ddc97', 16);
        }
      }
    }

    // Phase 2 Predatory Swallow Rush (Devouring Lunge)
    b.lungeT = Math.max(0, (b.lungeT || 0) - dt);
    if (isP2 && b.skillPhase !== 'active'){
      b.lungeTimer = (b.lungeTimer !== undefined ? b.lungeTimer : 4.0) - dt;
      if (b.lungeTimer <= 0 && b.lungeT <= 0){
        b.lungeT = 0.85;
        b.lungeTimer = rnd(3.2, 4.6);
        b.lungeTargetX = p.x;
        b.lungeTargetY = p.y;
        b.jawAngle = 1.35;
        if (sound.abyssRoar) sound.abyssRoar();
        if (sound.swallowRushWhoosh) sound.swallowRushWhoosh();
        else if (sound.surge) sound.surge();
        if (typeof triggerRumble === 'function') triggerRumble(0.85, 300);
        G.shake = Math.max(G.shake, 35);
        shockwave(b.x, b.y, '#ff0033', 300, 5);
        burst(b.x, b.y, '#ff0033', 40);
        addText(b.x, b.y - b.r - 35, 'DEVOURING LUNGE!', '#ff0033', 24);
      }
    }

    // Active Skill Phase: Gaping Maw Plasma Eruption or 360-degree Acid Deluge
    if (b.skillPhase === 'active'){
      b.jawAngle = 1.25;
      b.mawGlow = 1.0;
      if (isP2){
        // Phase 2: CONTINUOUS 360-DEGREE ROTATING ACID BILE SPRAY
        b.bileRotationAngle = (b.bileRotationAngle || 0) + dt * 5.4;
        b.bileTimer = (b.bileTimer || 0.06) - dt;
        if (b.bileTimer <= 0){
          b.bileTimer = 0.06;
          for (var bsi = 0; bsi < 2; bsi++){
            var ba = b.bileRotationAngle + bsi * Math.PI;
            G.ebullets.push({
              x: b.x + Math.cos(ba) * (b.r * 0.75),
              y: b.y + Math.sin(ba) * (b.r * 0.75),
              vx: Math.cos(ba) * 380,
              vy: Math.sin(ba) * 380,
              r: 7.5, dmg: b.dmg * 0.42,
              life: 3.2, ang: ba, col: '#a7ff00', kind: 'acid_bile', isBossBullet: true
            });
          }
          if (Math.random() < 0.28){
            G.thermitePools = G.thermitePools || [];
            G.thermitePools.push({
              x: b.x + Math.cos(b.bileRotationAngle) * rnd(80, 240),
              y: b.y + Math.sin(b.bileRotationAngle) * rnd(80, 240),
              r: 44, life: 4.5, maxLife: 4.5, isAcid: true
            });
          }
        }
      } else {
        // Phase 1: GAPING MAW BIO-PLASMA DELUGE (Periodic curving bio-plasma orbs)
        b.plasmaBurstTimer = (b.plasmaBurstTimer !== undefined ? b.plasmaBurstTimer : 0.75) - dt;
        if (b.plasmaBurstTimer <= 0){
          b.plasmaBurstTimer = 0.75;
          var curAimA = Math.atan2(dy, dx);
          for (var pvi = 0; pvi < 5; pvi++){
            var pSpreadAng = curAimA + (pvi - 2) * 0.22;
            G.ebullets.push({
              x: b.x + Math.cos(curAimA) * (b.r * 0.75),
              y: b.y + Math.sin(curAimA) * (b.r * 0.75),
              vx: Math.cos(pSpreadAng) * 330,
              vy: Math.sin(pSpreadAng) * 330,
              r: 9.0, dmg: b.dmg * 0.50, life: 3.5, ang: pSpreadAng,
              col: '#ff0055', kind: 'voracis_plasma', isBossBullet: true
            });
          }
          shockwave(b.x, b.y, '#ff0055', 200, 3);
          if (sound.enemyShoot) sound.enemyShoot();
        }
      }
      // Sinuous steering toward player
      b.ang = angLerp(b.ang, Math.atan2(dy, dx), Math.min(1, dt * 4.0));
      b.vx = ux * b.spd * 0.65;
      b.vy = uy * b.spd * 0.65;
    } else if (b.lungeT > 0){
      // Devouring Swallow Rush: 3.2x normal velocity towards target
      var ldx = (b.lungeTargetX || p.x) - b.x;
      var ldy = (b.lungeTargetY || p.y) - b.y;
      var ld = Math.hypot(ldx, ldy) || 1;
      b.vx = (ldx / ld) * b.spd * 3.2;
      b.vy = (ldy / ld) * b.spd * 3.2;
      b.ang = angLerp(b.ang, Math.atan2(ldy, ldx), Math.min(1, dt * 14));
      b.shadowTrail = b.shadowTrail || [];
      if (b.shadowTrail.length < 16){
        b.shadowTrail.push({ x: b.x, y: b.y, ang: b.ang, a: 0.85 });
      }
      // Swallow bite hit check on player
      if (d < b.r + p.r + 14){
        hurtPlayer(52, Math.atan2(p.y - b.y, p.x - b.x));
        p.vx += ux * 380;
        p.vy += uy * 380;
        G.shake = Math.max(G.shake, 36);
        burst(p.x, p.y, '#ff0033', 12);
        shockwave(p.x, p.y, '#ff0033', 110, 3);
        addText(p.x, p.y - 25, 'DEVOURED!', '#ff0033', 22);
      }
    } else {
      // Normal predatory stalking
      b.vx = ux * b.spd * (isP2 ? 1.45 : 1.10);
      b.vy = uy * b.spd * (isP2 ? 1.45 : 1.10);
      b.ang = angLerp(b.ang, Math.atan2(dy, dx), Math.min(1, dt * (isP2 ? 7.5 : 5.0)));
    }

    // Phase 2 Parasitic Leech Ejection from Dorsal Vents
    if (isP2){
      b.spawnLeechTimer = (b.spawnLeechTimer !== undefined ? b.spawnLeechTimer : 5.0) - dt;
      if (b.spawnLeechTimer <= 0){
        b.spawnLeechTimer = rnd(5.5, 7.5);
        for (var dli = 0; dli < 2; dli++){
          var dla = Math.random() * TAU;
          var dltype = ENEMY_TYPES.leech;
          G.enemies.push({
            type: 'leech', r: dltype.r, color: dltype.color, xp: 2,
            x: b.x + Math.cos(dla) * (b.r * 0.4), y: b.y + Math.sin(dla) * (b.r * 0.4),
            vx: Math.cos(dla) * 190, vy: Math.sin(dla) * 190, kx: 0, ky: 0,
            ang: dla, spawn: 0, squash: 0, hitAng: 0,
            hp: dltype.hp, maxhp: dltype.hp, spd: dltype.spd, dmg: dltype.dmg,
            touchT: 0, shootT: 1, flash: 0, split: 0, ranged: false
          });
        }
        burst(b.x, b.y, '#ff0055', 14);
        if (sound.enemyShoot) sound.enemyShoot();
      }
    }

    // Barbed Tendril Bone Spines Sweep (Attack timer)
    if (b.attackT <= 0 && b.skillPhase !== 'active'){
      b.attackT = isP2 ? 0.85 : 1.25;
      var spineCount = isP2 ? 16 : 10;
      var spineSpread = isP2 ? 0.75 : 0.55;
      var spineCol = isP2 ? '#ff0033' : '#bf55ec';
      fireBossBulletSpread(b, spineCount, spineSpread, isP2 ? 460 : 380, b.dmg * 0.52, spineCol, 'bone_spine');
    }

    // Radial Bone Shockwave (Special timer)
    if (b.specialT <= 0 && b.skillPhase !== 'active'){
      b.specialT = isP2 ? 3.0 : 4.4;
      var ringCount = isP2 ? 32 : 22;
      var ringCol = isP2 ? '#ff0033' : '#ff0055';
      fireBossBulletRing(b, ringCount, 340, b.dmg * 0.48, ringCol, 'bone_spine');
      shockwave(b.x, b.y, ringCol, 320, 5);
      if (sound.skillNova) sound.skillNova();
    }
  }
}

function startWave(wNum){
  G.wave = wNum || 1;
  G.waveState = 'combat';
  G.waveKills = 0;
  G.waveSpawned = 0;
  G.waveTimer = 0;
  updateHighScore();

  if (G.sector === 2){
    var s2Configs = [
      { total:24, title:'SECTOR 02 // WAVE 6: BROOD CARAPACE INVASION', sub:'Heavy bone plates detected • Penetrate bio-shields' },
      { total:30, title:'SECTOR 02 // WAVE 7: PHASE-STALKER AMBUSH', sub:'Sub-space cloaking predators • Evade lethal scythe strikes' },
      { total:36, title:'SECTOR 02 // WAVE 8: BILE SPORE DELUGE', sub:'Living toxic mines deployed • Avoid expanding acid clouds' },
      { total:42, title:'SECTOR 02 // WAVE 9: HIVE COLOSSUS VANGUARD', sub:'Heavy juggernauts charging • Flank rear exposed weakpoints' },
      { total:1,  title:'SECTOR 02 // WAVE 10: APEX PREDATOR CONFRONTATION', sub:'VORACIS THE VOID GARGANTUA • SURVIVE BOTH PHASES' }
    ];
    var s2Idx = clamp(G.wave - 6, 0, 4);
    var s2cfg = s2Configs[s2Idx];
    G.waveTotal = s2cfg.total;
    G.waveTitle = s2cfg.title;
    G.waveSub = s2cfg.sub;
    G.missionToast = {
      t: 4.5,
      title: s2cfg.title,
      sub: s2cfg.sub
    };
    if (G.wave === 10){
      G.waveState = 'boss';
      if (G.boss) {
        var oldBIdx = G.enemies.indexOf(G.boss);
        if (oldBIdx !== -1) G.enemies.splice(oldBIdx, 1);
        G.boss = null;
      }
      spawnBoss(10, 'voracis', true);
    }
  } else {
    if (!G.boss){
      spawnBoss(wNum);
    }

    var waveConfigs = [
      { total:16, title:'WAVE 1 OF 5: SCOUT VANGUARD', sub:'Eliminate 16 scout drifters • Secure extraction zone' },
      { total:22, title:'WAVE 2 OF 5: FRACTURE DIVISION', sub:'Splitter chassis detected • Active Skill Core incoming' },
      { total:28, title:'WAVE 3 OF 5: ARTILLERY PROTOCOL', sub:'Long-range snipers encircling • Evade plasma fire' },
      { total:34, title:'WAVE 4 OF 5: TITAN BULWARK SIEGE', sub:'Armored war-chassis charging • Skill Core deployed' },
      { total:40, title:'WAVE 5 OF 5: OVERDRIVE APEX LEGION', sub:'High-intensity invasion • Clear to breach Titan Egg' }
    ];

    if (G.wave <= 5){
      var cfg = waveConfigs[G.wave - 1];
      G.waveTotal = cfg.total;
      G.waveTitle = cfg.title;
      G.waveSub = cfg.sub;
      G.missionToast = {
        t: 4.0,
        title: cfg.title,
        sub: cfg.sub
      };
    } else {
      G.waveTotal = 1;
      G.waveTitle = 'APEX CONFRONTATION';
      G.waveSub = 'Neutralize the Abyss Leviathan';
      if (G.boss && G.boss.dormant){
        awakenBoss();
      }
    }
  }
}

function spawnEnemyUnit(type, x, y){
  var base = ENEMY_TYPES[type] || ENEMY_TYPES.drifter;
  var w = Math.min(5, G.wave || 1);
  var hpScale = 1 + (w - 1) * 0.14;
  var spdScale = Math.min(1.25, 1 + (w - 1) * 0.03);
  var dmgScale = 1 + (w - 1) * 0.06;
  var ang = Math.atan2(G.player.y - y, G.player.x - x);

  G.enemies.push({
    type:type, r:base.r, color:base.color, xp:base.xp,
    x:clamp(x, 30, ARENA-30), y:clamp(y, 30, ARENA-30),
    vx:0, vy:0, kx:0, ky:0, ang:ang, spawn:0, squash:0, hitAng:0,
    hp:Math.round(base.hp * hpScale), maxhp:Math.round(base.hp * hpScale),
    spd:base.spd * spdScale, dmg:Math.round(base.dmg * dmgScale),
    touchT:0, shootT:rnd(0.8, 2.2), flash:0,
    split:base.split || 0, ranged:!!base.ranged
  });

  shockwave(x, y, base.color, base.r * 2.8, 2);
  burst(x, y, base.color, 6);
}

function spawnSquad(sq){
  var p = G.player;
  var vw = W / ZOOM, vh = H / ZOOM;
  var spawnDist = Math.hypot(vw, vh) * 0.52 + 70;
  var count = sq.count, type = sq.type, formation = sq.formation || 'ring';

  if (formation === 'ring'){
    var startA = Math.random() * TAU;
    for (var i = 0; i < count; i++){
      var a = startA + i * (TAU / count) + rnd(-0.1, 0.1);
      spawnEnemyUnit(type, p.x + Math.cos(a)*spawnDist, p.y + Math.sin(a)*spawnDist);
    }
  } else if (formation === 'pincer'){
    var baseA = Math.random() * TAU, oppA = baseA + Math.PI;
    for (var i = 0; i < count; i++){
      var flank = (i % 2 === 0) ? baseA : oppA;
      var a = flank + rnd(-0.35, 0.35);
      var d = spawnDist + rnd(-30, 45);
      spawnEnemyUnit(type, p.x + Math.cos(a)*d, p.y + Math.sin(a)*d);
    }
  } else if (formation === 'cluster' || formation === 'charge'){
    var baseA = Math.random() * TAU;
    for (var i = 0; i < count; i++){
      var a = baseA + rnd(-0.38, 0.38);
      var d = spawnDist + rnd(-20, 50);
      spawnEnemyUnit(type, p.x + Math.cos(a)*d, p.y + Math.sin(a)*d);
    }
  } else if (formation === 'corners'){
    var offsets = [
      [-vw*0.55, -vh*0.55], [ vw*0.55, -vh*0.55],
      [-vw*0.55,  vh*0.55], [ vw*0.55,  vh*0.55]
    ];
    for (var i = 0; i < count; i++){
      var off = offsets[i % offsets.length];
      spawnEnemyUnit(type, p.x + off[0] + rnd(-40, 40), p.y + off[1] + rnd(-40, 40));
    }
  } else {
    for (var i = 0; i < count; i++){
      var a = Math.random() * TAU;
      spawnEnemyUnit(type, p.x + Math.cos(a)*spawnDist, p.y + Math.sin(a)*spawnDist);
    }
  }
}

function spawnIncursionEnemy(type){
  var p = G && G.player;
  var w = (G && G.wave) || 1;
  var pickType = type;
  if (!pickType){
    var roll = Math.random();
    if (G && G.sector === 2){
      if (w === 6){
        pickType = roll < 0.60 ? 'carapace' : 'mantis';
      } else if (w === 7){
        pickType = roll < 0.50 ? 'mantis' : (roll < 0.80 ? 'sporepod' : 'carapace');
      } else if (w === 8){
        pickType = roll < 0.40 ? 'sporepod' : (roll < 0.65 ? 'colossus' : (roll < 0.85 ? 'mantis' : 'carapace'));
      } else {
        pickType = roll < 0.30 ? 'colossus' : (roll < 0.55 ? 'sporepod' : (roll < 0.80 ? 'mantis' : 'carapace'));
      }
    } else {
      var w1 = Math.min(5, w);
      if (w1 === 1){
        pickType = 'drifter';
      } else if (w1 === 2){
        pickType = roll < 0.60 ? 'drifter' : 'splitter';
      } else if (w1 === 3){
        pickType = roll < 0.40 ? 'drifter' : (roll < 0.75 ? 'splitter' : 'shooter');
      } else if (w1 === 4){
        pickType = roll < 0.30 ? 'drifter' : (roll < 0.55 ? 'splitter' : (roll < 0.80 ? 'shooter' : 'brute'));
      } else {
        pickType = roll < 0.22 ? 'drifter' : (roll < 0.45 ? 'splitter' : (roll < 0.70 ? 'shooter' : (roll < 0.85 ? 'brute' : 'shard')));
      }
    }
  }
  var vw = W / ZOOM, vh = H / ZOOM;
  var spawnDist = Math.hypot(vw, vh) * 0.52 + rnd(40, 120);
  var ang = Math.random() * TAU;
  var sx = (p ? p.x : ARENA/2) + Math.cos(ang) * spawnDist;
  var sy = (p ? p.y : ARENA/2) + Math.sin(ang) * spawnDist;
  spawnEnemyUnit(pickType, sx, sy);
}

function hurtPlayer(dmg){
  var p = G.player;
  if (p.inv > 0 || G.state !== 'play' || p.godMode || (G && G.trainingInvulnerable)) return;
  var actualDmg = dmg * (p.resist || 1);

  // Kinetic Shield barrier absorption
  if (p.shield && p.shield > 0){
    p.shieldRegenTimer = 3.5;
    if (p.shield >= actualDmg){
      p.shield -= actualDmg;
      actualDmg = 0;
      p.inv = 0.15;
      burst(p.x, p.y, '#35f0ff', 9);
      shockwave(p.x, p.y, '#35f0ff', 65, 2);
      sound.hit(true);
      return;
    } else {
      actualDmg -= p.shield;
      p.shield = 0;
      burst(p.x, p.y, '#35f0ff', 12);
      shockwave(p.x, p.y, '#35f0ff', 90, 3);
    }
  }

  p.hp -= actualDmg; p.inv = p.invDur || 0.5; p.flash = 1;
  p.squash = 0.7; p.hitAng = Math.atan2(p.vy, p.vx);
  G.shake = Math.min(20, G.shake + 7);
  G.hitstop = Math.max(G.hitstop, 0.07);
  G.vig = 1;
  burst(p.x, p.y, '#ff4d6d', 14);
  shockwave(p.x, p.y, '#ff4d6d', 110, 2);
  sound.hurt();
  if (p.hp <= 0){ p.hp = 0; die(); }
}
function die(){
  if (G && G.mode === 'training'){
    G.player.hp = G.player.maxhp;
    if (G.player.maxShield) G.player.shield = G.player.maxShield;
    G.player.inv = 2.5;
    G.shake = 14;
    G.flash = 0.35;
    shockwave(G.player.x, G.player.y, '#35f0ff', 240, 3);
    burst(G.player.x, G.player.y, '#35f0ff', 40);
    if (sound.goldOrb) sound.goldOrb();
    addText(G.player.x, G.player.y - 30, 'REPAIR MATRIX RESTORED', '#35f0ff', 20);
    return;
  }
  G.state = 'dead';
  G.slow = 0;
  G.hitstop = 0.14;
  G.flash = 0.6;
  burst(G.player.x, G.player.y, '#35f0ff', 110);
  burst(G.player.x, G.player.y, '#ffffff', 50);
  shockwave(G.player.x, G.player.y, '#ffffff', 460, 5);
  G.shake = 28;
  updateHighScore();
  sound.die();
}
function killEnemy(e, idx, wasCrit){
  if (idx === undefined || idx < 0){
    idx = G.enemies.indexOf(e);
  }
  if (idx >= 0){
    G.enemies.splice(idx, 1);
  }
  if (e.bossParent && e.bossParent.minions){
    var pidx = e.bossParent.minions.indexOf(e);
    if (pidx >= 0) e.bossParent.minions.splice(pidx, 1);
  }
  G.kills++;
  if (e.type !== 'shard' || G.waveKills < G.waveTotal) G.waveKills++;
  G.streak++;
  G.streakT = 1.8;
  if (G.streak > G.best) G.best = G.streak;
  if (G.streak > 0 && G.streak % 10 === 0){
    addText(e.x, e.y - 26, 'x' + G.streak, '#ffe066', 20);
    G.flash = Math.max(G.flash, 0.18);
  }
  if (e.isBoss){
    G.shake = 35;
    G.hitstop = 0.25;
    G.flash = 0.85;
    burst(e.x, e.y, e.color, 120);
    burst(e.x, e.y, '#ffffff', 60);
    burst(e.x, e.y, '#ffe066', 40);
    shockwave(e.x, e.y, '#ffffff', 580, 7);
    shockwave(e.x, e.y, e.color, 420, 5);

    // Drop Random Active Skill Core!
    var allSkills = Object.keys(ACTIVE_SKILLS);
    var equipped = [];
    if (G.player && G.player.skills && G.player.skills.q && G.player.skills.q.skill){
      equipped.push(G.player.skills.q.skill.id);
    }
    // Prioritize skills the player does not have equipped for variety
    var candidates = allSkills.filter(function(id){ return equipped.indexOf(id) === -1; });
    if (candidates.length === 0) candidates = allSkills;
    var chosenSkill = candidates[Math.floor(Math.random() * candidates.length)];
    G.skillCores = G.skillCores || [];
    G.skillCores.push({
      x: e.x, y: e.y,
      skillId: chosenSkill,
      rot: 0, life: 999
    });

    // Apex Boss erupts with 5 radiant high-value Golden EXP Orbs!
    for (var gi = 0; gi < 5; gi++){
      var ga = (gi / 5) * TAU + Math.random() * 0.4;
      var gd = rnd(40, 140);
      G.orbs.push({
        x: clamp(e.x + Math.cos(ga)*gd, 40, ARENA-40),
        y: clamp(e.y + Math.sin(ga)*gd, 40, ARENA-40),
        vx: Math.cos(ga) * rnd(90, 180),
        vy: Math.sin(ga) * rnd(90, 180),
        val: Math.max(16, Math.round((e.xp || 30) * 0.7)),
        isGold: true,
        popTime: 0.12,
        life: 38,
        rot: Math.random() * TAU
      });
    }

    for (var bi = 0; bi < 28; bi++){
      var oa = Math.random() * TAU, od = rnd(30, 220);
      G.orbs.push({
        x: clamp(e.x + Math.cos(oa)*od, 40, ARENA-40),
        y: clamp(e.y + Math.sin(oa)*od, 40, ARENA-40),
        vx: rnd(-80, 80), vy: rnd(-80, 80),
        val: 2,
        popTime: 0.10,
        life: 30,
        rot: Math.random()*TAU
      });
    }

    addText(e.x, e.y - e.r - 28, 'APEX BOSS DESTROYED!', '#ffe066', 28);
    addText(e.x, e.y - e.r + 6, 'ACTIVE SKILL CORE DROPPED!', '#35f0ff', 18);

    // Detonate any remaining geometric escort minions
    for (var mi = G.enemies.length - 1; mi >= 0; mi--){
      var me = G.enemies[mi];
      if (me.bossParent === e || me.type === 'minion_geom'){
        burst(me.x, me.y, me.color, 16);
        shockwave(me.x, me.y, me.color, 90, 2);
        G.enemies.splice(mi, 1);
      }
    }

    if (G.mode === 'training'){
      G.boss = null;
      sound.bossDeath();
      addText(e.x, e.y - e.r - 28, 'TRAINING TARGET DESTROYED!', '#ffe066', 28);
      return;
    }

    // Initialize cinematic Dying Boss destruction sequence
    var bossShards = [];
    for (var sdi = 0; sdi < 40; sdi++){
      var sda = (sdi / 40) * TAU + rnd(-0.15, 0.15);
      var sds = rnd(120, 360);
      bossShards.push({
        x: e.x,
        y: e.y,
        vx: Math.cos(sda) * sds,
        vy: Math.sin(sda) * sds,
        rot: Math.random() * TAU,
        vrot: rnd(-10, 10),
        size: rnd(7, 18),
        color: Math.random() < 0.6 ? (e.color || '#ff3565') : (Math.random() < 0.5 ? '#ffe066' : '#ffffff'),
        life: rnd(1.4, 2.6),
        maxLife: 2.6
      });
    }
    G.dyingBoss = {
      x: e.x,
      y: e.y,
      r: e.r || 45,
      color: e.color || '#ff3565',
      bossType: e.bossType || 'abyss',
      ang: e.ang || 0,
      segments: e.segments ? e.segments.slice() : null,
      mandibleOpen: e.mandibleOpen || 0,
      phase: e.phase || 2,
      phase2: e.phase2 !== undefined ? e.phase2 : true,
      t: 0,
      maxT: 3.2,
      shards: bossShards,
      flashes: 0,
      detonated: false
    };

    if (e.bossType === 'abyss'){
      G.astralRift = {
        x: e.x,
        y: e.y,
        r: 54,
        active: true,
        pulse: 0
      };
      addText(e.x, e.y - 48, 'ASTRAL VOID RIFT OPENED!', '#bf55ec', 22);
    }

    G.boss = null;
    G.state = 'victory';
    G.victoryTimer = 0;
    sound.waveClear();
    if (window.music && music.setMood) music.setMood('victory');
    updateHighScore();
  } else {
    if (e.type === 'carapace'){
      for (var coi = 0; coi < 3; coi++){
        var coa = (coi / 3) * TAU + Math.random() * 0.4;
        var cod = rnd(20, 60);
        G.orbs.push({
          x: clamp(e.x + Math.cos(coa) * cod, 40, ARENA - 40),
          y: clamp(e.y + Math.sin(coa) * cod, 40, ARENA - 40),
          vx: Math.cos(coa) * 120, vy: Math.sin(coa) * 120,
          val: 8, isGold: false, popTime: 0.1, life: 30, rot: Math.random() * TAU
        });
      }
      burst(e.x, e.y, '#35f0ff', 24);
      shockwave(e.x, e.y, '#35f0ff', 120, 3);
    } else if (e.type === 'spore'){
      G.thermitePools = G.thermitePools || [];
      G.thermitePools.push({
        x: e.x, y: e.y, r: 42, life: 4.2, maxLife: 4.2, isAcid: true
      });
      burst(e.x, e.y, '#a7ff00', 16);
      shockwave(e.x, e.y, '#a7ff00', 70, 2);
    }

    if (e.type === 'brute' && Math.random() < 0.20){
      dropRandomSkillCore(e.x, e.y);
      addText(e.x, e.y - e.r - 20, 'SKILL CORE DROPPED!', '#35f0ff', 16);
    }
    burst(e.x, e.y, e.color, 13);
    burst(e.x, e.y, '#ffffff', 5);
    shockwave(e.x, e.y, e.color, e.r * 3.4, 2);
    decal(e.x, e.y, e.r * 0.9, e.color);
    G.shake = Math.min(16, G.shake + 2.5);
    G.hitstop = Math.max(G.hitstop, e.type === 'brute' ? 0.09 : 0.035);
    sound.kill(e.type);

    var isCritKill = wasCrit || e.hitWithCrit;
    var dropGold = isCritKill && (Math.random() < 0.28);
    if (dropGold){
      G.orbs.push({
        x: e.x, y: e.y,
        vx: rnd(-70, 70), vy: rnd(-70, 70),
        val: Math.max(14, Math.round(e.xp * 6)),
        isGold: true,
        popTime: 0.08,
        life: 30,
        rot: Math.random() * TAU
      });
      burst(e.x, e.y, '#ffe066', 16);
      burst(e.x, e.y, '#ffffff', 8);
      addText(e.x, e.y - e.r - 12, 'GOLDEN XP CORE', '#ffe066', 15);
    } else {
      G.orbs.push({
        x: e.x, y: e.y,
        vx: rnd(-50, 50), vy: rnd(-50, 50),
        val: e.xp,
        isGold: false,
        popTime: 0.06,
        life: 24,
        rot: Math.random() * TAU
      });
    }
  }
  if (e.split > 0){
    var s = ENEMY_TYPES.shard;
    var w = Math.min(5, G.wave || 1);
    var scHp = 1 + (w - 1) * 0.14;
    var scDmg = 1 + (w - 1) * 0.06;
    for (var k = 0; k < e.split; k++){
      var a = Math.random() * TAU;
      G.enemies.push({
        type:'shard', r:s.r, color:s.color, xp:s.xp,
        x:e.x + Math.cos(a)*18, y:e.y + Math.sin(a)*18, vx:0, vy:0, kx:0, ky:0,
        ang:a, spawn:0.4, squash:0, hitAng:0,
        hp:s.hp*scHp, maxhp:s.hp*scHp, spd:s.spd, dmg:s.dmg*scDmg,
        touchT:0, shootT:1, flash:0, split:0, ranged:false
      });
    }
  }
}
function fireEnemyBullet(e){
  var p = G.player;
  var a = Math.atan2(p.y - e.y, p.x - e.x);
  G.ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a)*275, vy:Math.sin(a)*275, r:6, dmg:e.dmg*0.85, life:3, ang:a });
  burst(e.x + Math.cos(a)*e.r, e.y + Math.sin(a)*e.r, '#b388ff', 4, a, 0.5);
  sound.enemyShoot();
}

function update(dt){
  var p = G.player;

  /* streaks, timers */
  if (G.streakT > 0){ G.streakT -= dt; if (G.streakT <= 0) G.streak = 0; }

  /* space dust (organic harmonic drift) */
  var vw = W / ZOOM, vh = H / ZOOM;
  for (var di = 0; di < G.dust.length; di++){
    var dd = G.dust[di];
    dd.phase = (dd.phase || 0) + dt * (dd.pulseSpeed || 1);
    dd.x += (dd.vx + Math.sin(dd.phase) * 5.5) * dt;
    dd.y += (dd.vy + Math.cos(dd.phase * 0.8) * 5.5) * dt;
    if (dd.x < G.camX - vw/2 - 120) dd.x += vw + 240;
    if (dd.x > G.camX + vw/2 + 120) dd.x -= vw + 240;
    if (dd.y < G.camY - vh/2 - 120) dd.y += vh + 240;
    if (dd.y > G.camY + vh/2 + 120) dd.y -= vh + 240;
  }

  if (G.state === 'title'){
    G.t += dt;
    if (Math.random() < 0.7) burst(rnd(0,W), rnd(0,H), '#35f0ff', 1);
    for (var i = G.parts.length-1; i >= 0; i--){
      var pt = G.parts[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      if (pt.life <= 0) G.parts.splice(i,1);
    }
    for (var wi = G.waves.length-1; wi >= 0; wi--){
      var wv = G.waves[wi];
      wv.r += (wv.maxR - wv.r) * Math.min(1, dt*6); wv.life -= dt*1.6;
      if (wv.life <= 0) G.waves.splice(wi,1);
    }
    return;
  }
  if (G.state === 'victory'){
    G.victoryTimer = (G.victoryTimer || 0) + dt;
    G.t += dt;
    G.shake = Math.max(0, G.shake - dt * 35);
    if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.5);

    var p = G.player;
    var db = G.dyingBoss;

    // 1. Dying Boss Simulation
    if (db){
      db.t += dt;
      // Pre-detonation tremors & spontaneous micro bursts
      if (db.t < 1.2){
        if (Math.random() < dt * 24){
          var bx = db.x + rnd(-db.r * 0.7, db.r * 0.7);
          var by = db.y + rnd(-db.r * 0.7, db.r * 0.7);
          burst(bx, by, Math.random() < 0.5 ? '#ffe066' : db.color, 8);
          if (Math.random() < 0.3) shockwave(bx, by, '#ffffff', 80, 2);
        }
      } else if (!db.detonated){
        // Supernova detonation at t = 1.2s!
        db.detonated = true;
        G.flash = 0.95;
        G.shake = 45;
        sound.bossDeath();
        shockwave(db.x, db.y, '#ffffff', 650, 7);
        shockwave(db.x, db.y, db.color, 480, 5);
        shockwave(db.x, db.y, '#35f0ff', 320, 4);
        burst(db.x, db.y, db.color, 120);
        burst(db.x, db.y, '#ffffff', 80);
        burst(db.x, db.y, '#ffe066', 60);
      }

      // Shard physics (active post-detonation)
      if (db.detonated && db.shards){
        for (var sdi = db.shards.length - 1; sdi >= 0; sdi--){
          var sh = db.shards[sdi];
          sh.x += sh.vx * dt;
          sh.y += sh.vy * dt;
          var drag = Math.pow(0.84, dt * 60);
          sh.vx *= drag;
          sh.vy *= drag;
          sh.rot += sh.vrot * dt;
          sh.life -= dt;
          if (Math.random() < dt * 10){
            burst(sh.x, sh.y, sh.color, 1);
          }
          if (sh.life <= 0) db.shards.splice(sdi, 1);
        }
      }
    }

    // 2. Player Celebratory Flight Maneuver
    if (p){
      p.inv = 999;
      var epicX = db ? db.x : p.x;
      var epicY = db ? db.y : p.y;
      var orbitR = 150;
      var vicAng = G.victoryTimer * 2.8;
      var targetX = epicX + Math.cos(vicAng) * orbitR;
      var targetY = epicY + Math.sin(vicAng) * orbitR;

      p.vx += (targetX - p.x) * Math.min(1, dt * 6);
      p.vy += (targetY - p.y) * Math.min(1, dt * 6);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(0.9, dt * 60);
      p.vy *= Math.pow(0.9, dt * 60);

      var flightHeading = Math.atan2(p.vy, p.vx);
      if (Math.hypot(p.vx, p.vy) > 10){
        p.ang = flightHeading;
        p.aim = flightHeading;
      }

      // Overdrive celebration thrusters
      if (Math.random() < dt * 35){
        var exX = p.x - Math.cos(p.ang) * (p.r + 6);
        var exY = p.y - Math.sin(p.ang) * (p.r + 6);
        burst(exX, exY, '#ffe066', 2);
        burst(exX, exY, '#3ddc97', 2);
      }

      // Fireworks bursts every ~0.35s
      if (!G._lastFirework || G.victoryTimer - G._lastFirework > 0.35){
        G._lastFirework = G.victoryTimer;
        var fwX = p.x + rnd(-80, 80);
        var fwY = p.y - rnd(40, 120);
        var fwCols = ['#3ddc97', '#ffe066', '#35f0ff', '#ff3565', '#d557ff'];
        var fwCol = fwCols[Math.floor(Math.random() * fwCols.length)];
        burst(fwX, fwY, fwCol, 18);
        shockwave(fwX, fwY, fwCol, 75, 2);
      }

      // Magnetically attract and pull nearby EXP orbs
      for (var oi = 0; oi < G.orbs.length; oi++){
        var ob = G.orbs[oi];
        var odx = p.x - ob.x, ody = p.y - ob.y;
        var odist = Math.hypot(odx, ody);
        if (odist < 240){
          ob.vx += (odx / odist) * 350 * dt;
          ob.vy += (ody / odist) * 350 * dt;
        }
      }
    }

    // 3. Smooth Camera Tracking Midpoint
    var camTgtX = (db ? (db.x * 0.45 + (p ? p.x : db.x) * 0.55) : (p ? p.x : W/2));
    var camTgtY = (db ? (db.y * 0.45 + (p ? p.y : db.y) * 0.55) : (p ? p.y : H/2));
    G.camX += (camTgtX - G.camX) * Math.min(1, dt * 5);
    G.camY += (camTgtY - G.camY) * Math.min(1, dt * 5);

    // 4. Update particles, shockwaves, orbs, texts
    for (var j = G.parts.length - 1; j >= 0; j--){
      var q = G.parts[j];
      q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
      if (q.life <= 0) G.parts.splice(j, 1);
    }
    for (var wj = G.waves.length - 1; wj >= 0; wj--){
      var w2 = G.waves[wj];
      w2.r += (w2.maxR - w2.r) * Math.min(1, dt * 6); w2.life -= dt * 1.4;
      if (w2.life <= 0) G.waves.splice(wj, 1);
    }
    for (var obi = G.orbs.length - 1; obi >= 0; obi--){
      var morb = G.orbs[obi];
      morb.x += morb.vx * dt; morb.y += morb.vy * dt;
      morb.vx *= Math.pow(0.92, dt * 60);
      morb.vy *= Math.pow(0.92, dt * 60);
      morb.rot = (morb.rot || 0) + dt * 2;
    }
    for (var ti = G.texts.length - 1; ti >= 0; ti--){
      var txt = G.texts[ti];
      txt.y += txt.vy * dt; txt.life -= dt;
      if (txt.life <= 0) G.texts.splice(ti, 1);
    }
    for (var gi = G.ghosts.length - 1; gi >= 0; gi--){
      G.ghosts[gi].life -= dt * 3;
      if (G.ghosts[gi].life <= 0) G.ghosts.splice(gi, 1);
    }
    return;
  }
  if (G.state === 'levelup' || G.state === 'dead'){
    G.shake = Math.max(0, G.shake - dt*45);
    for (var j = G.parts.length-1; j >= 0; j--){
      var q = G.parts[j];
      q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt;
      if (q.life <= 0) G.parts.splice(j,1);
    }
    for (var wj = G.waves.length-1; wj >= 0; wj--){
      var w2 = G.waves[wj];
      w2.r += (w2.maxR - w2.r) * Math.min(1, dt*6); w2.life -= dt*1.4;
      if (w2.life <= 0) G.waves.splice(wj,1);
    }
    for (var ci = 0; ci < G.cards.length; ci++){
      G.cards[ci].born = Math.min(1, G.cards[ci].born + dt*6);
    }
    for (var gi = G.ghosts.length-1; gi >= 0; gi--){
      G.ghosts[gi].life -= dt*3;
      if (G.ghosts[gi].life <= 0) G.ghosts.splice(gi,1);
    }
    return;
  }

  G.t += dt;
  G.shake = Math.max(0, G.shake - dt*45);

  /* Ion Lance Continuous Laser Channeling */
  if (isSkillActive('laser')){
    var lx1 = p.x + Math.cos(p.aim)*p.r*1.5;
    var ly1 = p.y + Math.sin(p.aim)*p.r*1.5;
    var lx2 = p.x + Math.cos(p.aim)*700;
    var ly2 = p.y + Math.sin(p.aim)*700;
    var beamDmg = 340 * dt;

    for (var ei = 0; ei < G.enemies.length; ei++){
      var en = G.enemies[ei];
      if (en.isBoss && en.dormant) continue;
      var ldx = lx2 - lx1, ldy = ly2 - ly1, lLenSq = ldx*ldx + ldy*ldy;
      var tParam = Math.max(0, Math.min(1, ((en.x - lx1)*ldx + (en.y - ly1)*ldy) / lLenSq));
      var projX = lx1 + tParam * ldx, projY = ly1 + tParam * ldy;
      var distToBeam = Math.hypot(en.x - projX, en.y - projY);

      if (distToBeam < en.r + 16){
        en.hp -= beamDmg;
        en.flash = 0.5;
        burst(projX, projY, '#ffe066', 2, p.aim + Math.PI, 0.8);
        if (Math.random() < 0.25){
          addText(en.x + rnd(-8,8), en.y - en.r - 4, '' + Math.round(beamDmg * 4), '#ffe066', 13);
          sound.hit(true);
        }
      }
    }
    for (var bi = G.ebullets.length - 1; bi >= 0; bi--){
      var eb = G.ebullets[bi];
      var ldx = lx2 - lx1, ldy = ly2 - ly1, lLenSq = ldx*ldx + ldy*ldy;
      var tParam = Math.max(0, Math.min(1, ((eb.x - lx1)*ldx + (eb.y - ly1)*ldy) / lLenSq));
      var projX = lx1 + tParam * ldx, projY = ly1 + tParam * ldy;
      if (Math.hypot(eb.x - projX, eb.y - projY) < eb.r + 14){
        burst(eb.x, eb.y, '#ffe066', 3);
        G.ebullets.splice(bi, 1);
      }
    }
    G.shake = Math.min(8, G.shake + 0.8);
    // Tactile weapon recoil kick
    p.vx -= Math.cos(p.aim) * 85 * dt;
    p.vy -= Math.sin(p.aim) * 85 * dt;
  }

  /* EMP Nova Hex-Shockwaves */
  G.empWaves = G.empWaves || [];
  for (var ewi = G.empWaves.length - 1; ewi >= 0; ewi--){
    var ew = G.empWaves[ewi];
    ew.r += (ew.maxR - ew.r) * Math.min(1, dt * 9);
    ew.life -= dt;
    if (ew.life <= 0) G.empWaves.splice(ewi, 1);
  }

  /* Micro-Missile Salvo Launcher & Homing Simulation */
  if (p.missileSalvoCount > 0){
    p.missileSalvoInterval = (p.missileSalvoInterval || 0) - dt;
    if (p.missileSalvoInterval <= 0){
      p.missileSalvoInterval = 0.032;
      p.missileSalvoCount--;
      var mSide = (p.missileSalvoCount % 2 === 0 ? 1 : -1);
      var mSpawnX = p.x + Math.cos(p.aim + Math.PI/2 * mSide) * 16;
      var mSpawnY = p.y + Math.sin(p.aim + Math.PI/2 * mSide) * 16;
      var mLaunchAng = p.aim + mSide * 0.42 + (Math.random() - 0.5) * 0.22;
      G.playerMissiles = G.playerMissiles || [];
      G.playerMissiles.push({
        x: mSpawnX, y: mSpawnY,
        vx: Math.cos(mLaunchAng) * 340,
        vy: Math.sin(mLaunchAng) * 340,
        ang: mLaunchAng,
        spd: 340,
        maxSpd: 820,
        life: 2.5,
        smokeT: 0
      });
      if (sound.skillMissileLaunch) sound.skillMissileLaunch();
    }
  }

  G.playerMissiles = G.playerMissiles || [];
  for (var pmi = G.playerMissiles.length - 1; pmi >= 0; pmi--){
    var pm = G.playerMissiles[pmi];
    pm.life -= dt;
    pm.spd = Math.min(pm.maxSpd, pm.spd + dt * 750);

    // Homing onto nearest enemy
    var bestTarget = null, bestDist = 650;
    for (var ei = 0; ei < G.enemies.length; ei++){
      var em = G.enemies[ei];
      if (em.isBoss && em.dormant) continue;
      var emd = Math.hypot(em.x - pm.x, em.y - pm.y);
      if (emd < bestDist){ bestDist = emd; bestTarget = em; }
    }
    if (bestTarget){
      var desireAng = Math.atan2(bestTarget.y - pm.y, bestTarget.x - pm.x);
      pm.ang = angLerp(pm.ang, desireAng, Math.min(1, dt * 14));
    }
    pm.vx = Math.cos(pm.ang) * pm.spd;
    pm.vy = Math.sin(pm.ang) * pm.spd;
    pm.x += pm.vx * dt;
    pm.y += pm.vy * dt;

    // Trailing fiery exhaust particle smoke
    pm.smokeT += dt;
    if (pm.smokeT >= 0.02){
      pm.smokeT = 0;
      burst(pm.x - Math.cos(pm.ang) * 8, pm.y - Math.sin(pm.ang) * 8, '#ff9f1c', 1, pm.ang + Math.PI, 0.4);
    }

    // Impact detection
    var hitTarget = null;
    for (var ei = 0; ei < G.enemies.length; ei++){
      var en = G.enemies[ei];
      if (en.isBoss && en.dormant) continue;
      if (Math.hypot(en.x - pm.x, en.y - pm.y) < en.r + 10){
        hitTarget = en; break;
      }
    }
    if (hitTarget || pm.life <= 0){
      if (sound.skillMissileHit) sound.skillMissileHit();
      shockwave(pm.x, pm.y, '#ff7b00', 70, 2);
      burst(pm.x, pm.y, '#ff7b00', 14);
      burst(pm.x, pm.y, '#ffe066', 8);
      G.shake = Math.min(14, G.shake + 1.8);

      for (var ei = 0; ei < G.enemies.length; ei++){
        var en = G.enemies[ei];
        if (en.isBoss && en.dormant) continue;
        var distToBlast = Math.hypot(en.x - pm.x, en.y - pm.y);
        if (distToBlast < 75){
          var dmg = Math.round(55 * (1 - distToBlast / 80) + 15);
          en.hp -= dmg;
          en.flash = 0.8;
          en.kx += Math.cos(pm.ang) * 180;
          en.ky += Math.sin(pm.ang) * 180;
          addText(en.x, en.y - en.r, '' + dmg, '#ff7b00', 16);
        }
      }
      G.playerMissiles.splice(pmi, 1);
    }
  }

  /* Tesla Overload Arcs */
  G.teslaArcs = G.teslaArcs || [];
  for (var tai = G.teslaArcs.length - 1; tai >= 0; tai--){

    ta.life -= dt;
    if (ta.life <= 0) G.teslaArcs.splice(tai, 1);
  }

  /* Orbital Glaives */
  G.orbitalGlaives = G.orbitalGlaives || [];
  var glaiveActive = isSkillActive('glaives');
  for (var gi = G.orbitalGlaives.length - 1; gi >= 0; gi--){
    var gl = G.orbitalGlaives[gi];
    if (glaiveActive && !gl.launched){

      gl.y = p.y + Math.sin(gl.ang) * gl.r;

      for (var ei = 0; ei < G.enemies.length; ei++){

      for (var bi = G.ebullets.length - 1; bi >= 0; bi--){

  /* Phantom Mirage Decoys */
  G.phantomDecoys = G.phantomDecoys || [];
  var decoyActive = isSkillActive('decoy');
  for (var pdi = G.phantomDecoys.length - 1; pdi >= 0; pdi--){

      for (var ei = 0; ei < G.enemies.length; ei++){

  /* Quantum Warp-Strike Dimensional Rifts */
  G.quantumRifts = G.quantumRifts || [];
  for (var qri = G.quantumRifts.length - 1; qri >= 0; qri--){
    var qr = G.quantumRifts[qri];
    qr.life -= dt;
    if (qr.life <= 0.12 && !qr.detonated){

      for (var ei = 0; ei < G.enemies.length; ei++){

          en.flash = 1;
          var pullX = projX - en.x, pullY = projY - en.y, pullD = Math.hypot(pullX, pullY) || 1;

          en.ky += (pullY / pullD) * 350;

        }
      }
    }
    if (qr.life <= 0) G.quantumRifts.splice(qri, 1);
  }

  /* Gravity Singularity Vortices */
  G.vortices = G.vortices || [];
  for (var vi = G.vortices.length - 1; vi >= 0; vi--){
    var vt = G.vortices[vi];
    vt.x += vt.vx * dt; vt.y += vt.vy * dt;
    vt.vx *= Math.pow(0.12, dt); vt.vy *= Math.pow(0.12, dt);
    vt.life -= dt;

      var en = G.enemies[ei];
      if (en.isBoss && en.dormant) continue;
      var vdx = vt.x - en.x, vdy = vt.y - en.y;
      var vd = Math.hypot(vdx, vdy) || 1;
      if (vd < vt.r){
        var pullForce = (1 - vd / vt.r) * 320;

        en.flash = 0.2;
      }
    }
    for (var bi = G.ebullets.length - 1; bi >= 0; bi--){
      var eb = G.ebullets[bi];
      if (Math.hypot(eb.x - vt.x, eb.y - vt.y) < vt.r * 0.7){

        G.ebullets.splice(bi, 1);
      }
    }
    if (vt.life <= 0){
      shockwave(vt.x, vt.y, '#ff4d6d', vt.r * 1.4, 4);
      burst(vt.x, vt.y, '#ff4d6d', 45);
      burst(vt.x, vt.y, '#ffffff', 20);

      for (var ei = 0; ei < G.enemies.length; ei++){
        var en = G.enemies[ei];
        if (en.isBoss && en.dormant) continue;
        if (Math.hypot(en.x - vt.x, en.y - vt.y) < vt.r){

          en.flash = 1;
          addText(en.x, en.y - en.r, '120', '#ff4d6d', 18);
        }
      }
      G.vortices.splice(vi, 1);
    }
  }

  /* Solar Phoenix Thermite Hazard Pools & Electric Pools & Acid Pools */
  G.thermitePools = G.thermitePools || [];
  for (var tpi = G.thermitePools.length - 1; tpi >= 0; tpi--){
    var tp = G.thermitePools[tpi];
    tp.life -= dt;
    var tpDist = Math.hypot(p.x - tp.x, p.y - tp.y);
    if (tpDist < p.r + tp.r){
      var poolDmg = tp.isAcid ? 18 : (tp.isElectric ? 16 : 12);
      hurtPlayer(poolDmg * dt, Math.atan2(p.y - tp.y, p.x - tp.x));
      if (tp.isAcid){
        p.vx *= Math.pow(0.35, dt);
        p.vy *= Math.pow(0.35, dt);
        if (sound.acidSizzle) sound.acidSizzle();
      }
    } else if (tp.isAcid && tpDist < 360 && Math.random() < dt * 6){
      // Diegetic ambient sizzling/bubbling loop when approaching acid pools
      if (sound.acidSizzle) sound.acidSizzle();
    }
    if (tp.life <= 0) G.thermitePools.splice(tpi, 1);
  }

  /* Astral Void Rift Proximity Warp Conduit to Sector 2 */
  if (G.astralRift && G.astralRift.active && p && G.state === 'play'){
    var riftDist = Math.hypot(p.x - G.astralRift.x, p.y - G.astralRift.y);
    if (riftDist < G.astralRift.r + p.r + 14){
      enterSector2();
    }
  }

  /* Tesla Storm Ground Reticles */
  if (G.teslaMarkers && G.teslaMarkers.length > 0){
    for (var tmi = G.teslaMarkers.length - 1; tmi >= 0; tmi--){
      var tm = G.teslaMarkers[tmi];
      tm.t -= dt;
      if (tm.t <= -0.6) G.teslaMarkers.splice(tmi, 1);
    }
  }

  /* Supermassive Black Hole Singularities */
  if (G.blackHoles && G.blackHoles.length > 0){
    for (var bhi = G.blackHoles.length - 1; bhi >= 0; bhi--){

      bh.life -= dt;
      var bdist = Math.hypot(bh.x - p.x, bh.y - p.y);
      if (bdist < 600){
        var pullPower = (1 - bdist / 600) * (bh.pull || 260);
        p.vx += ((bh.x - p.x) / (bdist || 1)) * pullPower * dt;
        p.vy += ((bh.y - p.y) / (bdist || 1)) * pullPower * dt;
        if (bdist < bh.r * 0.5){

        }
      }
      bh.pulseT = (bh.pulseT || 0.6) - dt;
      if (bh.pulseT <= 0){
        bh.pulseT = 0.6;

        if (G.boss && G.boss.bossType === 'nexus'){
          _scratchVec.x = bh.x; _scratchVec.y = bh.y; _scratchVec.dmg = G.boss.dmg * 0.4;
          fireEnemyBulletRing(_scratchVec, 8, 250, G.boss.dmg * 0.35, '#ff4d6d');

      }
      if (bh.life <= 0){
        shockwave(bh.x, bh.y, '#ff4d6d', bh.r * 2.5, 5);
        G.blackHoles.splice(bhi, 1);
      }
    }
  }

  /* Apex Boss Skill Alert Banner Timer */
  if (G.bossSkillAlert){
    G.bossSkillAlert.time -= dt;
    if (G.bossSkillAlert.time <= 0) G.bossSkillAlert = null;
  }

  /* Mission Directive Toast Timer */
  if (G.missionToast && G.missionToast.t > 0){
    G.missionToast.t -= dt;
    if (G.missionToast.t <= 0) G.missionToast = null;
  }

  /* Active Skill Cores on Ground */
  G.skillCores = G.skillCores || [];
  for (var ci = G.skillCores.length - 1; ci >= 0; ci--){
    var sc = G.skillCores[ci];
    sc.rot += dt * 2.5;
    var cdx = p.x - sc.x, cdy = p.y - sc.y, cd = Math.hypot(cdx, cdy);
    if (cd < 180){

      sc.y += (cdy / (cd || 1)) * 420 * dt;
    }
    if (cd < 38){
      var skObj = ACTIVE_SKILLS[sc.skillId] || ACTIVE_SKILLS.nova;
      G.skillCores.splice(ci, 1);
      acquireSkillCore(skObj);
      break;
    }
  }

  p.inv = Math.max(0, p.inv - dt);
  p.flash = Math.max(0, p.flash - dt*5);
  p.dashT = Math.max(0, p.dashT - dt);
  p.dashActiveT = Math.max(0, (p.dashActiveT || 0) - dt);
  p.recoil = Math.max(0, p.recoil - dt*7);
  p.muzzle = Math.max(0, p.muzzle - dt*14);
  p.squash = Math.max(0, p.squash - dt*4);

  /* movement: WASD (Arrow keys are reserved for directional shooting) */
  var mx = 0, my = 0;

  if (keys['w']) my--;
  if (keys['s']) my++;
  if (touch.active){
    var tdx = touch.x - p.x, tdy = touch.y - p.y, td = Math.hypot(tdx, tdy);
    if (td > 26){ mx = tdx/td; my = tdy/td; }
  }

  /* Gamepad Dual-Stick & Controller Input */
  var gp = (typeof getActiveGamepad === 'function') ? getActiveGamepad() : null;
  var gpDash = false;
  if (gp){
    var gpx = gp.axes && gp.axes[0] ? gp.axes[0] : 0;
    var gpy = gp.axes && gp.axes[1] ? gp.axes[1] : 0;
    if (Math.hypot(gpx, gpy) > 0.18){
      mx = gpx; my = gpy;
    }
    if (gp.buttons && gp.buttons[14] && gp.buttons[14].pressed) mx--;
    if (gp.buttons && gp.buttons[15] && gp.buttons[15].pressed) mx++;
    if (gp.buttons && gp.buttons[12] && gp.buttons[12].pressed) my--;
    if (gp.buttons && gp.buttons[13] && gp.buttons[13].pressed) my++;

    if (gp.buttons && gp.buttons[0] && gp.buttons[0].pressed){
      gpDash = true;
    }

    // Active skill trigger: Button X (2) or LB (4) (when buffTray is not active)
    var isBuffActive = G.buffTray && G.buffTray.active;
    var skillPressed = (gp.buttons && ((gp.buttons[4] && gp.buttons[4].pressed) || (!isBuffActive && gp.buttons[2] && gp.buttons[2].pressed)));
    if (skillPressed){
      if (!p._gpSkillHeld){
        p._gpSkillHeld = true;
        if (typeof useActiveSkill === 'function') useActiveSkill();
      }
    } else {
      p._gpSkillHeld = false;
    }

    // Pause toggle: Start / Menu (9)
    if (gp.buttons && gp.buttons[9] && gp.buttons[9].pressed){
      if (!p._gpPauseHeld){
        p._gpPauseHeld = true;
        if (typeof togglePause === 'function') togglePause();
      }
    } else {
      p._gpPauseHeld = false;
    }
  }

  /* Diegetic Low-Hull Proximity Alarm (HP < 28%) */
  if (p.hp > 0 && p.hp < p.maxhp * 0.28){
    p.lowHullTimer = (p.lowHullTimer !== undefined ? p.lowHullTimer : 0) - dt;
    if (p.lowHullTimer <= 0){
      p.lowHullTimer = 0.55;
      if (sound.lowHullAlarm) sound.lowHullAlarm();
      if (typeof triggerRumble === 'function') triggerRumble(0.22, 90);
    }
  }

  _scratchVec.x = mx; _scratchVec.y = my;
  var ml = Math.hypot(_scratchVec.x, _scratchVec.y);
  if (ml > 0.001){
    _scratchVec.x /= ml; _scratchVec.y /= ml;
    mx = _scratchVec.x; my = _scratchVec.y;
  } else {
    mx = 0; my = 0;
  }

  if ((keys['shift'] || keys[' '] || gpDash) && p.dashT <= 0){
    var ddx = mx, ddy = my;
    if (ddx === 0 && ddy === 0){
      ddx = Math.cos(p.aim);
      ddy = Math.sin(p.aim);

    p.dashDirX = ddx;
    p.dashDirY = ddy;

    p.vy = ddy * p.speed * 4.6;
    for (var gh = 0; gh < 6; gh++)
      G.ghosts.push({ x:p.x - ddx*gh*12, y:p.y - ddy*gh*12, ang:p.aim, life:1 - gh*0.14 });
    burst(p.x, p.y, '#9df6ff', 24, Math.atan2(-ddy, -ddx), 0.75);
    shockwave(p.x, p.y, '#9df6ff', 120, 2);
    sound.dash();
  }

  if (p.dashActiveT > 0){
    // Maintain supersonic dash velocity throughout the active duration
    p.vx = p.dashDirX * p.speed * 4.6;
    p.vy = p.dashDirY * p.speed * 4.6;
    p.dashGhostTimer = (p.dashGhostTimer || 0) + dt;
    if (p.dashGhostTimer >= 0.04){
      p.dashGhostTimer = 0;
      G.ghosts.push({ x: p.x, y: p.y, ang: p.aim, life: 0.75 });
      burst(p.x, p.y, '#9df6ff', 3, Math.atan2(-p.dashDirY, -p.dashDirX), 0.5);
    }
  } else {
    var acc = Math.min(1, dt*14);
    var currentSpeed = isSkillActive('timewarp') ? p.speed * 1.38 : p.speed;
    if (p.hyperDrive > 0) currentSpeed *= 1.7;
    p.vx += (mx*currentSpeed - p.vx) * acc;
    p.vy += (my*currentSpeed - p.vy) * acc;
    if (mx === 0 && my === 0 && Math.hypot(p.vx, p.vy) < 4){
      p.vx = 0; p.vy = 0;
    }
  }

  p.x = clamp(p.x + p.vx*dt, 34, ARENA-34);
  p.y = clamp(p.y + p.vy*dt, 34, ARENA-34);

  // Map exploration features update
  if (typeof updateMapFeatures === 'function') updateMapFeatures(dt);

  // Rebound / physical collision with intact crystalline minerals
  if (G.minerals){
    for (var mi = 0; mi < G.minerals.length; mi++){
      var min = G.minerals[mi];
      if (min.hp <= 0) continue;
      var mDist = Math.hypot(p.x - min.x, p.y - min.y);
      var minSep = p.r + min.r;
      if (mDist < minSep && mDist > 0.001){
        var pushOut = minSep - mDist;
        var nx = (p.x - min.x) / mDist;
        var ny = (p.y - min.y) / mDist;
        p.x += nx * pushOut;
        p.y += ny * pushOut;
        p.vx = -p.vx * 0.4 + nx * 80;
        p.vy = -p.vy * 0.4 + ny * 80;
        min.flash = 0.12;
        min.shake = 3;
      }
    }
  }
  if (p.regen > 0) p.hp = Math.min(p.maxhp, p.hp + p.regen*dt);
  if (p.maxShield && p.maxShield > 0){
    p.shieldRegenTimer = (p.shieldRegenTimer || 0) - dt;
    if (p.shieldRegenTimer <= 0 && p.shield < p.maxShield){
      p.shield = Math.min(p.maxShield, p.shield + dt * (p.maxShield * 0.35));
    }
  }

  // Active Skill Cooldown [Q]
  if (p.skills && p.skills.q){
    var sData = p.skills.q;
    if (sData.cd > 0){
      sData.cd = Math.max(0, sData.cd - dt);
      if (sData.cd === 0 && sData.skill){
        sound.skillReady();
        addText(p.x, p.y - 32, sData.skill.name + ' [Q] READY!', sData.skill.col, 16);
      }
    }
    if (sData.activeT > 0){
      sData.activeT = Math.max(0, sData.activeT - dt);
    }
  }
  if (p.skillCd > 0) p.skillCd = Math.max(0, p.skillCd - dt);
  if (p.skillActiveT > 0) p.skillActiveT = Math.max(0, p.skillActiveT - dt);

  G.camX += ((p.x + p.vx*0.12) - G.camX) * Math.min(1, dt*7);
  G.camY += ((p.y + p.vy*0.12) - G.camY) * Math.min(1, dt*7);

  /* Directional Aim & Shoot Controls (Arrow Keys with Smooth Aim Assist & Gamepad Right Stick) */
  var sx = 0, sy = 0;
  if (keys['arrowleft'])  sx--;
  if (keys['arrowright']) sx++;
  if (keys['arrowup'])    sy--;
  if (keys['arrowdown'])  sy++;
  var isArrowAim = (sx !== 0 || sy !== 0);

  var shouldFire = false;
  var rawManualAim = p.aim;

  var gpRightAim = false;
  if (gp && gp.axes){
    var grx = gp.axes[2] || 0;
    var gry = gp.axes[3] || 0;
    if (Math.hypot(grx, gry) > 0.22){
      rawManualAim = Math.atan2(gry, grx);
      shouldFire = true;
      gpRightAim = true;
    }
    var rtPressed = gp.buttons && gp.buttons[7] && (gp.buttons[7].pressed || gp.buttons[7].value > 0.15);
    var rbPressed = gp.buttons && gp.buttons[5] && (gp.buttons[5].pressed || gp.buttons[5].value > 0.15);
    var ltPressed = gp.buttons && gp.buttons[6] && (gp.buttons[6].pressed || gp.buttons[6].value > 0.15);
    var bPressed = gp.buttons && gp.buttons[1] && (gp.buttons[1].pressed || gp.buttons[1].value > 0.15);
    if (rtPressed || rbPressed || ltPressed || bPressed){
      shouldFire = true;
    }
  }

  if (!gpRightAim){
    if (isArrowAim){
      // Directional Arrow Keys: aim and fire in chosen direction
      rawManualAim = Math.atan2(sy, sx);
      shouldFire = true;
    } else if (touch.active){
      // Touchscreen aim
      var tdx = touch.x - p.x, tdy = touch.y - p.y;
      if (Math.hypot(tdx, tdy) > 18){
        rawManualAim = Math.atan2(tdy, tdx);
        shouldFire = true;
      }
    } else if (!!keys['control'] || !!keys['j'] || !!keys['k'] || !!keys['z']){
      // Fire key pressed without directional arrows: fire in current facing direction
      rawManualAim = p.aim;
      shouldFire = true;
    } else if (!shouldFire){
      // Cruising mode: ship smoothly heads toward movement vector when maneuvering
      if (Math.hypot(p.vx, p.vy) > 20){
        rawManualAim = Math.atan2(p.vy, p.vx);
      }
      shouldFire = false;
    }
  }

  // Aim Assist: Forward tactical cone hostile search in aimed direction
  var bestTarget = null;
  if (shouldFire){
    var assistCone = 0.70 * (1 + (p.aimAssistBonus || 0)); // ~40-58 degrees cone
    var maxAssistRange = 750;
    var bestScore = -1;

    for (var ei = 0; ei < G.enemies.length; ei++){
      var e = G.enemies[ei];
      if (e.hp <= 0) continue;
      var edx = e.x - p.x;
      var edy = e.y - p.y;
      var edist = Math.hypot(edx, edy);
      if (edist <= maxAssistRange && edist > 0){
        var eang = Math.atan2(edy, edx);
        var dAng = Math.abs(angDist(rawManualAim, eang));
        if (dAng <= assistCone){
          var angScore = 1 - (dAng / assistCone);
          var distScore = 1 - (edist / maxAssistRange);
          var score = angScore * 0.70 + distScore * 0.30;
          if (e.isBoss) score *= 1.45;
          if (score > bestScore){
            bestScore = score;
            bestTarget = e;
          }
        }
      }
    }
  }

  G.aimAssistTarget = bestTarget;

  // Aim Assist: Line up player model directly to the target
  var desiredAim = rawManualAim;
  if (bestTarget && shouldFire){
    desiredAim = Math.atan2(bestTarget.y - p.y, bestTarget.x - p.x);
    // Directly lock player heading and bullet trajectory to target with zero lag
    p.aim = desiredAim;
  } else {
    // Smooth rotational interpolation (snappy when aiming, smooth when cruising)
    var turnSpeed = shouldFire ? 28 : 12;
    p.aim = angLerp(p.aim, desiredAim, Math.min(1, dt * turnSpeed));
  }
  _scratchAim.x = Math.cos(p.aim);
  _scratchAim.y = Math.sin(p.aim);
  var fireAngle = p.aim;

  // Fire command: ONLY fires when the player holds arrow keys, touch, or fire key
  G.playerFiring = shouldFire;

  p.fireT -= dt;
  if (p.fireT <= 0 && shouldFire){
    var curFireRate = isSkillActive('timewarp') ? p.fireRate * 1.45 : p.fireRate;
    p.fireT = 1 / curFireRate;
    p.recoil = 1; p.muzzle = 1;
    var spread = 0.15;
    for (var s = 0; s < p.shots; s++){
      var a2 = fireAngle + (s - (p.shots-1)/2) * spread + rnd(-0.02,0.02);
      var isCrit = Math.random() < p.crit;
      G.bullets.push({
        x:p.x + Math.cos(a2)*p.r, y:p.y + Math.sin(a2)*p.r,
        vx:Math.cos(a2)*660, vy:Math.sin(a2)*660,
        r:p.bsize, dmg:p.damage, pierce:p.pierce, hit:[], life:1.6,
        ang:a2, crit:isCrit, critMult: p.critMult || 2.5
      });
    }
    // Visual recoil only via p.recoil - no physics velocity kick (p.vx -= ...) so player stays under full control
    burst(p.x + Math.cos(fireAngle)*p.r*1.3, p.y + Math.sin(fireAngle)*p.r*1.3, '#cfefff', 3, fireAngle, 0.4);
    sound.shoot();
  }

  /* Tactical Incursion Spawner Director */
  var isCombatWave = (G.sector === 2) ? (G.wave >= 6 && G.wave <= 9) : (G.wave <= 5);
  if (G.mode !== 'training' && isCombatWave && G.waveState === 'combat'){
    if (G.spawnTimer === undefined) G.spawnTimer = 0.4;
    G.spawnTimer -= dt;

    var activeMobs = 0;
    for (var mi = 0; mi < G.enemies.length; mi++){
      if (!G.enemies[mi].isBoss) activeMobs++;
    }

    var maxConcurrent = Math.min(18, 8 + G.wave * 2);
    if ((G.waveSpawned || 0) < G.waveTotal && activeMobs < maxConcurrent && G.spawnTimer <= 0){
      G.spawnTimer = Math.max(0.65, 1.45 - G.wave * 0.12);
      var toSpawn = Math.min(G.waveTotal - (G.waveSpawned || 0), Math.floor(rnd(2, 4)));

      var pickType = 'drifter';
      var roll = Math.random();
      if (G.sector === 2){
        if (G.wave === 6){
          pickType = roll < 0.60 ? 'carapace' : 'mantis';
        } else if (G.wave === 7){
          pickType = roll < 0.50 ? 'mantis' : (roll < 0.80 ? 'sporepod' : 'carapace');
        } else if (G.wave === 8){
          pickType = roll < 0.40 ? 'sporepod' : (roll < 0.65 ? 'colossus' : (roll < 0.85 ? 'mantis' : 'carapace'));
        } else {
          pickType = roll < 0.35 ? 'colossus' : (roll < 0.60 ? 'sporepod' : (roll < 0.80 ? 'mantis' : 'carapace'));
        }
      } else {
        var curW = Math.min(5, G.wave || 1);
        if (curW === 1){
          pickType = 'drifter';
        } else if (curW === 2){
          pickType = roll < 0.60 ? 'drifter' : 'splitter';
        } else if (curW === 3){
          pickType = roll < 0.40 ? 'drifter' : (roll < 0.75 ? 'splitter' : 'shooter');
        } else if (curW === 4){
          pickType = roll < 0.30 ? 'drifter' : (roll < 0.55 ? 'splitter' : (roll < 0.80 ? 'shooter' : 'brute'));
        } else {
          pickType = roll < 0.22 ? 'drifter' : (roll < 0.45 ? 'splitter' : (roll < 0.70 ? 'shooter' : (roll < 0.85 ? 'brute' : 'shard')));
        }
      }

      var fRoll = Math.random();
      var form = fRoll < 0.4 ? 'cluster' : (fRoll < 0.75 ? 'pincer' : 'ring');
      spawnSquad({ type: pickType, count: toSpawn, formation: form });
      G.waveSpawned = (G.waveSpawned || 0) + toSpawn;
    }

    // Check if current wave is fully eliminated
    if (G.waveKills >= G.waveTotal && activeMobs === 0){
      G.waveState = 'cleared';
      G.waveTimer = 2.0;
      sound.waveStart();
      G.shake = 16;
      G.flash = 0.45;

      // Heal player 25% max HP as battlefield repair
      if (p){
        var healAmt = Math.round(p.maxhp * 0.25);
        p.hp = Math.min(p.maxhp, p.hp + healAmt);
        addText(p.x, p.y - 50, '+' + healAmt + ' HP REPAIR', '#3ddc97', 20);
        shockwave(p.x, p.y, '#3ddc97', 220, 3);
      }

      // Tactical skill core drops on Sector 1 (Waves 2, 4) and Sector 2 (Waves 7, 9)
      if (G.sector === 2){
        if (G.wave === 7 || G.wave === 9){
          dropRandomSkillCore(p.x + rnd(-60, 60), p.y + rnd(-60, 60));
          addText(p.x, p.y - 75, 'TACTICAL SKILL CORE DEPLOYED!', '#35f0ff', 20);
        }
      } else {
        if (G.wave === 2 || G.wave === 4){
          dropRandomSkillCore(p.x + rnd(-60, 60), p.y + rnd(-60, 60));
          addText(p.x, p.y - 75, 'TACTICAL SKILL CORE DEPLOYED!', '#35f0ff', 20);
        }
      }

      if (G.sector === 2){
        if (G.wave < 9){
          addText(p.x, p.y - 25, 'WAVE ' + G.wave + ' CLEARED!', '#ffe066', 26);
          G.missionToast = {
            t: 2.8,
            title: 'WAVE ' + G.wave + ' CLEARED // REPAIRS COMPLETE',
            sub: 'PREPARE FOR SECTOR 2 WAVE ' + (G.wave + 1)
          };
        } else {
          addText(p.x, p.y - 25, 'ALL BIO-PREDATOR WAVES CLEARED!', '#ff0033', 28);
          G.missionToast = {
            t: 4.2,
            title: 'BIO-HORDE EXTERMINATED // VOID GARGANTUA AWAKENING',
            sub: 'PREPARE FOR APEX CONFRONTATION WITH VORACIS'
          };
        }
      } else {
        if (G.wave < 5){
          addText(p.x, p.y - 25, 'WAVE ' + G.wave + ' CLEARED!', '#ffe066', 26);
          G.missionToast = {
            t: 2.8,
            title: 'WAVE ' + G.wave + ' CLEARED // REPAIRS COMPLETE',
            sub: 'PREPARE FOR WAVE ' + (G.wave + 1) + ' OF 5'
          };
        } else {
          // Wave 5 finished!
          addText(p.x, p.y - 25, 'ALL 5 WAVES CLEARED!', '#ffe066', 28);
          G.missionToast = {
            t: 4.2,
            title: 'ALL 5 INCURSIONS REPELLED // TITAN STASIS COMPROMISED',
            sub: 'BIOMECHANICAL EGG RUPTURING • PREPARE FOR APEX CONFRONTATION'
          };
        }
      }
    }
  } else if (G.mode !== 'training' && G.waveState === 'cleared'){
    G.waveTimer -= dt;
    if (G.waveTimer <= 0){
      if (G.sector === 2){
        if (G.wave < 9){
          startWave(G.wave + 1);
        } else {
          G.wave = 10;
          G.waveState = 'boss';
          startWave(10);
        }
      } else {
        if (G.wave < 5){
          startWave(G.wave + 1);
        } else {
          // Awaken Boss
          G.wave = 6;
          G.waveState = 'boss';
          startWave(6);
          awakenBoss();
        }
      }
    }
  }

  // Fallback awakening if level 10 reached via god mode warp
  if (G.mode !== 'training' && G.boss && G.boss.dormant && p.lvl >= BOSS_UNLOCK_LEVEL){
    awakenBoss();
  }

  // Deflect player smoothly from Aegis Stasis Matrix while sealed
  if (G.boss && G.boss.dormant){
    var pDistToMatrix = Math.hypot(p.x - G.boss.x, p.y - G.boss.y);
    if (pDistToMatrix < G.boss.barrierRadius + p.r){
      var pushAng = Math.atan2(p.y - G.boss.y, p.x - G.boss.x);
      p.x = G.boss.x + Math.cos(pushAng) * (G.boss.barrierRadius + p.r + 2);
      p.y = G.boss.y + Math.sin(pushAng) * (G.boss.barrierRadius + p.r + 2);
      p.vx *= 0.5; p.vy *= 0.5;
    }
  }

  var enemyDt = isSkillActive('timewarp') ? dt * 0.22 : dt;
  var barrierActive = isSkillActive('barrier');
  for (var i = G.enemies.length - 1; i >= 0; i--){
    var e = G.enemies[i];
    if (e.isBoss){
      updateBoss(e, enemyDt, p);
    }
    e.flash = Math.max(0, e.flash - dt*6);
    e.squash = Math.max(0, e.squash - dt*5);
    e.spawn = Math.min(1, e.spawn + dt*3.4);
    var targetX = p.x, targetY = p.y;
    if (G.phantomDecoys && G.phantomDecoys.length > 0 && ((e.x * 13 + e.y * 7) % 10 < 7)){
      var d0 = G.phantomDecoys[0], d1 = G.phantomDecoys[1];
      if (d0 && d1){
        var pickD = Math.hypot(e.x - d0.x, e.y - d0.y) < Math.hypot(e.x - d1.x, e.y - d1.y) ? d0 : d1;
        targetX = pickD.x; targetY = pickD.y;
      } else if (d0) { targetX = d0.x; targetY = d0.y; }
      else if (d1) { targetX = d1.x; targetY = d1.y; }
    }
    var dx = targetX - e.x, dy = targetY - e.y;
    var d = Math.hypot(dx, dy) || 1;
    var ux = dx/d, uy = dy/d;
    e.ang = angLerp(e.ang, Math.atan2(dy, dx), Math.min(1, dt*7));

    if (e.stun > 0){
      e.stun = Math.max(0, e.stun - dt);
      e.vx = 0; e.vy = 0;
      if (Math.random() < 0.25) burst(e.x + rnd(-e.r, e.r), e.y + rnd(-e.r, e.r), '#00f0ff', 1);
    } else if (e.ranged && !e.isBoss){
      var dir = d < 250 ? -1 : (d > 370 ? 1 : 0);
      e.vx = ux*e.spd*dir; e.vy = uy*e.spd*dir;

      if (e.shootT <= 0 && d < 620){ e.shootT = 2.2; fireEnemyBullet(e); }
    } else if (!e.isBoss){
      if (e.type === 'colossus'){
        e.chargeTimer = (e.chargeTimer !== undefined ? e.chargeTimer : 4.0) - enemyDt;
        if (e.charging > 0){
          e.charging -= enemyDt;
          e.vx = Math.cos(e.chargeAng) * 220;
          e.vy = Math.sin(e.chargeAng) * 220;
          // Tactical telegraph: Colossus charging dust trails & ground rumble
          burst(e.x - Math.cos(e.chargeAng) * e.r * 0.8, e.y - Math.sin(e.chargeAng) * e.r * 0.8, '#ff5400', 2);
          if (d < 460){
            G.shake = Math.max(G.shake, 6 * enemyDt * 60);
            if (typeof triggerRumble === 'function') triggerRumble(0.25, 40);
          }
        } else if (e.chargeTimer <= 0 && d < 460){
          e.chargeTimer = rnd(4.2, 5.8);
          e.charging = 0.95;
          e.chargeAng = Math.atan2(dy, dx);
          shockwave(e.x, e.y, '#ff3565', 70, 2);
          burst(e.x, e.y, '#ff3565', 10);
        } else {
          e.vx = ux * e.spd; e.vy = uy * e.spd;
          if (e.chargeTimer < 1.0 && Math.random() < 0.25){
            burst(e.x + (Math.random()-0.5)*e.r, e.y + (Math.random()-0.5)*e.r, '#ff7043', 1);
          }
        }
      } else if (e.type === 'mantis'){
        var wasCloaked = !!e.cloaked;
        e.cloaked = (d > 220);
        if (wasCloaked && !e.cloaked){
          // Tactical telegraph: Mantis phase-in dimensional distortion shockwave
          shockwave(e.x, e.y, '#bf55ec', 110, 4);
          burst(e.x, e.y, '#df7eff', 16);
          if (sound.quantumWarp) sound.quantumWarp();
          else if (sound.skillTimeWarp) sound.skillTimeWarp();
          if (typeof triggerRumble === 'function') triggerRumble(0.35, 120);
        }
        e.slashT = (e.slashT !== undefined ? e.slashT : 2.5) - enemyDt;
        if (e.slashT <= 0 && d < 300){
          e.slashT = 2.6;
          fireEnemyBullet(e);
          burst(e.x, e.y, '#bf55ec', 8);
        }
        var mSpd = e.cloaked ? e.spd * 1.25 : e.spd;
        e.vx = ux * mSpd; e.vy = uy * mSpd;
      } else if (e.type === 'sporepod'){
        e.sporeT = (e.sporeT !== undefined ? e.sporeT : 4.0) - enemyDt;
        if (e.sporeT <= 0 && G.enemies.length < 40){
          e.sporeT = rnd(4.5, 6.0);
          var sa = Math.random() * TAU;
          spawnEnemyUnit('spore', e.x + Math.cos(sa) * 30, e.y + Math.sin(sa) * 30);
          burst(e.x, e.y, '#ff9f1c', 6);
        }
        e.vx = ux * e.spd; e.vy = uy * e.spd;
      } else if (e.type === 'spore'){
        // Tactical telegraph: Spore proximity hazard warning
        if (d < 200){
          e.isWarning = true;
          e.warningDistFrac = clamp(1 - (d / 200), 0, 1);
        } else {
          e.isWarning = false;
          e.warningDistFrac = 0;
        }
        if (d < 65){
          killEnemy(e, i, false);
          continue;
        }
        e.vx = ux * e.spd; e.vy = uy * e.spd;
      } else {
        if (e.type === 'carapace') e.shieldR = 75;
        e.vx = ux*e.spd; e.vy = uy*e.spd;
      }
    }
    e.kx = (e.kx || 0) * Math.pow(0.0009, dt);
    e.ky = (e.ky || 0) * Math.pow(0.0009, dt);
    var boundPadding = e.r + 8;
    e.x = clamp(e.x + (e.vx + e.kx)*enemyDt, boundPadding, ARENA - boundPadding);
    e.y = clamp(e.y + (e.vy + e.ky)*enemyDt, boundPadding, ARENA - boundPadding);
    e.touchT = (e.touchT || 0) - dt;

    if (barrierActive && d < e.r + p.r + 26 && e.touchT <= 0){
      e.touchT = 0.35;
      e.hp -= 45;
      e.flash = 1;
      e.kx = -ux * 340;
      e.ky = -uy * 340;
      shockwave(p.x + ux*p.r*1.4, p.y + uy*p.r*1.4, '#3ddc97', 50, 2);
      burst(p.x + ux*p.r*1.4, p.y + uy*p.r*1.4, '#3ddc97', 8);
      addText(e.x, e.y - e.r, '45', '#3ddc97', 16);
      sound.hit(true);
      if (e.hp <= 0){ killEnemy(e, i, false); continue; }
    } else if (d < e.r + p.r && e.touchT <= 0 && e.hp > 0){
      e.touchT = e.isBoss ? 0.70 : 0.45;
      hurtPlayer(e.dmg);
    }
    if (e.hp <= 0) killEnemy(e, i, e.hitWithCrit);
  }

  for (var bi = G.bullets.length - 1; bi >= 0; bi--){
    var b = G.bullets[bi];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    var dead = b.life <= 0;
    if (!dead){
      // Stasis Barrier bullet deflection while Leviathan slumbers
      if (G.boss && G.boss.dormant){
        var bDist = Math.hypot(b.x - G.boss.x, b.y - G.boss.y);
        var bRad = G.boss.barrierRadius || G.boss.barrierR || 210;
        if (bDist < bRad + b.r){
          var hitAng = Math.atan2(b.y - G.boss.y, b.x - G.boss.x);
          burst(b.x, b.y, '#35f0ff', 6);
          burst(b.x, b.y, '#e0aaff', 4);
          shockwave(b.x, b.y, '#35f0ff', 40, 2);
          if (G.boss.deflectionRipples){
            G.boss.deflectionRipples.push({
              ang: hitAng,
              r: 8,
              maxR: 38,
              life: 0.40,
              maxLife: 0.40
            });
          }
          G.boss.crackImpactFlash = 1.0;
          G.boss.lastHitAng = hitAng;
          sound.hit(true);
          addText(b.x, b.y - 12, 'STASIS SHIELD // CLEAR 5 WAVES', '#35f0ff', 12);
          dead = true;
        }
      }
    }
    if (!dead){
      for (var ei = 0; ei < G.enemies.length; ei++){
        var en = G.enemies[ei];
        if (en.hp <= 0 || b.hit.indexOf(en) !== -1 || (en.isBoss && en.dormant)) continue;
        var rr = en.r + b.r;
        var hitBossSeg = false;

        if (en.isBoss && en.bossType === 'abyss' && en.segments && en.segments.length > 0){
          for (var si = 0; si < en.segments.length; si++){
            var seg = en.segments[si];
            var srr = seg.r + b.r;
            if ((seg.x - b.x)*(seg.x - b.x) + (seg.y - b.y)*(seg.y - b.y) < srr*srr){
              hitBossSeg = true;
              hitSegObj = seg;
              break;
            }
          }
        }
        if (((en.x-b.x)*(en.x-b.x) + (en.y-b.y)*(en.y-b.y) < rr*rr) || hitBossSeg){
          if (en.isBoss && en.barrierActive){
            // Aegis Titan Bulwark reflection
            var refAng = Math.atan2(b.y - en.y, b.x - en.x) + rnd(-0.22, 0.22);
            G.ebullets.push({
              x: b.x, y: b.y,
              vx: Math.cos(refAng) * 440, vy: Math.sin(refAng) * 440,
              r: 6, dmg: (en.dmg || 12) * 0.45, life: 3.0, ang: refAng, col: '#ff9f1c'
            });
            burst(b.x, b.y, '#ff9f1c', 6);
            shockwave(b.x, b.y, '#ff9f1c', 35, 2);
            sound.hit(true);
            dead = true;
            break;
          }
          var dmg = b.dmg * (b.crit ? (b.critMult || 2.5) : 1);
          if (p.bossDamageMult && en.isBoss) dmg *= p.bossDamageMult;
          if (hitBossSeg) dmg *= 0.55;

          // Hive Colossus Frontal Armor Plate Deflection vs Dorsal Heart Critical
          if (en.type === 'colossus'){
            var colRelHitA = angDist(en.ang, Math.atan2(b.y - en.y, b.x - en.x));
            if (Math.abs(colRelHitA) < 1.15){
              // Frontal deflection: 70% damage reduction
              dmg *= 0.30;
              burst(b.x, b.y, '#ffffff', 5);
              shockwave(b.x, b.y, '#ff3565', 28, 2);
              addText(b.x, b.y - 12, 'DEFLECTED -70%', '#ff3565', 11);
            } else if (Math.abs(colRelHitA) > 2.1){
              // Exposed rear dorsal heart: 3.0x critical damage
              dmg *= 3.0;
              b.crit = true;
