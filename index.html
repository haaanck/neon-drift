var W = 0, H = 0, DPR = 1;

var vignette = null;

/* Cosmic Deep-Space Environment */

var VORACIS_EYE_OFFSETS = [

  { fx: 0.14, fy: -0.48, fr: 4.5 },

  { fx: 0.38, fy: 0.36,  fr: 6.5 },
  { fx: 0.26, fy: 0.44,  fr: 5.5 },
  { fx: 0.14, fy: 0.48,  fr: 4.5 },

var COLOSSUS_PLATE_CONFIGS = [

];

var STARS = [];
(function initStars(){
  var seed = 5123;
  function pseudoRnd(){
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }
  for (var i = 0; i < 135; i++){
    var starX = Math.round(pseudoRnd() * (ARENA + 400) - 200);
    var starY = Math.round(pseudoRnd() * (ARENA + 400) - 200);
    var sz = Number((0.85 + pseudoRnd() * 1.8).toFixed(2));
    var baseA = Number((0.25 + pseudoRnd() * 0.45).toFixed(2));
    var spd = Number((1.2 + pseudoRnd() * 2.4).toFixed(2));
    var hueRoll = pseudoRnd();
    var hue = hueRoll < 0.35 ? '#8fe5ff' : (hueRoll < 0.65 ? '#d5bfff' : '#ffffff');
    var hasCross = sz > 2.0;
    STARS.push({ x: starX, y: starY, r: sz, baseA: baseA, spd: spd, col: hue, cross: hasCross });
  }
})();

/* Map Texture Features: Asteroids, Cyber Conduits, Tech Floor Decals */
var MAP_ASTEROIDS = [];
var MAP_TECH_DECALS = [];
var MAP_CONDUITS = [];

(function initMapTextures(){
  var seed = 8841;
  function pRnd(){
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }

  // 1. Faceted Deep-Space Asteroids / Mineral Debris
  for (var i = 0; i < 52; i++){
    var ax = 120 + pRnd() * (ARENA - 240);
    var ay = 120 + pRnd() * (ARENA - 240);
    var ar = 12 + pRnd() * 26;
    var verts = [];
    var vCount = 6 + Math.floor(pRnd() * 4);
    for (var vi = 0; vi < vCount; vi++){
      var va = (vi / vCount) * TAU;
      var vr = ar * (0.75 + pRnd() * 0.45);
      verts.push({ x: Math.cos(va) * vr, y: Math.sin(va) * vr });
    }
    var rot = pRnd() * TAU;
    var craterCount = 1 + Math.floor(pRnd() * 3);
    var craters = [];
    for (var ci = 0; ci < craterCount; ci++){
      craters.push({
        x: (pRnd() - 0.5) * ar * 0.9,
        y: (pRnd() - 0.5) * ar * 0.9,
        r: 2 + pRnd() * (ar * 0.25)
      });
    }
    MAP_ASTEROIDS.push({ x: ax, y: ay, r: ar, verts: verts, rot: rot, craters: craters });
  }

  // 2. Cyber-Conduit Junctions & Energy Fiber Lines
  for (var cStep = 375; cStep < ARENA; cStep += 375){
    MAP_CONDUITS.push({ axis: 'x', pos: cStep });
    MAP_CONDUITS.push({ axis: 'y', pos: cStep });
  }

  // 3. Tech Sector Markings, Floor Grates & Stencils
  var badges = ['ALPHA-CORE', 'SUB-STATION 07', 'PLASMA VENT', 'REACTOR CONDUIT', 'SECTOR GATE', 'RELAY HUB'];
  for (var di = 0; di < 24; di++){
    var dx = 200 + pRnd() * (ARENA - 400);
    var dy = 200 + pRnd() * (ARENA - 400);
    var dtype = Math.floor(pRnd() * 3); // 0: Vent Grate, 1: Stencil Badge, 2: Hazard Stripes
    var dtext = badges[di % badges.length];
    MAP_TECH_DECALS.push({ x: dx, y: dy, type: dtype, text: dtext, r: 25 + pRnd() * 20 });
  }
})();

function drawMapTextures(cx, cy){
  var vw = W / ZOOM, vh = H / ZOOM;
  var minX = cx - vw/2 - 120, maxX = cx + vw/2 + 120;
  var minY = cy - vh/2 - 120, maxY = cy + vh/2 + 120;

  // 1. Cyber Conduit Traces & Traveling Energy Pulses
  ctx.save();
  for (var ci = 0; ci < MAP_CONDUITS.length; ci++){
    var c = MAP_CONDUITS[ci];
    if (c.axis === 'x'){
      if (c.pos < minY || c.pos > maxY) continue;
      // Conduit track lines
      ctx.strokeStyle = 'rgba(53, 240, 255, 0.045)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(Math.max(0, minX), c.pos);
      ctx.lineTo(Math.min(ARENA, maxX), c.pos);
      ctx.stroke();

      // Thin inner glowing core
      ctx.strokeStyle = 'rgba(53, 240, 255, 0.09)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Traveling data/energy packet
      var pulseOffset = ((G ? G.t : 0) * 85 + c.pos) % ARENA;
      if (pulseOffset >= minX && pulseOffset <= maxX){
        ctx.fillStyle = '#35f0ff';
        ctx.globalAlpha = 0.45;
        ctx.fillRect(pulseOffset - 12, c.pos - 2, 24, 4);
      }
    } else {
      if (c.pos < minX || c.pos > maxX) continue;
      ctx.strokeStyle = 'rgba(53, 240, 255, 0.045)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(c.pos, Math.max(0, minY));
      ctx.lineTo(c.pos, Math.min(ARENA, maxY));
      ctx.stroke();

      ctx.strokeStyle = 'rgba(53, 240, 255, 0.09)';
      ctx.lineWidth = 1;
      ctx.stroke();

      var pulseOffset = ((G ? G.t : 0) * 85 + c.pos) % ARENA;
      if (pulseOffset >= minY && pulseOffset <= maxY){
        ctx.fillStyle = '#35f0ff';
        ctx.globalAlpha = 0.45;
        ctx.fillRect(c.pos - 2, pulseOffset - 12, 4, 24);
      }
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 2. Tech Decals, Floor Grates & Sector Markings
  for (var di = 0; di < MAP_TECH_DECALS.length; di++){
    var dec = MAP_TECH_DECALS[di];
    if (dec.x + dec.r < minX || dec.x - dec.r > maxX || dec.y + dec.r < minY || dec.y - dec.r > maxY) continue;

    ctx.save();
    ctx.translate(dec.x, dec.y);
    if (dec.type === 0){
      // Cooling / Energy Vent Grate
      ctx.strokeStyle = 'rgba(53, 240, 255, 0.07)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-dec.r, -dec.r*0.6, dec.r*2, dec.r*1.2);
      ctx.beginPath();
      var slits = 5;
      for (var si = 1; si < slits; si++){
        var sx = -dec.r + (si/slits) * dec.r*2;
        ctx.moveTo(sx, -dec.r*0.5); ctx.lineTo(sx, dec.r*0.5);
      }
      ctx.stroke();
      ctx.fillStyle = 'rgba(53, 240, 255, 0.03)';
      ctx.fillRect(-dec.r*0.8, -dec.r*0.4, dec.r*1.6, dec.r*0.8);
    } else if (dec.type === 1){
      // Stencil Sector Badge
      ctx.font = '8px ui-monospace,monospace';
      ctx.fillStyle = 'rgba(159, 182, 200, 0.18)';
      ctx.textAlign = 'center';
      ctx.fillText('[ ' + dec.text + ' ]', 0, 0);
      ctx.strokeStyle = 'rgba(53, 240, 255, 0.1)';
      ctx.strokeRect(-dec.r, -7, dec.r*2, 14);
    } else {
      // Caution Hazard Stripe Patch
      ctx.strokeStyle = 'rgba(255, 224, 102, 0.08)';
      ctx.lineWidth = 2;
      ctx.strokeRect(-dec.r*0.8, -12, dec.r*1.6, 24);
      ctx.beginPath();
      for (var hi = -dec.r*0.7; hi < dec.r*0.7; hi += 12){
        ctx.moveTo(hi, 10); ctx.lineTo(hi + 10, -10);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // 3. Faceted Deep-Space Asteroids / Minerals
  for (var ai = 0; ai < MAP_ASTEROIDS.length; ai++){
    var ast = MAP_ASTEROIDS[ai];
    if (ast.x + ast.r < minX || ast.x - ast.r > maxX || ast.y + ast.r < minY || ast.y - ast.r > maxY) continue;

    ctx.save();
    ctx.translate(ast.x, ast.y);
    ctx.rotate(ast.rot);

    // Dark Basalt Rock Silhouette
    ctx.fillStyle = '#080c14';
    ctx.strokeStyle = 'rgba(53, 240, 255, 0.12)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (var vi = 0; vi < ast.verts.length; vi++){
      var v = ast.verts[vi];
      if (vi === 0) ctx.moveTo(v.x, v.y);
      else ctx.lineTo(v.x, v.y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Internal rock surface facets & craters
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ast.verts[0].x, ast.verts[0].y);
    ctx.lineTo(ast.verts[2].x * 0.4, ast.verts[2].y * 0.4);
    ctx.lineTo(ast.verts[ast.verts.length - 2].x, ast.verts[ast.verts.length - 2].y);
    ctx.stroke();

    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.strokeStyle = 'rgba(53, 240, 255, 0.08)';
    for (var cr = 0; cr < ast.craters.length; cr++){
      var c = ast.craters[cr];
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, TAU);
      ctx.fill();
      ctx.stroke();
    }

    ctx.restore();
  }
}

/* ================= EXPLORATION & MAP POINTS OF INTEREST (POIS) ================= */

function initMapFeatures(){
  if (!G) return;

  // 1. Slipstream Acceleration Gates (8 high-speed transit rings)
  G.boostRings = [
    { x: 1200, y: 2100, ang: 0, r: 42, cd: 0 },
    { x: 3000, y: 2100, ang: Math.PI, r: 42, cd: 0 },
    { x: 2100, y: 1200, ang: Math.PI/2, r: 42, cd: 0 },
    { x: 2100, y: 3000, ang: -Math.PI/2, r: 42, cd: 0 },
    { x: 1350, y: 1350, ang: Math.PI/4, r: 42, cd: 0 },
    { x: 2850, y: 1350, ang: 3*Math.PI/4, r: 42, cd: 0 },
    { x: 2850, y: 2850, ang: -3*Math.PI/4, r: 42, cd: 0 },
    { x: 1350, y: 2850, ang: -Math.PI/4, r: 42, cd: 0 }
  ];

  // 2. Quantum Jump Rifts (2 interconnected wormhole pairs)
  G.wormholes = [
    { id: 'ALPHA-1', pairId: 'ALPHA-2', x: 800,  y: 800,  r: 40, cd: 0, partnerIdx: 1, col: '#bf5af2' },
    { id: 'ALPHA-2', pairId: 'ALPHA-1', x: 3400, y: 3400, r: 40, cd: 0, partnerIdx: 0, col: '#bf5af2' },
    { id: 'BETA-1',  pairId: 'BETA-2',  x: 3400, y: 800,  r: 40, cd: 0, partnerIdx: 3, col: '#35f0ff' },
    { id: 'BETA-2',  pairId: 'BETA-1',  x: 800,  y: 3400, r: 40, cd: 0, partnerIdx: 2, col: '#35f0ff' }
  ];

  // 3. Derelict High-Tech Salvage Caches (4 exploratory tactical POIs)
  G.salvagePods = [
    { id: 'POD-ALPHA', name: 'TITAN WRECKAGE',  x: 950,  y: 1650, r: 32, progress: 0, maxT: 1.4, looted: false, cd: 0, col: '#ffe066' },
    { id: 'POD-BETA',  name: 'CARGO CAPSULE',   x: 3250, y: 1550, r: 32, progress: 0, maxT: 1.4, looted: false, cd: 0, col: '#35f0ff' },
    { id: 'POD-GAMMA', name: 'ARRAY BEACON',    x: 1050, y: 2950, r: 32, progress: 0, maxT: 1.4, looted: false, cd: 0, col: '#3ddc97' },
    { id: 'POD-DELTA', name: 'ORBITAL VAULT',   x: 3150, y: 2950, r: 32, progress: 0, maxT: 1.4, looted: false, cd: 0, col: '#ff70a6' }
  ];

  // 4. Destructible Crystalline Asteroids (24 harvestable mineral clusters)
  G.minerals = [];
  var mineralSeed = 4417;
  function mRnd(){ mineralSeed = (mineralSeed * 9301 + 49297) % 233280; return mineralSeed / 233280; }
  var types = ['quartz', 'geode', 'nanite'];
  var typeCols = { quartz: '#35f0ff', geode: '#ffe066', nanite: '#3ddc97' };
  var typeHps = { quartz: 60, geode: 90, nanite: 75 };

  for (var mi = 0; mi < 24; mi++){
    var mType = types[mi % types.length];
    var mx = 300 + mRnd() * (ARENA - 600);
    var my = 300 + mRnd() * (ARENA - 600);
    if (Math.hypot(mx - ARENA/2, my - ARENA/2) < 450){
      mx += (mx > ARENA/2 ? 500 : -500);
      my += (my > ARENA/2 ? 500 : -500);
    }
    var mr = 20 + mRnd() * 14;
    var verts = [];
    var vCount = 6 + Math.floor(mRnd() * 3);
    for (var vi = 0; vi < vCount; vi++){
      var va = (vi / vCount) * TAU;
      var vr = mr * (0.8 + mRnd() * 0.4);
      verts.push({ x: Math.cos(va) * vr, y: Math.sin(va) * vr });
    }
    G.minerals.push({
      x: mx, y: my, r: mr,
      type: mType,
      col: typeCols[mType],
      hp: typeHps[mType], maxHp: typeHps[mType],
      verts: verts,
      rot: mRnd() * TAU,
      vrot: (mRnd() - 0.5) * 0.4,
      flash: 0, shake: 0,
      respawnTimer: 0
    });
  }

  G.activeZone = null;
  G.zoneToastTimer = 0;
}

function hitMineral(m, dmg, isCrit){
  m.hp -= dmg;
  m.flash = 0.25;
  m.shake = 6;
  sound.hit(isCrit);
  burst(m.x, m.y, m.col, 5);
  if (m.hp <= 0){
    destroyMineral(m);
  }
}

function destroyMineral(m){
  m.hp = 0;
  m.respawnTimer = 45;
  burst(m.x, m.y, m.col, 28);
  burst(m.x, m.y, '#ffffff', 14);
  shockwave(m.x, m.y, m.col, 95, 3);
  sound.kill('mineral');

  if (m.type === 'geode'){
    shockwave(m.x, m.y, '#ffe066', 150, 4);
    for (var ei = 0; ei < G.enemies.length; ei++){
      var en = G.enemies[ei];
      if (en.hp <= 0 || (en.isBoss && en.dormant)) continue;
      if (Math.hypot(en.x - m.x, en.y - m.y) < 150){
        en.hp -= 160; en.flash = 1;
        if (en.hp <= 0) killEnemy(en, ei, false);
      }
    }
    for (var gi = 0; gi < 2; gi++){
      var ga = Math.random() * TAU, gd = rnd(15, 45);
      G.orbs.push({
        x: clamp(m.x + Math.cos(ga)*gd, 40, ARENA-40),
        y: clamp(m.y + Math.sin(ga)*gd, 40, ARENA-40),
        vx: Math.cos(ga)*120, vy: Math.sin(ga)*120,
        val: 12, isGold: true, popTime: 0.1, life: 35, rot: Math.random()*TAU
      });
    }
    addText(m.x, m.y - 18, 'PLASMA GEODE DETONATED!', '#ffe066', 16);
  } else if (m.type === 'nanite'){
    for (var ni = 0; ni < 3; ni++){
      var na = Math.random() * TAU, nd = rnd(15, 40);
      G.orbs.push({
        x: clamp(m.x + Math.cos(na)*nd, 40, ARENA-40),
        y: clamp(m.y + Math.sin(na)*nd, 40, ARENA-40),
        vx: Math.cos(na)*90, vy: Math.sin(na)*90,
        val: 4, isNanite: true, popTime: 0.1, life: 35, rot: Math.random()*TAU
      });
    }
    addText(m.x, m.y - 18, 'NANITE MATRIX RESTORED', '#3ddc97', 16);
  } else {
    var dropCount = 4 + Math.floor(Math.random() * 3);
    for (var qi = 0; qi < dropCount; qi++){
      var qa = Math.random() * TAU, qd = rnd(15, 50);
      G.orbs.push({
        x: clamp(m.x + Math.cos(qa)*qd, 40, ARENA-40),
        y: clamp(m.y + Math.sin(qa)*qd, 40, ARENA-40),
        vx: Math.cos(qa)*100, vy: Math.sin(qa)*100,
        val: 3, popTime: 0.1, life: 30, rot: Math.random()*TAU
      });
    }
    addText(m.x, m.y - 18, 'ENERGY QUARTZ HARVESTED', '#35f0ff', 16);
  }
}

function updateMapFeatures(dt){
  if (!G || !G.player) return;
  var p = G.player;

  // 1. Update Boost Rings
  if (G.boostRings){
    for (var bri = 0; bri < G.boostRings.length; bri++){
      var br = G.boostRings[bri];
      if (br.cd > 0) br.cd = Math.max(0, br.cd - dt);
      var bdist = Math.hypot(p.x - br.x, p.y - br.y);
      if (bdist < br.r && br.cd <= 0){
        br.cd = 4.0;
        p.vx = Math.cos(br.ang) * 640;
        p.vy = Math.sin(br.ang) * 640;
        p.hyperDrive = 3.0;
        sound.boostGate ? sound.boostGate() : sound.dash();
        shockwave(br.x, br.y, '#35f0ff', 160, 4);
        burst(br.x, br.y, '#35f0ff', 25);
        burst(br.x, br.y, '#ffffff', 15);
        addText(p.x, p.y - 30, 'SLIPSTREAM HYPER-DRIVE!', '#35f0ff', 18);
      }
    }
  }

  // Hyper-drive flight effects & thermal burn
  if (p.hyperDrive > 0){
    p.hyperDrive = Math.max(0, p.hyperDrive - dt);
    if (Math.random() < dt * 26){
      var hx = p.x - Math.cos(p.aim) * (p.r + 8);
      var hy = p.y - Math.sin(p.aim) * (p.r + 8);
      burst(hx, hy, '#35f0ff', 2);
      burst(hx, hy, '#ffe066', 1);
    }
    for (var ei = 0; ei < G.enemies.length; ei++){
      var en = G.enemies[ei];
      if (en.hp <= 0 || (en.isBoss && en.dormant)) continue;
      if (Math.hypot(en.x - p.x, en.y - p.y) < p.r + en.r + 30){
        en.hp -= 95 * dt; en.flash = 0.5;
        if (en.hp <= 0) killEnemy(en, ei, false);
      }
    }
  }

  // 2. Update Quantum Wormholes
  if (p.warpCd > 0) p.warpCd = Math.max(0, p.warpCd - dt);
  if (G.wormholes){
    for (var wi = 0; wi < G.wormholes.length; wi++){
      var wh = G.wormholes[wi];
      if (wh.cd > 0) wh.cd = Math.max(0, wh.cd - dt);
      var wdist = Math.hypot(p.x - wh.x, p.y - wh.y);
      if (wdist < wh.r * 2.8 && wdist > 35){
        var pull = (1 - wdist / (wh.r * 2.8)) * 140 * dt;
        p.vx += ((wh.x - p.x) / wdist) * pull;
        p.vy += ((wh.y - p.y) / wdist) * pull;
      }
      if (wdist < 34 && wh.cd <= 0 && (!p.warpCd || p.warpCd <= 0)){
        var partner = G.wormholes[wh.partnerIdx];
        if (partner){
          wh.cd = 4.5;
          partner.cd = 4.5;
          p.warpCd = 4.5;
          p.x = partner.x + Math.cos(p.aim) * 45;
          p.y = partner.y + Math.sin(p.aim) * 45;
          p.inv = Math.max(p.inv, 1.5);
          sound.quantumWarp ? sound.quantumWarp() : sound.bossDeath();
          shockwave(wh.x, wh.y, wh.col, 220, 3);
          shockwave(partner.x, partner.y, partner.col, 340, 5);
          burst(partner.x, partner.y, partner.col, 40);
          burst(partner.x, partner.y, '#ffffff', 25);
          G.flash = Math.max(G.flash, 0.4);
          G.shake = Math.min(24, G.shake + 12);
          addText(p.x, p.y - 32, 'QUANTUM WARP // TRANSIT COMPLETE', wh.col, 20);
        }
      }
    }
  }

  // 3. Update Derelict Salvage Pods
  if (G.salvagePods){
    for (var spi = 0; spi < G.salvagePods.length; spi++){
      var sp = G.salvagePods[spi];
      if (sp.cd > 0){
        sp.cd = Math.max(0, sp.cd - dt);
        if (sp.cd === 0) sp.looted = false;
        continue;
      }
      var sdist = Math.hypot(p.x - sp.x, p.y - sp.y);
      if (sdist < 115){
        sp.progress += dt / sp.maxT;
        if (Math.random() < dt * 8){
          burst(sp.x + rnd(-15, 15), sp.y + rnd(-15, 15), sp.col, 2);
        }
        if (sp.progress >= 1.0){
          sp.progress = 0;
          sp.looted = true;
          sp.cd = 75;
          sound.salvage ? sound.salvage() : sound.levelUp();
          burst(sp.x, sp.y, sp.col, 35);
          burst(sp.x, sp.y, '#ffffff', 20);
          shockwave(sp.x, sp.y, sp.col, 240, 4);
          for (var sgi = 0; sgi < 5; sgi++){
            var sga = (sgi / 5) * TAU + Math.random() * 0.4;
            var sgd = rnd(30, 90);
            G.orbs.push({
              x: clamp(sp.x + Math.cos(sga)*sgd, 40, ARENA-40),
              y: clamp(sp.y + Math.sin(sga)*sgd, 40, ARENA-40),
              vx: Math.cos(sga) * 140, vy: Math.sin(sga) * 140,
              val: 18, isGold: true, popTime: 0.12, life: 40, rot: Math.random()*TAU
            });
          }
          if (p.maxShield > 0) p.shield = p.maxShield;
          if (Math.random() < 0.25){
            dropRandomSkillCore(sp.x, sp.y);
          }
          addText(sp.x, sp.y - 36, sp.name + ' SECURED!', sp.col, 22);
          addText(sp.x, sp.y - 14, '+90 XP & SHIELD RECHARGE', '#ffffff', 14);
        }
      } else {
        if (sp.progress > 0) sp.progress = Math.max(0, sp.progress - dt * 0.6);
      }
    }
  }

  // 4. Update Minerals (respawn timer & oscillation)
  if (G.minerals){
    for (var mii = 0; mii < G.minerals.length; mii++){
      var mn = G.minerals[mii];
      if (mn.flash > 0) mn.flash = Math.max(0, mn.flash - dt * 5);
      if (mn.shake > 0) mn.shake = Math.max(0, mn.shake - dt * 25);
      mn.rot += mn.vrot * dt;
      if (mn.respawnTimer > 0){
        mn.respawnTimer -= dt;
        if (mn.respawnTimer <= 0){
          mn.hp = mn.maxHp;
          mn.x = 300 + Math.random() * (ARENA - 600);
          mn.y = 300 + Math.random() * (ARENA - 600);
          burst(mn.x, mn.y, mn.col, 16);
          shockwave(mn.x, mn.y, mn.col, 60, 2);
        }
      }
    }
  }

  // 5. Check Nebula Atmospheric Mutator
  var currentNebula = null;
  for (var ni = 0; ni < NEBULAE.length; ni++){
    var neb = NEBULAE[ni];
    var ndist = Math.hypot(p.x - neb.x, p.y - neb.y);
    if (ndist < neb.r){
      currentNebula = neb;
      break;
    }
  }

  if (currentNebula){
    if (currentNebula.name === 'Void Violet Nebula'){
      if (p.skills && p.skills.q && p.skills.q.cd > 0){
        p.skills.q.cd = Math.max(0, p.skills.q.cd - dt * 0.35);
      }
    } else if (currentNebula.name === 'Emerald Cyan Rift'){
      if (p.maxShield > 0 && p.shield < p.maxShield){
        p.shield = Math.min(p.maxShield, p.shield + 12 * dt);
      }
    } else if (currentNebula.name === 'Perseus Deep Cyan'){
      for (var pci = 0; pci < G.enemies.length; pci++){
        var pen = G.enemies[pci];
        if (Math.hypot(pen.x - currentNebula.x, pen.y - currentNebula.y) < currentNebula.r){
          pen.cryoSlow = 0.25;
        }
      }
    } else if (currentNebula.name === 'Amber Filament'){
      p.vx *= (1 + 0.08 * dt);
      p.vy *= (1 + 0.08 * dt);
    }
    if (G.activeZone !== currentNebula.name){
      G.activeZone = currentNebula.name;
      var subText = '';
      if (currentNebula.name === 'Void Violet Nebula') subText = 'PSIONIC CONDUIT // SKILL COOLDOWN ACCELERATION +35%';
      else if (currentNebula.name === 'Emerald Cyan Rift') subText = 'NANITE MIST // ACTIVE SHIELD MATRIX REGENERATION';
      else if (currentNebula.name === 'Perseus Deep Cyan') subText = 'CRYO REGION // HOSTILE FLIGHT DAMPENING -25%';
      else if (currentNebula.name === 'Crimson Veil') subText = 'PLASMA VEIL // WEAPON THERMAL OVERCHARGE ACTIVE';
      else if (currentNebula.name === 'Core Apex Indigo') subText = 'GRAVITATIONAL ANOMALY // MAGNETIC SUCTION RADIUS x2';
      else if (currentNebula.name === 'Amber Filament') subText = 'KINETIC FILAMENT // SUB-LIGHT THRUSTER SURGE +20%';
      G.missionToast = { t: 3.5, title: 'ENTERING ' + currentNebula.name.toUpperCase(), sub: subText };
    }
  } else {
    G.activeZone = null;
  }
}

function drawBoostRing(br){
  ctx.save();
  ctx.translate(br.x, br.y);
  ctx.rotate(br.ang);

  var isReady = br.cd <= 0;
  var col = isReady ? '#35f0ff' : 'rgba(100, 140, 170, 0.4)';
  var glowCol = isReady ? '#35f0ff' : 'transparent';

  ctx.strokeStyle = col;
  ctx.lineWidth = isReady ? 2.5 : 1.5;
  ctx.shadowColor = glowCol;
  ctx.shadowBlur = isReady ? 14 : 0;
  ctx.beginPath();
  for (var hi = 0; hi < 6; hi++){
    var ha = hi * (TAU / 6);
    var hx = Math.cos(ha) * br.r, hy = Math.sin(ha) * br.r;
    if (hi === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
  }
  ctx.closePath();
  ctx.stroke();

  ctx.strokeStyle = isReady ? '#ffffff' : 'rgba(255, 255, 255, 0.2)';
  ctx.lineWidth = 2.2;
  for (var chv = -1; chv <= 1; chv++){
    var chvX = chv * 12;
    ctx.beginPath();
    ctx.moveTo(chvX - 6, -12);
    ctx.lineTo(chvX + 6, 0);
    ctx.lineTo(chvX - 6, 12);
    ctx.stroke();
  }

  if (!isReady){
    ctx.strokeStyle = 'rgba(53, 240, 255, 0.6)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    var prog = 1 - (br.cd / 4.0);
    ctx.arc(0, 0, br.r - 8, -Math.PI/2, -Math.PI/2 + TAU * prog);
    ctx.stroke();
  }

  ctx.restore();
}

function drawQuantumWormhole(wh){
  ctx.save();
  ctx.translate(wh.x, wh.y);

  var isReady = wh.cd <= 0;
  var col = wh.col || '#bf5af2';
  var t = G.t;

  var pulse = 0.8 + Math.sin(t * 5 + wh.x) * 0.2;
  ctx.beginPath();
  ctx.arc(0, 0, wh.r * 1.5, 0, TAU);
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.2;
  ctx.globalAlpha = 0.25 * pulse;
  ctx.stroke();

  ctx.globalAlpha = isReady ? 0.85 : 0.4;
  for (var s = 0; s < 3; s++){
    var sAng = (s * (TAU / 3)) + t * 4;
    ctx.beginPath();
    ctx.arc(0, 0, wh.r * (0.45 + s * 0.22), sAng, sAng + Math.PI * 0.9);
    ctx.strokeStyle = s === 0 ? '#ffffff' : col;
    ctx.lineWidth = 2.2;
    ctx.shadowColor = col;
    ctx.shadowBlur = isReady ? 12 : 0;
    ctx.stroke();
  }

  ctx.rotate(0.45 + t * 0.5);
  ctx.beginPath();
  ctx.ellipse(0, 0, wh.r * 0.85, wh.r * 0.35, 0, 0, TAU);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.4;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, TAU);
  ctx.fillStyle = '#04060d';
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.rotate(-(0.45 + t * 0.5));
  ctx.font = 'bold 9px ui-monospace,monospace';
  ctx.fillStyle = col;
  ctx.textAlign = 'center';
  ctx.fillText('WARP RIFT', 0, wh.r + 14);

  ctx.restore();
}

function drawSalvagePod(sp){

  var col = isReady ? sp.col : '#556677';
  var t = G.t;

  if (isReady){

  }

  ctx.fillStyle = '#0a101d';
  ctx.strokeStyle = col;

    var px = side * 22;

    ctx.rect(px - 6, -14, 12, 28);

    ctx.beginPath();
    ctx.moveTo(px - 6, -5); ctx.lineTo(px + 6, -5);

    ctx.strokeStyle = col;
  }

  ctx.fillStyle = '#0e1828';

  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, TAU);
  ctx.fill(); ctx.stroke();

  var blink = Math.sin(t * 10) > 0;
  ctx.fillStyle = isReady ? (blink ? '#ffffff' : col) : '#334455';
  ctx.shadowColor = isReady ? col : 'transparent';
  ctx.shadowBlur = isReady ? 10 : 0;
  ctx.beginPath();
  ctx.arc(0, 0, 5, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;

  if (sp.progress > 0){
    ctx.beginPath();

    ctx.shadowColor = '#3ddc97';
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center';
    ctx.font = 'bold 10px ui-monospace,monospace';
    ctx.fillStyle = '#3ddc97';
    ctx.fillText('EXTRACTING ' + Math.round(sp.progress * 100) + '%', 0, -42);
  } else {
    ctx.textAlign = 'center';
    ctx.font = 'bold 9px ui-monospace,monospace';
    ctx.fillStyle = isReady ? col : '#667788';
    ctx.fillText(sp.name, 0, 26);
  }

  ctx.restore();
}

function drawMineral(m){
  if (m.hp <= 0) return;
  ctx.save();
  var mx = m.x + (m.shake > 0 ? rnd(-m.shake, m.shake) : 0);
  var my = m.y + (m.shake > 0 ? rnd(-m.shake, m.shake) : 0);
  ctx.translate(mx, my);
  ctx.rotate(m.rot);

  var hpFrac = m.hp / m.maxHp;
  var col = m.flash > 0 ? '#ffffff' : m.col;

  ctx.fillStyle = '#080e18';
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.8;
  ctx.shadowColor = col;
  ctx.shadowBlur = m.flash > 0 ? 12 : 5;
  ctx.beginPath();
  for (var vi = 0; vi < m.verts.length; vi++){
    var v = m.verts[vi];
    if (vi === 0) ctx.moveTo(v.x, v.y);
    else ctx.lineTo(v.x, v.y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = col;
  ctx.globalAlpha = 0.35 + (1 - hpFrac) * 0.4;
  ctx.beginPath();
  for (var ci = 0; ci < m.verts.length; ci += 2){
    var cv = m.verts[ci];
    if (ci === 0) ctx.moveTo(cv.x * 0.5, cv.y * 0.5);
    else ctx.lineTo(cv.x * 0.5, cv.y * 0.5);
  }
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  if (hpFrac < 0.75){
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(m.verts[1].x * 0.7, m.verts[1].y * 0.7);
    if (hpFrac < 0.4){
      ctx.moveTo(0, 0);
      ctx.lineTo(m.verts[3].x * 0.7, m.verts[3].y * 0.7);
    }
    ctx.stroke();
  }

  ctx.restore();
}

function drawMapFeatures(cx, cy){
  if (!G) return;
  var vw = W / ZOOM, vh = H / ZOOM;
  var minX = cx - vw/2 - 140, maxX = cx + vw/2 + 140;
  var minY = cy - vh/2 - 140, maxY = cy + vh/2 + 140;

  // 1. Quantum Wormholes
  if (G.wormholes){
    for (var wi = 0; wi < G.wormholes.length; wi++){
      var wh = G.wormholes[wi];
      if (wh.x + wh.r*2 < minX || wh.x - wh.r*2 > maxX || wh.y + wh.r*2 < minY || wh.y - wh.r*2 > maxY) continue;
      drawQuantumWormhole(wh);
    }
  }

  // 2. Boost Rings
  if (G.boostRings){
    for (var bri = 0; bri < G.boostRings.length; bri++){
      var br = G.boostRings[bri];
      if (br.x + br.r*1.5 < minX || br.x - br.r*1.5 > maxX || br.y + br.r*1.5 < minY || br.y - br.r*1.5 > maxY) continue;
      drawBoostRing(br);
    }
  }

  // 3. Derelict Salvage Pods
  if (G.salvagePods){
    for (var spi = 0; spi < G.salvagePods.length; spi++){
      var sp = G.salvagePods[spi];
      if (sp.x + 130 < minX || sp.x - 130 > maxX || sp.y + 130 < minY || sp.y - 130 > maxY) continue;
      drawSalvagePod(sp);
    }
  }

  // 4. Destructible Crystalline Minerals
  if (G.minerals){
    for (var mi = 0; mi < G.minerals.length; mi++){
      var mn = G.minerals[mi];
      if (mn.hp <= 0) continue;
      if (mn.x + mn.r < minX || mn.x - mn.r > maxX || mn.y + mn.r < minY || mn.y - mn.r > maxY) continue;
      drawMineral(mn);
    }
  }

  // 5. Astral Void Rift (Conduit to Sector 2)
  if (G.astralRift && G.astralRift.active){
    drawAstralVoidRift(G.astralRift);
  }
}

function drawAstralVoidRift(rift){
  if (!rift || !rift.active) return;
  var rx = rift.x, ry = rift.y, rr = rift.r || 54;
  var t = (G ? G.t : 0);
  ctx.save();
  ctx.translate(rx, ry);

  // Outer cosmic distortion halo
  var haloGrd = ctx.createRadialGradient(0, 0, rr * 0.25, 0, 0, rr * 2.2);
  haloGrd.addColorStop(0, 'rgba(191, 85, 236, 0.45)');
  haloGrd.addColorStop(0.5, 'rgba(123, 44, 191, 0.22)');
  haloGrd.addColorStop(1, 'rgba(10, 0, 26, 0)');
  ctx.fillStyle = haloGrd;
  ctx.beginPath();
  ctx.arc(0, 0, rr * 2.2, 0, TAU);
  ctx.fill();

  // Swirling vortex accretion rings
  for (var vi = 0; vi < 3; vi++){
    var vRot = (vi % 2 === 0 ? 1 : -1) * t * (1.8 + vi * 0.6);
    var vRad = rr * (0.65 + vi * 0.28);
    ctx.save();
    ctx.rotate(vRot);
    ctx.setLineDash([14, 10]);
    ctx.strokeStyle = vi === 0 ? '#35f0ff' : (vi === 1 ? '#bf55ec' : '#7b2cbf');
    ctx.lineWidth = 2.5 - vi * 0.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, vRad * 1.3, vRad * 0.75, 0, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  // Event horizon singularity core
  ctx.beginPath();
  ctx.arc(0, 0, rr * 0.48, 0, TAU);
  ctx.fillStyle = '#06000f';
  ctx.fill();
  ctx.strokeStyle = '#bf55ec';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Inner pulsing core flare
  var corePulse = 0.5 + 0.5 * Math.sin(t * 8);
  ctx.beginPath();
  ctx.arc(0, 0, rr * 0.22 * (0.8 + corePulse * 0.4), 0, TAU);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  ctx.restore();

  // Floating HUD Callout
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 12px ui-monospace,monospace';
  ctx.fillStyle = '#bf55ec';
  ctx.shadowColor = '#bf55ec';
  ctx.shadowBlur = 8;
  ctx.fillText('ASTRAL VOID RIFT // CONDUIT TO SECTOR 02', rx, ry - rr - 28);
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillStyle = '#ffffff';
  ctx.shadowBlur = 4;
  ctx.fillText('FLY INTO RIFT OR PRESS [4]', rx, ry - rr - 12);
  ctx.restore();
}

function rnd(a, b){ return a + Math.random() * (b - a); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function angLerp(a, b, t){
  var d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * t;
}
function angDist(a, b){
  return ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
}
function distToSegment(px, py, x1, y1, x2, y2){
  var l2 = (x2 - x1)*(x2 - x1) + (y2 - y1)*(y2 - y1);
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  var t = Math.max(0, Math.min(1, ((px - x1)*(x2 - x1) + (py - y1)*(y2 - y1)) / l2));
  var projX = x1 + t * (x2 - x1);
  var projY = y1 + t * (y2 - y1);
  return Math.hypot(px - projX, py - projY);
}

function actx(){

      masterFilter = AC.createBiquadFilter();
      masterFilter.type = 'lowpass';
      if (masterFilter.frequency && masterFilter.frequency.setValueAtTime) {
        masterFilter.frequency.setValueAtTime(3200, now);
      }
      if (masterFilter.Q && masterFilter.Q.setValueAtTime) {
        masterFilter.Q.setValueAtTime(0.65, now);
      }

      masterGain = AC.createGain();

  var by = clamp(p.y + Math.sin(ang) * dist, 140, ARENA - 140);

  var boss = spawnBoss(true, btype, bawake !== undefined ? bawake : true);
  boss.x = bx;
  boss.y = by;
  if (boss.segments){
    for (var s = 0; s < boss.segments.length; s++){
      boss.segments[s].x = bx + (s + 1) * 20;
      boss.segments[s].y = by;
    }
  }
  shockwave(bx, by, boss.color, 260, 4);
  sound.bossWarning();
  addText(bx, by - boss.r - 24, 'DEPLOYED: ' + boss.name, boss.color, 22);
}

/* Native Gamepad API & Dual-Stick / Haptic Rumble Controller Support */
function getActiveGamepad(){
  if (typeof navigator === 'undefined' || !navigator.getGamepads) return null;
  var gps = navigator.getGamepads();
  if (!gps) return null;
  for (var i = 0; i < gps.length; i++){
    var gp = gps[i];
    if (gp && gp.connected) return gp;
  }
  return null;
}

function triggerRumble(intensity, duration){
  if (typeof navigator === 'undefined' || !navigator.getGamepads) return;
  var gps = navigator.getGamepads();
  if (!gps) return;
  for (var i = 0; i < gps.length; i++){
    var gp = gps[i];
    if (gp && gp.vibrationActuator && typeof gp.vibrationActuator.playEffect === 'function'){
      try {
        gp.vibrationActuator.playEffect('dual-rumble', {
          startDelay: 0,
          duration: duration || 120,
          weakMagnitude: Math.min(1, (intensity || 0.5) * 0.7),
          strongMagnitude: Math.min(1, (intensity || 0.5))
        }).catch(function(){});
      } catch(err){}
    }
  }
}

var _gpPrevButtons = {};
function pollGamepad(dt){
  var gp = getActiveGamepad();
  if (!gp || !gp.buttons){
    _gpPrevButtons = {};
    return;
  }

  function gpPressed(btnIdx){
    if (!gp.buttons || !gp.buttons[btnIdx]) return false;
    var b = gp.buttons[btnIdx];
    var isDown = (typeof b === 'object') ? (b.pressed || b.value > 0.5) : (b > 0.5);
    var wasDown = !!_gpPrevButtons[btnIdx];
    return isDown && !wasDown;
  }

  if (G){
    if (G.state === 'title'){
      // Button A (0) or Start (9) -> Start Game
      if (gpPressed(0) || gpPressed(9)){
        startGame();
      } else if (gpPressed(2) || gpPressed(3)){
        // Button X (2) or Y (3) -> Training Room
        enterTrainingRoom();
      }
    } else if (G.state === 'pause'){
      // Start (9) or Button B (1) -> Resume
      if (gpPressed(9) || gpPressed(1)){
        togglePause();
      } else if (gpPressed(2)){
        // Button X (2) -> Restart
        togglePause();
        startGame();
      } else if (gpPressed(3)){
        // Button Y (3) -> Home
        togglePause();
        G.state = 'title';
      }
    } else if (G.state === 'dead'){
      // Button A (0) or Start (9) or Button X (2) -> Restart
      if (gpPressed(0) || gpPressed(9) || gpPressed(2)){
        startGame();
      } else if (gpPressed(3)){
        // Button Y (3) -> Home
        G.state = 'title';
      }
    } else if (G.state === 'victory'){
      if (gpPressed(0) || gpPressed(2)){
        if (G.sector === 1 && typeof enterSector2 === 'function'){
          enterSector2();
        } else {
          startGame();
        }
      } else if (gpPressed(1) || gpPressed(9)){
        startGame();
      } else if (gpPressed(3)){
        G.state = 'title';
      }
    } else if (G.state === 'play'){
      // Buff Selection / Skill Swap Tray
      if (G.buffTray && G.buffTray.active){
        if (gpPressed(2) || gpPressed(14)){ // Button X (2) or D-Pad Left (14)
          chooseBuff(0);
        } else if (gpPressed(3) || gpPressed(12)){ // Button Y (3) or D-Pad Up (12)
          chooseBuff(1);
        } else if (gpPressed(1) || gpPressed(15)){ // Button B (1) or D-Pad Right (15)
          chooseBuff(2);
        } else if (gpPressed(0) && G.buffTray.cards && G.buffTray.cards.length === 1){
          chooseBuff(0);
        }
      }

      // Pause toggle: Start / Menu (9)
      if (gpPressed(9)){
        togglePause();
      }
    }
  }

  for (var bi = 0; bi < gp.buttons.length; bi++){
    var btn = gp.buttons[bi];
    _gpPrevButtons[bi] = (typeof btn === 'object') ? (btn.pressed || btn.value > 0.5) : (btn > 0.5);
  }
}

var keys = {};
window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if (k === ' ' || k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright' || k === 'p' || k === 'escape') e.preventDefault();
  keys[k] = true;
  actx();
  if (!G) return;

  if (k === 'g' || k === '`' || k === '~'){
    if (G.state === 'godmode'){
      closeGodMode();
      return;
    } else if (G.godModeUnlocked || G.state === 'play' || G.state === 'pause'){
      openGodMode();
      return;
    }
  }

  if (k === 'm'){
    toggleAudioMute();
    return;
  }

  if (G.buffTray && G.buffTray.active){
    var code = e.code || '';
    if (k === '1' || k === '&' || code === 'Digit1' || code === 'Numpad1') { chooseBuff(0); return; }
    else if (k === '2' || k === 'é' || k === '~' || code === 'Digit2' || code === 'Numpad2') { chooseBuff(1); return; }
    else if (k === '3' || k === '"' || k === '#' || code === 'Digit3' || code === 'Numpad3') { chooseBuff(2); return; }
  }

  if (G.skillSwapTray && G.skillSwapTray.active && G.pendingSkill){
    var code = e.code || '';
    if (k === '1' || k === '&' || k === 'q' || code === 'Digit1' || code === 'Numpad1' || code === 'KeyQ'){
      resolveSkillSwap('q');
      return;
    } else if (k === '2' || k === 'é' || code === 'Digit2' || code === 'Numpad2'){
      resolveSkillSwap('discard');
      return;
    } else if (k === '3' || k === '"' || k === 'escape' || code === 'Digit3' || code === 'Numpad3' || code === 'Escape'){
      resolveSkillSwap('repair');
      return;
    }
  }

  if (G.state === 'godmode'){
    if (k === 'escape'){
      closeGodMode();
      return;
    } else if (k === 'enter'){
      if (G.godModePrevState === 'title'){
        var targetW = (G.godModeOverrides && G.godModeOverrides.targetWave) || 1;
        startGame(targetW);
      } else {
        closeGodMode();
      }
      return;
    }
  }
  else if (G.state === 'title'){
    if (k === 'x'){ enterTrainingRoom(); return; }
    if (k === ' ' || k === 'enter' || k.startsWith('arrow')) startGame();
  }
  else if (G.state === 'victory'){
    if (k === '1' || k === 'r' || k === ' ' || k === 'enter'){
      if ((G.victoryTimer || 0) < 2.5){
        G.victoryTimer = 2.6;
        return;
      }
      startGame();
      return;
    } else if (k === '2' || k === 'e'){
      G.state = 'play';
      G.victoryDismissed = true;
      if (G.player) G.player.inv = 3.5;
      sound.choose();
      return;
    } else if (k === '3' || k === 'escape'){
      G.state = 'title';
      sound.choose();
      return;
    } else if (G.sector === 1 && (k === '4' || k === 'numpad4')){
      if (typeof enterSector2 === 'function') enterSector2();
      return;
    }
  }
  else if (G.state === 'dead'){
    if (k === 'h'){ goToTitle(); return; }
    if (k === 'x'){ enterTrainingRoom(); return; }
    if (k === 'r' || k === ' ' || k === 'enter') startGame();
  }
  else if (G.state === 'levelup'){
    if (k === '1' || k === 'numpad1') choose(0);
    else if (k === '2' || k === 'numpad2') choose(1);
    else if (k === '3' || k === 'numpad3') choose(2);
  }
  else if (G.state === 'skill_swap'){
    if (k === '1' || k === 'numpad1' || k === 'q') resolveSkillSwap('q');
    else if (k === '2' || k === 'numpad2') resolveSkillSwap('discard');
    else if (k === '3' || k === 'numpad3' || k === 'escape' || k === ' ' || k === 'enter') resolveSkillSwap('repair');
  }
  else if (G.state === 'play' && (k === 'p' || k === 'escape')){
    togglePause();
  }
  else if (G.state === 'pause'){
    if (k === 'p' || k === 'escape' || k === ' ' || k === 'enter') togglePause();
    else if (k === 'r'){
      if (G.mode === 'training') enterTrainingRoom();
      else startGame();
    }
    else if (k === 'h') goToTitle();
    else if (k === 'x') enterTrainingRoom();
  }
  else if (G.state === 'play' && G.mode === 'training'){
    if (k === 'c'){ G.trainingDockOpen = !G.trainingDockOpen; sound.choose(); return; }
    if (k === 'h'){ goToTitle(); return; }
    if (k === 'x'){ clearTrainingHostiles(); return; }
    if (k === '1' && !(G.buffTray && G.buffTray.active)){ G.trainingCategory = 'enemies'; sound.choose(); return; }
    if (k === '2' && !(G.buffTray && G.buffTray.active)){ G.trainingCategory = 'bosses'; sound.choose(); return; }
    if (k === '3' && !(G.buffTray && G.buffTray.active)){ G.trainingCategory = 'tools'; sound.choose(); return; }
    if (k === 'q') activateSkill('q');
  }
  else if (G.state === 'play' && k === 'q'){
    activateSkill('q');
  }
  else if (G.state === 'play' && G.waveState === 'breather' && (k === 'enter' || k === 'n' || (k === ' ' && Math.hypot(G.player.vx, G.player.vy) < 20))){
    G.waveTimer = 0; // Skip breather and immediately deploy next wave
  }
});

<script>
"use strict";

function burst(x, y, col, n, ang, spread){
  for (var i = 0; i < n; i++){
    var a = (ang === undefined) ? Math.random()*TAU : ang + rnd(-spread, spread);
    var s = rnd(60, 320);
    G.parts.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:rnd(0.22,0.6), col:col, size:rnd(1.4,3.2), drag:0.06 });
  }
  if (G.parts.length > 450) G.parts.splice(0, G.parts.length - 450);
}
function shockwave(x, y, col, maxR, w){
  G.waves.push({ x:x, y:y, r:4, maxR:maxR, life:1, col:col, w:w || 3 });
}
function decal(x, y, r, col){
  G.decals.push({ x:x, y:y, r:r, life:7, max:7, col:col });
  if (G.decals.length > 140) G.decals.shift();
}
function nearestEnemy(x, y, range){
  var best = null, bd = range * range;
  for (var i = 0; i < G.enemies.length; i++){
    var e = G.enemies[i];
    if (e.hp <= 0) continue;
    var d = (e.x-x)*(e.x-x) + (e.y-y)*(e.y-y);
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}
function addText(x, y, txt, col, size){
  G.texts.push({ x:x, y:y, txt:txt, col:col, life:0.7, v:-38, size:size || 13 });
}

function triggerLevelUpEnemySurge(levelsGained, lvl){
  var p = G.player;
  if (!p) return;
  // Tactical Level Stabilization: Heal 25% max HP per level gained, no punitive enemy HP inflation
  var healAmt = Math.round(p.maxhp * 0.25 * levelsGained);
  p.hp = Math.min(p.maxhp, p.hp + healAmt);
  shockwave(p.x, p.y, '#35f0ff', 320, 4);
  shockwave(p.x, p.y, '#ffe066', 220, 2);
  addText(p.x, p.y - 75, 'LEVEL ' + lvl + ' // +' + healAmt + ' HP REPAIR', '#ffe066', 20);
  G.shake = Math.min(16, G.shake + 6);
  G.flash = 0.35;
  if (sound.levelUp) sound.levelUp();
}

function addXP(v){
  var p = G.player;
  p.xp += v * p.xpGain;
  var levelsGained = 0;
  while (p.xp >= p.xpNext){
    p.xp -= p.xpNext;
    p.lvl++;
    p.xpNext = Math.round(p.xpNext * 1.28 + 3);
    G.queue++;
    levelsGained++;

    // Guaranteed skill core drop at tactical milestone levels
    if (p.lvl === 3 || p.lvl === 6 || p.lvl === 8){
      dropRandomSkillCore(p.x + rnd(-80, 80), p.y + rnd(-80, 80));
      addText(p.x, p.y - 70, 'SKILL CORE UNLOCKED!', '#35f0ff', 20);
    }
  }
  if (levelsGained > 0){
    triggerLevelUpEnemySurge(levelsGained, p.lvl);
    if (p.lvl >= BOSS_UNLOCK_LEVEL && G.boss && G.boss.dormant){
      awakenBoss();
    }
  }
  if (G.queue > 0 && G.state === 'play'){
    if (!G.buffTray || !G.buffTray.active){
      openLevelUp();
    }
  }
}
function openLevelUp(){
  var p = G.player;
  var buffPool = UPGRADES.map(function(u){
    return {
      name: u.name,
      icon: u.icon,
      desc: u.desc,
      isSkill: false,
      apply: u.apply
    };
  });

  var skillPool = Object.keys(ACTIVE_SKILLS).map(function(skKey){
    var sk = ACTIVE_SKILLS[skKey];
    return {
      name: sk.name,
      icon: sk.icon,
      desc: sk.desc,
      isSkill: true,
      skillId: sk.id,
      col: sk.col,
      apply: function(player){
        if (!player.skills) {
          player.skills = {
            q: { skill: null, cd: 0, maxCd: 10, activeT: 0 }
          };
        }
        var mult = player.skillCdMult || 1;
        if (player.skills.q && player.skills.q.skill && player.skills.q.skill.id === sk.id){
          player.skills.q.maxCd = Math.max(2, player.skills.q.maxCd * 0.75);
          player.skills.q.cd = 0;
          addText(player.x, player.y - 60, '[Q] OVERCLOCKED (-25% CD)', sk.col, 18);
        } else {
          player.skills.q.skill = sk;
          player.skills.q.cd = 0;
          player.skills.q.maxCd = (sk.cd || 10) * mult;
          player.skills.q.activeT = 0;
          player.skill = sk;
          addText(player.x, player.y - 60, '[Q] EQUIPPED: ' + sk.name, sk.col, 18);
        }
        sound.skillEquip();
        G.flash = 0.45;
        shockwave(player.x, player.y, sk.col, 260, 3);
        burst(player.x, player.y, sk.col, 35);
      }
    };
  });

  // Shuffle buff pool
  for (var bi = buffPool.length - 1; bi > 0; bi--){
    var bj = Math.floor(Math.random() * (bi + 1));
    var btemp = buffPool[bi]; buffPool[bi] = buffPool[bj]; buffPool[bj] = btemp;
  }

  // Active skills are rare: 18% roll chance for a skill slot among choices
  var pick = [];
  var rollSkill = (Math.random() < 0.18 && skillPool.length > 0);
  if (rollSkill){
    var skIdx = Math.floor(Math.random() * skillPool.length);
    pick.push(skillPool[skIdx]);
  }

  // Fill remaining slots with unique buffs from buffPool
  while (pick.length < 3 && buffPool.length > 0){
    var bItem = buffPool.pop();
    var dup = false;
    for (var pi = 0; pi < pick.length; pi++){
      if (pick[pi].name === bItem.name) { dup = true; break; }
    }
    if (!dup) pick.push(bItem);
  }

  // Shuffle final choices so rare skill is not fixed in first slot
  for (var si = pick.length - 1; si > 0; si--){
    var sj = Math.floor(Math.random() * (si + 1));
    var ptemp = pick[si]; pick[si] = pick[sj]; pick[sj] = ptemp;
  }

  var newCards = [];
  for (var j = 0; j < pick.length; j++){
    newCards.push({ u: pick[j], i: j, rect: null, born: 1 });
  }

  var offBottom = (H || 1080) + 180;
  var inBottom = (H || 1080) - 55;
  if (!G.buffTray){
    G.buffTray = { active: false, animY: offBottom, targetY: offBottom, cards: [] };
  }
  G.buffTray.cards = newCards;
  G.buffTray.active = true;
  if (G.buffTray.animY > (H || 1080) + 40){
    G.buffTray.animY = (H || 1080) + 140; // Slide up smoothly from below screen
  }
  G.buffTray.targetY = inBottom;
  G.cards = newCards; // Maintain G.cards reference for backwards compatibility

  G.slow = 0; // Seamless fluid real-time without slow motion

  // Seamless floating buff menu keeps gameplay running in real time without closing the game
  if (G.state !== 'title' && G.state !== 'dead') {
    G.state = 'play';
  }

  G.flash = Math.max(G.flash, 0.28);
  shockwave(G.player.x, G.player.y, '#35f0ff', 240, 3);
  sound.levelUp();
}

function chooseBuff(i){
  var cards = (G.buffTray && G.buffTray.cards && G.buffTray.cards.length > 0) ? G.buffTray.cards : G.cards;
  var c = cards ? cards[i] : null;
  if (!c) return;
  c.u.apply(G.player);
  G.player.upgrades = G.player.upgrades || {};
  if (c.u.name) G.player.upgrades[c.u.name] = (G.player.upgrades[c.u.name] || 0) + 1;
  G.slow = 0; // Resume normal speed immediately
  var healAmt = Math.round(G.player.maxhp * 0.20);
  G.player.hp = Math.min(G.player.maxhp, G.player.hp + healAmt);
  if (healAmt > 0) addText(G.player.x, G.player.y - 48, '+' + healAmt + ' HP REPAIR', '#3ddc97', 16);
  G.queue = Math.max(0, (G.queue || 1) - 1);

  burst(G.player.x, G.player.y, '#ffe066', 18);

  var isForcedAwake = (forceAwake !== undefined) ? !!forceAwake : (wNum === true || wNum === 6 || wNum === 7 || (p && p.lvl >= BOSS_UNLOCK_LEVEL));
  var isDormant = (bType === 'abyss') ? !isForcedAwake : false;

  var boss = {
    isBoss: true,
    bossType: bType,
    name: arch.name,
    sub: arch.sub,
    type: 'boss',
    r: arch.r,
    color: arch.col,
    xp: 45,
    x: bx, y: by,
    vx: 0, vy: 0, kx: 0, ky: 0,
    ang: p ? Math.atan2(p.y - by, p.x - bx) : -Math.PI / 2,
    spawn: 1, squash: 0, hitAng: 0,
    hp: hp, maxhp: hp,
    spd: arch.spd,
    dmg: dmg,
    touchT: 0, flash: 0,
    attackT: 1.2,
    specialT: 4.0,
    phaseT: 0,
    orbitAng: 0,
    chargeT: 0,
    chargeAng: 0,
    skillCd: 3.5,
    skillMaxCd: 6.5,
    skillWindupT: 0,
    skillActiveT: 0,
    skillPhase: 'ready',
    skillName: arch.skillName || 'TITAN VOID HYPER-BEAM',
    hyperBeamAng: 0,
    mandibleOpen: 0,
    dormant: isDormant,
    barrierRadius: 210,
    barrierR: 210,
    crackImpactFlash: 0,
    crackPulse: 0,
    lastHitAng: 0,
    pylonEnergyT: 0,
    caliperRot: 0,
    deflectionRipples: [],
    segments: [],
    minions: []
  };

  if (bType === 'abyss'){
    var segCount = 16;
    for (var si = 0; si < segCount; si++){
      var segDist = (si + 1) * 32;
      var sa = boss.ang + Math.PI;
      if (isDormant){
        var spiralAng = boss.ang + Math.PI + (si * 0.38);
        var spiralDist = 55 + si * 8.5;
        boss.segments.push({
          x: bx + Math.cos(spiralAng) * spiralDist,
          y: by + Math.sin(spiralAng) * spiralDist,
          ang: spiralAng + Math.PI / 2,
          r: Math.max(16, Math.round(arch.r * (0.85 - (si / segCount) * 0.55))),
          width: Math.max(22, Math.round(arch.r * 1.35 * (1 - (si / segCount) * 0.58))),
          height: Math.max(18, Math.round(arch.r * 1.05 * (1 - (si / segCount) * 0.56))),
          finLength: Math.max(10, Math.round(48 * (1 - Math.abs(si - 6) / 10))),
          index: si
        });
      } else {
        boss.segments.push({
          x: bx + Math.cos(sa) * segDist,
          y: by + Math.sin(sa) * segDist,
          ang: sa,
          r: Math.max(16, Math.round(arch.r * (0.85 - (si / segCount) * 0.55))),
          width: Math.max(22, Math.round(arch.r * 1.35 * (1 - (si / segCount) * 0.58))),
          height: Math.max(18, Math.round(arch.r * 1.05 * (1 - (si / segCount) * 0.56))),
          finLength: Math.max(10, Math.round(48 * (1 - Math.abs(si - 6) / 10))),
          index: si
        });
      }
    }
  } else if (bType === 'voracis'){
    boss.jawAngle = 0;
    boss.mawGlow = 0;
    boss.ribFlex = 0;
    boss.scytheAngleLeft = 0;
    boss.scytheAngleRight = 0;
    boss.scytheSlashT = 0;
    boss.scytheSlashing = null;
    boss.scytheTimer = 3.2;
    boss.rupturedCarapace = false;
    boss.lungeT = 0;
    boss.lungeTimer = 4.0;
    boss.shadowTrail = [];
    boss.heartbeatTimer = 0.8;
    boss.bileRotationAngle = 0;
    boss.spawnLeechTimer = 5.0;
    boss.tendrils = [];
    for (var vti = 0; vti < 8; vti++){
      var vtAnchor = Math.PI - 0.7 + (vti / 7) * 1.4;
      boss.tendrils.push({
        baseAngle: vtAnchor,
        segments: 8,
        phaseOffset: vti * 0.85
      });
    }
  }

  G.boss = boss;
  if (G.enemies.indexOf(boss) === -1){
    G.enemies.push(boss);
  }

  if (!isDormant){
    G.shake = 28;
    G.flash = 0.65;
    shockwave(bx, by, arch.col, 460, 6);
    shockwave(bx, by, '#ffffff', 280, 4);
    burst(bx, by, arch.col, 60);
    sound.waveStart();
    addText(bx, by - boss.r - 28, 'APEX DETECTED: ' + arch.name, arch.col, 26);
  }

  return boss;
}

function updateBoss(b, dt, p){
  if (b.dormant){
    b.phaseT += dt * 0.8;
    b.pylonEnergyT = (b.pylonEnergyT || 0) + dt * 1.5;
    b.caliperRot = (b.caliperRot || 0) + dt * 0.4;
    b.crackImpactFlash = Math.max(0, (b.crackImpactFlash || 0) - dt * 3.2);
    b.crackPulse = (b.crackPulse || 0) + dt * 2.0;
    b.ang = -Math.PI / 2 + Math.sin(b.phaseT * 0.7) * 0.15;
    if (b.segments){
      for (var si = 0; si < b.segments.length; si++){
        var seg = b.segments[si];
        var spiralAng = b.ang + Math.PI + (si * 0.38) + Math.sin(b.phaseT * 0.9 - si * 0.15) * 0.08;
        var spiralDist = 55 + si * 8.5;
        seg.x = b.x + Math.cos(spiralAng) * spiralDist;
        seg.y = b.y + Math.sin(spiralAng) * spiralDist;
        seg.ang = spiralAng + Math.PI / 2;
      }
    }
    if (b.deflectionRipples){
      for (var ri = b.deflectionRipples.length - 1; ri >= 0; ri--){
        var rip = b.deflectionRipples[ri];
        rip.life -= dt;
        rip.r += (rip.maxR - rip.r) * Math.min(1, dt * 12);
        if (rip.life <= 0) b.deflectionRipples.splice(ri, 1);
      }
    }
    return;
  }
  b.phaseT += dt;
  b.attackT -= dt;
  b.specialT -= dt;
  b.skillCd = (b.skillCd !== undefined ? b.skillCd : 4.5) - dt;
  var dx = p.x - b.x, dy = p.y - b.y;
  var d = Math.hypot(dx, dy) || 1;
  var ux = dx/d, uy = dy/d;
  var isEnraged = (b.hp < b.maxhp * 0.5);

  // Trigger Phase 2 Enrage & Metamorphosis Transformation for Abyss Leviathan
  if (b.bossType === 'abyss' && isEnraged && !b.phase2){
    b.phase2 = true;
    b.phase = 2;
    b.color = '#ff0055';
    b.skillName = 'APEX ECLIPSE CATACLYSM';
    b.heartbeatTimer = 0.5;
    b.shadowDashTimer = 3.2;
    b.shadowDashing = 0;
    b.shadowTrail = [];
    b.tendrilPhase = 0;
    G.shake = 48;
    G.flash = 0.95;
    G.vig = 0.45;
    shockwave(b.x, b.y, '#ff0055', 560, 6);
    shockwave(b.x, b.y, '#7b2cbf', 400, 5);
    shockwave(b.x, b.y, '#ffffff', 260, 4);
    burst(b.x, b.y, '#ff0055', 90);
    burst(b.x, b.y, '#10002b', 45);
    burst(b.x, b.y, '#ffffff', 35);
    addText(b.x, b.y - b.r - 42, 'METAMORPHOSIS // THE VOID AWAKENS', '#ff0055', 26);
    G.bossSkillAlert = { name: 'PHASE 2: APEX ECLIPSE CATACLYSM', boss: b.name, color: '#ff0055', time: 4.2 };
    if (sound.abyssRoar) sound.abyssRoar();
    if (sound.bossWarning) sound.bossWarning();
    if (sound.surge) sound.surge();
    if (window.music && music.setMood) music.setMood('boss_p2');
  }

  // Trigger Phase 2 Enrage & Metamorphosis Transformation for Voracis the Void Gargantua (< 50% HP)
  if (b.bossType === 'voracis' && isEnraged && !b.phase2){
    b.phase2 = true;
    b.phase = 2;
    b.rupturedCarapace = true;
    b.color = '#ff0033';
    b.spd = 145;
    b.skillName = 'EXTINCTION ACID ROTATION & LEECH BROOD';
    b.heartbeatTimer = 0.5;
    b.lungeTimer = 3.2;
    b.lungeT = 0;
    b.shadowTrail = [];
    b.spawnLeechTimer = 4.0;
    G.shake = 55;
    G.flash = 1.0;
    G.vig = 0.55;
    shockwave(b.x, b.y, '#ff0033', 600, 7);
    shockwave(b.x, b.y, '#7b2cbf', 420, 5);
    shockwave(b.x, b.y, '#ffffff', 280, 4);
    burst(b.x, b.y, '#ff0033', 100);
    burst(b.x, b.y, '#1a0933', 50);
    burst(b.x, b.y, '#ffe066', 35);
    for (var bfi = 0; bfi < 60; bfi++){
      var bfa = Math.random() * TAU;
      var bfspd = rnd(150, 480);
      G.parts.push({
        x: b.x, y: b.y,
        vx: Math.cos(bfa) * bfspd, vy: Math.sin(bfa) * bfspd,
        col: Math.random() < 0.5 ? '#1a0933' : (Math.random() < 0.5 ? '#ff0055' : '#ffffff'),
        life: rnd(0.8, 2.0),
        size: rnd(3.5, 7.5)
      });
    }
    for (var li = 0; li < 4; li++){
      var la = (li / 4) * TAU + rnd(-0.2, 0.2);
      var ltype = ENEMY_TYPES.leech;
      G.enemies.push({
        type: 'leech', r: ltype.r, color: ltype.color, xp: 2,
        x: b.x + Math.cos(la) * 35, y: b.y + Math.sin(la) * 35,
        vx: Math.cos(la) * 160, vy: Math.sin(la) * 160, kx: 0, ky: 0,
        ang: la, spawn: 0, squash: 0, hitAng: 0,
        hp: ltype.hp, maxhp: ltype.hp, spd: ltype.spd, dmg: ltype.dmg,
        touchT: 0, shootT: 1, flash: 0, split: 0, ranged: false
      });
    }
    addText(b.x, b.y - b.r - 42, 'FRENZIED METAMORPHOSIS // CARAPACE RUPTURED!', '#ff0033', 24);
    G.bossSkillAlert = { name: 'PHASE 2: EXTINCTION CATACLYSM', boss: b.name, color: '#ff0033', time: 4.5 };
    if (sound.abyssRoar) sound.abyssRoar();
    if (sound.bossWarning) sound.bossWarning();
    if (sound.surge) sound.surge();
    if (window.music && music.setMood) music.setMood('boss_p2');
  }

  // --- APEX BOSS ACTIVE SKILL TRIGGER ---
  if (b.skillCd <= 0 && (!b.skillPhase || b.skillPhase === 'ready' || b.skillPhase === 'cooldown')){
    b.skillPhase = 'windup';
    b.skillWindupT = 1.0;
    if (b.bossType === 'aegis') b.skillName = 'TITAN BULWARK OVERDRIVE';
    else if (b.bossType === 'void') b.skillName = 'DIMENSIONAL RIFT WARP';
    else if (b.bossType === 'vector') b.skillName = 'VECTOR PRISM CAGE';
    else if (b.bossType === 'volt') b.skillName = 'TESLA STORM CATACLYSM';
    else if (b.bossType === 'inferno') b.skillName = 'SUPERNOVA FLARE BEAM';
    else if (b.bossType === 'nexus') b.skillName = 'EVENT HORIZON COLLAPSE';
    else if (b.bossType === 'abyss'){
      if (b.phase2 || isEnraged){
        b.skillName = 'APEX ECLIPSE CATACLYSM';
      } else {
        b.skillName = 'TITAN VOID HYPER-BEAM';
      }
    } else if (b.bossType === 'voracis'){
      if (b.phase2 || isEnraged){
        b.skillName = 'EXTINCTION ACID ROTATION & LEECH BROOD';
      } else {
        b.skillName = 'GAPING MAW PLASMA ERUPTION';
      }
      b.bileAngle = Math.atan2(dy, dx);
    }

    G.bossSkillAlert = { name: b.skillName, boss: b.name, color: b.color, time: 3.6 };
    if (sound.skillNova) sound.skillNova();
    addText(b.x, b.y - b.r - 35, b.skillName + '!', b.color, 22);
    shockwave(b.x, b.y, b.color, 200, 4);

    if (b.bossType === 'vector'){
      b.cageTargetX = p.x;
      b.cageTargetY = p.y;
      b.cageRadius = 180;
    } else if (b.bossType === 'volt'){
      G.teslaMarkers = [];
      for (var ti = 0; ti < 6; ti++){
        var ta = ti * (TAU / 6) + rnd(-0.15, 0.15);
        var td = (ti === 0) ? 0 : rnd(90, 220);
        G.teslaMarkers.push({
          x: clamp(p.x + Math.cos(ta) * td, 80, ARENA - 80),
          y: clamp(p.y + Math.sin(ta) * td, 80, ARENA - 80),
          r: 56,
          t: 1.0,
          fired: false
        });
      }
    } else if (b.bossType === 'inferno'){
      b.beamAng = Math.atan2(dy, dx);
      b.beamRotSpd = isEnraged ? 0.95 : 0.72;
    } else if (b.bossType === 'nexus'){
      G.blackHoles = [{
        x: clamp(p.x, 150, ARENA - 150),
        y: clamp(p.y, 150, ARENA - 150),
        r: 120,
        life: 3.4,
        maxLife: 3.4,
        pull: 240,
        pulseT: 0.5
      }];
    } else if (b.bossType === 'abyss'){
      var aimAng = Math.atan2(dy, dx);
      if (b.phase2 || isEnraged){
        b.hyperBeamAng1 = aimAng - 0.52;
        b.hyperBeamAng2 = aimAng + 0.52;
        b.hyperBeamAng = aimAng;
        b.mandibleOpen = 1.0;
        // Spawn 2 Gravitational Void Singularities flanking player
        var pPerp = aimAng + Math.PI / 2;
        G.blackHoles = [
          { x: clamp(p.x + Math.cos(pPerp) * 230, 120, ARENA - 120), y: clamp(p.y + Math.sin(pPerp) * 230, 120, ARENA - 120), r: 90, life: 3.4, maxLife: 3.4, pull: 260, pulseT: 0.5 },
          { x: clamp(p.x - Math.cos(pPerp) * 230, 120, ARENA - 120), y: clamp(p.y - Math.sin(pPerp) * 230, 120, ARENA - 120), r: 90, life: 3.4, maxLife: 3.4, pull: 260, pulseT: 0.5 }
        ];
      } else {
        b.hyperBeamAng = aimAng;
        b.mandibleOpen = 1.0;
      }
    }
  }

  // --- WINDUP PHASE PROGRESSION ---
  if (b.skillPhase === 'windup'){
    b.skillWindupT -= dt;
    if (b.bossType === 'inferno'){
      b.beamAng = angLerp(b.beamAng, Math.atan2(dy, dx), Math.min(1, dt * 6));
    } else if (b.bossType === 'abyss'){
      var targetAng = Math.atan2(dy, dx);
      if (b.phase2 || isEnraged){
        b.hyperBeamAng1 = angLerp(b.hyperBeamAng1 || (targetAng - 0.52), targetAng - 0.32, Math.min(1, dt * 5));
        b.hyperBeamAng2 = angLerp(b.hyperBeamAng2 || (targetAng + 0.52), targetAng + 0.32, Math.min(1, dt * 5));
        b.hyperBeamAng = targetAng;
      } else {
        b.hyperBeamAng = angLerp(b.hyperBeamAng, targetAng, Math.min(1, dt * 6));
      }
      b.mandibleOpen = Math.min(1, (b.mandibleOpen || 0) + dt * 3);
    } else if (b.bossType === 'voracis'){
      b.jawAngle = Math.min(1.25, (b.jawAngle || 0) + dt * 3.5);
      b.mawGlow = Math.min(1.0, (b.mawGlow || 0) + dt * 3.0);
      b.ang = angLerp(b.ang, Math.atan2(dy, dx), Math.min(1, dt * 5));
    }
    if (b.skillWindupT <= 0){
      b.skillPhase = 'active';
      if (b.bossType === 'aegis'){
        b.skillActiveT = 2.4;
        b.barrierActive = true;
        b.chargeAng = Math.atan2(dy, dx);
        shockwave(b.x, b.y, '#ff9f1c', 280, 5);
        if (sound.skillBarrier) sound.skillBarrier();
      } else if (b.bossType === 'void'){
        b.skillActiveT = 2.2;
        var warpA = Math.random() * TAU;
        burst(b.x, b.y, b.color, 40);
        b.x = clamp(p.x + Math.cos(warpA) * 290, 120, ARENA - 120);
        b.y = clamp(p.y + Math.sin(warpA) * 290, 120, ARENA - 120);
        shockwave(b.x, b.y, '#bf55ec', 320, 5);
        if (sound.skillTimeWarp) sound.skillTimeWarp();
        for (var di = 0; di < 3; di++){
          var da = warpA + (di + 1) * (TAU / 4);
          var decoy = {
            type: 'decoy', isMinion: true, isDecoy: true,
            r: 22, color: '#bf55ec', xp: 1,
            x: b.x + Math.cos(da) * 65, y: b.y + Math.sin(da) * 65,
            vx: Math.cos(da) * 120, vy: Math.sin(da) * 120,
            kx: 0, ky: 0, ang: da, spawn: 0, squash: 0, hitAng: 0,
            hp: 1, maxhp: 1, spd: 120, dmg: 6, touchT: 0, flash: 0, shootT: 0.9
          };
          G.enemies.push(decoy);
        }
      } else if (b.bossType === 'vector'){
        b.skillActiveT = 2.6;
        b.cageActive = true;
        shockwave(b.cageTargetX, b.cageTargetY, '#00f5d4', 260, 4);
        if (sound.skillLaser) sound.skillLaser();
      } else if (b.bossType === 'volt'){
        b.skillActiveT = 1.8;
        if (G.teslaMarkers){
          for (var ti = 0; ti < G.teslaMarkers.length; ti++){
            var tm = G.teslaMarkers[ti];
            tm.fired = true;
            shockwave(tm.x, tm.y, '#35f0ff', tm.r * 2.2, 4);
            burst(tm.x, tm.y, '#35f0ff', 16);
            if (Math.hypot(p.x - tm.x, p.y - tm.y) < p.r + tm.r){
              hurtPlayer(18, Math.atan2(p.y - tm.y, p.x - tm.x));
            }
            G.thermitePools = G.thermitePools || [];
            G.thermitePools.push({ x: tm.x, y: tm.y, r: 44, life: 3.2, maxLife: 3.2, isElectric: true });
          }
        }
        fireEnemyBulletRing(b, 18, 310, b.dmg * 0.44, '#35f0ff');
        shockwave(b.x, b.y, '#35f0ff', 300, 5);
        if (sound.skillNova) sound.skillNova();
      } else if (b.bossType === 'inferno'){
        b.skillActiveT = 2.8;
        shockwave(b.x, b.y, '#ffe066', 320, 5);
        if (sound.skillNova) sound.skillNova();
        G.thermitePools = G.thermitePools || [];
        for (var cbi = 0; cbi < 4; cbi++){
          var ca = b.beamAng + cbi * (TAU / 4);
          G.thermitePools.push({ x: b.x + Math.cos(ca) * 160, y: b.y + Math.sin(ca) * 160, r: 45, life: 4.5, maxLife: 4.5 });
        }
      } else if (b.bossType === 'nexus'){
        b.skillActiveT = 3.0;
        shockwave(b.x, b.y, '#ff4d6d', 340, 5);
        if (sound.skillVortex) sound.skillVortex();
      } else if (b.bossType === 'abyss'){
        b.skillActiveT = (b.phase2 || isEnraged) ? 3.0 : 2.6;
        b.mandibleOpen = 1.0;
        var sCol = (b.phase2 || isEnraged) ? '#ff0055' : '#e0aaff';
        shockwave(b.x, b.y, sCol, 380, 6);
        if (sound.skillLaser) sound.skillLaser();
        if (sound.skillNova) sound.skillNova();
      } else if (b.bossType === 'voracis'){
        b.skillActiveT = (b.phase2 || isEnraged) ? 3.6 : 2.6;
        b.jawAngle = 1.25;
        b.mawGlow = 1.0;
        var vCol = (b.phase2 || isEnraged) ? '#ff0033' : '#ff0055';
        shockwave(b.x, b.y, vCol, 380, 6);
        if (sound.abyssRoar) sound.abyssRoar();
        if (sound.surge) sound.surge();
        if (b.phase2 || isEnraged){
          for (var lk = 0; lk < 3; lk++){
            var lka = Math.random() * TAU;
            var ltype2 = ENEMY_TYPES.leech;
            G.enemies.push({
              type: 'leech', r: ltype2.r, color: ltype2.color, xp: 2,
              x: b.x + Math.cos(lka) * 40, y: b.y + Math.sin(lka) * 40,
              vx: Math.cos(lka) * 180, vy: Math.sin(lka) * 180, kx: 0, ky: 0,
              ang: lka, spawn: 0, squash: 0, hitAng: 0,
              hp: ltype2.hp, maxhp: ltype2.hp, spd: ltype2.spd, dmg: ltype2.dmg,
              touchT: 0, shootT: 1, flash: 0, split: 0, ranged: false
            });
          }
        } else {
          var baseAng = Math.atan2(dy, dx);
          for (var pvi = 0; pvi < 7; pvi++){
            var pSpreadAng = baseAng + (pvi - 3) * 0.22;
            G.ebullets.push({
              x: b.x + Math.cos(baseAng) * b.r * 0.8,
              y: b.y + Math.sin(baseAng) * b.r * 0.8,
              vx: Math.cos(pSpreadAng) * 320,
              vy: Math.sin(pSpreadAng) * 320,
              r: 9.0, dmg: b.dmg * 0.55, life: 3.5, ang: pSpreadAng,
              col: '#ff0055', kind: 'voracis_plasma', isBossBullet: true
            });
          }
        }
      }
    }
  }

  // --- ACTIVE PHASE PROGRESSION & CLEANUP ---
  if (b.skillPhase === 'active'){
    b.skillActiveT -= dt;
    if (b.skillActiveT <= 0){
      b.skillPhase = 'cooldown';
      b.skillCd = isEnraged ? (b.skillMaxCd * 0.72) : b.skillMaxCd;
      b.barrierActive = false;
      b.cageActive = false;
      b.mandibleOpen = 0;
      b.jawAngle = 0;
      b.mawGlow = 0;
    }
  }

  // --- BOSS-SPECIFIC BEHAVIORS ---
  if (b.bossType === 'aegis'){
    b.ang = angLerp(b.ang, Math.atan2(dy, dx), Math.min(1, dt * 5));
    if (b.barrierActive){
      b.vx = Math.cos(b.chargeAng) * 600;
      b.vy = Math.sin(b.chargeAng) * 600;
      burst(b.x, b.y, '#ff9f1c', 4, b.chargeAng + Math.PI, 0.4);
      shockwave(b.x, b.y, '#ff9f1c', 70, 2);
      b.barrierDetonateT = (b.barrierDetonateT || 0.6) - dt;
      if (b.barrierDetonateT <= 0){
        b.barrierDetonateT = 0.6;
        fireEnemyBulletRing(b, 10, 310, b.dmg * 0.38, '#ff9f1c');
        shockwave(b.x, b.y, '#ff9f1c', 130, 3);
      }
    } else if (b.chargeT > 0){
      b.chargeT -= dt;
