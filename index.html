        var tMidX = -r * 0.75 + Math.sin(tPhase2) * (r * 0.25);
        var tMidY = tYOffset + Math.cos(tPhase2) * (r * 0.20);
        var tEnd2X = -r * 1.35 + Math.sin(tPhase2 + 1.2) * (r * 0.35);
        var tEnd2Y = tYOffset + Math.cos(tPhase2 + 1.2) * (r * 0.30);
        ctx.quadraticCurveTo(tMidX, tMidY, tEnd2X, tEnd2Y);
        ctx.stroke();

        // Stinging nematocyst nodes along tentacle
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(tMidX, tMidY, 1.8, 0, TAU); ctx.fill();
        ctx.fillStyle = '#a7ff00';
        ctx.beginPath(); ctx.arc(tEnd2X, tEnd2Y, 2.5, 0, TAU); ctx.fill();
      }

      // 2. Outer Pulsating Medusa Bell Dome with Scalloped Margin
      ctx.beginPath();
      ctx.arc(r * 0.1, 0, r * (0.85 + podHeave), -Math.PI * 0.5, Math.PI * 0.5, false);
      ctx.lineTo(-r * 0.25, r * (0.65 + podHeave));
      ctx.quadraticCurveTo(-r * 0.10, 0, -r * 0.25, -r * (0.65 + podHeave));
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 159, 28, 0.38)';
      ctx.fill();
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.4;
      ctx.stroke();

      // Specular sheen along umbrella rim
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(r * 0.1, 0, r * (0.82 + podHeave), -Math.PI * 0.35, Math.PI * 0.35, false);
      ctx.stroke();

      // Scalloped marginal rhopalia sensory bulbs along rim
      for (var rhi = -3; rhi <= 3; rhi++){
        var rha = (rhi / 4) * Math.PI * 0.45;
        var rhx = r * 0.1 + Math.cos(rha) * r * (0.85 + podHeave);
        var rhy = Math.sin(rha) * r * (0.85 + podHeave);
        ctx.fillStyle = '#a7ff00';
        ctx.beginPath(); ctx.arc(rhx, rhy, 2.2, 0, TAU); ctx.fill();
      }

      // 3. Central Glowing Bio-Acid Gland Sac & Digestive Vesicles
      var glandPulse = Math.sin(t * 8.5) * 0.22;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.42 * (1 + glandPulse), 0, TAU);
      ctx.fillStyle = '#a7ff00';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Internal circulating toxic vesicles
      for (var vi2 = 0; vi2 < 3; vi2++){
        var va2 = t * 4.5 + vi2 * (TAU / 3);
        var vx2 = Math.cos(va2) * r * 0.22;
        var vy2 = Math.sin(va2) * r * 0.22;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(vx2, vy2, 1.8, 0, TAU); ctx.fill();
      }

      // Core white-hot digestion seed
      ctx.beginPath(); ctx.arc(0, 0, r * 0.16, 0, TAU);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      break;

    case 'colossus':
      // Hive Colossus: Super-heavy horned bio-tank juggernaut
      var hbPulse = Math.pow(Math.sin(t * 8.0), 4) * 0.24;

      // 1. 4 Colossal Articulated Walking Limbs (Coxa, Femur, Tibia, Ground-Cleat Hoof)
      for (var cli = -1; cli <= 1; cli += 2){
        for (var cls = -1; cls <= 1; cls += 2){
          var legPhaseCol = t * 11 + cls * 2.0 + cli;
          var limbCoxaX = cls * r * 0.45;
          var limbCoxaY = cli * r * 0.50;
          var limbKneeX = limbCoxaX + cls * r * 0.28 + Math.sin(legPhaseCol) * 3;
          var limbKneeY = cli * (r * 0.78 + Math.sin(legPhaseCol) * 4);
          var limbFootX = limbKneeX + cls * r * 0.22;
          var limbFootY = cli * (r * 0.98 + Math.cos(legPhaseCol) * 4);

          // Muscular coxa
          ctx.fillStyle = '#2d0610';
          ctx.beginPath(); ctx.arc(limbCoxaX, limbCoxaY, 5.0, 0, TAU); ctx.fill();

          // Armored femur
          ctx.strokeStyle = '#4a0e1c'; ctx.lineWidth = 5.5; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(limbCoxaX, limbCoxaY); ctx.lineTo(limbKneeX, limbKneeY); ctx.stroke();

          // Tibia & ground-cleat hoof
          ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.moveTo(limbKneeX, limbKneeY); ctx.lineTo(limbFootX, limbFootY); ctx.stroke();

          // Articulated ground cleat plate
          ctx.fillStyle = '#ffe066';
          ctx.fillRect(limbFootX - 3, limbFootY - 2, 6, 4);
        }
      }

      // 2. Segmented Juggernaut Torso Carapace (Multi-tiered overlapping scutes)
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.78, r * 0.68, 0, 0, TAU);
      ctx.fillStyle = '#1e050c';
      ctx.fill();
      ctx.strokeStyle = '#5a1222';
      ctx.lineWidth = 3.2;
      ctx.stroke();

      // Dorsal bone ridges
      for (var dri = -2; dri <= 1; dri++){
        var drx = dri * r * 0.28;
        ctx.strokeStyle = 'rgba(255, 0, 85, 0.45)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(drx, 0, r * 0.52, -Math.PI * 0.4, Math.PI * 0.4, false);
        ctx.stroke();
      }

      // 3. Frontal Heavy Horned Cranial Bone Plate (Deflects 70% damage)
      ctx.beginPath();
      ctx.moveTo(r * 0.98, 0);
      ctx.lineTo(r * 0.48, -r * 0.88);
      ctx.lineTo(r * 0.12, -r * 0.68);
      ctx.lineTo(r * 0.28, 0);
      ctx.lineTo(r * 0.12, r * 0.68);
      ctx.lineTo(r * 0.48, r * 0.88);
      ctx.closePath();
      ctx.fillStyle = '#3a0814';
      ctx.fill();
      ctx.strokeStyle = col;
      ctx.lineWidth = 3.8;
      ctx.stroke();

      // Specular hard-light bone bevel on cranial armor
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(r * 0.96, 0); ctx.lineTo(r * 0.48, -r * 0.85);
      ctx.moveTo(r * 0.96, 0); ctx.lineTo(r * 0.48, r * 0.85);
      ctx.stroke();

      // Colossal Forward Ramming Horns with Annular Growth Ridges
      for (var hni = -1; hni <= 1; hni += 2){
        ctx.strokeStyle = '#ffe066';
        ctx.lineWidth = 3.6;
        ctx.beginPath();
        ctx.moveTo(r * 0.45, hni * r * 0.75);
        ctx.quadraticCurveTo(r * 0.88, hni * r * 0.98, r * 1.20, hni * r * 0.62);
        ctx.stroke();

        // Specular horn ridge
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(r * 0.55, hni * r * 0.78);
        ctx.quadraticCurveTo(r * 0.85, hni * r * 0.92, r * 1.18, hni * r * 0.62);
        ctx.stroke();

        // Annular growth rings
        ctx.fillStyle = '#ff7b00';
        for (var ari = 1; ari <= 3; ari++){
          var arx = r * (0.55 + ari * 0.16);
          var ary = hni * r * (0.76 + ari * 0.04);
          ctx.fillRect(arx - 1, ary - 2, 2, 4);
        }
      }

      // Crushing chelicerae fangs guarding mouth
      ctx.fillStyle = '#ffffff';
      for (var cfi = -1; cfi <= 1; cfi += 2){
        ctx.beginPath();
        ctx.moveTo(r * 0.65, cfi * r * 0.25);
        ctx.lineTo(r * 0.92, cfi * r * 0.15);
        ctx.lineTo(r * 0.72, cfi * r * 0.05);
        ctx.closePath();
        ctx.fill();
      }

      // 4. Exposed Rear Dorsal Heart / Vulnerable Core (3.0x Crit Spot!)
      ctx.save();
      ctx.beginPath();
      ctx.arc(-r * 0.48, 0, r * 0.34 * (1 + hbPulse), 0, TAU);
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Heart chambers & pulsating vent capillaries
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(-r * 0.48, 0, r * 0.20 * (1 + hbPulse), 0, TAU);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(-r * 0.48, 0, r * 0.10, 0, TAU);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.restore();
      break;

    case 'leech':
      // Parasitic Leech Drone: Sinuous multi-segmented eel horror
      var leechWiggle = Math.sin(t * 18);
      ctx.beginPath();
      ctx.moveTo(r * 0.9, 0);
      for (var lsi = 1; lsi <= 6; lsi++){
        var lx = r * 0.9 - lsi * (r * 0.32);
        var ly = Math.sin(t * 18 - lsi * 0.85) * (r * 0.48);
        ctx.lineTo(lx, ly);
      }
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(2.5, r * 0.48);
      ctx.lineCap = 'round';
      ctx.stroke();

      // Segmented Chitinous Annuli Highlights
      for (var lsi2 = 1; lsi2 <= 5; lsi2++){
        var lx2 = r * 0.9 - lsi2 * (r * 0.32);
        var ly2 = Math.sin(t * 18 - lsi2 * 0.85) * (r * 0.48);
        ctx.fillStyle = '#ff8fd8';
        ctx.fillRect(lx2 - 1.5, ly2 - 2, 3, 4);
      }

      // Circular Toothy Maw with Concentric Needle Teeth
      ctx.beginPath();
      ctx.arc(r * 0.82, 0, r * 0.46, 0, TAU);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(r * 0.82, 0, r * 0.28, 0, TAU);
      ctx.fillStyle = '#2b0008';
      ctx.fill();
      // Razor teeth ring
      ctx.fillStyle = '#ffffff';
      for (var lti = 0; lti < 6; lti++){
        var lta = lti * (TAU / 6) + t * 4;
        ctx.fillRect(r * 0.82 + Math.cos(lta) * r * 0.22 - 1, Math.sin(lta) * r * 0.22 - 1, 2, 2);
      }
      break;

    case 'spore':
      // Living Acid Spore: Floating pulsating hazard bulb
      var spPulse = Math.sin(t * 10 + e.x) * 0.16;
      if (e.isWarning || (e.warningDistFrac && e.warningDistFrac > 0)){
        var warnP = (Math.sin(t * (16 + (e.warningDistFrac || 0) * 14)) + 1) * 0.5;
        var warnR = r * (1.6 + warnP * 0.85);
        ctx.save();
        ctx.strokeStyle = warnP > 0.5 ? 'rgba(255, 53, 101, 0.85)' : 'rgba(167, 255, 0, 0.85)';
        ctx.lineWidth = 1.8;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.arc(0, 0, warnR, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
      ctx.save();
      ctx.shadowColor = '#a7ff00';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, 0, r * (0.85 + spPulse), 0, TAU);
      ctx.fillStyle = 'rgba(255, 159, 28, 0.48)';
      ctx.fill();
      ctx.strokeStyle = '#a7ff00';
      ctx.lineWidth = 2.4;
      ctx.stroke();
      ctx.restore();

      // Specular surface glaze
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.75, -Math.PI * 0.3, Math.PI * 0.3, false);
      ctx.stroke();

      // Core toxic droplet with bubbling vesicles
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.44, 0, TAU);
      ctx.fillStyle = '#a7ff00';
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(-r * 0.12, -r * 0.12, r * 0.14, 0, TAU); ctx.fill();

      // 4 twitching articulated flagella
      ctx.strokeStyle = 'rgba(167, 255, 0, 0.75)';
      ctx.lineWidth = 1.4;
      for (var fli = 0; fli < 4; fli++){
        var fla = Math.PI - 0.6 + fli * 0.4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(fla) * r * 0.8, Math.sin(fla) * r * 0.8);
        ctx.lineTo(Math.cos(fla) * r * 1.6 + Math.sin(t * 14 + fli) * 4, Math.sin(fla) * r * 1.6);
        ctx.stroke();
      }
      break;

    case 'minion_geom':
      // Fast Geometric Escort Fighter (Cyan #00f5d4, r=13)
      var thrFlame = 6 + Math.sin(t * 30 + e.x) * 4;
      ctx.fillStyle = '#00f5d4';
      ctx.beginPath();
      ctx.moveTo(-r * 0.7, -r * 0.35);
      ctx.lineTo(-r * 0.7 - thrFlame, 0);
      ctx.lineTo(-r * 0.7, r * 0.35);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(-r * 0.7, -r * 0.18);
      ctx.lineTo(-r * 0.7 - thrFlame * 0.55, 0);
      ctx.lineTo(-r * 0.7, r * 0.18);
      ctx.closePath();
      ctx.fill();

      // Delta-Wing Polyhedral Hull with underglow pass
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(r * 1.25, 0);
      ctx.lineTo(-r * 0.65, -r * 0.95);
      ctx.lineTo(-r * 0.3, 0);
      ctx.lineTo(-r * 0.65, r * 0.95);
      ctx.closePath();
      ctx.fillStyle = '#071618';
      ctx.fill();
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.2;
      ctx.stroke();
      ctx.restore();

      // Specular hull ridge
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(r * 1.2, 0); ctx.lineTo(-r * 0.6, -r * 0.9);
      ctx.stroke();

      // Inner Prismatic Hull Inset
      ctx.beginPath();
      ctx.moveTo(r * 0.7, 0);
      ctx.lineTo(-r * 0.25, -r * 0.45);
      ctx.lineTo(-r * 0.25, r * 0.45);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 245, 212, 0.25)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Forward twin micro-blasters
      ctx.fillStyle = '#00f5d4';
      ctx.fillRect(r * 0.45, -r * 0.32, r * 0.35, 2.5);
      ctx.fillRect(r * 0.45, r * 0.30, r * 0.35, 2.5);

      // Glowing Vertex Core Lens
      ctx.beginPath();
      ctx.arc(r * 0.1, 0, r * 0.22, 0, TAU);
      ctx.fillStyle = col;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(r * 0.1, 0, r * 0.09, 0, TAU);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      break;

    case 'decoy':
      // Holographic Phantom Decoy Drone (Void Violet #bf55ec, r=22)
      var dAlpha = 0.65 + Math.sin(t * 18 + e.x) * 0.20;
      ctx.save();
      ctx.globalAlpha = dAlpha;

      // Layer 1: Dual ion phantom exhaust plumes
      for (var dti = -1; dti <= 1; dti += 2){
        var dty = dti * r * 0.35;
        var dtFlame = (0.35 + Math.sin(t * 26 + dti) * 0.15) * r;
        ctx.fillStyle = 'rgba(191, 85, 236, 0.55)';
        ctx.beginPath();
        ctx.moveTo(-r * 0.65, dty - r * 0.08);
        ctx.lineTo(-r * 0.65 - dtFlame, dty);
        ctx.lineTo(-r * 0.65, dty + r * 0.08);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(-r * 0.65, dty - r * 0.03);
        ctx.lineTo(-r * 0.65 - dtFlame * 0.5, dty);
        ctx.lineTo(-r * 0.65, dty + r * 0.03);
        ctx.closePath();
        ctx.fill();
      }

      // Layer 2: Faceted Holographic Delta Carapace
      ctx.beginPath();
      ctx.moveTo(r * 1.15, 0);
      ctx.lineTo(r * 0.25, -r * 0.35);
      ctx.lineTo(-r * 0.65, -r * 0.85);
      ctx.lineTo(-r * 0.45, 0);
      ctx.lineTo(-r * 0.65, r * 0.85);
      ctx.lineTo(r * 0.25, r * 0.35);
      ctx.closePath();
      ctx.fillStyle = 'rgba(25, 12, 38, 0.75)';
      ctx.fill();
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.2;
      ctx.stroke();

      // Layer 3: Inner Quantum Interference Scanlines
      ctx.strokeStyle = 'rgba(191, 85, 236, 0.5)';
      ctx.lineWidth = 1;
      for (var sli = -2; sli <= 2; sli++){
        var slx = sli * r * 0.22;
        ctx.beginPath();
        ctx.moveTo(slx, -r * 0.4);
        ctx.lineTo(slx, r * 0.4);
        ctx.stroke();
      }

      // Layer 4: Central Holographic Singularity Lens
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.25, 0, TAU);
      ctx.fillStyle = 'rgba(191, 85, 236, 0.35)';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, r * 0.10, 0, TAU);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();
      break;

    default:
      // Robust Fallback Vector Fighter (ensures no entity is ever invisible)
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(r * 1.1, 0);
      ctx.lineTo(-r * 0.7, -r * 0.7);
      ctx.lineTo(-r * 0.3, 0);
      ctx.lineTo(-r * 0.7, r * 0.7);
      ctx.closePath();
      ctx.fillStyle = 'rgba(10, 14, 24, 0.90)';
      ctx.fill();
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.2;
      ctx.stroke();
      ctx.restore();

      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.0;
      ctx.beginPath();
      ctx.moveTo(r * 1.05, 0); ctx.lineTo(-r * 0.65, -r * 0.65);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, r * 0.2, 0, TAU);
      ctx.fillStyle = col;
      ctx.fill();
      break;
  }
  ctx.restore();
}

function drawPlayer(){
  var p = G.player;
  var spd = Math.hypot(p.vx, p.vy);
  var lean = clamp(spd / p.speed, 0, 1.8);
  var r = p.r;
  var t = G.t;

  // Determine visual scale from HP upgrades (does NOT affect physics radius p.r)
  var visualScale = clamp(1 + (p.maxhp / 120 - 1) * 0.12, 1, 1.35);
  var vr = r * visualScale;

  // Detect active skill overdrive state
  var qSlot = p.skills ? p.skills.q : null;
  var qActive = (qSlot && qSlot.activeT > 0) || (p.skillActiveT && p.skillActiveT > 0) || (p.missileSalvoTimer && p.missileSalvoTimer > 0);
  var overdriveActive = qActive;
  var overdriveCol = '#35f0ff';
  if (qActive && qSlot && qSlot.skill) overdriveCol = qSlot.skill.col || '#35f0ff';
  else if (qActive && p.skill) overdriveCol = p.skill.col || '#35f0ff';
  var overdriveFlameBoost = overdriveActive ? 1.4 : 1.0;

  // Speed tier classification
  var speedTier = 0;
  if (p.speed > 400) speedTier = 3;
  else if (p.speed > 330) speedTier = 2;
  else if (p.speed > 280) speedTier = 1;

  var up = p.upgrades || {};

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.aim);
  if (p.squash > 0.01){
    ctx.rotate(p.hitAng - p.aim);
    ctx.scale(1 + p.squash*0.3, 1 - p.squash*0.3);
    ctx.rotate(p.aim - p.hitAng);
  }
  ctx.translate(-p.recoil * r * 0.35, 0);
  ctx.scale(1 + lean*0.12, 1 - lean*0.06);

  /* === OVERDRIVE AURA FIELD (Active Skill In-Use) === */
  if (overdriveActive){
    ctx.save();
    var oPulse = 0.5 + 0.5 * Math.sin(t * 18);
    ctx.beginPath();
    ctx.ellipse(0, 0, vr * (1.85 + oPulse * 0.2), vr * (1.45 + oPulse * 0.15), 0, 0, TAU);
    ctx.fillStyle = 'rgba(' + (qSlot && qSlot.skill && qSlot.skill.id === 'missiles' ? '255,123,0' : (qSlot && qSlot.skill && qSlot.skill.id === 'laser' ? '255,224,102' : '53,240,255')) + ', 0.14)';
    ctx.fill();
    ctx.strokeStyle = overdriveCol;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // High-frequency energy discharge arcs
    for (var oi = 0; oi < 3; oi++){
      var oAng = t * 6 + oi * (TAU / 3);
      var ox1 = Math.cos(oAng) * vr * 1.1;
      var oy1 = Math.sin(oAng) * vr * 0.9;
      var ox2 = Math.cos(oAng + 0.4) * vr * 1.7;
      var oy2 = Math.sin(oAng + 0.4) * vr * 1.3;
      ctx.beginPath();
      ctx.moveTo(ox1, oy1);
      ctx.lineTo((ox1 + ox2) * 0.5 + Math.sin(t * 30 + oi) * 4, (oy1 + oy2) * 0.5);
      ctx.lineTo(ox2, oy2);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.restore();
  }

  /* === SHIELD BARRIER (orbiting hexagonal energy field) === */
  if (p.shield > 0 || p.maxShield > 0){
    var shieldFrac = (p.maxShield > 0) ? clamp(p.shield / p.maxShield, 0, 1) : 0;
    var shieldR = vr * 2.4;
    var hexCount = 6;
    var hexRot = t * 1.8;
    ctx.save();
    ctx.lineWidth = 1.6;
    for (var hi = 0; hi < hexCount; hi++){
      var hexAng = hexRot + hi * (TAU / hexCount);
      var hx = Math.cos(hexAng) * shieldR;
      var hy = Math.sin(hexAng) * shieldR;
      var hexSize = vr * 0.38;
      ctx.save();
      ctx.translate(hx, hy);
      ctx.rotate(hexAng + t * 2.2);
      ctx.beginPath();
      for (var hv = 0; hv < 6; hv++){
        var va = hv * (TAU / 6);
        var vx2 = Math.cos(va) * hexSize;
        var vy2 = Math.sin(va) * hexSize;
        if (hv === 0) ctx.moveTo(vx2, vy2); else ctx.lineTo(vx2, vy2);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(53, 240, 255, ' + (0.35 + shieldFrac * 0.45) + ')';
      ctx.stroke();
      if (shieldFrac > 0.5){
        ctx.fillStyle = 'rgba(53, 240, 255, ' + (shieldFrac * 0.12) + ')';
        ctx.fill();
      }
      ctx.restore();
    }
    // Connecting orbital arc
    ctx.beginPath();
    ctx.arc(0, 0, shieldR, 0, TAU);
    ctx.strokeStyle = 'rgba(53, 240, 255, ' + (0.12 + shieldFrac * 0.18) + ')';

  ctx.lineTo(-vr * 0.15, vr * 0.48);
  ctx.closePath();
  ctx.fillStyle = 'rgba(12, 18, 30, 0.75)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(53, 240, 255, 0.35)';
  ctx.lineWidth = 1.0;
  ctx.stroke();

  // Internal cyber panel lines
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(vr*0.75, 0); ctx.lineTo(-vr*0.35, -vr*0.45);
  ctx.moveTo(vr*0.75, 0); ctx.lineTo(-vr*0.35, vr*0.45);
  if (overdriveActive){
    ctx.strokeStyle = overdriveCol;
    ctx.globalAlpha = 0.8;
  } else {
    ctx.strokeStyle = 'rgba(53,240,255,0.4)';
  }
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Plating / armored reinforcement seams (visible when maxhp > 120)
  if (p.maxhp > 120){
    ctx.beginPath();
    ctx.moveTo(vr*0.4, 0); ctx.lineTo(-vr*0.55, -vr*0.7);
    ctx.moveTo(vr*0.4, 0); ctx.lineTo(-vr*0.55, vr*0.7);
    ctx.strokeStyle = 'rgba(53, 240, 255, 0.45)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // Heavy Bulkhead Rivets
    ctx.fillStyle = '#ffffff';
    for (var bii = 0; bii < 4; bii++){
      var bxPos = -vr * (0.1 + bii * 0.15);
      var byPos = -vr * (0.35 + bii * 0.10);
      ctx.beginPath(); ctx.arc(bxPos, byPos, 1.2, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(bxPos, -byPos, 1.2, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();

  /* === HARDWARE SOCKETS: EQUIPPED SKILL [Q] (Twin Wing Mounts) === */
  if (qSlot && qSlot.skill){
    var qsk = qSlot.skill;
    var qGlow = qActive ? (0.7 + Math.sin(t * 16) * 0.3) : 0.55;
    for (var side = -1; side <= 1; side += 2){
      ctx.save();
      ctx.translate(-vr*0.45, side * vr*0.78);
      if (qsk.id === 'missiles'){
        ctx.fillStyle = '#0a0e1a';
        ctx.strokeStyle = qsk.col;
        ctx.lineWidth = 1.4;
        ctx.fillRect(-vr*0.14, -vr*0.10, vr*0.28, vr*0.08);
        ctx.strokeRect(-vr*0.14, -vr*0.10, vr*0.28, vr*0.08);
        ctx.fillRect(-vr*0.14, vr*0.02, vr*0.28, vr*0.08);
        ctx.strokeRect(-vr*0.14, vr*0.02, vr*0.28, vr*0.08);
        ctx.fillStyle = qsk.col;
        ctx.beginPath(); ctx.arc(vr*0.14, -vr*0.06, vr*0.03, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(vr*0.14, vr*0.06, vr*0.03, 0, TAU); ctx.fill();
      } else if (qsk.id === 'tesla'){
        ctx.strokeStyle = qsk.col;
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(-vr*0.06, 0, vr*0.09, 0, TAU); ctx.stroke();
        ctx.beginPath(); ctx.arc(vr*0.06, 0, vr*0.09, 0, TAU); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, vr*0.04, 0, TAU); ctx.fill();
      } else if (qsk.id === 'laser'){
        ctx.strokeStyle = qsk.col;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-vr*0.15, -vr*0.03);
        ctx.lineTo(vr*0.18, -vr*0.03);
        ctx.moveTo(-vr*0.15, vr*0.03);
        ctx.lineTo(vr*0.18, vr*0.03);
        ctx.stroke();
        ctx.fillStyle = qsk.col;
        ctx.beginPath(); ctx.arc(vr*0.18, 0, vr*0.03, 0, TAU); ctx.fill();
      } else if (qsk.id === 'nova'){
        ctx.fillStyle = '#08121e';
        ctx.strokeStyle = qsk.col;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        for (var nvi = 0; nvi < 6; nvi++){
          var nva = nvi * (TAU / 6);
          var nvx = Math.cos(nva) * vr * 0.11;
          var nvy = Math.sin(nva) * vr * 0.11;
          if (nvi === 0) ctx.moveTo(nvx, nvy); else ctx.lineTo(nvx, nvy);
        }
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Inner EMP capacitor shock ring
        ctx.beginPath();
        ctx.arc(0, 0, vr * 0.05, 0, TAU);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = qsk.col;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      } else if (qsk.id === 'timewarp'){
        ctx.fillStyle = '#100820';
        ctx.strokeStyle = qsk.col;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(0, 0, vr * 0.10, 0, TAU);
        ctx.fill(); ctx.stroke();
        // Rotating astrolabe dial tick marks
        var astRot = t * 3.5;
        for (var ai = 0; ai < 4; ai++){
          var aa = astRot + ai * (TAU / 4);
          ctx.beginPath();
          ctx.moveTo(Math.cos(aa) * vr * 0.04, Math.sin(aa) * vr * 0.04);
          ctx.lineTo(Math.cos(aa) * vr * 0.09, Math.sin(aa) * vr * 0.09);
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.stroke();
        }
        ctx.fillStyle = qsk.col;
        ctx.beginPath(); ctx.arc(0, 0, vr * 0.03, 0, TAU); ctx.fill();
      } else if (qsk.id === 'barrier'){
        ctx.fillStyle = '#081812';
        ctx.strokeStyle = qsk.col;
        ctx.lineWidth = 1.4;
        ctx.fillRect(-vr * 0.12, -vr * 0.08, vr * 0.24, vr * 0.16);
        ctx.strokeRect(-vr * 0.12, -vr * 0.08, vr * 0.24, vr * 0.16);
        // Projecting barrier emitter prongs
        ctx.strokeStyle = '#3ddc97';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(vr * 0.12, -vr * 0.06); ctx.lineTo(vr * 0.22, -vr * 0.10);
        ctx.moveTo(vr * 0.12, vr * 0.06);  ctx.lineTo(vr * 0.22, vr * 0.10);
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(vr * 0.20, -vr * 0.11, 2, 2);
        ctx.fillRect(vr * 0.20, vr * 0.09, 2, 2);
      } else if (qsk.id === 'vortex'){
        ctx.fillStyle = '#1c060d';
        ctx.strokeStyle = qsk.col;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(0, 0, vr * 0.11, 0, TAU);
        ctx.fill(); ctx.stroke();
        // Spiral accretion vortex arcs
        var vorRot = -t * 6;
        for (var vxi = 0; vxi < 3; vxi++){
          var vaa = vorRot + vxi * (TAU / 3);
          ctx.beginPath();
          ctx.arc(0, 0, vr * (0.05 + vxi * 0.02), vaa, vaa + 1.2);
          ctx.strokeStyle = vxi === 0 ? '#ffffff' : qsk.col;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.arc(0, 0, vr * 0.03, 0, TAU); ctx.fill();
      } else if (qsk.id === 'glaives'){
        ctx.fillStyle = '#1e0515';
        ctx.strokeStyle = qsk.col;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(0, 0, vr * 0.08, 0, TAU);
        ctx.fill(); ctx.stroke();
        // Plasma blade shuriken wings
        var glRot = t * 8;
        for (var gi = 0; gi < 3; gi++){
          var ga = glRot + gi * (TAU / 3);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(ga) * vr * 0.16, Math.sin(ga) * vr * 0.16);
          ctx.lineTo(Math.cos(ga + 0.3) * vr * 0.08, Math.sin(ga + 0.3) * vr * 0.08);
          ctx.closePath();
          ctx.fillStyle = qsk.col; ctx.fill();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.stroke();
        }
      } else if (qsk.id === 'decoy'){
        ctx.fillStyle = '#140822';
        ctx.strokeStyle = qsk.col;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(vr * 0.14, 0);
        ctx.lineTo(-vr * 0.08, -vr * 0.10);
        ctx.lineTo(-vr * 0.08, vr * 0.10);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Inner prismatic refraction core
        var prismPulse = 0.5 + 0.5 * Math.sin(t * 14);
        ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.4 + prismPulse * 0.4) + ')';
        ctx.beginPath(); ctx.arc(0, 0, vr * 0.04, 0, TAU); ctx.fill();
      } else if (qsk.id === 'warpstrike'){
        ctx.fillStyle = '#061c16';
        ctx.strokeStyle = qsk.col;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(vr * 0.16, 0);
        ctx.lineTo(-vr * 0.12, -vr * 0.08);
        ctx.lineTo(-vr * 0.04, 0);
        ctx.lineTo(-vr * 0.12, vr * 0.08);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // High-frequency subspace quantum conduit
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-vr * 0.08, 0);
        ctx.lineTo(vr * 0.12, 0);
        ctx.stroke();
      } else {
        ctx.beginPath();
        for (var qhi = 0; qhi < 6; qhi++){
          var qa = qhi * (TAU / 6);
          var qhx = Math.cos(qa) * vr * 0.10;
          var qhy = Math.sin(qa) * vr * 0.10;
          if (qhi === 0) ctx.moveTo(qhx, qhy); else ctx.lineTo(qhx, qhy);
        }
        ctx.closePath();
        ctx.strokeStyle = qsk.col;
        ctx.lineWidth = 1.4;
        ctx.stroke();
        ctx.globalAlpha = qGlow;
        ctx.fillStyle = qsk.col;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }
  }

  /* === Faceted Crystalline Cockpit Canopy === */
  // Base glass fill
  ctx.beginPath();
  ctx.moveTo(vr * 0.78, 0);
  ctx.lineTo(vr * 0.40, -vr * 0.22);
  ctx.lineTo(-vr * 0.05, -vr * 0.24);
  ctx.lineTo(-vr * 0.12, 0);
  ctx.lineTo(-vr * 0.05, vr * 0.24);
  ctx.lineTo(vr * 0.40, vr * 0.22);
  ctx.closePath();
  ctx.fillStyle = overdriveActive ? (overdriveCol || '#35f0ff') : 'rgba(10, 26, 44, 0.92)';
  ctx.fill();
  ctx.strokeStyle = overdriveActive ? '#ffffff' : '#35f0ff';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  // Faceted gem-cut reflection panels
  ctx.beginPath();
  ctx.moveTo(vr * 0.78, 0);
  ctx.lineTo(-vr * 0.12, 0);
  ctx.moveTo(vr * 0.40, -vr * 0.22);
  ctx.lineTo(vr * 0.25, 0);
  ctx.lineTo(vr * 0.40, vr * 0.22);
  ctx.moveTo(-vr * 0.05, -vr * 0.24);
  ctx.lineTo(vr * 0.05, 0);
  ctx.lineTo(-vr * 0.05, vr * 0.24);
  ctx.strokeStyle = overdriveActive ? 'rgba(255, 255, 255, 0.85)' : 'rgba(144, 243, 255, 0.55)';
  ctx.lineWidth = 1.0;
  ctx.stroke();

  // Specular gloss glare highlight curve
  ctx.beginPath();
  ctx.moveTo(vr * 0.68, -vr * 0.04);
  ctx.quadraticCurveTo(vr * 0.35, -vr * 0.18, 0, -vr * 0.16);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // Central Pilot HUD Reticle Pip
  ctx.beginPath();
  ctx.arc(vr * 0.22, 0, 1.8, 0, TAU);
  ctx.fillStyle = overdriveActive ? '#ffffff' : '#35f0ff';
  ctx.fill();

  ctx.restore();

  /* invuln ring */
  if (p.inv > 0.02 && G.state !== 'victory'){
    ctx.beginPath();
    ctx.arc(p.x, p.y, r*1.9, 0, TAU);
    ctx.strokeStyle = 'rgba(255,255,255,' + Math.min(1, p.inv*1.4) + ')';
    ctx.lineWidth = 1.5; ctx.stroke();
  }

  /* Diegetic Player Tactical Hazard Ring & Proximity Threat Monitor */
  if (G.state === 'play'){
    ctx.save();
    var isLowHull = (p.hp / p.maxhp < 0.35);
    var warnPulse = isLowHull ? (0.55 + Math.sin(G.t * 12) * 0.40) : 0.25;
    var baseRingCol = isLowHull ? 'rgba(255, 77, 109, ' + warnPulse + ')' : 'rgba(53, 240, 255, 0.20)';

    // 1. Diegetic Tactical Orientation Ring
    var ringR = r * 1.95;
    ctx.strokeStyle = baseRingCol;
    ctx.lineWidth = isLowHull ? 1.6 : 1.0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, ringR, 0, TAU);
    ctx.stroke();

    // 2. Tactical Compass Tick Marks with Directional Forward Heading Chevron
    var tickLen = isLowHull ? 4.5 : 3.0;
    ctx.strokeStyle = isLowHull ? '#ff4d6d' : 'rgba(53, 240, 255, 0.45)';
    ctx.lineWidth = 1.2;
    for (var cti = 0; cti < 4; cti++){
      var cta = p.aim + cti * (TAU / 4);
      if (cti === 0){
        var fwdTipX = p.x + Math.cos(cta) * (ringR + tickLen + 3);
        var fwdTipY = p.y + Math.sin(cta) * (ringR + tickLen + 3);
        var fwdLeftX = p.x + Math.cos(cta - 0.12) * (ringR - 1);
        var fwdLeftY = p.y + Math.sin(cta - 0.12) * (ringR - 1);
        var fwdRightX = p.x + Math.cos(cta + 0.12) * (ringR - 1);
        var fwdRightY = p.y + Math.sin(cta + 0.12) * (ringR - 1);
        ctx.beginPath();
        ctx.moveTo(fwdLeftX, fwdLeftY);
        ctx.lineTo(fwdTipX, fwdTipY);
        ctx.lineTo(fwdRightX, fwdRightY);
        ctx.stroke();
      } else {
        var cx1 = p.x + Math.cos(cta) * (ringR - tickLen);
        var cy1 = p.y + Math.sin(cta) * (ringR - tickLen);
        var cx2 = p.x + Math.cos(cta) * (ringR + tickLen);
        var cy2 = p.y + Math.sin(cta) * (ringR + tickLen);
        ctx.beginPath();
        ctx.moveTo(cx1, cy1);
        ctx.lineTo(cx2, cy2);
        ctx.stroke();
      }
    }

    // 3. Directional Proximity Threat Wedges (Sorted Nearest & Boss Priority < 320px)
    if (G.enemies && G.enemies.length > 0){
      var nearHostiles = [];
      for (var eni = 0; eni < G.enemies.length; eni++){
        var envObj = G.enemies[eni];
        if (!envObj || envObj.hp <= 0) continue;
        var endx = envObj.x - p.x;
        var endy = envObj.y - p.y;
        var endist = Math.hypot(endx, endy);
        var maxAlertDist = envObj.isBoss ? 500 : 320;
        if (endist < maxAlertDist){
          nearHostiles.push({ obj: envObj, dist: endist, dx: endx, dy: endy, isBoss: !!envObj.isBoss });
        }
      }
      if (nearHostiles.length > 0){
        nearHostiles.sort(function(a, b){
          if (a.isBoss && !b.isBoss) return -1;
          if (!a.isBoss && b.isBoss) return 1;
          return a.dist - b.dist;
        });
        var alertMax = Math.min(4, nearHostiles.length);
        for (var thi = 0; thi < alertMax; thi++){
          var th = nearHostiles[thi];
          var threatAng = Math.atan2(th.dy, th.dx);
          var threatIntensity = 1 - (th.dist / 320);
          ctx.strokeStyle = th.isBoss ? '#ff0055' : 'rgba(255, 100, 100, ' + (0.45 + threatIntensity * 0.5) + ')';
          ctx.lineWidth = th.isBoss ? 2.8 : 1.8;
          ctx.beginPath();
          ctx.arc(p.x, p.y, ringR + 3, threatAng - 0.22, threatAng + 0.22);
          ctx.stroke();
        }
      }
    }

    // 4. Critical Low-Hull Rotating Chevron Alert Brackets
    if (isLowHull){
      for (var hti = 0; hti < 3; hti++){
        var hta = G.t * 4 + hti * (TAU / 3);
        ctx.beginPath();
        ctx.arc(p.x, p.y, ringR + 5, hta - 0.25, hta + 0.25);
        ctx.strokeStyle = 'rgba(255, 77, 109, ' + (warnPulse * 1.2) + ')';
        ctx.lineWidth = 2.2;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /* god mode divine aura */
  if (p.godMode){
    ctx.save();
    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 16;
    ctx.shadowColor = '#ffe066';
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 2.1, 0, TAU);
    ctx.stroke();
    for (var gt = 0; gt < 4; gt++){
      var ga = (t * 3.5) + gt * (TAU / 4);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(p.x + Math.cos(ga) * r * 2.1 - 2, p.y + Math.sin(ga) * r * 2.1 - 2, 4, 4);
    }
    ctx.restore();
  }

  /* Victory Celebratory Aura & Champion Hex-Crown */
  if (G.state === 'victory'){
    ctx.save();
    var vt = G.victoryTimer || 0;
    var crownR = r * 2.5;
    var crownRot = vt * 2.2;
    ctx.strokeStyle = '#3ddc97';
    ctx.lineWidth = 2.2;
    ctx.shadowColor = '#3ddc97';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    for (var hi = 0; hi < 6; hi++){
      var ha = crownRot + hi * (TAU / 6);
      var hx = p.x + Math.cos(ha) * crownR;
      var hy = p.y + Math.sin(ha) * crownR;
      if (hi === 0) ctx.moveTo(hx, hy);
      else ctx.lineTo(hx, hy);
    }
    ctx.closePath();
    ctx.stroke();

    for (var gi = 0; gi < 6; gi++){
      var ga = crownRot + gi * (TAU / 6);
      var gx = p.x + Math.cos(ga) * crownR;
      var gy = p.y + Math.sin(ga) * crownR;
      var gCol = (gi % 2 === 0 ? '#3ddc97' : '#ffe066');
      ctx.fillStyle = gCol;
      ctx.shadowColor = gCol;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(gx, gy, 4.5, 0, TAU);
      ctx.fill();
    }

    ctx.strokeStyle = 'rgba(255, 224, 102, 0.65)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 1.85, 0, TAU);
    ctx.stroke();

    var textBob = Math.sin(vt * 6) * 4;
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px ui-monospace,monospace';
    ctx.fillStyle = '#3ddc97';
    ctx.shadowColor = '#3ddc97';
    ctx.shadowBlur = 12;
    ctx.fillText('VICTORIOUS', p.x, p.y - r * 2.5 - 14 + textBob);

    ctx.font = 'bold 9px ui-monospace,monospace';
    ctx.fillStyle = '#ffe066';
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 8;
    ctx.fillText('APEX OVERDRIVE', p.x, p.y - r * 2.5 - 2 + textBob);

    ctx.restore();
  }
}

function drawCosmicBackground(cx, cy, inWorld){
  var vw = inWorld ? (W / ZOOM) : W;
  var vh = inWorld ? (H / ZOOM) : H;
  var minX = inWorld ? (cx - vw/2 - 250) : 0;
  var maxX = inWorld ? (cx + vw/2 + 250) : W;
  var minY = inWorld ? (cy - vh/2 - 250) : 0;
  var maxY = inWorld ? (cy + vh/2 + 250) : H;

  // 1. Fixed Cosmic Nebulae Gas Blooms (Viewport culled)
  var activeNebulae = (G && G.sector === 2 && typeof SECTOR2_NEBULAE !== 'undefined') ? SECTOR2_NEBULAE : NEBULAE;
  for (var ni = 0; ni < activeNebulae.length; ni++){
    var neb = activeNebulae[ni];
    var nx = inWorld ? neb.x : (neb.x / ARENA) * W;
    var ny = inWorld ? neb.y : (neb.y / ARENA) * H;
    var nr = inWorld ? neb.r : neb.r * (W / ARENA) * 1.8;

    if (nx + nr < minX || nx - nr > maxX || ny + nr < minY || ny - nr > maxY) continue;

    var pulse = Math.sin((G ? G.t : 0) * 0.4 + ni * 1.5) * 0.02;
    var g = ctx.createRadialGradient(nx, ny, Math.max(1, nr * 0.08), nx, ny, nr);
    g.addColorStop(0, neb.col + (0.15 + pulse) + ')');
    g.addColorStop(0.45, neb.col + (0.07 + pulse * 0.5) + ')');
    g.addColorStop(0.8, neb.col + (0.02 + pulse * 0.2) + ')');
    g.addColorStop(1, neb.col + '0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(nx, ny, nr, 0, TAU);
    ctx.fill();
  }

  // 2. Distant Twinkling Stellar Field (Viewport culled)
  for (var si = 0; si < STARS.length; si++){
    var st = STARS[si];
    var sx = inWorld ? st.x : (st.x / ARENA) * W;
    var sy = inWorld ? st.y : (st.y / ARENA) * H;
    if (sx < minX || sx > maxX || sy < minY || sy > maxY) continue;

    var twinkle = Math.sin((G ? G.t : 0) * st.spd + si * 2.1) * 0.18;
    var alpha = Math.max(0.12, Math.min(1, st.baseA + twinkle));
    ctx.fillStyle = st.col;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(sx, sy, st.r, 0, TAU);
    ctx.fill();

    // 4-point cross flare on brightest stars
    if (st.cross && alpha > 0.45){
      ctx.strokeStyle = st.col;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(sx - st.r * 3.2, sy); ctx.lineTo(sx + st.r * 3.2, sy);
      ctx.moveTo(sx, sy - st.r * 3.2); ctx.lineTo(sx, sy + st.r * 3.2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function drawGrid(cx, cy, inWorld){
  var minorStep = 75;
  var majorStep = 375;
  var w = inWorld ? (W / ZOOM) : W;
  var h = inWorld ? (H / ZOOM) : H;
  var x0 = inWorld ? Math.floor((cx - w/2)/minorStep)*minorStep : Math.floor(cx/minorStep)*minorStep;
  var y0 = inWorld ? Math.floor((cy - h/2)/minorStep)*minorStep : Math.floor(cy/minorStep)*minorStep;
  var x1 = inWorld ? (cx + w/2 + minorStep) : (cx + w + minorStep);
  var y1 = inWorld ? (cy + h/2 + minorStep) : (cy + h + minorStep);

  // Subtle breathing grid luminescence
  var pulseAlpha = 0.038 + Math.sin((G ? G.t : 0) * 1.4) * 0.012;

  // 1. Minor grid lines (Tactical spatial reference)
  ctx.strokeStyle = 'rgba(70,220,255,' + pulseAlpha + ')';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = x0; x < x1; x += minorStep){ ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
  for (var y = y0; y < y1; y += minorStep){ ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();

  // 2. Major grid lines & Sector badges (In-world tactical navigation)
  if (inWorld){
    var majX0 = Math.floor((cx - w/2)/majorStep)*majorStep;
    var majY0 = Math.floor((cy - h/2)/majorStep)*majorStep;
    var majX1 = cx + w/2 + majorStep;
    var majY1 = cy + h/2 + majorStep;

    ctx.strokeStyle = 'rgba(70,220,255,' + (pulseAlpha * 2.2) + ')';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (var mx = majX0; mx < majX1; mx += majorStep){ ctx.moveTo(mx, y0); ctx.lineTo(mx, y1); }
    for (var my = majY0; my < majY1; my += majorStep){ ctx.moveTo(x0, my); ctx.lineTo(x1, my); }
    ctx.stroke();

    // Sector junction ticks & holographic coordinates
    ctx.fillStyle = 'rgba(70, 220, 255, ' + (pulseAlpha * 3.4) + ')';
    ctx.font = '9px ui-monospace,monospace';
    ctx.textAlign = 'left';
    var tickSize = 7;
    for (var jx = majX0; jx < majX1; jx += majorStep){
      for (var jy = majY0; jy < majY1; jy += majorStep){
        // Corner crosshair brackets at major intersections
        ctx.strokeStyle = 'rgba(70, 220, 255, ' + (pulseAlpha * 3.8) + ')';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(jx - tickSize, jy); ctx.lineTo(jx + tickSize, jy);
        ctx.moveTo(jx, jy - tickSize); ctx.lineTo(jx, jy + tickSize);
        ctx.stroke();

        // Sector coordinate badge (e.g. [SEC 04-06])
        if (jx >= 0 && jx <= ARENA && jy >= 0 && jy <= ARENA){
          var secX = ('0' + Math.floor(jx / majorStep)).slice(-2);
          var secY = ('0' + Math.floor(jy / majorStep)).slice(-2);
          ctx.fillText('SEC ' + secX + '-' + secY, jx + 6, jy - 5);
        }
      }
    }
  } else {
    // Title screen intersection dots
    ctx.fillStyle = 'rgba(70,220,255,' + (pulseAlpha * 2.2) + ')';
    for (var px = x0; px < x1; px += minorStep * 2){
      for (var py = y0; py < y1; py += minorStep * 2){
        ctx.fillRect(px - 1.5, py - 1.5, 3, 3);
      }
    }
  }
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, W, H);
  if (!G) return;
  if (G.state === 'title' || (G.state === 'godmode' && G.godModePrevState === 'title')){
    drawTitle();
    if (G.state === 'godmode') drawGodModeModal();
    return;
  }

  var p = G.player;
  var sx = (Math.random()-0.5) * G.shake;
  var sy = (Math.random()-0.5) * G.shake;

  ctx.save();
  ctx.translate(W/2 + sx, H/2 + sy);
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-G.camX, -G.camY);

  /* Deep Space Cosmic Nebulae & Stars */
  drawCosmicBackground(G.camX, G.camY, true);

  /* Tactical Grid */
  drawGrid(G.camX, G.camY, true);

  /* Map Textures: Asteroids, Cyber Conduits & Tech Decals */
  drawMapTextures(G.camX, G.camY);

  /* Interactive Map Features: Boost Rings, Wormholes, Salvage Pods & Crystalline Asteroids */
  if (typeof drawMapFeatures === 'function') drawMapFeatures(G.camX, G.camY);

  /* Cosmic Space Dust Motes / Sector 2 Bioluminescent Cellular Motes */
  var isSec2 = (G && G.sector === 2);
  for (var d = 0; d < G.dust.length; d++){
    var du = G.dust[d];
    var pulse = 0.75 + Math.sin(du.phase || 0) * 0.25;
    var alpha = (du.a || 0.2) * pulse;

    if (isSec2){
      // Drifting organic cellular motes with pulsating membrane and glowing nucleus
      var cellPulse = 1.0 + Math.sin((G ? G.t : 0) * 2.8 + du.x * 0.05) * 0.22;
      var cellCol = (d % 3 === 0) ? '#00f5d4' : ((d % 3 === 1) ? '#a7ff00' : '#bf55ec');

      ctx.globalAlpha = alpha * 0.28;
      ctx.strokeStyle = cellCol;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(du.x, du.y, du.s * 3.4 * cellPulse, 0, TAU);
      ctx.stroke();

      ctx.globalAlpha = alpha * 0.16;
      ctx.fillStyle = cellCol;
      ctx.beginPath();
      ctx.arc(du.x, du.y, du.s * 3.4 * cellPulse, 0, TAU);
      ctx.fill();

      ctx.globalAlpha = alpha * 0.85;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(du.x, du.y, Math.max(1, du.s * 0.85), 0, TAU);
      ctx.fill();
    } else {
      ctx.globalAlpha = alpha * 0.35;
      ctx.fillStyle = du.col || '#8fd8ff';
      ctx.beginPath();
      ctx.arc(du.x, du.y, du.s * 2.8, 0, TAU);
      ctx.fill();

      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(du.x, du.y, du.s, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  /* decals */
  for (var dc = 0; dc < G.decals.length; dc++){
    var de = G.decals[dc];
    ctx.globalAlpha = (de.life/de.max) * 0.22;
    ctx.beginPath(); ctx.arc(de.x, de.y, de.r, 0, TAU);
    ctx.fillStyle = de.col; ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* Solar Phoenix Thermite Hazard Pools & Electrified Pools */
  if (G.thermitePools && G.thermitePools.length > 0){
    for (var tpi = 0; tpi < G.thermitePools.length; tpi++){
      var tp = G.thermitePools[tpi];
      var tpAlpha = Math.min(1, tp.life / 0.8) * 0.75;
      var tpPulse = 1 + Math.sin(G.t * 8 + tp.x) * 0.06;
      var curR = tp.r * tpPulse;
      var isAcid = !!tp.isAcid;
      var isElec = !!tp.isElectric;
      var mainCol = isAcid ? '#a7ff00' : (isElec ? '#35f0ff' : '#ff5400');
      var edgeCol = isAcid ? '#d4ff00' : (isElec ? '#ffffff' : '#ffe066');
      var rbgVal = isAcid ? '167, 255, 0' : (isElec ? '53, 240, 255' : '255, 84, 0');

      ctx.beginPath();
      ctx.arc(tp.x, tp.y, curR * 1.25, 0, TAU);
      ctx.fillStyle = 'rgba(' + rbgVal + ', ' + (tpAlpha * 0.16) + ')';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(tp.x, tp.y, curR, 0, TAU);
      ctx.fillStyle = 'rgba(' + rbgVal + ', ' + (tpAlpha * 0.45) + ')';
      ctx.fill();
      ctx.strokeStyle = edgeCol;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(tp.x, tp.y, curR * 0.45, 0, TAU);
      ctx.fillStyle = 'rgba(255, 255, 255, ' + (tpAlpha * 0.5) + ')';
      ctx.fill();

      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.lineDashOffset = G.t * 18;
      ctx.strokeStyle = 'rgba(' + rbgVal + ', ' + (tpAlpha * 0.6) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, curR + 6, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* Volt Goliath Tesla Storm Ground Markers & Orbital Strikes */
  if (G.teslaMarkers && G.teslaMarkers.length > 0){
    for (var tmi = 0; tmi < G.teslaMarkers.length; tmi++){
      var tm = G.teslaMarkers[tmi];
      var tmAlpha = Math.max(0, Math.min(1, tm.t > 0 ? (1 - tm.t + 0.3) : 1));
      ctx.save();
      ctx.beginPath();
      ctx.arc(tm.x, tm.y, tm.r, 0, TAU);
      ctx.fillStyle = 'rgba(53, 240, 255, ' + (tmAlpha * 0.22) + ')';
      ctx.fill();
      ctx.strokeStyle = tm.fired ? '#ffffff' : '#35f0ff';
      ctx.lineWidth = tm.fired ? 3.5 : 2;
      ctx.stroke();

      ctx.setLineDash([8, 8]);
      ctx.lineDashOffset = G.t * 30;
      ctx.beginPath();
      ctx.arc(tm.x, tm.y, tm.r * 0.65, 0, TAU);
      ctx.stroke();

      if (tm.fired && tm.t < 0){
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(53, 240, 255, 0.4)';
        ctx.lineWidth = 32;
        ctx.beginPath();
        ctx.moveTo(tm.x, tm.y - 1200);
        ctx.lineTo(tm.x, tm.y);
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 12;
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  /* Nexus Overlord Supermassive Gravitational Singularity */
  if (G.blackHoles && G.blackHoles.length > 0){
    for (var bhi = 0; bhi < G.blackHoles.length; bhi++){
      var bh = G.blackHoles[bhi];
      var bAlpha = Math.min(1, bh.life / 0.8);
      var bPulse = 1 + Math.sin(G.t * 12) * 0.08;
      ctx.save();
      ctx.beginPath();
      ctx.arc(bh.x, bh.y, bh.r * 1.5 * bPulse, 0, TAU);
      ctx.fillStyle = 'rgba(123, 44, 191, ' + (bAlpha * 0.25) + ')';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(bh.x, bh.y, bh.r * bPulse, 0, TAU);
      ctx.fillStyle = 'rgba(255, 77, 109, ' + (bAlpha * 0.45) + ')';
      ctx.fill();

      ctx.strokeStyle = '#e0aaff';
      ctx.lineWidth = 2.5;
      for (var spi = 0; spi < 4; spi++){
        var spa = -G.t * 6 + spi * (TAU / 4);
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, bh.r * 0.85, spa, spa + 1.2);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(bh.x, bh.y, bh.r * 0.38, 0, TAU);
      ctx.fillStyle = '#000000';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
    }
  }

  /* Solar Phoenix Supernova Flare Beams (Boss 5 Active Skill) */
  if (G.boss && G.boss.bossType === 'inferno' && (G.boss.skillPhase === 'windup' || G.boss.skillPhase === 'active')){
    var sb = G.boss;
    ctx.save();
    if (sb.skillPhase === 'windup'){
      ctx.setLineDash([8, 8]);
      ctx.lineDashOffset = -G.t * 35;
      ctx.strokeStyle = 'rgba(255, 84, 0, 0.75)';
      ctx.lineWidth = 2;
      for (var bi = 0; bi < 4; bi++){
        var ba = sb.beamAng + bi * (TAU / 4);
        ctx.beginPath();
        ctx.moveTo(sb.x, sb.y);
        ctx.lineTo(sb.x + Math.cos(ba) * 850, sb.y + Math.sin(ba) * 850);
        ctx.stroke();
      }
    } else if (sb.skillPhase === 'active'){
      for (var bi = 0; bi < 4; bi++){
        var ba = sb.beamAng + bi * (TAU / 4);
        var bx2 = sb.x + Math.cos(ba) * 850;
        var by2 = sb.y + Math.sin(ba) * 850;

        ctx.strokeStyle = 'rgba(255, 84, 0, 0.45)';
        ctx.lineWidth = 36 + Math.sin(G.t * 22 + bi) * 6;
        ctx.beginPath();
        ctx.moveTo(sb.x, sb.y);
        ctx.lineTo(bx2, by2);
        ctx.stroke();

        ctx.strokeStyle = '#ffe066';
        ctx.lineWidth = 18;
        ctx.beginPath();
        ctx.moveTo(sb.x, sb.y);
        ctx.lineTo(bx2, by2);
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(sb.x, sb.y);
        ctx.lineTo(bx2, by2);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(sb.x, sb.y, sb.r * 0.75, 0, TAU);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.fill();
    }
    ctx.restore();
  }

  /* High-Detail Arena Perimeter Containment Field / Sector 2 Living Bioluminescent Tendril Borders */
  if (G && G.sector === 2){
    ctx.save();
    var tTime = G.t * 2.2;
    ctx.strokeStyle = 'rgba(0, 245, 212, 0.18)';
    ctx.lineWidth = 18;
    ctx.strokeRect(0, 0, ARENA, ARENA);

    ctx.strokeStyle = 'rgba(155, 93, 229, 0.45)';
    ctx.lineWidth = 3.0;
    ctx.strokeRect(0, 0, ARENA, ARENA);

    var stepT = 75;
    ctx.lineWidth = 1.8;
    var vh = (H / ZOOM), vw = (W / ZOOM);
    var vMinX = G.camX - vw * 0.5 - 60;
    var vMaxX = G.camX + vw * 0.5 + 60;
    var vMinY = G.camY - vh * 0.5 - 60;
    var vMaxY = G.camY + vh * 0.5 + 60;

    var txStart = Math.max(0, Math.floor(vMinX / stepT) * stepT);
    var txEnd = Math.min(ARENA, Math.ceil(vMaxX / stepT) * stepT);
    var tyStart = Math.max(0, Math.floor(vMinY / stepT) * stepT);
    var tyEnd = Math.min(ARENA, Math.ceil(vMaxY / stepT) * stepT);

    if (vMinY <= 50){
      for (var tx = txStart; tx <= txEnd; tx += stepT){
        var tPhase = tx * 0.012 + tTime;
        var tLenTop = 26 + Math.sin(tPhase) * 16;
        var tWaveTop = Math.cos(tPhase * 1.3) * 14;
        var tCol = (tx % 150 === 0) ? '#00f5d4' : '#a7ff00';

        ctx.strokeStyle = tCol;
        ctx.beginPath();
        ctx.moveTo(tx, 0);
        ctx.quadraticCurveTo(tx + tWaveTop, tLenTop * 0.5, tx + tWaveTop * 0.5, tLenTop);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(tx + tWaveTop * 0.5, tLenTop, 2.2, 0, TAU);
        ctx.fill();
      }
    }

    if (vMaxY >= ARENA - 50){
      for (var tx = txStart; tx <= txEnd; tx += stepT){
        var tPhase = tx * 0.012 + tTime;
        var tLenBot = 26 + Math.sin(tPhase + 1.8) * 16;
        var tWaveBot = Math.cos(tPhase * 1.1 + 1.2) * 14;
        var tCol = (tx % 150 === 0) ? '#00f5d4' : '#a7ff00';

        ctx.strokeStyle = tCol;
        ctx.beginPath();
        ctx.moveTo(tx, ARENA);
        ctx.quadraticCurveTo(tx + tWaveBot, ARENA - tLenBot * 0.5, tx + tWaveBot * 0.5, ARENA - tLenBot);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(tx + tWaveBot * 0.5, ARENA - tLenBot, 2.2, 0, TAU);
        ctx.fill();
      }
    }

    if (vMinX <= 50){
      for (var ty = tyStart; ty <= tyEnd; ty += stepT){
        var tPhaseY = ty * 0.012 + tTime + 0.8;
        var tLenLeft = 26 + Math.sin(tPhaseY) * 16;
        var tWaveLeft = Math.cos(tPhaseY * 1.3) * 14;
        var tColY = (ty % 150 === 0) ? '#9b5de5' : '#00f5d4';

        ctx.strokeStyle = tColY;
        ctx.beginPath();
        ctx.moveTo(0, ty);
        ctx.quadraticCurveTo(tLenLeft * 0.5, ty + tWaveLeft, tLenLeft, ty + tWaveLeft * 0.5);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(tLenLeft, ty + tWaveLeft * 0.5, 2.2, 0, TAU);
        ctx.fill();
      }
    }

    if (vMaxX >= ARENA - 50){
      for (var ty = tyStart; ty <= tyEnd; ty += stepT){
        var tPhaseY = ty * 0.012 + tTime + 0.8;
        var tLenRight = 26 + Math.sin(tPhaseY + 2.1) * 16;
        var tWaveRight = Math.cos(tPhaseY * 1.2 + 0.5) * 14;
        var tColY = (ty % 150 === 0) ? '#9b5de5' : '#00f5d4';

        ctx.strokeStyle = tColY;
        ctx.beginPath();
        ctx.moveTo(ARENA, ty);
        ctx.quadraticCurveTo(ARENA - tLenRight * 0.5, ty + tWaveRight, ARENA - tLenRight, ty + tWaveRight * 0.5);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ARENA - tLenRight, ty + tWaveRight * 0.5, 2.2, 0, TAU);
        ctx.fill();
      }
    }

    ctx.strokeStyle = 'rgba(0, 245, 212, 0.75)';
    ctx.lineWidth = 2.2;
    ctx.setLineDash([22, 28]);
    ctx.lineDashOffset = -tTime * 38;
    ctx.strokeRect(0, 0, ARENA, ARENA);
    ctx.setLineDash([]);
    ctx.restore();
  } else {
    // 1. Soft outer containment halo
    ctx.strokeStyle = 'rgba(53, 240, 255, 0.08)';
    ctx.lineWidth = 14;
    ctx.strokeRect(0, 0, ARENA, ARENA);

    // 2. Base structural perimeter beam
    ctx.strokeStyle = 'rgba(53, 240, 255, 0.32)';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(0, 0, ARENA, ARENA);

    // 3. Traveling dashed energy pulse runner
    ctx.save();
    ctx.strokeStyle = 'rgba(53, 240, 255, 0.65)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([18, 22]);
    ctx.lineDashOffset = -G.t * 32;
    ctx.strokeRect(0, 0, ARENA, ARENA);
    ctx.setLineDash([]);
    ctx.restore();
  }

  // 4. Heavy reinforced corner tech brackets with double chevron accents
  var bl = 105;
  var corners = [[0,0,1,1],[ARENA,0,-1,1],[0,ARENA,1,-1],[ARENA,ARENA,-1,-1]];
  for (var ci = 0; ci < 4; ci++){
    var c = corners[ci];
    // Main bracket
    ctx.strokeStyle = 'rgba(53, 240, 255, 0.85)';
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(c[0] + c[2]*bl, c[1]);
    ctx.lineTo(c[0], c[1]);
    ctx.lineTo(c[0], c[1] + c[3]*bl);
    ctx.stroke();

    // Inner bracket accent
    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(c[0] + c[2]*(bl*0.55), c[1] + c[3]*12);
    ctx.lineTo(c[0] + c[2]*12, c[1] + c[3]*12);
    ctx.lineTo(c[0] + c[2]*12, c[1] + c[3]*(bl*0.55));
    ctx.stroke();

    // Corner anchor nodule
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(c[0] - 3.5, c[1] - 3.5, 7, 7);
  }

  // 5. Hazard perimeter chevron markings every 350px along all 4 walls
  ctx.fillStyle = 'rgba(53, 240, 255, 0.22)';
  ctx.font = 'bold 9px ui-monospace,monospace';
  ctx.textAlign = 'center';
  var markSpacing = 350;
  for (var mPos = markSpacing; mPos < ARENA; mPos += markSpacing){
    ctx.fillText('// SECTOR BOUNDARY //', mPos, -10);
    ctx.fillText('// SECTOR BOUNDARY //', mPos, ARENA + 18);
  }
  ctx.save();
  for (var mPos = markSpacing; mPos < ARENA; mPos += markSpacing){
    ctx.save();
    ctx.translate(-12, mPos); ctx.rotate(-Math.PI/2);
    ctx.fillText('// SECTOR BOUNDARY //', 0, 0);
    ctx.restore();

    ctx.save();
    ctx.translate(ARENA + 18, mPos); ctx.rotate(Math.PI/2);
    ctx.fillText('// SECTOR BOUNDARY //', 0, 0);
    ctx.restore();
  }
  ctx.restore();

  // 6. Near-boundary reactive energy warning arc when player is close (< 240px)
  var distLeft = p.x, distRight = ARENA - p.x;
  var distTop = p.y, distBottom = ARENA - p.y;
  var minDist = Math.min(distLeft, distRight, distTop, distBottom);
  if (minDist < 240){
    var warnAlpha = (1 - minDist / 240) * 0.45;
    ctx.strokeStyle = 'rgba(255, 77, 109, ' + warnAlpha + ')';
    ctx.lineWidth = 6;
    ctx.beginPath();
    if (distLeft === minDist){ ctx.moveTo(0, p.y - 140); ctx.lineTo(0, p.y + 140); }
    else if (distRight === minDist){ ctx.moveTo(ARENA, p.y - 140); ctx.lineTo(ARENA, p.y + 140); }
    else if (distTop === minDist){ ctx.moveTo(p.x - 140, 0); ctx.lineTo(p.x + 140, 0); }
    else { ctx.moveTo(p.x - 140, ARENA); ctx.lineTo(p.x + 140, ARENA); }
    ctx.stroke();
  }

  /* shockwaves */
  ctx.globalCompositeOperation = 'lighter';
  for (var w = 0; w < G.waves.length; w++){
    var wv = G.waves[w];
    var wAlpha = Math.max(0, wv.life);
    ctx.globalAlpha = wAlpha * 0.65;
    ctx.beginPath(); ctx.arc(wv.x, wv.y, wv.r, 0, TAU);
    ctx.strokeStyle = wv.col; ctx.lineWidth = wv.w * Math.max(0.2, wv.life);
    ctx.stroke();

    // High-energy white core ring
    if (wv.r > 10){
      ctx.beginPath(); ctx.arc(wv.x, wv.y, Math.max(1, wv.r - 4), 0, TAU);
      ctx.strokeStyle = 'rgba(255, 255, 255, ' + (wAlpha * 0.75) + ')';
      ctx.lineWidth = Math.max(1, wv.w * 0.45 * wv.life);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  /* viewport culling bounds */
  var vPad = 140;
  var vMinX = G.camX - W / 2 - vPad;
  var vMaxX = G.camX + W / 2 + vPad;
  var vMinY = G.camY - H / 2 - vPad;
  var vMaxY = G.camY + H / 2 + vPad;

  /* ghosts */
  for (var gh = 0; gh < G.ghosts.length; gh++){
    var go = G.ghosts[gh];
    var ghAlpha = Math.max(0, go.life) * 0.4;
    ctx.globalAlpha = ghAlpha;
    ctx.save();
    ctx.translate(go.x, go.y); ctx.rotate(go.ang);
    ctx.beginPath();
    ctx.moveTo(p.r*1.45, 0); ctx.lineTo(-p.r*0.2, -p.r*0.62);
    ctx.lineTo(-p.r*0.85, 0); ctx.lineTo(-p.r*0.2, p.r*0.62);
    ctx.closePath();
    ctx.fillStyle = 'rgba(53, 240, 255, 0.45)'; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke();

    // Ghost cockpit core
    ctx.beginPath(); ctx.arc(p.r*0.25, 0, p.r*0.18, 0, TAU);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  /* orbs */
  for (var o = 0; o < G.orbs.length; o++){
    var ob = G.orbs[o];
    if (ob.x < vMinX || ob.x > vMaxX || ob.y < vMinY || ob.y > vMaxY) continue;
    var bob = Math.sin(G.t*6 + ob.x*0.1) * 1.5;
    var ox = ob.x, oy = ob.y + bob;

    // Glowing plasma stream trail behind fast-attracted orbs

    } else if (k === 'void_needle'){
