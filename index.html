        ctx.moveTo(h*0.6, pi * h*0.35); ctx.lineTo(h*0.9, pi * h*0.35);
        ctx.stroke();
      }
      break;
    case 'flame':
      ctx.beginPath();
      ctx.moveTo(0, -h*0.85);
      ctx.quadraticCurveTo(h*0.6, -h*0.2, h*0.4, h*0.5);
      ctx.quadraticCurveTo(0, h*0.85, -h*0.4, h*0.5);
      ctx.quadraticCurveTo(-h*0.6, -h*0.2, 0, -h*0.85);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, -h*0.3);
      ctx.quadraticCurveTo(h*0.25, 0, 0, h*0.55);
      ctx.quadraticCurveTo(-h*0.25, 0, 0, -h*0.3);
      ctx.closePath();
      ctx.fillStyle = '#ffffff'; ctx.fill();
      break;
    case 'play':
      ctx.beginPath();
      ctx.moveTo(-h*0.4, -h*0.7); ctx.lineTo(h*0.7, 0); ctx.lineTo(-h*0.4, h*0.7);
      ctx.closePath(); ctx.fill();
      break;
    case 'restart':
      ctx.beginPath();
      ctx.arc(0, 0, h*0.65, -Math.PI*0.8, Math.PI*0.7);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(h*0.35, -h*0.7); ctx.lineTo(h*0.7, -h*0.55); ctx.lineTo(h*0.5, -h*0.2);
      ctx.closePath(); ctx.fill();
      break;
    case 'close':
      ctx.beginPath();
      ctx.moveTo(-h*0.6, -h*0.6); ctx.lineTo(h*0.6, h*0.6);
      ctx.moveTo(h*0.6, -h*0.6); ctx.lineTo(-h*0.6, h*0.6);
      ctx.stroke();
      break;
    case 'eject':
      ctx.beginPath();
      ctx.moveTo(0, -h*0.7); ctx.lineTo(h*0.6, h*0.2); ctx.lineTo(-h*0.6, h*0.2);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(-h*0.6, h*0.45, h*1.2, h*0.25);
      break;
    case 'lock':
      ctx.strokeRect(-h*0.5, -h*0.1, h, h*0.8);
      ctx.beginPath(); ctx.arc(0, -h*0.1, h*0.35, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, h*0.3, h*0.12, 0, TAU); ctx.fill();
      break;
    case 'reticle':
      ctx.beginPath(); ctx.arc(0, 0, h*0.75, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, h*0.25, 0, TAU); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, -h); ctx.lineTo(0, -h*0.35);
      ctx.moveTo(0, h*0.35); ctx.lineTo(0, h);
      ctx.moveTo(-h, 0); ctx.lineTo(-h*0.35, 0);
      ctx.moveTo(h*0.35, 0); ctx.lineTo(h, 0);
      ctx.stroke();
      break;
    case 'manual_aim':
      ctx.beginPath();
      ctx.moveTo(-h*0.7, -h*0.7); ctx.lineTo(-h*0.2, -h*0.2);
      ctx.moveTo(h*0.7, -h*0.7); ctx.lineTo(h*0.2, -h*0.2);
      ctx.moveTo(-h*0.7, h*0.7); ctx.lineTo(-h*0.2, h*0.2);
      ctx.moveTo(h*0.7, h*0.7); ctx.lineTo(h*0.2, h*0.2);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, h*0.3, 0, TAU); ctx.stroke();
      break;
    case 'egg':
      // Sculpted biomechanical egg contour
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.95);
      ctx.bezierCurveTo(h * 0.72, -h * 0.65, h * 0.92, h * 0.35, 0, h * 0.95);
      ctx.bezierCurveTo(-h * 0.92, h * 0.35, -h * 0.72, -h * 0.65, 0, -h * 0.95);
      ctx.closePath();
      ctx.stroke();
      // Lateral carapace plate divide seams
      ctx.beginPath();
      ctx.moveTo(-h * 0.75, -h * 0.1);
      ctx.quadraticCurveTo(-h * 0.2, -h * 0.15, -h * 0.1, -h * 0.05);
      ctx.moveTo(h * 0.75, -h * 0.1);
      ctx.quadraticCurveTo(h * 0.2, -h * 0.15, h * 0.1, -h * 0.05);
      ctx.stroke();
      // Glowing jagged fracture chasm with branch
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.75);
      ctx.lineTo(-h * 0.22, -h * 0.45);
      ctx.lineTo(h * 0.18, -h * 0.15);
      ctx.lineTo(-h * 0.15, h * 0.20);
      ctx.lineTo(h * 0.22, h * 0.55);
      ctx.lineTo(0, h * 0.82);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(h * 0.18, -h * 0.15);
      ctx.lineTo(h * 0.55, -h * 0.05);
      ctx.moveTo(-h * 0.15, h * 0.20);
      ctx.lineTo(-h * 0.50, h * 0.32);
      ctx.stroke();
      break;
    case 'home':
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.9);
      ctx.lineTo(h * 0.8, -h * 0.15);
      ctx.lineTo(h * 0.8, h * 0.85);
      ctx.lineTo(h * 0.28, h * 0.85);
      ctx.lineTo(h * 0.28, h * 0.25);
      ctx.lineTo(-h * 0.28, h * 0.25);
      ctx.lineTo(-h * 0.28, h * 0.85);
      ctx.lineTo(-h * 0.8, h * 0.85);
      ctx.lineTo(-h * 0.8, -h * 0.15);
      ctx.closePath();
      ctx.stroke();
      break;
    case 'target':
      ctx.beginPath(); ctx.arc(0, 0, h * 0.85, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, h * 0.45, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, h * 0.15, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, -h); ctx.lineTo(0, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-h, 0); ctx.lineTo(h, 0); ctx.stroke();
      break;
    case 'audio':
    case 'speaker':
      ctx.beginPath();
      ctx.moveTo(-h*0.5, -h*0.35);
      ctx.lineTo(-h*0.1, -h*0.35);
      ctx.lineTo(h*0.3, -h*0.75);
      ctx.lineTo(h*0.3, h*0.75);
      ctx.lineTo(-h*0.1, h*0.35);
      ctx.lineTo(-h*0.5, h*0.35);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(h*0.3, 0, h*0.5, -Math.PI*0.3, Math.PI*0.3);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(h*0.3, 0, h*0.8, -Math.PI*0.35, Math.PI*0.35);
      ctx.stroke();
      break;
    case 'mute':
      ctx.beginPath();
      ctx.moveTo(-h*0.5, -h*0.35);
      ctx.lineTo(-h*0.1, -h*0.35);
      ctx.lineTo(h*0.3, -h*0.75);
      ctx.lineTo(h*0.3, h*0.75);
      ctx.lineTo(-h*0.1, h*0.35);
      ctx.lineTo(-h*0.5, h*0.35);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(h*0.45, -h*0.35); ctx.lineTo(h*0.85, h*0.35);
      ctx.moveTo(h*0.85, -h*0.35); ctx.lineTo(h*0.45, h*0.35);
      ctx.stroke();
      break;
  }
  ctx.restore();
}


function drawTitanEgg(b){
  var p = G.player;
  var bx = b.x, by = b.y;
  var br = b.barrierRadius || b.barrierR || 210;
  var t = b.phaseT || 0;
  var rot = b.caliperRot || 0;
  var curW = Math.min(5, (G && G.wave) || 1);
  var waveK = (G && G.waveKills) || 0;
  var waveT = (G && G.waveTotal) || 20;
  var waveFrac = waveT > 0 ? clamp(waveK / waveT, 0, 1) : 0;
  var progressFrac = 0;
  if (typeof b.crackProgress === 'number'){
    progressFrac = clamp(b.crackProgress, 0, 1);
  } else if (typeof b.progressFrac === 'number'){
    progressFrac = clamp(b.progressFrac, 0, 1);
  } else if (!b.dormant || (G && (G.wave >= 6 || (G.wave === 5 && G.waveState === 'cleared')))){
    progressFrac = 1.0;
  } else if (p && p.lvl >= BOSS_UNLOCK_LEVEL && (!G || G.mode !== 'training')){
    progressFrac = 1.0;
  } else {
    progressFrac = clamp(((curW - 1) + waveFrac) / 5, 0, 0.98);
  }
  var shellIntegrity = Math.max(0, 1 - progressFrac);
  var heartFreq = 1.2 + curW * 0.55;
  var heartPulse = Math.pow(Math.max(0, Math.sin(G.t * heartFreq)), 8);
  var impactFlash = b.crackImpactFlash || 0;
  var crackPulse = b.crackPulse || (G.t * 2.0);
  var lastHitAng = (typeof b.lastHitAng === 'number') ? b.lastHitAng : 0;

  ctx.save();

  // 1. Eight Perimeter Bio-Mechanical Charging Pylons & Conduits
  var pylonCount = 8;
  var pylonDist = br + 75;
  for (var pi = 0; pi < pylonCount; pi++){
    var pa = pi * (TAU / pylonCount) + Math.sin(t * 0.35 + pi) * 0.015;
    var px = bx + Math.cos(pa) * pylonDist;
    var py = by + Math.sin(pa) * pylonDist;
    var rimX = bx + Math.cos(pa) * (br - 8);
    var rimY = by + Math.sin(pa) * (br - 8);

    // Directional bullet impact resonance on this pylon
    var pylonAngDiff = Math.abs(Math.atan2(Math.sin(pa - lastHitAng), Math.cos(pa - lastHitAng)));
    var pylonProximity = Math.max(0, 1 - pylonAngDiff / (Math.PI * 0.55));
    var pylonHitSurge = impactFlash * Math.pow(pylonProximity, 1.6);

    // Multi-tier dynamic high-voltage plasma conduit
    var jitter1 = Math.sin(t * 22 + pi * 4) * (5 + progressFrac * 6 + pylonHitSurge * 10);
    var jitter2 = Math.cos(t * 26 + pi * 5) * (5 + progressFrac * 6 + pylonHitSurge * 10);
    var m1x = px * 0.66 + rimX * 0.34 + Math.cos(pa + Math.PI / 2) * jitter1;
    var m1y = py * 0.66 + rimY * 0.34 + Math.sin(pa + Math.PI / 2) * jitter1;
    var m2x = px * 0.34 + rimX * 0.66 + Math.cos(pa + Math.PI / 2) * jitter2;
    var m2y = py * 0.34 + rimY * 0.66 + Math.sin(pa + Math.PI / 2) * jitter2;

    // Conduit Glow
    var conduitBaseCol = progressFrac > 0.75 ? 'rgba(255, 77, 109, ' : (progressFrac > 0.45 ? 'rgba(255, 224, 102, ' : 'rgba(53, 240, 255, ');
    ctx.strokeStyle = pylonHitSurge > 0.2 ? 'rgba(255, 255, 255, 0.75)' : (conduitBaseCol + (0.30 + pylonHitSurge * 0.45) + ')');
    ctx.lineWidth = 4.5 + pylonHitSurge * 4;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(m1x, m1y);
    ctx.lineTo(m2x, m2y);
    ctx.lineTo(rimX, rimY);
    ctx.stroke();

    // Conduit Electric Filament
    ctx.strokeStyle = pylonHitSurge > 0.4 ? '#ffffff' : (progressFrac > 0.75 ? '#ff4d6d' : (progressFrac > 0.45 ? '#ffe066' : '#35f0ff'));
    ctx.lineWidth = 1.8 + pylonHitSurge * 1.5;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(m1x, m1y);
    ctx.lineTo(m2x, m2y);
    ctx.lineTo(rimX, rimY);
    ctx.stroke();

    // White core lightning thread
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // Traveling magnetic flux plasma packets
    for (var pki = 0; pki < 2; pki++){
      var packetProgress = (G.t * (1.6 + progressFrac * 1.2 + pylonHitSurge * 2.0) + pi * 0.25 + pki * 0.5) % 1.0;
      var pkX = px + (rimX - px) * packetProgress;
      var pkY = py + (rimY - py) * packetProgress;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(pkX, pkY, 2.8 + pylonHitSurge * 1.5, 0, TAU);
      ctx.fill();
    }

    // Heavy Octagonal Pylon Transformer Chassis
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(pa + Math.PI / 2);
    ctx.fillStyle = '#080c16';
    ctx.strokeStyle = pylonHitSurge > 0.3 ? '#ffffff' : (progressFrac > 0.8 ? '#ff4d6d' : (progressFrac > 0.45 ? '#ffe066' : 'rgba(53, 240, 255, 0.85)'));
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    var pr = 17;
    for (var ci = 0; ci < 8; ci++){
      var ca = ci * (TAU / 8);
      var cx = Math.cos(ca) * pr;
      var cy = Math.sin(ca) * pr;
      if (ci === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Lateral Heatsink Fins
    ctx.fillStyle = '#101726';
    ctx.fillRect(-pr - 5, -5, 5, 10);
    ctx.fillRect(pr, -5, 5, 10);

    // Core pulsing crystal
    var corePulse = 0.5 + Math.sin((b.pylonEnergyT || 0) * 4.5 + pi * 1.2) * 0.45 + pylonHitSurge * 0.4;
    ctx.fillStyle = pylonHitSurge > 0.5 ? '#ffffff' : (progressFrac > 0.8 ? '#ff4d6d' : (corePulse > 0.6 ? '#35f0ff' : '#e0aaff'));
    ctx.beginPath();
    ctx.arc(0, 0, 5.5 + pylonHitSurge * 2, 0, TAU);
    ctx.fill();

    // White emitter center
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, 2.2, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // 2. Dual Mechanical Caliper Rings (Clockwise & Counter-Clockwise)
  // Outer Titanium Caliper Ring
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(rot * 0.5);
  ctx.strokeStyle = progressFrac > 0.8 ? 'rgba(255, 77, 109, 0.55)' : (progressFrac > 0.45 ? 'rgba(255, 224, 102, 0.48)' : 'rgba(53, 240, 255, 0.42)');
  ctx.lineWidth = 2.5;
  var outerR = br + 20;
  for (var oi = 0; oi < 16; oi++){
    var oAng = oi * (TAU / 16);
    ctx.beginPath();
    ctx.arc(0, 0, outerR, oAng + 0.04, oAng + (TAU / 16) - 0.04);
    ctx.stroke();

    // Gear tooth interlock
    var tx1 = Math.cos(oAng + 0.08) * (outerR + 7);
    var ty1 = Math.sin(oAng + 0.08) * (outerR + 7);
    var tx2 = Math.cos(oAng + (TAU / 16) - 0.08) * (outerR + 7);
    var ty2 = Math.sin(oAng + (TAU / 16) - 0.08) * (outerR + 7);
    ctx.beginPath();
    ctx.moveTo(Math.cos(oAng + 0.08) * outerR, Math.sin(oAng + 0.08) * outerR);
    ctx.lineTo(tx1, ty1);
    ctx.lineTo(tx2, ty2);
    ctx.lineTo(Math.cos(oAng + (TAU / 16) - 0.08) * outerR, Math.sin(oAng + (TAU / 16) - 0.08) * outerR);
    ctx.stroke();
  }
  ctx.restore();

  // Inner Magnetic Levitation Ring
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(-rot * 1.3);
  ctx.strokeStyle = progressFrac > 0.8 ? 'rgba(255, 100, 150, 0.55)' : 'rgba(224, 170, 255, 0.45)';
  ctx.lineWidth = 1.8;
  var innerR = br + 7;
  for (var ii = 0; ii < 24; ii++){
    var iAng = ii * (TAU / 24);
    ctx.beginPath();
    ctx.arc(0, 0, innerR, iAng + 0.03, iAng + (TAU / 24) - 0.03);
    ctx.stroke();
    // Magnetic coil emitter pad
    var ix = Math.cos(iAng) * innerR;
    var iy = Math.sin(iAng) * innerR;
    ctx.fillStyle = (ii % 3 === 0) ? '#35f0ff' : '#e0aaff';
    ctx.beginPath();
    ctx.arc(ix, iy, 2.0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  // 3. Stasis Hexagonal Forcefield Dome
  var grad = ctx.createRadialGradient(bx, by, br * 0.15, bx, by, br);
  grad.addColorStop(0, 'rgba(224, 170, 255, ' + (0.06 + impactFlash * 0.12) + ')');
  grad.addColorStop(0.7, 'rgba(53, 240, 255, ' + (0.16 + impactFlash * 0.20) + ')');
  grad.addColorStop(1, 'rgba(53, 240, 255, ' + (0.34 + impactFlash * 0.35) + ')');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(bx, by, br, 0, TAU);
  ctx.fill();

  // Hexagonal lattice grid overlay
  ctx.strokeStyle = impactFlash > 0.1 ? 'rgba(255, 255, 255, 0.35)' : 'rgba(53, 240, 255, 0.16)';
  ctx.lineWidth = 1.2;
  var hexSize = 28;
  var hexRows = 8, hexCols = 8;
  for (var rIndex = -hexRows; rIndex <= hexRows; rIndex++){
    for (var cIndex = -hexCols; cIndex <= hexCols; cIndex++){
      var hx = bx + cIndex * hexSize * 1.5;
      var hy = by + rIndex * hexSize * Math.sqrt(3) + ((Math.abs(cIndex) % 2) * hexSize * Math.sqrt(3) / 2);
      if (Math.hypot(hx - bx, hy - by) < br - 10){
        ctx.beginPath();
        for (var hi = 0; hi < 6; hi++){
          var ha = hi * (TAU / 6);
          var hpx = hx + Math.cos(ha) * (hexSize * 0.48);
          var hpy = hy + Math.sin(ha) * (hexSize * 0.48);
          if (hi === 0) ctx.moveTo(hpx, hpy); else ctx.lineTo(hpx, hpy);
        }
        ctx.closePath();
        ctx.stroke();
      }
    }
  }

  // Pulsing outer barrier boundary
  var barrierPulse = 0.65 + Math.sin(G.t * 3.5) * 0.25 + impactFlash * 0.35;
  ctx.strokeStyle = progressFrac > 0.8 ? 'rgba(255, 77, 109, ' + barrierPulse + ')' : 'rgba(53, 240, 255, ' + barrierPulse + ')';
  ctx.lineWidth = 3.2;
  ctx.beginPath();
  ctx.arc(bx, by, br, 0, TAU);
  ctx.stroke();

  // 4. THE TITAN BIOMECHANICAL EGG CHASSIS & PROGRESSIVE FRACTURE FISSURES
  ctx.save();
  ctx.translate(bx, by);

  // Egg Dimensions: Profile width 152px, height 216px
  var eggW = 76;
  var eggH = 108;
  var breath = 1 + Math.sin(t * 1.8) * 0.012;
  var vibPhase = G.t * 38;
  var vibAmp = (progressFrac > 0.6 ? (progressFrac - 0.6) * 10 : 0) + impactFlash * 4.5;
  var eggVibX = vibAmp > 0.1 ? Math.sin(vibPhase) * vibAmp * 0.6 : 0;
  var eggVibY = vibAmp > 0.1 ? Math.cos(vibPhase * 1.3) * vibAmp * 0.6 : 0;
  ctx.translate(eggVibX, eggVibY);
  ctx.scale(breath, breath);

  // Helper: Computes exact radius of ovoid egg at polar angle ang
  function getEggRadius(ang){
    var sa = Math.sin(ang);
    var ca = Math.cos(ang);
    var wFactor = (sa < 0) ? (0.76 - sa * 0.18) : (1.04 - sa * 0.10);
    var rW = eggW * wFactor;
    var rH = (sa < 0) ? eggH : (eggH * 0.95);
    var denom = Math.hypot(rH * ca, rW * sa);
    return denom > 0 ? (rW * rH) / denom : eggW;
  }

  // A. Gantry Clamping Claws & Cradle Supports
  // Upper Hydraulic Clamping Arms (Top Gantry Crown)
  ctx.save();
  ctx.fillStyle = '#060a14';
  ctx.strokeStyle = '#35f0ff';
  ctx.lineWidth = 2.0;
  var clampLift = progressFrac * 10;
  // Left top clamp
  ctx.beginPath();
  ctx.moveTo(-eggW * 0.55, -eggH * 0.90 - clampLift);
  ctx.lineTo(-eggW * 0.35, -eggH * 1.15 - clampLift);
  ctx.lineTo(-eggW * 0.15, -eggH * 1.15 - clampLift);
  ctx.lineTo(-eggW * 0.20, -eggH * 0.88 - clampLift);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // Right top clamp
  ctx.beginPath();
  ctx.moveTo(eggW * 0.55, -eggH * 0.90 - clampLift);
  ctx.lineTo(eggW * 0.35, -eggH * 1.15 - clampLift);
  ctx.lineTo(eggW * 0.15, -eggH * 1.15 - clampLift);
  ctx.lineTo(eggW * 0.20, -eggH * 0.88 - clampLift);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // Hydraulic Piston Cylinders
  ctx.strokeStyle = '#e0aaff';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-eggW * 0.25, -eggH * 1.12 - clampLift); ctx.lineTo(-eggW * 0.25, -eggH * 0.92);
  ctx.moveTo(eggW * 0.25, -eggH * 1.12 - clampLift); ctx.lineTo(eggW * 0.25, -eggH * 0.92);
  ctx.stroke();
  ctx.restore();

  // Lower Industrial Incubator Cradle Base
  ctx.save();
  ctx.fillStyle = '#070b16';
  ctx.strokeStyle = progressFrac > 0.8 ? '#ff4d6d' : '#35f0ff';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-eggW * 0.92, eggH * 0.68);
  ctx.quadraticCurveTo(0, eggH * 1.08, eggW * 0.92, eggH * 0.68);
  ctx.lineTo(eggW * 0.72, eggH * 0.98);
  ctx.quadraticCurveTo(0, eggH * 1.20, -eggW * 0.72, eggH * 0.98);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Coolant manifold conduits on base
  ctx.strokeStyle = 'rgba(53, 240, 255, 0.75)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(-eggW * 0.65, eggH * 0.82);
  ctx.quadraticCurveTo(0, eggH * 1.02, eggW * 0.65, eggH * 0.82);
  ctx.stroke();

  // Exhaust Heat Vents
  ctx.fillStyle = '#02050c';
  for (var vi = -2; vi <= 2; vi++){
    var vx = vi * 20;
    var vy = eggH * 1.02;
    ctx.fillRect(vx - 6, vy, 12, 6);
    ctx.strokeRect(vx - 6, vy, 12, 6);
  }
  ctx.restore();

  // B. Translucent Amniotic Chamber Fluid (Glowing Void Core)
  var eggGrad = ctx.createRadialGradient(0, -10, 18, 0, 10, eggH * 1.05);
  var coreHueAlpha = 0.42 + heartPulse * 0.38 + impactFlash * 0.20;
  if (progressFrac > 0.75){

        var emT = (G.t * 3.5 + emi * 0.618) % 1.0;
        var emX = (Math.sin(emi * 3.7) * eggW * 0.65) + Math.sin(G.t * 4 + emi) * 6;
        var emY = (eggH * 0.6) - emT * (eggH * 1.4);
        var emSize = (1 - emT) * 3.2;
        ctx.globalAlpha = (1 - emT) * 0.9;
        ctx.fillRect(emX, emY, emSize, emSize);
      }
      ctx.globalAlpha = 1;

      // Spallation Chitin Shards (Floating broken shell chips near chasms)
      var shardCoords = [
        [-eggW * 0.48, -eggH * 0.28, 7, 5, 0.4],
        [eggW * 0.42, -eggH * 0.35, 6, 4, -0.3],
        [-eggW * 0.32, eggH * 0.32, 8, 6, 0.6],
        [eggW * 0.36, eggH * 0.18, 6, 5, -0.5]
      ];
      ctx.fillStyle = '#140526';
      ctx.strokeStyle = crackCol;
      ctx.lineWidth = 1.6;
      for (var shi = 0; shi < shardCoords.length; shi++){
        var sc = shardCoords[shi];
        var sFloat = Math.sin(t * 5 + shi * 1.8) * 3;
        ctx.save();
        ctx.translate(sc[0] + sFloat, sc[1] + sFloat * 0.5);
        ctx.rotate(sc[4] + sFloat * 0.05);
        ctx.beginPath();
        ctx.moveTo(-sc[2] * 0.5, -sc[3] * 0.5);
        ctx.lineTo(sc[2] * 0.6, -sc[3] * 0.4);
        ctx.lineTo(sc[2] * 0.4, sc[3] * 0.5);
        ctx.lineTo(-sc[2] * 0.5, sc[3] * 0.3);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }
    ctx.restore();
  }

  ctx.restore(); // restore egg translate

  // 5. Deflection Impact Ripple Waves
  if (b.deflectionRipples && b.deflectionRipples.length > 0){
    for (var ri = 0; ri < b.deflectionRipples.length; ri++){
      var rip = b.deflectionRipples[ri];
      var ripAlpha = rip.life / (rip.maxLife || 0.4);
      var rx = bx + Math.cos(rip.ang) * br;
      var ry = by + Math.sin(rip.ang) * br;
      ctx.save();
      ctx.translate(rx, ry);
      ctx.rotate(rip.ang);
      ctx.strokeStyle = 'rgba(255, 255, 255, ' + ripAlpha + ')';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(0, 0, rip.r, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(53, 240, 255, ' + (ripAlpha * 0.85) + ')';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(0, 0, rip.r * 1.5, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // 6. Holographic Floating Status Readout Pill (Projected directly above egg)
  var pillW = 280, pillH = 52;
  var pillX = bx - pillW / 2;
  var pillY = by - br - 70;

  ctx.fillStyle = 'rgba(5, 7, 18, 0.92)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(pillX, pillY, pillW, pillH, 8);
  else ctx.rect(pillX, pillY, pillW, pillH);
  ctx.fill();

  ctx.strokeStyle = progressFrac > 0.8 ? '#ff4d6d' : (progressFrac > 0.45 ? '#ffe066' : 'rgba(53, 240, 255, 0.65)');
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // Corner holographic tick marks
  ctx.strokeStyle = '#ffe066';
  ctx.lineWidth = 2;
  var cLen = 6;
  var corners = [
    [pillX, pillY, 1, 1], [pillX + pillW, pillY, -1, 1],
    [pillX, pillY + pillH, 1, -1], [pillX + pillW, pillY + pillH, -1, -1]
  ];
  for (var ci = 0; ci < 4; ci++){
    var crn = corners[ci];
    ctx.beginPath();
    ctx.moveTo(crn[0] + crn[2] * cLen, crn[1]);
    ctx.lineTo(crn[0], crn[1]);
    ctx.lineTo(crn[0], crn[1] + crn[3] * cLen);
    ctx.stroke();
  }

  drawIcon('egg', pillX + 22, pillY + 26, 16, progressFrac > 0.8 ? '#ff4d6d' : (progressFrac > 0.45 ? '#ffe066' : '#35f0ff'));
  ctx.textAlign = 'left';
  ctx.font = 'bold 11px ui-monospace,monospace';
  ctx.fillStyle = progressFrac > 0.8 ? '#ff4d6d' : (progressFrac > 0.45 ? '#ffe066' : '#35f0ff');
  ctx.fillText('BIOMECHANICAL EGG INCUBATOR', pillX + 40, pillY + 20);

  ctx.font = '10px ui-monospace,monospace';
  ctx.fillStyle = '#ffe066';
  ctx.fillText('STASIS SEALS: ' + Math.ceil(shellIntegrity * 100) + '% // WAVE ' + curW + ' OF 5 (HOSTILES ' + waveK + '/' + waveT + ')', pillX + 40, pillY + 36);

  ctx.restore();
}

function drawContainmentMatrix(b){
  drawTitanEgg(b);
}

function renderHyperBeam(x1, y1, ang, len, isPhase2, t){
  var x2 = x1 + Math.cos(ang) * len;
  var y2 = y1 + Math.sin(ang) * len;

  ctx.save();

  // A. Outer Distortion & Energy Aura
  ctx.strokeStyle = isPhase2 ? 'rgba(255, 0, 85, 0.38)' : 'rgba(123, 44, 191, 0.45)';
  ctx.lineWidth = (isPhase2 ? 58 : 46) + Math.sin(t * 26) * 8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  // B. Compression Shockwave Rings Spaced along the Beam
  var ringCount = Math.floor(len / 85);
  var ringOffset = (G.t * 320) % 85;
  ctx.strokeStyle = isPhase2 ? 'rgba(255, 224, 102, 0.7)' : 'rgba(224, 170, 255, 0.7)';
  ctx.lineWidth = 2.5;
  for (var rgi = 0; rgi < ringCount; rgi++){
    var rDist = rgi * 85 + ringOffset;
    if (rDist > 40 && rDist < len - 40){
      var rx = x1 + Math.cos(ang) * rDist;
      var ry = y1 + Math.sin(ang) * rDist;
      ctx.save();
      ctx.translate(rx, ry);
      ctx.rotate(ang + Math.PI / 2);
      ctx.beginPath();
      ctx.ellipse(0, 0, isPhase2 ? 26 : 20, 7, 0, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  // C. Mid Intense Plasma Beam
  ctx.strokeStyle = isPhase2 ? '#ff4d6d' : '#c77dff';
  ctx.lineWidth = (isPhase2 ? 28 : 22) + Math.sin(t * 32) * 5;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  // D. Pure Blinding White Core
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = isPhase2 ? 12 : 9;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  // E. Muzzle Detonation Flare
  ctx.beginPath();
  ctx.arc(x1, y1, (isPhase2 ? 46 : 36) + Math.sin(t * 22) * 8, 0, TAU);
  ctx.fillStyle = isPhase2 ? 'rgba(255, 100, 150, 0.85)' : 'rgba(255, 255, 255, 0.85)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x1, y1, 16, 0, TAU);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  ctx.restore();
}

function drawAbyssLeviathan(b){
  if (b.dormant){
    drawTitanEgg(b);
    return;
  }

  var r = b.r;
  var isPhase2 = (b.phase === 2 || b.phase2);
  var col = b.flash > 0 ? '#ffffff' : (isPhase2 ? '#ff0055' : b.color);
  var t = b.phaseT;

  // 0. Draw Phantom Shadow Trail Afterimages during Phase 2 Dimensional Stalk
  if (isPhase2 && b.shadowTrail && b.shadowTrail.length > 0){
    for (var sti = 0; sti < b.shadowTrail.length; sti++){
      var st = b.shadowTrail[sti];
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.rotate(st.ang);
      ctx.globalAlpha = st.a * 0.45;
      ctx.fillStyle = '#20000e';
      ctx.strokeStyle = 'rgba(255, 0, 85, ' + (st.a * 0.7) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.95, r * 0.65, 0, 0, TAU);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // 1. Draw 16 Articulated Body Segments from Tail (s = 15) down to Segment 0
  if (b.segments && b.segments.length > 0){
    var segCount = b.segments.length;

    // Phase 2: Inter-vertebral bio-electric crimson lightning arcs between adjacent segments
    if (isPhase2){
      for (var sArc = 1; sArc < segCount; sArc++){
        if (Math.sin(t * 16 + sArc * 2.8) > 0.15){
          var curS = b.segments[sArc];
          var prevS = b.segments[sArc - 1];
          var midX = (curS.x + prevS.x) * 0.5 + Math.sin(t * 28 + sArc) * 8;
          var midY = (curS.y + prevS.y) * 0.5 + Math.cos(t * 28 + sArc) * 8;
          ctx.save();
          ctx.strokeStyle = (Math.random() < 0.35) ? '#ffffff' : '#ff0055';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(curS.x, curS.y);
          ctx.lineTo(midX, midY);
          ctx.lineTo(prevS.x, prevS.y);
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    for (var s = segCount - 1; s >= 0; s--){
      var seg = b.segments[s];
      var sFrac = s / (segCount - 1);
      ctx.save();
      ctx.translate(seg.x, seg.y);
      ctx.rotate(seg.ang);

      // Lateral Bio-Mechanical Rib Fins
      var finLen = seg.finLength || 24;
      var finWave = Math.sin(t * 6 - s * 0.45) * 6;
      ctx.fillStyle = isPhase2 ? '#400018' : '#3c096c';
      ctx.strokeStyle = isPhase2 ? 'rgba(255, 77, 109, 0.85)' : 'rgba(224, 170, 255, 0.75)';
      ctx.lineWidth = 2;

      // Top fin
      ctx.beginPath();
      ctx.moveTo(0, -seg.height * 0.6);
      ctx.lineTo(-seg.width * 0.4, -seg.height - finLen - finWave);
      ctx.lineTo(-seg.width * 0.3, -seg.height * 0.5);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Bottom fin
      ctx.beginPath();
      ctx.moveTo(0, seg.height * 0.6);
      ctx.lineTo(-seg.width * 0.4, seg.height + finLen + finWave);
      ctx.lineTo(-seg.width * 0.3, seg.height * 0.5);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Phase 2: Jagged Barbed Dorsal Spines jutting backward from vertebrae
      if (isPhase2){
        ctx.fillStyle = '#260010';
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 2.0;

        // Upper barb
        ctx.beginPath();
        ctx.moveTo(-seg.width * 0.15, -seg.height * 0.55);
        ctx.lineTo(-seg.width * 0.75, -seg.height * 1.15);
        ctx.lineTo(-seg.width * 0.40, -seg.height * 0.35);
        ctx.closePath();
        ctx.fill(); ctx.stroke();

        // Lower barb
        ctx.beginPath();
        ctx.moveTo(-seg.width * 0.15, seg.height * 0.55);
        ctx.lineTo(-seg.width * 0.75, seg.height * 1.15);
        ctx.lineTo(-seg.width * 0.40, seg.height * 0.35);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
      }

      // Tail Scythe Blades on the last 3 segments
      if (s >= segCount - 3){
        var tailScale = (s - (segCount - 4)) / 3;
        ctx.fillStyle = '#10002b';
        ctx.strokeStyle = col;
        ctx.lineWidth = 2.5;
        // Upper tail scythe
        ctx.beginPath();
        ctx.moveTo(-seg.width * 0.4, -seg.height * 0.5);
        ctx.lineTo(-seg.width * (1.8 + tailScale * 1.2), -seg.height * (1.6 + tailScale * 1.5));
        ctx.lineTo(-seg.width * 0.8, -seg.height * 0.2);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Lower tail scythe
        ctx.beginPath();
        ctx.moveTo(-seg.width * 0.4, seg.height * 0.5);
        ctx.lineTo(-seg.width * (1.8 + tailScale * 1.2), seg.height * (1.6 + tailScale * 1.5));
        ctx.lineTo(-seg.width * 0.8, seg.height * 0.2);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
      }

      // Armored Chitin Carapace Plate (Elliptical Vertebrae)
      ctx.beginPath();
      ctx.ellipse(0, 0, seg.width * 0.6, seg.height * 0.6, 0, 0, TAU);
      ctx.fillStyle = s % 2 === 0 ? '#0b0217' : (isPhase2 ? '#220010' : '#18062e');
      ctx.fill();
      ctx.strokeStyle = (b.flash > 0) ? '#ffffff' : (isPhase2 ? 'rgba(255, 77, 109, ' + (0.95 - sFrac * 0.4) + ')' : 'rgba(224, 170, 255, ' + (0.9 - sFrac * 0.4) + ')');
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Bioluminescent Void Capillary Veins pulsing along vertebrae
      var veinPulse = Math.sin(t * 8 - s * 0.55);
      ctx.beginPath();
      ctx.moveTo(-seg.width * 0.45, 0);
      ctx.quadraticCurveTo(0, seg.height * (0.35 * veinPulse), seg.width * 0.45, 0);
      ctx.strokeStyle = isPhase2 ? 'rgba(255, 0, 85, ' + (0.45 + veinPulse * 0.3) + ')' : 'rgba(179, 136, 255, ' + (0.35 + veinPulse * 0.25) + ')';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      // Secondary Lateral Rib Spines
      for (var rsi = -1; rsi <= 1; rsi += 2){
        var rsy = rsi * seg.height * 0.38;
        ctx.beginPath();
        ctx.moveTo(0, rsy);
        ctx.lineTo(-seg.width * 0.35, rsy + rsi * 6);
        ctx.strokeStyle = isPhase2 ? '#ff0055' : col;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      // Dorsal Vertebrae Core Light
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(3, 7 * (1 - sFrac * 0.5)), 0, TAU);
      ctx.fillStyle = col;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(1.5, 3 * (1 - sFrac * 0.5)), 0, TAU);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.restore();
    }
  }

  // 2. Draw Titan Leviathan Head at (b.x, b.y)
  ctx.save();
  ctx.translate(b.x, b.y);
  if (b.squash > 0.01){
    ctx.rotate(b.hitAng);
    ctx.scale(1 + b.squash*0.35, 1 - b.squash*0.28);
    ctx.rotate(b.ang - b.hitAng);
  } else {
    ctx.rotate(b.ang);
  }
  var sc = 0.5 + 0.5 * Math.min(1, b.spawn);
  if (b.shadowDashing > 0) sc *= 1.12;
  ctx.scale(sc, sc);

  // Phase 2: 8 Writhing Eldritch Void Tendrils Sprouting from Occipital Flanks
  if (isPhase2){
    for (var ti = 0; ti < 8; ti++){
      var tSide = (ti < 4) ? -1 : 1;
      var tIdx = ti % 4;
      var tRootX = -r * (0.30 + tIdx * 0.12);
      var tRootY = tSide * r * (0.42 + tIdx * 0.08);
      var tWave = Math.sin(t * 8.5 + ti * 1.1) * (20 + tIdx * 6);
      var tWave2 = Math.cos(t * 6.5 + ti * 0.9) * (14 + tIdx * 5);
      var cp1x = tRootX - r * (0.50 + tIdx * 0.15);
      var cp1y = tRootY + tSide * (32 + tWave);
      var cp2x = tRootX - r * (1.05 + tIdx * 0.22);
      var cp2y = tRootY + tSide * (50 + tWave2);
      var endX = tRootX - r * (1.45 + tIdx * 0.30);
      var endY = tRootY + tSide * (65 + tWave);

      // Shadow fleshy tentacle shaft
      ctx.beginPath();
      ctx.moveTo(tRootX, tRootY);
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, endX, endY);
      ctx.strokeStyle = '#10002b';
      ctx.lineWidth = 5.2 - tIdx * 0.6;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Bio-luminescent crimson spine
      ctx.strokeStyle = (ti % 2 === 0) ? '#ff0055' : '#ff4d6d';
      ctx.lineWidth = 2.2;
      ctx.stroke();

      // Barbed sensory eye at tendril apex
      ctx.beginPath();
      ctx.arc(endX, endY, 3.8, 0, TAU);
      ctx.fillStyle = '#ff0055';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(endX, endY, 1.6, 0, TAU);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }
  }

  // Predatory Void Scythe Mandibles (Spread open during Hyper-Beam!)
  var manSpread = ((b.mandibleOpen || 0) * 0.45) + Math.sin(t * 5.2) * 0.08;
  ctx.fillStyle = isPhase2 ? '#260010' : '#10002b';
  ctx.strokeStyle = col;
  ctx.lineWidth = 3.5;

  // Left Mandible
  ctx.beginPath();
  ctx.moveTo(r * 0.25, -r * 0.42);
  ctx.quadraticCurveTo(r * 1.25, -r * (0.95 + manSpread), r * 1.60, -r * (0.42 + manSpread));
  ctx.quadraticCurveTo(r * 1.05, -r * (0.28 + manSpread * 0.6), r * 0.42, -r * 0.15);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Right Mandible
  ctx.beginPath();
  ctx.moveTo(r * 0.25, r * 0.42);
  ctx.quadraticCurveTo(r * 1.25, r * (0.95 + manSpread), r * 1.60, r * (0.42 + manSpread));
  ctx.quadraticCurveTo(r * 1.05, r * (0.28 + manSpread * 0.6), r * 0.42, r * 0.15);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Phase 2: Micro-serrations along mandible inner edges
  if (isPhase2){
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.4;
    for (var mi = 0; mi < 5; mi++){
      var mFrac = 0.4 + mi * 0.11;
      // Left mandible serration
      var lmx = r * (0.42 + mFrac * 0.7);
      var lmy = -r * (0.18 + mFrac * 0.45 + manSpread * 0.5);
      ctx.beginPath();
      ctx.moveTo(lmx, lmy);
      ctx.lineTo(lmx + 5, lmy + 6);
      ctx.stroke();

      // Right mandible serration
      var rmx = r * (0.42 + mFrac * 0.7);
      var rmy = r * (0.18 + mFrac * 0.45 + manSpread * 0.5);
      ctx.beginPath();
      ctx.moveTo(rmx, rmy);
      ctx.lineTo(rmx + 5, rmy - 6);
      ctx.stroke();
    }
  }

  // Main Armored Cranial Chassis
  ctx.fillStyle = '#0b0217';
  ctx.strokeStyle = col;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(r * 0.75, 0);
  ctx.lineTo(r * 0.45, -r * 0.55);
  ctx.lineTo(-r * 0.25, -r * 0.75);
  ctx.lineTo(-r * 0.75, -r * 0.45);
  ctx.lineTo(-r * 0.85, 0);
  ctx.lineTo(-r * 0.75, r * 0.45);
  ctx.lineTo(-r * 0.25, r * 0.75);
  ctx.lineTo(r * 0.45, r * 0.55);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Sweeping Abyssal Crest Horns
  ctx.fillStyle = isPhase2 ? '#20000e' : '#140026';
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(-r * 0.25, -r * 0.75);
  ctx.quadraticCurveTo(-r * 0.85, -r * 1.15, -r * 1.15, -r * 0.95);
  ctx.lineTo(-r * 0.65, -r * 0.60);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-r * 0.25, r * 0.75);
  ctx.quadraticCurveTo(-r * 0.85, r * 1.15, -r * 1.15, r * 0.95);
  ctx.lineTo(-r * 0.65, r * 0.60);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Cranial Chitin Crown Plates
  ctx.fillStyle = isPhase2 ? '#400018' : '#240046';
  ctx.strokeStyle = isPhase2 ? 'rgba(255, 77, 109, 0.75)' : 'rgba(224, 170, 255, 0.65)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(r * 0.55, 0);
  ctx.lineTo(r * 0.25, -r * 0.38);
  ctx.lineTo(-r * 0.45, -r * 0.35);
  ctx.lineTo(-r * 0.60, 0);
  ctx.lineTo(-r * 0.45, r * 0.35);
  ctx.lineTo(r * 0.25, r * 0.38);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Central Event Horizon Singularity (Vortex Maw with Counter-Rotating Fangs)
  var mawRot = -t * (isPhase2 ? 7.5 : 5.2);
  ctx.save();
  ctx.translate(r * 0.35, 0);
  ctx.rotate(mawRot);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.28, 0, TAU);
  ctx.fillStyle = (b.skillPhase === 'active') ? 'rgba(255, 255, 255, 0.5)' : (isPhase2 ? 'rgba(255, 0, 85, 0.45)' : 'rgba(123, 44, 191, 0.45)');
  ctx.fill();

  // In Phase 2: Double Concentric Ring of Serrated Counter-Rotating Fangs!
  if (isPhase2){
    // Outer Ring: 12 needle fangs spinning with mawRot
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = 1.2;
    for (var fi = 0; fi < 12; fi++){
      var fa = fi * (TAU / 12);
      var fOuterR = r * 0.29;
      var fInnerR = r * 0.19;
      var fw = 0.12;
      ctx.beginPath();
      ctx.moveTo(Math.cos(fa - fw) * fOuterR, Math.sin(fa - fw) * fOuterR);
      ctx.lineTo(Math.cos(fa) * fInnerR, Math.sin(fa) * fInnerR);
      ctx.lineTo(Math.cos(fa + fw) * fOuterR, Math.sin(fa + fw) * fOuterR);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    }

    // Inner Ring: 8 reverse-spinning serrated triangular fangs
    var revRot = mawRot * -1.8;
    for (var f2i = 0; f2i < 8; f2i++){
      var f2a = revRot + f2i * (TAU / 8);
      var f2OuterR = r * 0.18;
      var f2InnerR = r * 0.10;
      var f2w = 0.16;
      ctx.beginPath();
      ctx.moveTo(Math.cos(f2a - f2w) * f2OuterR, Math.sin(f2a - f2w) * f2OuterR);
      ctx.lineTo(Math.cos(f2a) * f2InnerR, Math.sin(f2a) * f2InnerR);
      ctx.lineTo(Math.cos(f2a + f2w) * f2OuterR, Math.sin(f2a + f2w) * f2OuterR);
      ctx.closePath();
      ctx.fillStyle = '#ff4d6d';
      ctx.fill();
    }
  } else {
    for (var sp = 0; sp < 4; sp++){
      var spa = sp * (TAU / 4);
      ctx.strokeStyle = (b.skillPhase === 'active') ? '#ffffff' : '#e0aaff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.22, spa, spa + 1.0);
      ctx.stroke();
    }
  }

  ctx.beginPath();
  ctx.arc(0, 0, r * 0.12, 0, TAU);
  ctx.fillStyle = '#000000';
  ctx.fill();
  ctx.strokeStyle = isPhase2 ? '#ff0055' : '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  // Cluster of 6 Glowing Sensor Lenses
  var eyeOffsets = [
    [r * 0.35, -r * 0.28], [r * 0.18, -r * 0.38], [r * 0.02, -r * 0.44],
    [r * 0.35,  r * 0.28], [r * 0.18,  r * 0.38], [r * 0.02,  r * 0.44]
  ];
  for (var ei = 0; ei < eyeOffsets.length; ei++){
    var epos = eyeOffsets[ei];

    // Weeping Plasma Flare Tears in Phase 2
    if (isPhase2){
      ctx.beginPath();
      ctx.moveTo(epos[0], epos[1]);
      var tearWiggle = Math.sin(t * 11 + ei * 1.5) * 5;
      ctx.quadraticCurveTo(epos[0] - r * 0.22, epos[1] + tearWiggle, epos[0] - r * 0.48, epos[1] + tearWiggle * 0.5);
      ctx.strokeStyle = 'rgba(255, 0, 85, 0.55)';
      ctx.lineWidth = 2.4;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(epos[0], epos[1], 5, 0, TAU);
    ctx.fillStyle = isPhase2 ? '#ff0055' : col;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(epos[0], epos[1], 2, 0, TAU);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }

  // Phase 2 Apex Demonic Aura Corona with Radiating Spikes
  if (isPhase2){
    var auraR = r * 1.35 + Math.sin(t * 12) * 5;
    ctx.beginPath();
    ctx.arc(0, 0, auraR, 0, TAU);
    ctx.strokeStyle = 'rgba(255, 0, 85, 0.65)';
    ctx.lineWidth = 3.5;
    ctx.stroke();

    // Radiating Jagged Energy Spikes
    ctx.strokeStyle = 'rgba(255, 77, 109, 0.75)';
    ctx.lineWidth = 2;
    for (var spi = 0; spi < 12; spi++){
      var spa = spi * (TAU / 12) + t * 2.5;
      var spInner = auraR - 4;
      var spOuter = auraR + 14 + Math.sin(t * 16 + spi) * 6;
      ctx.beginPath();
      ctx.moveTo(Math.cos(spa) * spInner, Math.sin(spa) * spInner);
      ctx.lineTo(Math.cos(spa) * spOuter, Math.sin(spa) * spOuter);
      ctx.stroke();
    }
  }

  ctx.restore();

  // 3. Draw Hyper-Beam(s) when active or windup aiming sight
  var hbx1 = b.x + Math.cos(b.ang) * r * 0.75;
  var hby1 = b.y + Math.sin(b.ang) * r * 0.75;

  if (b.skillPhase === 'windup'){
    ctx.save();
    ctx.setLineDash([8, 8]);
    ctx.lineDashOffset = -t * 30;
    ctx.lineWidth = 2.5;

    if (isPhase2){
      // Dual Scissoring Laser Sights
      ctx.strokeStyle = 'rgba(255, 77, 109, 0.85)';
      var b1a = b.hyperBeamAng1 || (b.hyperBeamAng - 0.4);
      var b2a = b.hyperBeamAng2 || (b.hyperBeamAng + 0.4);

      ctx.beginPath();
      ctx.moveTo(hbx1, hby1);
      ctx.lineTo(hbx1 + Math.cos(b1a) * 1250, hby1 + Math.sin(b1a) * 1250);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(hbx1, hby1);
      ctx.lineTo(hbx1 + Math.cos(b2a) * 1250, hby1 + Math.sin(b2a) * 1250);
      ctx.stroke();
    } else {
      // Single Laser Sight
      ctx.strokeStyle = 'rgba(224, 170, 255, 0.75)';
      ctx.beginPath();
      ctx.moveTo(hbx1, hby1);
      ctx.lineTo(hbx1 + Math.cos(b.hyperBeamAng) * 1200, hby1 + Math.sin(b.hyperBeamAng) * 1200);
      ctx.stroke();
    }
    ctx.restore();
  } else if (b.skillPhase === 'active'){
    if (isPhase2){
      // Phase 2: DUAL SCISSORING OMEGA-BEAMS
      var b1a = b.hyperBeamAng1 || (b.hyperBeamAng - 0.2);
      var b2a = b.hyperBeamAng2 || (b.hyperBeamAng + 0.2);
      renderHyperBeam(hbx1, hby1, b1a, 1300, true, t);
      renderHyperBeam(hbx1, hby1, b2a, 1300, true, t);
    } else {
      // Phase 1: Single Hyper-Beam
      renderHyperBeam(hbx1, hby1, b.hyperBeamAng, 1200, false, t);
    }
  }
}

function drawVoracisBoss(b){
  var r = b.r || 92;
  var isP2 = (b.phase === 2 || b.phase2);
  var col = b.flash > 0 ? '#ffffff' : (isP2 ? '#ff0033' : (b.color || '#ff0055'));
  var t = b.phaseT || (G ? G.t : 0);
  var jawSpread = b.jawAngle || 0;
  var ribFlex = b.ribFlex || 0;

  // 0. Phantom Shadow Trail Afterimages during Predatory Swallow Lunge (Phase 2)
  if (isP2 && b.shadowTrail && b.shadowTrail.length > 0){
    for (var sti = 0; sti < b.shadowTrail.length; sti++){
      var st = b.shadowTrail[sti];
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.rotate(st.ang);
      ctx.globalAlpha = st.a * 0.40;
      ctx.fillStyle = '#10000a';
      ctx.strokeStyle = 'rgba(255, 0, 51, ' + (st.a * 0.65) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.95, r * 0.70, 0, 0, TAU);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  ctx.save();
  ctx.translate(b.x, b.y);

  if (b.squash > 0.01){
    ctx.rotate(b.hitAng);
    ctx.scale(1 + b.squash * 0.35, 1 - b.squash * 0.28);
    ctx.rotate(b.ang - b.hitAng);
  } else {
    ctx.rotate(b.ang);
  }

  var sc = 0.5 + 0.5 * Math.min(1, b.spawn);
  ctx.scale(sc, sc);

  // --- LAYER 1: WRITHING POSTERIOR TENDRILS (8 Articulated Barbed Appendages) ---
  var tendrilCount = 8;
  for (var ti = 0; ti < tendrilCount; ti++){
    var tAnchorA = Math.PI - 0.75 + (ti / (tendrilCount - 1)) * 1.5;
    var tBaseX = Math.cos(tAnchorA) * (r * 0.65);
    var tBaseY = Math.sin(tAnchorA) * (r * 0.65);
    var tPhase = t * (isP2 ? 7.5 : 5.0) + ti * 0.85;

    ctx.save();
    // Segmented chitinous socket plate at tendril root
    ctx.fillStyle = '#18041c';
    ctx.strokeStyle = isP2 ? '#ff0055' : '#7b2cbf';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(tBaseX, tBaseY, 6, 0, TAU);
    ctx.fill(); ctx.stroke();

    ctx.strokeStyle = isP2 ? '#ff0055' : '#bf55ec';
    ctx.lineWidth = Math.max(1.5, (isP2 ? 3.6 : 2.6) * (1 - ti / 12));
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tBaseX, tBaseY);

    var curX = tBaseX, curY = tBaseY;
    var tSegs = 7;
    var segLen = (r * (isP2 ? 1.4 : 1.15)) / tSegs;
    for (var si = 0; si < tSegs; si++){
      var waveAngle = tAnchorA + Math.sin(tPhase + si * 0.6) * (0.35 + si * 0.08);
      curX += Math.cos(waveAngle) * segLen;
      curY += Math.sin(waveAngle) * segLen;
      ctx.lineTo(curX, curY);
    }
    ctx.stroke();

    // Dual barbed hook recurve spine at tendril tip
    ctx.fillStyle = isP2 ? '#ff0033' : '#ffe066';
    ctx.beginPath();
    ctx.arc(curX, curY, isP2 ? 4.5 : 3.5, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(curX, curY);
    ctx.lineTo(curX + Math.cos(tAnchorA - 0.4) * 6, curY + Math.sin(tAnchorA - 0.4) * 6);
    ctx.moveTo(curX, curY);
    ctx.lineTo(curX + Math.cos(tAnchorA + 0.4) * 6, curY + Math.sin(tAnchorA + 0.4) * 6);
    ctx.stroke();
    ctx.restore();
  }

  // --- LAYER 2: SEGMENTED RIBBED THORAX & BREATHING CARAPACE ---
  var ribTiers = 4;
  for (var ri = 0; ri < ribTiers; ri++){
    var ribFrac = ri / ribTiers;
    var ribX = -r * 0.45 + ri * (r * 0.26);
    var ribSpread = (r * 0.55 + Math.sin(ribFrac * Math.PI) * r * 0.25) * (1 + ribFlex);

    // Glowing ventral organ sacs between the ribs (biological respiration)
    ctx.fillStyle = isP2 ? 'rgba(255, 0, 51, 0.45)' : 'rgba(191, 85, 236, 0.35)';
    ctx.beginPath();
    ctx.ellipse(ribX, 0, r * 0.14, ribSpread * 0.75, 0, 0, TAU);
    ctx.fill();

    // Arched chitinous rib bones (left and right)
    ctx.strokeStyle = isP2 ? '#ff0033' : '#7b2cbf';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(ribX, 0, ribSpread, -Math.PI * 0.45, Math.PI * 0.45, false);
    ctx.stroke();

    // Specular bone highlight ridge
    ctx.strokeStyle = isP2 ? '#ff8fd8' : '#e0aaff';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(ribX, 0, ribSpread * 0.94, -Math.PI * 0.38, Math.PI * 0.38, false);
    ctx.stroke();
  }

  // --- LAYER 3: RAPTORIAL SCYTHE FORELIMBS (Left & Right) ---
  var scytheSides = [-1, 1];
  for (var sci = 0; sci < 2; sci++){
    var sSide = scytheSides[sci];
    var isSlashingThis = (b.scytheSlashing === (sSide === -1 ? 'left' : 'right'));
    var baseScytheA = sSide * 0.42 + (isSlashingThis ? (sSide * 0.95 * Math.sin((0.5 - (b.scytheSlashT || 0)) * Math.PI * 2)) : Math.sin(t * 3.5 + sSide) * 0.08);

    ctx.save();
    var shoulderX = r * 0.15;
    var shoulderY = sSide * r * 0.55;
    ctx.translate(shoulderX, shoulderY);
    ctx.rotate(baseScytheA);

    // Coxa / shoulder muscular joint socket
    ctx.fillStyle = '#1c051a';
    ctx.strokeStyle = isP2 ? '#ff0055' : '#7b2cbf';
    ctx.lineWidth = 2.0;
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, TAU);
    ctx.fill(); ctx.stroke();

    // Upper limb segment (femur)
    ctx.strokeStyle = isP2 ? '#ff0033' : '#4a154b';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(r * 0.45, sSide * r * 0.35);
    ctx.stroke();

    // Elbow joint
    var elbowX = r * 0.45, elbowY = sSide * r * 0.35;
    ctx.fillStyle = isP2 ? '#ff0055' : '#ffe066';
    ctx.beginPath();
    ctx.arc(elbowX, elbowY, 5, 0, TAU);
    ctx.fill();

    // Curved razor scythe sickle blade with beveled spine
    ctx.beginPath();
    ctx.moveTo(elbowX, elbowY);
    ctx.quadraticCurveTo(elbowX + r * 0.65, elbowY - sSide * r * 0.15, elbowX + r * 0.75, elbowY + sSide * r * 0.65);
    ctx.lineTo(elbowX + r * 0.55, elbowY + sSide * r * 0.45);
    ctx.quadraticCurveTo(elbowX + r * 0.45, elbowY, elbowX, elbowY);
    ctx.closePath();
    ctx.fillStyle = isP2 ? 'rgba(255, 0, 51, 0.85)' : 'rgba(26, 9, 51, 0.95)';
    ctx.fill();
    ctx.strokeStyle = isP2 ? '#ffffff' : (b.flash > 0 ? '#ffffff' : '#ffe066');
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Specular cutting edge bevel
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    ctx.moveTo(elbowX + r * 0.15, elbowY + sSide * r * 0.08);
    ctx.quadraticCurveTo(elbowX + r * 0.55, elbowY - sSide * r * 0.08, elbowX + r * 0.73, elbowY + sSide * r * 0.62);
    ctx.stroke();

    // Scythe blade slash trail flare
    if (isSlashingThis && b.scytheSlashT > 0){
      ctx.strokeStyle = isP2 ? 'rgba(255, 0, 51, 0.65)' : 'rgba(255, 224, 102, 0.65)';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.35, -0.4, 0.4, false);
      ctx.stroke();
    }
    ctx.restore();
  }

  // --- LAYER 4: INNER NIGHTMARE CORE & VISCERA (Phase 2 Metamorphosis) ---
  if (isP2){
    var corePulse = Math.sin(t * 12) * 0.12;
    ctx.save();
    // Raw visceral bio-core
    var coreGrd = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r * 0.65);
    coreGrd.addColorStop(0, '#ffffff');
    coreGrd.addColorStop(0.3, '#ff0033');
    coreGrd.addColorStop(0.7, '#7b0022');
    coreGrd.addColorStop(1, '#1a0008');
    ctx.fillStyle = coreGrd;
    ctx.beginPath();
    ctx.ellipse(r * 0.1, 0, r * 0.55 * (1 + corePulse), r * 0.42 * (1 + corePulse), 0, 0, TAU);
    ctx.fill();

    // Crawling bio-veins overlay
    ctx.strokeStyle = 'rgba(255, 143, 216, 0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var vi = 0; vi < 6; vi++){
      var va = (vi / 6) * TAU + t * 2;
      var vx = r * 0.1 + Math.cos(va) * (r * 0.35);
      var vy = Math.sin(va) * (r * 0.28);
      ctx.moveTo(r * 0.1, 0);
      ctx.quadraticCurveTo(r * 0.1 + Math.cos(va + 0.5) * r * 0.2, Math.sin(va + 0.5) * r * 0.15, vx, vy);
    }
    ctx.stroke();
    ctx.restore();
  } else {
    // Phase 1: Heavy chitinous dorsal shield plates
    ctx.fillStyle = '#120624';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.65, r * 0.48, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#3c1266';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Longitudinal dorsal armor seam
    ctx.strokeStyle = 'rgba(191, 85, 236, 0.5)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, 0);
    ctx.lineTo(r * 0.25, 0);
    ctx.stroke();
  }

  // --- LAYER 5: ARMORED CRANIAL CARAPACE & MOLTED RUPTURE SHARDS ---
  if (isP2){
    var shardOffset = 14 + Math.sin(t * 8) * 3;
    for (var sdi = -1; sdi <= 1; sdi += 2){
      ctx.save();
      ctx.translate(r * 0.25, sdi * (r * 0.45 + shardOffset));
      ctx.rotate(sdi * 0.25);
      ctx.beginPath();
      ctx.moveTo(r * 0.4, 0);
      ctx.lineTo(-r * 0.3, -sdi * r * 0.25);
      ctx.lineTo(-r * 0.4, sdi * r * 0.15);
      ctx.closePath();
      ctx.fillStyle = '#120624';
      ctx.fill();
      ctx.strokeStyle = '#ff0033';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = '#ff8fd8';
      ctx.beginPath();
      ctx.arc(0, 0, 2.5, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  } else {
    // Phase 1: Pristine cranial obsidian crown with beveled facets
    ctx.beginPath();
    ctx.moveTo(r * 0.75, 0);
    ctx.lineTo(r * 0.35, -r * 0.55);
    ctx.lineTo(-r * 0.2, -r * 0.48);
    ctx.lineTo(-r * 0.1, 0);
    ctx.lineTo(-r * 0.2, r * 0.48);
    ctx.lineTo(r * 0.35, r * 0.55);
    ctx.closePath();
    ctx.fillStyle = '#18092e';
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.stroke();

    // Specular cranial facets
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(r * 0.55, 0); ctx.lineTo(r * 0.2, -r * 0.35);
    ctx.moveTo(r * 0.55, 0); ctx.lineTo(r * 0.2, r * 0.35);
    ctx.stroke();
  }

  // --- LAYER 6: ARTICULATED TRIPLE-HINGED MANDIBLES & GAPING MAW ---
  var maxJawA = isP2 ? 0.95 : 0.65;
  var curJawA = Math.max(0.12, jawSpread * maxJawA);

  // A. Inner Maw Cavern & Plasma Throat Singularity
  ctx.save();
  var mawGrd = ctx.createRadialGradient(r * 0.45, 0, 4, r * 0.45, 0, r * 0.55);
  var mawCoreCol = (b.skillPhase === 'active' && isP2) ? '#a7ff00' : (isP2 ? '#ff0033' : '#ff0055');
  mawGrd.addColorStop(0, '#ffffff');
  mawGrd.addColorStop(0.35, mawCoreCol);
  mawGrd.addColorStop(0.85, 'rgba(16, 0, 24, 0.9)');
  mawGrd.addColorStop(1, 'rgba(0, 0, 0, 0.95)');
  ctx.fillStyle = mawGrd;
  ctx.beginPath();
  ctx.ellipse(r * 0.45, 0, r * 0.42 * (1 + jawSpread * 0.5), r * 0.34 * (1 + jawSpread * 0.8), 0, 0, TAU);
  ctx.fill();

  // Razor needle fangs lining inner maw (especially terrifying in Phase 2)
  var fangCount = isP2 ? 14 : 8;
  ctx.fillStyle = '#ffffff';
  for (var fi = 0; fi < fangCount; fi++){
    var fa = -Math.PI * 0.45 + (fi / (fangCount - 1)) * Math.PI * 0.9;
    var fx = r * 0.45 + Math.cos(fa) * (r * 0.36);
    var fy = Math.sin(fa) * (r * 0.28);
    var tipX = fx - Math.cos(fa) * (isP2 ? 14 : 9);
    var tipY = fy - Math.sin(fa) * (isP2 ? 14 : 9);
    ctx.beginPath();
    ctx.moveTo(fx - 2, fy);
    ctx.lineTo(tipX, tipY);
    ctx.lineTo(fx + 2, fy);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // B. Left Mandible (Sickle jaw, rotates outward by -curJawA)
  ctx.save();
  ctx.translate(r * 0.35, -r * 0.30);
  ctx.rotate(-curJawA);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(r * 0.55, -r * 0.25, r * 0.75, r * 0.12);
  ctx.lineTo(r * 0.50, r * 0.08);
  ctx.quadraticCurveTo(r * 0.35, -r * 0.08, 0, 0);
  ctx.closePath();
  ctx.fillStyle = isP2 ? '#26000c' : '#1d0c38';
  ctx.fill();
  ctx.strokeStyle = isP2 ? '#ff0033' : '#bf55ec';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  for (var jti = 0; jti < 4; jti++){
    var jtx = r * 0.22 + jti * (r * 0.12);
    var jty = -r * 0.04 + jti * 3;
    ctx.fillRect(jtx, jty, 3, 4);
  }
  // Chitinous armor ridge on left mandible
  ctx.strokeStyle = isP2 ? '#ff8fd8' : '#e0aaff';
  ctx.lineWidth = 1.0;
  ctx.beginPath();
  ctx.moveTo(r * 0.15, -r * 0.10);
  ctx.quadraticCurveTo(r * 0.45, -r * 0.18, r * 0.65, 0);
  ctx.stroke();
  ctx.restore();

  // C. Right Mandible (Sickle jaw, rotates outward by +curJawA)
  ctx.save();
  ctx.translate(r * 0.35, r * 0.30);
  ctx.rotate(curJawA);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(r * 0.55, r * 0.25, r * 0.75, -r * 0.12);
  ctx.lineTo(r * 0.50, -r * 0.08);
  ctx.quadraticCurveTo(r * 0.35, r * 0.08, 0, 0);
  ctx.closePath();
  ctx.fillStyle = isP2 ? '#26000c' : '#1d0c38';
  ctx.fill();
  ctx.strokeStyle = isP2 ? '#ff0033' : '#bf55ec';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  for (var jti2 = 0; jti2 < 4; jti2++){
    var jtx2 = r * 0.22 + jti2 * (r * 0.12);
    var jty2 = r * 0.04 - jti2 * 3;
    ctx.fillRect(jtx2, jty2, 3, -4);
  }
  // Chitinous armor ridge on right mandible
  ctx.strokeStyle = isP2 ? '#ff8fd8' : '#e0aaff';
  ctx.lineWidth = 1.0;
  ctx.beginPath();
  ctx.moveTo(r * 0.15, r * 0.10);
  ctx.quadraticCurveTo(r * 0.45, r * 0.18, r * 0.65, 0);
  ctx.stroke();
  ctx.restore();

  // D. Upper Cranial Dorsal Mandible / Horn Plate
  ctx.beginPath();
  ctx.moveTo(r * 0.85, 0);
  ctx.lineTo(r * 0.45, -r * 0.18);
  ctx.lineTo(r * 0.30, 0);
  ctx.lineTo(r * 0.45, r * 0.18);
  ctx.closePath();
  ctx.fillStyle = isP2 ? '#ff0033' : '#e0aaff';
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // --- LAYER 7: 8 PULSING COMPOUND OCULAR NODES ---
  var eyeOffsets = (typeof VORACIS_EYE_OFFSETS !== 'undefined') ? VORACIS_EYE_OFFSETS : [];
  for (var ei = 0; ei < eyeOffsets.length; ei++){
    var ep = eyeOffsets[ei];
    var epx = r * ep.fx, epy = r * ep.fy;
    var eyePulse = Math.sin(t * (isP2 ? 14 : 7) + ei) * 0.2;
    var eyeRad = ep.fr * (1 + eyePulse);

    ctx.beginPath();
    ctx.arc(epx, epy, eyeRad * 1.3, 0, TAU);
    ctx.fillStyle = isP2 ? 'rgba(255, 0, 51, 0.4)' : 'rgba(255, 224, 102, 0.4)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(epx, epy, eyeRad, 0, TAU);
    ctx.fillStyle = isP2 ? '#ff0033' : '#ffe066';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(epx + 1, epy, eyeRad * 0.4, 0, TAU);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }

  ctx.restore();
}

function drawBossModel(b){
  if (b.bossType === 'abyss'){
    drawAbyssLeviathan(b);
    return;
  }
  if (b.bossType === 'voracis'){
    drawVoracisBoss(b);
    return;
  }
  ctx.save();
  ctx.translate(b.x, b.y);
  if (b.squash > 0.01){
    ctx.rotate(b.hitAng);
    ctx.scale(1 + b.squash*0.35, 1 - b.squash*0.28);

    ctx.beginPath();
    ctx.arc(0, 0, crucibleR, 0, TAU);
    ctx.fillStyle = isEnraged ? '#ffffff' : '#ff5400';
    ctx.fill();
    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, crucibleR * 0.48, 0, TAU);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

  } else if (b.bossType === 'nexus'){
    // --- NEXUS OVERLORD (Starbase Citadel Fortress, r=94, Crimson #ff4d6d) ---
    // Layer 1: Colossal Hexagonal Starbase Fortress Outer Hull
    ctx.fillStyle = '#0a0a14';
    ctx.strokeStyle = col;
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    for (var i = 0; i < 6; i++){
      var a = i/6 * TAU;
      var px = Math.cos(a)*r, py = Math.sin(a)*r;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Layer 2: Inner Bastion Fortress Ring
    ctx.fillStyle = '#161224';
    ctx.strokeStyle = 'rgba(255, 77, 109, 0.45)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (var j = 0; j < 6; j++){
      var a2 = (j/6 * TAU) + Math.PI/6;
      var px2 = Math.cos(a2)*r*0.68, py2 = Math.sin(a2)*r*0.68;
      if (j) ctx.lineTo(px2, py2); else ctx.moveTo(px2, py2);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Layer 3: 6 Independent Rotary Gatling Turrets at Each Outer Vertex
    var turretRot = t * 2.2;
    for (var k = 0; k < 6; k++){
      var va = k/6 * TAU;
      var vx = Math.cos(va)*r*0.92, vy = Math.sin(va)*r*0.92;

      ctx.save();
      ctx.translate(vx, vy);
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU);
      ctx.fillStyle = '#22152b'; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();

      ctx.rotate(turretRot + k * (Math.PI/3));
      ctx.fillStyle = '#ff4d6d';
      ctx.fillRect(4, -4, 9, 3);
      ctx.fillRect(4, 1, 9, 3);
      ctx.restore();
    }

    // Layer 4: Hangar Deck Launch Bays & Runway Guide Lights
    var flashStep = Math.floor(t * 8) % 3;
    for (var hb = 0; hb < 3; hb++){
      var ha = hb * (TAU/3) + Math.PI/6;
      var hx = Math.cos(ha)*r*0.48, hy = Math.sin(ha)*r*0.48;
      ctx.save();
      ctx.translate(hx, hy);
      ctx.rotate(ha + Math.PI/2);
      ctx.fillStyle = '#05060a';
      ctx.fillRect(-10, -5, 20, 10);
      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 1;
      ctx.strokeRect(-10, -5, 20, 10);
      ctx.fillStyle = isEnraged ? '#ff4d6d' : '#3ddc97';
      ctx.fillRect(-7, -2, 3, 4);
      ctx.fillRect(4, -2, 3, 4);

      // Runway approach beacon pips
      for (var lgt = 0; lgt < 3; lgt++){
        var lx2 = -6 + lgt * 6;
        ctx.fillStyle = (lgt === flashStep) ? '#ffffff' : (isEnraged ? '#ff4d6d' : '#3ddc97');
        ctx.fillRect(lx2, -10, 2, 2);
      }
      ctx.restore();
    }

    // Layer 5: Molten Supernova Reactor Core
    var corePulse = isEnraged ? (0.28 + Math.sin(t * 14)*0.07) : (0.22 + Math.sin(t * 7)*0.04);
    ctx.beginPath();
    ctx.arc(0, 0, r * (corePulse + 0.12), 0, TAU);
    ctx.fillStyle = 'rgba(255, 77, 109, 0.28)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, r * corePulse, 0, TAU);
    ctx.fillStyle = isEnraged ? '#ffffff' : col;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, r * (corePulse * 0.45), 0, TAU);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }

  // Common: Outer Armor Integrity Hologram Ring
  ctx.beginPath();
  ctx.arc(0, 0, r + 10, 0, TAU);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Phase 2 Enrage Glow Aura
  if (isEnraged){
    ctx.beginPath();
    ctx.arc(0, 0, r + 16 + Math.sin(t*10)*4, 0, TAU);
    ctx.strokeStyle = 'rgba(255, 77, 109, 0.4)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  ctx.restore();
}

function drawDyingBoss(db){
  if (!db) return;
  ctx.save();
  var t = db.t;

  if (t < 1.2){
    // Phase 1: Destabilization tremor & electric fissures
    var tremorIntensity = (t / 1.2) * 10 + 2;
    var tx = db.x + rnd(-tremorIntensity, tremorIntensity);
    var ty = db.y + rnd(-tremorIntensity, tremorIntensity);

    var segs = null;
    if (db.segments){
      var dx = tx - db.x;
      var dy = ty - db.y;
      segs = db.segments.map(function(s){
        return {
          x: s.x + dx,
          y: s.y + dy,
          ang: s.ang,
          width: s.width,
          height: s.height,
          finLength: s.finLength
        };
      });
    }

    var tempBoss = {
      x: tx, y: ty, r: db.r,
      ang: db.ang + rnd(-0.06, 0.06),
      color: Math.random() < 0.4 ? '#ffffff' : (Math.random() < 0.2 ? '#ffe066' : db.color),
      bossType: db.bossType,
      segments: segs,
      mandibleOpen: db.mandibleOpen,
      flash: (Math.sin(t * 35) > 0 ? 0.85 : 0),
      phaseT: t,
      phase: db.phase || 2,
      phase2: db.phase2 !== undefined ? db.phase2 : true,
      chargeT: 0,
      squash: 0.18 * Math.sin(t * 28),
      hitAng: Math.random() * TAU,
      spawn: 1,
      dormant: false,
      invuln: false,
      hp: 1, maxhp: 100
    };
    drawBossModel(tempBoss);

    // Electric energy crackles & lightning fissures across the hull
    ctx.strokeStyle = Math.random() < 0.5 ? '#ffffff' : '#35f0ff';
    ctx.lineWidth = 2.2;
    ctx.shadowColor = '#35f0ff';
    ctx.shadowBlur = 12;
    for (var fi = 0; fi < 6; fi++){
      var fa = fi * (TAU / 6) + t * 4;
      var fDist = db.r * (0.35 + 0.65 * Math.random());
      var fx1 = tx + Math.cos(fa) * (db.r * 0.15);
      var fy1 = ty + Math.sin(fa) * (db.r * 0.15);
      var fxMid = tx + Math.cos(fa + rnd(-0.5, 0.5)) * (fDist * 0.6);
      var fyMid = ty + Math.sin(fa + rnd(-0.5, 0.5)) * (fDist * 0.6);
      var fx2 = tx + Math.cos(fa) * fDist;
      var fy2 = ty + Math.sin(fa) * fDist;
      ctx.beginPath();
      ctx.moveTo(fx1, fy1);
      ctx.lineTo(fxMid, fyMid);
      ctx.lineTo(fx2, fy2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // Expanding white-hot fusion core
    var coreR = (t / 1.2) * (db.r * 0.85);
    var coreGrad = ctx.createRadialGradient(tx, ty, 0, tx, ty, Math.max(1, coreR));
    coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
    coreGrad.addColorStop(0.5, 'rgba(255, 224, 102, 0.65)');
    coreGrad.addColorStop(1, 'rgba(255, 53, 101, 0)');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(tx, ty, coreR, 0, TAU);
    ctx.fill();
  } else {
    // Phase 2: Radiant Supernova Starburst Rays
    var postT = t - 1.2;
    var burstAlpha = Math.max(0, 1 - postT / 0.9);
    if (burstAlpha > 0.01){
      ctx.save();
      ctx.globalAlpha = burstAlpha;
      ctx.strokeStyle = '#ffffff';
      ctx.shadowColor = db.color;
      ctx.shadowBlur = 18;
      var rayCount = 16;
      var rayLen = 140 + postT * 420;
      for (var ri = 0; ri < rayCount; ri++){
        var ra = (ri / rayCount) * TAU + postT * 0.6;
        var rWidth = (ri % 2 === 0 ? 3.5 : 1.8);
        ctx.lineWidth = rWidth;
        ctx.beginPath();
        ctx.moveTo(db.x + Math.cos(ra) * 15, db.y + Math.sin(ra) * 15);
        ctx.lineTo(db.x + Math.cos(ra) * rayLen, db.y + Math.sin(ra) * rayLen);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 40 Tumbling Geometric Crystal Shards
    if (db.shards){
      for (var si = 0; si < db.shards.length; si++){
        var sh = db.shards[si];
        var shAlpha = Math.max(0, Math.min(1, sh.life / (sh.maxLife * 0.6)));
        ctx.save();
        ctx.translate(sh.x, sh.y);
        ctx.rotate(sh.rot);
        ctx.globalAlpha = shAlpha;
        ctx.fillStyle = sh.color;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.2;
        ctx.shadowColor = sh.color;
        ctx.shadowBlur = 8;
        var sz = sh.size;
        ctx.beginPath();
        ctx.moveTo(0, -sz);
        ctx.lineTo(sz * 0.7, 0);
        ctx.lineTo(0, sz * 0.8);
        ctx.lineTo(-sz * 0.7, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  ctx.restore();
}

function drawEnemyModel(e){
  if (e.isBoss){ drawBossModel(e); return; }
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.squash > 0.01){
    ctx.rotate(e.hitAng);
    ctx.scale(1 + e.squash*0.42, 1 - e.squash*0.34);
    ctx.rotate(e.ang - e.hitAng);
  } else {
    ctx.rotate(e.ang);
  }
  var sc = 0.4 + 0.6*e.spawn;
  ctx.scale(sc, sc);

  var col = e.flash > 0 ? '#ffffff' : e.color;
  var r = e.r;
  var t = (G ? G.t : 0);
  ctx.lineWidth = Math.max(1.5, r*0.14);
  ctx.strokeStyle = col;
  ctx.fillStyle = 'rgba(6,8,14,0.7)';

  switch(e.type){
    case 'drifter':
      // Kinetic flex on swept razor wings
      var wingFlex = Math.sin(t*9 + e.x*0.08) * 0.14;
      var dPulse = 0.5 + 0.5 * Math.sin(t * 12 + e.x);

      // Layer 1: Dual micro-ion thrusters with supersonic shock diamonds
      for (var ti = -1; ti <= 1; ti += 2){
        var ty = ti * r * 0.32;
        var tFlame = (0.30 + Math.sin(t * 30 + ti * 2) * 0.14) * r;

        // Titanium nozzle cowl
        ctx.fillStyle = '#08060c';
        ctx.fillRect(-r * 0.58, ty - r * 0.09, r * 0.14, r * 0.18);
        ctx.strokeStyle = 'rgba(255, 77, 109, 0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(-r * 0.58, ty - r * 0.09, r * 0.14, r * 0.18);

        // Outer ion plume
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(-r * 0.55, ty - r * 0.08);
        ctx.lineTo(-r * 0.55 - tFlame, ty);
        ctx.lineTo(-r * 0.55, ty + r * 0.08);
        ctx.closePath();
        ctx.fill();

        // Supersonic shock diamond
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        var sdx = -r * 0.55 - tFlame * 0.45;
        ctx.moveTo(sdx - 2, ty);
        ctx.lineTo(sdx, ty - 2);
        ctx.lineTo(sdx + 2, ty);
        ctx.lineTo(sdx, ty + 2);
        ctx.closePath();
        ctx.fill();

        // White-hot core
        ctx.beginPath();
        ctx.moveTo(-r * 0.55, ty - r * 0.04);
        ctx.lineTo(-r * 0.55 - tFlame * 0.6, ty);
        ctx.lineTo(-r * 0.55, ty + r * 0.04);
        ctx.closePath();
        ctx.fill();
      }

      // Layer 2: Underglow Silhouette Pass
      ctx.save();
      ctx.shadowColor = col;
      ctx.shadowBlur = 8;
      ctx.strokeStyle = 'rgba(255, 77, 109, 0.4)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(r * 1.05, 0);
      ctx.lineTo(r * 0.25, -r * 0.28);
      ctx.lineTo(-r * 0.55, -r * (0.9 + wingFlex));
      ctx.lineTo(-r * 0.70, -r * (0.65 + wingFlex));
      ctx.lineTo(-r * 0.15, 0);
      ctx.lineTo(-r * 0.70, r * (0.65 + wingFlex));
      ctx.lineTo(-r * 0.55, r * (0.9 + wingFlex));
      ctx.lineTo(r * 0.25, r * 0.28);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();

      // Layer 3: Outer Faceted Razor-Wing Carapace
      ctx.beginPath();
      ctx.moveTo(r * 1.05, 0);
      ctx.lineTo(r * 0.25, -r * 0.28);
      ctx.lineTo(-r * 0.55, -r * (0.9 + wingFlex));
      ctx.lineTo(-r * 0.70, -r * (0.65 + wingFlex));
      ctx.lineTo(-r * 0.15, 0);
      ctx.lineTo(-r * 0.70, r * (0.65 + wingFlex));
      ctx.lineTo(-r * 0.55, r * (0.9 + wingFlex));
      ctx.lineTo(r * 0.25, r * 0.28);
      ctx.closePath();
      ctx.fillStyle = 'rgba(10, 8, 18, 0.92)';
      ctx.fill();
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // Layer 4: Inner Wing Armor Inset & Specular Bevel Seams
      ctx.beginPath();
      ctx.moveTo(r * 0.65, 0);
      ctx.lineTo(r * 0.10, -r * 0.20);
      ctx.lineTo(-r * 0.40, -r * 0.55);
      ctx.lineTo(-r * 0.10, 0);
      ctx.lineTo(-r * 0.40, r * 0.55);
      ctx.lineTo(r * 0.10, r * 0.20);
      ctx.closePath();
      ctx.fillStyle = 'rgba(24, 10, 24, 0.78)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 77, 109, 0.55)';
      ctx.lineWidth = 1.0;
      ctx.stroke();

      // Hard-light specular edge ridges along leading edges
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(r * 1.0, 0); ctx.lineTo(r * 0.25, -r * 0.26); ctx.lineTo(-r * 0.52, -r * (0.88 + wingFlex));
      ctx.moveTo(r * 1.0, 0); ctx.lineTo(r * 0.25, r * 0.26);  ctx.lineTo(-r * 0.52, r * (0.88 + wingFlex));
      ctx.stroke();

      // Wing panel bevel lines
      ctx.beginPath();
      ctx.moveTo(r * 0.35, 0); ctx.lineTo(-r * 0.45, -r * 0.55);
      ctx.moveTo(r * 0.35, 0); ctx.lineTo(-r * 0.45, r * 0.55);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1; ctx.stroke();

      // Articulated prow razor mandibles with glowing tips
      var mandGape = Math.sin(t * 10 + e.x) * 0.08;
      ctx.beginPath();
      ctx.moveTo(r * 0.65, -r * 0.15); ctx.lineTo(r * 1.25, -r * (0.22 + mandGape)); ctx.lineTo(r * 0.85, -r * 0.05);
      ctx.moveTo(r * 0.65, r * 0.15);  ctx.lineTo(r * 1.25, r * (0.22 + mandGape));  ctx.lineTo(r * 0.85, r * 0.05);
      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(r * 1.22, -r * (0.23 + mandGape), 2.5, 2.5);
      ctx.fillRect(r * 1.22, r * (0.21 + mandGape), 2.5, 2.5);

      // Rotating inner gyro core with specular highlight
      var gyroRot = t * 4.2;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.24, gyroRot, gyroRot + Math.PI * 0.85);
      ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.18, -gyroRot * 1.5, -gyroRot * 1.5 + Math.PI * 0.7);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.1; ctx.stroke();

      // Glowing ocular sensor array with biological respiration pulse
      ctx.beginPath(); ctx.arc(r*0.15, 0, r*(0.22 + dPulse * 0.04), 0, TAU);
      ctx.fillStyle = col; ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.15, 0, r*0.1, 0, TAU);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      break;

    case 'brute':
      // Juggernaut Heavy Assault Tank
      var bPulse = 0.5 + 0.5 * Math.sin(t * 8 + e.x);

      // Layer 1: Rear heavy thrusters (3 nozzles)
      for (var bti = -1; bti <= 1; bti++){
        var bty = bti * r * 0.32;
        var btFlame = (0.28 + Math.sin(t * 22 + bti * 2) * 0.12) * r;
        ctx.fillStyle = '#0b101c';
        ctx.fillRect(-r * 0.86, bty - r * 0.10, r * 0.12, r * 0.20);
        ctx.strokeStyle = '#ff7b00'; ctx.lineWidth = 1.0;
        ctx.strokeRect(-r * 0.86, bty - r * 0.10, r * 0.12, r * 0.20);

        ctx.fillStyle = '#ff5400';
        ctx.beginPath();
        ctx.moveTo(-r * 0.84, bty - r * 0.10);
        ctx.lineTo(-r * 0.84 - btFlame, bty);
        ctx.lineTo(-r * 0.84, bty + r * 0.10);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        ctx.moveTo(-r * 0.84, bty - r * 0.05);
        ctx.lineTo(-r * 0.84 - btFlame * 0.55, bty);
        ctx.lineTo(-r * 0.84, bty + r * 0.05);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-r * 0.84, bty - 2, 3, 4);
      }

      // Layer 2: Underglow Silhouette Pass
      ctx.save();
      ctx.shadowColor = col;
      ctx.shadowBlur = 10;
      ctx.strokeStyle = 'rgba(255, 77, 109, 0.45)';
      ctx.lineWidth = 3.0;
      ctx.beginPath();
      for (var i = 0; i < 6; i++){
        var a = i/6*TAU;
        var px = Math.cos(a)*r, py = Math.sin(a)*r;
        if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();

      // Layer 3: Heavy Interlocking Octagonal Blast Plates
      ctx.beginPath();
      for (var i2 = 0; i2 < 6; i2++){
        var a2_poly = i2/6*TAU;
        var px2 = Math.cos(a2_poly)*r, py2 = Math.sin(a2_poly)*r;
        if (i2) ctx.lineTo(px2, py2); else ctx.moveTo(px2, py2);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(10, 14, 24, 0.94)';
      ctx.fill();
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.4;
      ctx.stroke();

      // Specular hard-light edge bevels on outer hull facets
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      for (var sfi = 0; sfi < 3; sfi++){
        var sfa1 = sfi/6*TAU, sfa2 = (sfi+1)/6*TAU;
        ctx.moveTo(Math.cos(sfa1)*r*0.96, Math.sin(sfa1)*r*0.96);
        ctx.lineTo(Math.cos(sfa2)*r*0.96, Math.sin(sfa2)*r*0.96);
      }
      ctx.stroke();

      // Layer 4: Armored vertex bolt studs
      ctx.fillStyle = '#ffffff';
      for (var bi = 0; bi < 6; bi++){
        var ba = bi/6*TAU;
        ctx.beginPath();
        ctx.arc(Math.cos(ba)*r*0.88, Math.sin(ba)*r*0.88, Math.max(1.2, r*0.065), 0, TAU);
        ctx.fill();
      }

      // Layer 5: Hydraulic shock-absorber struts & side pauldrons
      for (var si = -1; si <= 1; si += 2){
        var sy = si * r * 0.58;
        ctx.fillStyle = '#161e30';
        ctx.fillRect(-r*0.48, sy - r*0.12, r*0.75, r*0.24);
        ctx.strokeStyle = col; ctx.lineWidth = 1.4;
        ctx.strokeRect(-r*0.48, sy - r*0.12, r*0.75, r*0.24);

        // Piston shaft
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-r * 0.15, sy - 1.5, r * 0.35, 3);
        ctx.fillStyle = '#ff7b00';
        ctx.fillRect(r * 0.20, sy - 2, 3, 4);
      }

      // Layer 6: Motorized inner rotating gear armor
      var gearRot = t * 1.5;
      ctx.beginPath();
      for (var j = 0; j < 6; j++){
        var a2 = j/6*TAU + Math.PI/6 + gearRot;
        var qx = Math.cos(a2)*r*0.52, qy = Math.sin(a2)*r*0.52;
        if (j) ctx.lineTo(qx, qy); else ctx.moveTo(qx, qy);
      }
      ctx.closePath();
      ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.stroke();

      // Counter-rotating inner serrated ring with specular glint
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.36, -gearRot * 1.8, -gearRot * 1.8 + Math.PI * 1.1);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();

      // Layer 7: Glowing thermal heatsink vent (thermal respiration pulse)
      ctx.fillStyle = 'rgba(255, 140, 40, ' + (0.35 + bPulse * 0.45) + ')';
      ctx.fillRect(-r * 0.22, -r * 0.35, r * 0.16, r * 0.7);
      ctx.strokeStyle = 'rgba(255, 224, 102, 0.6)'; ctx.lineWidth = 1;
      for (var hvi = -2; hvi <= 2; hvi++){
        ctx.beginPath();
        ctx.moveTo(-r * 0.22, hvi * r * 0.14);
        ctx.lineTo(-r * 0.06, hvi * r * 0.14);
        ctx.stroke();
      }

      // Layer 8: Central heavy cyclopean core
      ctx.beginPath(); ctx.arc(0, 0, r*(0.22 + bPulse * 0.03), 0, TAU); ctx.fillStyle = col; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, r*0.10, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
      break;

    case 'shooter':
      // Diamond stealth chassis & sniper platform
      var charge = e.shootT < 0.55 ? 1 - e.shootT/0.55 : 0;
      var sPulse = 0.5 + 0.5 * Math.sin(t * 10);

      // Layer 1: Rear stabilizer fins & micro-thrusters
      ctx.fillStyle = '#080a14';
      ctx.fillRect(-r * 0.95, -r * 0.18, r * 0.25, r * 0.36);
      ctx.strokeStyle = 'rgba(179, 136, 255, 0.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-r * 0.95, -r * 0.18, r * 0.25, r * 0.36);

      // Articulated cooling vanes that flare outward during charge
      var vaneFlare = charge * 0.18;
      for (var vni = -1; vni <= 1; vni += 2){
