  }

  var deadBossStat = (G.sector === 2) ?
    (G.boss ? (G.boss.phase2 ? 'VORACIS P2' : 'VORACIS P1') : ('SECTOR 2 W' + G.wave)) :
    (G.boss && !G.boss.dormant ? 'AWAKENED' : 'SEALED (LV 10)');
  drawDeadStat(G.sector === 2 ? 'skull' : 'shield', col1, statY, G.sector === 2 ? 'GARGANTUA STATUS' : 'LEVIATHAN STATUS', deadBossStat, '#35f0ff');
  drawDeadStat('clock',     col2, statY,      'SURVIVAL TIME', timeStr, '#35f0ff');
  drawDeadStat('crosshair', col1, statY + 28, 'HOSTILES PURGED', '' + G.kills, '#35f0ff');
  drawDeadStat('flame',     col2, statY + 28, 'PEAK STREAK', 'x' + G.best, '#ffe066');
  drawDeadStat('chip',      col1, statY + 56, 'FINAL HULL LEVEL', 'LV ' + G.player.lvl, '#3ddc97');
  drawDeadStat('trophy',    col2, statY + 56, 'BEST RUN LEVEL', 'LV ' + (HIGH_SCORE.level || G.player.lvl || 1), '#ffe066');

  // Combat Evaluation Performance Grade
  var evalGrade = (G.kills >= 100 || G.best >= 30) ? 'GRADE S // APEX ACE' : (G.kills >= 60 || G.best >= 20) ? 'GRADE A // ELITE' : (G.kills >= 30 || G.best >= 10) ? 'GRADE B // VETERAN' : 'GRADE C // CADET';
  var evalCol = (G.kills >= 100 || G.best >= 30) ? '#ffe066' : (G.kills >= 60 || G.best >= 20) ? '#35f0ff' : (G.kills >= 30 || G.best >= 10) ? '#3ddc97' : '#9fb6c8';
  var grW = cw - 80, grH = 22, grX = cx0 + 40, grY = cy0 + 214;
  ctx.fillStyle = 'rgba(25, 35, 55, 0.55)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(grX, grY, grW, grH, 4);
  else ctx.rect(grX, grY, grW, grH);
  ctx.fill();
  ctx.strokeStyle = evalCol;
  ctx.lineWidth = 1;
  ctx.stroke();
  drawIcon('flame', W/2 - 130, grY + 11, 10, evalCol);
  ctx.textAlign = 'center';
  ctx.font = 'bold 10px ui-monospace,monospace';
  ctx.fillStyle = evalCol;
  ctx.fillText('COMBAT RATING: ' + evalGrade, W/2 + 6, grY + 15);

  // High score record capsule
  var recY = cy0 + 242;
  var recW = cw - 80;
  var recX = cx0 + 40;
  ctx.fillStyle = 'rgba(255, 224, 102, 0.08)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(recX, recY, recW, 28, 6);
  else ctx.rect(recX, recY, recW, 28);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 224, 102, 0.35)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  drawIcon('trophy', W/2 - 170, recY + 14, 11, '#ffe066');
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe066';
  ctx.font = 'bold 10px ui-monospace,monospace';
  ctx.fillText('RECORD: LV ' + (HIGH_SCORE.level || G.player.lvl || 1) + '  •  ' + HIGH_SCORE.kills + ' KILLS  •  PEAK x' + HIGH_SCORE.streak + ' STREAK', W/2 + 8, recY + 18);

  // Primary Restart Button Pod
  var rstBtnY = cy0 + 278;
  var rstBtnW = cw - 80;
  var rstBtnX = cx0 + 40;
  var rstBtnH = 40;

  G.deadRestartRect = { x: rstBtnX, y: rstBtnY, w: rstBtnW, h: rstBtnH };
  var isHoverRst = mouse && mouse.active && mouse.x >= rstBtnX && mouse.x <= rstBtnX + rstBtnW && mouse.y >= rstBtnY && mouse.y <= rstBtnY + rstBtnH;
  ctx.fillStyle = isHoverRst ? 'rgba(53, 240, 255, 0.28)' : 'rgba(53, 240, 255, 0.12)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(rstBtnX, rstBtnY, rstBtnW, rstBtnH, 6);
  else ctx.rect(rstBtnX, rstBtnY, rstBtnW, rstBtnH);
  ctx.fill();
  ctx.strokeStyle = isHoverRst ? '#ffffff' : '#35f0ff';
  ctx.lineWidth = isHoverRst ? 2.2 : 1.5;
  ctx.stroke();

  // Tactile 3D button bevel
  ctx.fillStyle = isHoverRst ? 'rgba(255, 255, 255, 0.45)' : 'rgba(255, 255, 255, 0.18)';
  ctx.fillRect(rstBtnX + 3, rstBtnY + 1, rstBtnW - 6, 1);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(rstBtnX + 3, rstBtnY + rstBtnH - 1, rstBtnW - 6, 1);

  drawIcon('restart', W/2 - 120, rstBtnY + 20, 13, isHoverRst ? '#ffffff' : '#35f0ff');
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px ui-monospace,monospace';
  ctx.fillStyle = isHoverRst ? '#ffffff' : '#35f0ff';
  ctx.fillText('RE-ENGAGE CORE [SPACE / R]', W/2 + 10, rstBtnY + 25);

  // Secondary Buttons Row: HOME [H] & TRAINING [X]
  var secBtnY = rstBtnY + rstBtnH + 8;
  var secGap = 10;
  var secBtnW = (rstBtnW - secGap) / 2;
  var secBtnH = 34;

  // Home Button
  var deadHmX = rstBtnX;
  G.deadHomeRect = { x: deadHmX, y: secBtnY, w: secBtnW, h: secBtnH };
  var isHoverDeadHm = mouse && mouse.active && mouse.x >= deadHmX && mouse.x <= deadHmX + secBtnW && mouse.y >= secBtnY && mouse.y <= secBtnY + secBtnH;
  ctx.fillStyle = isHoverDeadHm ? 'rgba(255, 77, 109, 0.28)' : 'rgba(255, 77, 109, 0.10)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(deadHmX, secBtnY, secBtnW, secBtnH, 6);
  else ctx.rect(deadHmX, secBtnY, secBtnW, secBtnH);
  ctx.fill();
  ctx.strokeStyle = isHoverDeadHm ? '#ffffff' : '#ff4d6d';
  ctx.lineWidth = isHoverDeadHm ? 2 : 1.2;
  ctx.stroke();

  // Tactile 3D button bevel
  ctx.fillStyle = isHoverDeadHm ? 'rgba(255, 255, 255, 0.45)' : 'rgba(255, 255, 255, 0.18)';
  ctx.fillRect(deadHmX + 3, secBtnY + 1, secBtnW - 6, 1);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(deadHmX + 3, secBtnY + secBtnH - 1, secBtnW - 6, 1);

  drawIcon('home', deadHmX + secBtnW/2 - 44, secBtnY + 17, 12, isHoverDeadHm ? '#ffffff' : '#ff4d6d');
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px ui-monospace,monospace';
  ctx.fillStyle = isHoverDeadHm ? '#ffffff' : '#ff4d6d';
  ctx.fillText('HOME [H]', deadHmX + secBtnW/2 + 8, secBtnY + 21);

  // Training Button
  var deadTrnX = deadHmX + secBtnW + secGap;
  G.deadTrainingRect = { x: deadTrnX, y: secBtnY, w: secBtnW, h: secBtnH };
  var isHoverDeadTrn = mouse && mouse.active && mouse.x >= deadTrnX && mouse.x <= deadTrnX + secBtnW && mouse.y >= secBtnY && mouse.y <= secBtnY + secBtnH;
  ctx.fillStyle = isHoverDeadTrn ? 'rgba(157, 78, 221, 0.28)' : 'rgba(157, 78, 221, 0.10)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(deadTrnX, secBtnY, secBtnW, secBtnH, 6);
  else ctx.rect(deadTrnX, secBtnY, secBtnW, secBtnH);
  ctx.fill();
  ctx.strokeStyle = isHoverDeadTrn ? '#ffffff' : '#c77dff';
  ctx.lineWidth = isHoverDeadTrn ? 2 : 1.2;
  ctx.stroke();

  // Tactile 3D button bevel
  ctx.fillStyle = isHoverDeadTrn ? 'rgba(255, 255, 255, 0.45)' : 'rgba(255, 255, 255, 0.18)';
  ctx.fillRect(deadTrnX + 3, secBtnY + 1, secBtnW - 6, 1);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(deadTrnX + 3, secBtnY + secBtnH - 1, secBtnW - 6, 1);

  // Tactile death menu hover chime (distinct button tracking)
  var curDeadHoverId = isHoverRst ? 'rst' : (isHoverDeadHm ? 'home' : (isHoverDeadTrn ? 'trn' : null));
  if (curDeadHoverId){
    if (G._lastDeadHoverId !== curDeadHoverId){
      G._lastDeadHoverId = curDeadHoverId;
      if (sound && sound.hover) sound.hover();
    }
  } else {
    G._lastDeadHoverId = null;
  }

  // Bottom hint
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillStyle = '#678195';
  ctx.fillText('PRESS [SPACE] OR [R] TO RETRY  •  [H] HOME  •  [X] TRAINING', W/2, cy0 + ch - 16);

  ctx.restore();
}

function drawSkillSwapTray(){
  if (!G.skillSwapTray || (!G.skillSwapTray.active && G.skillSwapTray.animY > H + 160)) return;
  var sk = G.pendingSkill;
  if (!sk) return;

  var cardY = (G.buffTray && G.buffTray.active) ? G.buffTray.animY : G.skillSwapTray.animY;
  var ch = 44;
  var gap = 12;
  var maxTrayW = Math.min(W - 80, 720);
  var cw = Math.min(220, Math.floor((maxTrayW - gap * 2) / 3));
  var totalW = cw * 3 + gap * 2;
  var startX = Math.round((W - totalW) / 2);

  G.skillSwapCardQ = { x: startX, y: cardY, w: cw, h: ch };
  G.skillSwapCardSalvage = { x: startX + cw + gap, y: cardY, w: cw, h: ch };
  G.skillSwapCardRepair = { x: startX + (cw + gap) * 2, y: cardY, w: cw, h: ch };
  G.skillSwapCardDiscard = G.skillSwapCardSalvage;

  // Harmonize rects if already rendered via unified buffTray
  if (G.buffTray && G.buffTray.active && G.buffTray.cards && G.buffTray.cards.length >= 3){
    var bCards = G.buffTray.cards;
    G.skillSwapCardQ = bCards[0].rect || G.skillSwapCardQ;
    G.skillSwapCardSalvage = bCards[1].rect || G.skillSwapCardSalvage;
    G.skillSwapCardRepair = bCards[2].rect || G.skillSwapCardRepair;
    G.skillSwapCardDiscard = G.skillSwapCardSalvage;
    return;
  }

  var p = G.player;
  var qSk = (p && p.skills && p.skills.q && p.skills.q.skill) ? p.skills.q.skill : null;

  var cw = Math.min(270, Math.floor((W - 80) / 3));
  var ch = 104;
  var gap = 16;
  var totalW = cw * 3 + gap * 2;
  var startX = (W - totalW) / 2;
  var cardY = G.skillSwapTray.animY;

  ctx.save();

  // Floating Holographic Banner Prompt above cards (No emojis!)
  var promptY = cardY - 14;
  var pulse = 0.82 + Math.sin(G.t * 8) * 0.18;
  ctx.save();
  ctx.shadowBlur = 14; ctx.shadowColor = sk.col || '#ffe066';
  ctx.fillStyle = '#ffffff';
  var swapPrompt = 'CORE CAPACITY REACHED // ' + sk.name.toUpperCase() + ' (CD ' + sk.cd + 's) RECOVERED // CHOOSE REPLACEMENT';
  var promptFont = (W < 750 ? 'bold 10px ' : 'bold 12px ') + 'ui-monospace,monospace';
  ctx.font = promptFont;
  ctx.textAlign = 'center';
  ctx.globalAlpha = Math.min(1, Math.max(0, (H - cardY + 50) / 100)) * pulse;
  var ptm = ctx.measureText ? ctx.measureText(swapPrompt) : null;
  var promptHalfW = (ptm && typeof ptm.width === 'number') ? (ptm.width / 2 + 16) : 220;
  drawIcon('chip', Math.max(16, W / 2 - promptHalfW), promptY - 4, 12, sk.col || '#ffe066');
  ctx.fillText(swapPrompt, W / 2 + 6, promptY);
  ctx.restore();

  var cards = [
    {
      slot: 'q',
      keyText: '[ 1 / Q ]',
      actionTitle: sk.name.toUpperCase() + ' [Q]',
      currSkill: qSk,
      accentCol: '#35f0ff',
      target: 'q'
    },
    {
      slot: 'discard',
      keyText: '[ 2 ]',
      actionTitle: 'SALVAGE (+75 XP)',
      currSkill: null,
      accentCol: '#ffe066',
      target: 'discard'
    },
    {
      slot: 'repair',
      keyText: '[ 3 / ESC ]',
      actionTitle: 'REPAIR PROTOCOL',
      currSkill: null,
      accentCol: '#3ddc97',
      target: 'repair'
    }
  ];

  for (var i = 0; i < cards.length; i++){
    var cd = cards[i];
    var cx = startX + i * (cw + gap);
    var rect = { x: cx, y: cardY, w: cw, h: ch };

    if (cd.target === 'q') G.skillSwapCardQ = rect;
    else if (cd.target === 'discard') { G.skillSwapCardSalvage = rect; G.skillSwapCardDiscard = rect; }
    else if (cd.target === 'repair') G.skillSwapCardRepair = rect;

    var isHover = (mouse && mouse.active && mouse.x >= cx && mouse.x <= cx + cw && mouse.y >= cardY && mouse.y <= cardY + ch);

    ctx.save();

    // 1. Sleek Translucent Glass Card Fill
    if (cd.target === 'discard'){
      ctx.fillStyle = isHover ? 'rgba(50, 40, 18, 0.50)' : 'rgba(24, 20, 10, 0.35)';
    } else if (cd.target === 'repair'){
      ctx.fillStyle = isHover ? 'rgba(18, 50, 32, 0.50)' : 'rgba(10, 24, 16, 0.35)';
    } else {
      ctx.fillStyle = isHover ? 'rgba(18, 36, 62, 0.50)' : 'rgba(8, 16, 30, 0.35)';
    }
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(cx, cardY, cw, ch, 8);
    else ctx.rect(cx, cardY, cw, ch);
    ctx.fill();

    // 2. High-Glow Neon Border
    ctx.strokeStyle = isHover ? '#ffffff' : cd.accentCol;
    ctx.lineWidth = isHover ? 2.2 : 1.4;
    ctx.shadowBlur = isHover ? 16 : 8;
    ctx.shadowColor = cd.accentCol;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 3. Left Vertical Lightbar Accent
    ctx.strokeStyle = isHover ? '#ffffff' : cd.accentCol;
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + 2, cardY + 14);
    ctx.lineTo(cx + 2, cardY + ch - 14);
    ctx.stroke();

    // 4. Precision Corner Tech Ticks
    ctx.strokeStyle = isHover ? '#ffffff' : cd.accentCol;
    ctx.lineWidth = 2;
    var cl = 9;
    ctx.beginPath();
    ctx.moveTo(cx + cw - cl, cardY); ctx.lineTo(cx + cw, cardY); ctx.lineTo(cx + cw, cardY + cl);
    ctx.moveTo(cx + cw, cardY + ch - cl); ctx.lineTo(cx + cw, cardY + ch); ctx.lineTo(cx + cw - cl, cardY + ch);
    ctx.stroke();

    // 5. Backlit Keycap Badge
    var badgeW = 76, badgeH = 22;
    var badgeX = cx + 12, badgeY = cardY + 10;
    ctx.fillStyle = isHover ? cd.accentCol : 'rgba(255, 255, 255, 0.12)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 4);
    else ctx.rect(badgeX, badgeY, badgeW, badgeH);
    ctx.fill();
    ctx.strokeStyle = cd.accentCol; ctx.lineWidth = 1.1; ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = 'bold 10px ui-monospace,monospace';
    ctx.fillStyle = isHover ? '#050811' : '#ffffff';
    ctx.fillText(cd.keyText, badgeX + badgeW / 2, badgeY + 15);

    // 6. Action Title
    ctx.textAlign = 'left';
    ctx.font = 'bold 12px ui-monospace,monospace';
    ctx.fillStyle = isHover ? '#ffffff' : cd.accentCol;
    ctx.fillText(cd.actionTitle, cx + 96, cardY + 25);

    // 7. Divider Line
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.10)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx + 12, cardY + 38); ctx.lineTo(cx + cw - 12, cardY + 38);
    ctx.stroke();

    if (cd.target === 'discard'){
      drawIcon('chip', cx + 24, cardY + 58, 13, '#ffe066');
      ctx.textAlign = 'left';
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 12px ui-monospace,monospace';
      ctx.fillText('SALVAGE CORE (+75 XP)', cx + 42, cardY + 62);

      drawIcon('eject', cx + 24, cardY + 82, 11, '#829bb0');
      ctx.fillStyle = '#829bb0';
      ctx.font = '11px ui-monospace,monospace';
      ctx.fillText('Maintain ' + (qSk ? qSk.name : 'current skill'), cx + 42, cardY + 85);
    } else if (cd.target === 'repair'){
      drawIcon('heart', cx + 24, cardY + 58, 13, '#3ddc97');
      ctx.textAlign = 'left';
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 12px ui-monospace,monospace';
      ctx.fillText('RESTORE 50 HULL HP', cx + 42, cardY + 62);

      drawIcon('play', cx + 24, cardY + 82, 10, '#3ddc97');
      ctx.fillStyle = '#829bb0';
      ctx.font = '11px ui-monospace,monospace';
      ctx.fillText('Maintain ' + (qSk ? qSk.name : 'current skill'), cx + 42, cardY + 85);
    } else {
      var curr = cd.currSkill;
      ctx.textAlign = 'left';
      if (curr){
        drawIcon(curr.icon, cx + 22, cardY + 56, 16, curr.col);
        ctx.fillStyle = curr.col;
        ctx.font = 'bold 11px ui-monospace,monospace';
        ctx.fillText('CURRENT: ' + curr.name, cx + 42, cardY + 60);
      } else {
        drawIcon('lock', cx + 22, cardY + 56, 13, '#64748b');
        ctx.fillStyle = '#64748b';
        ctx.font = 'italic 11px ui-monospace,monospace';

function drawTitle(){
  drawCosmicBackground(ARENA/2, ARENA/2, false);
  drawGrid(0, 0, false);
  drawMapTextures(ARENA/2, ARENA/2);
  if (typeof drawMapFeatures === 'function') drawMapFeatures(ARENA/2, ARENA/2);
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < G.parts.length; i++){
    var pt = G.parts[i];
    ctx.globalAlpha = Math.max(0, pt.life/0.7) * 0.8;
    ctx.fillStyle = pt.col;
    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  ctx.textAlign = 'center';
  ctx.save();
  ctx.shadowBlur = G.godModeUnlocked ? 45 : 30;
  ctx.shadowColor = G.godModeUnlocked ? '#ffe066' : '#35f0ff';
  ctx.fillStyle = G.godModeUnlocked ? '#ffe066' : '#35f0ff';
  ctx.font = 'bold 62px ui-monospace,monospace';
  ctx.fillText('NEON DRIFT', W/2, H*0.38);
  ctx.restore();

  // Bounding rect for game title to register 3 clicks
  G.titleNameRect = { x: W/2 - 240, y: H*0.38 - 55, w: 480, h: 75 };

  // Version Subtitle Tag
  ctx.save();
  ctx.font = 'bold 11px ui-monospace,monospace';
  ctx.fillStyle = 'rgba(53, 240, 255, 0.7)';
  ctx.fillText('v2.4 APEX EDITION', W/2, H*0.38 + 18);
  ctx.restore();

  // Audio Status Toggle Pill in Top-Right
  var titleAudW = 126, titleAudH = 30;
  var titleAudX = W - titleAudW - 20, titleAudY = 16;
  G.titleAudioRect = { x: titleAudX, y: titleAudY, w: titleAudW, h: titleAudH };
  var isTitleAudHover = mouse.active && mouse.x >= titleAudX && mouse.x <= titleAudX + titleAudW && mouse.y >= titleAudY && mouse.y <= titleAudY + titleAudH;
  var tAudCol = audioMuted ? '#ff4d6d' : '#35f0ff';
  ctx.save();
  ctx.fillStyle = isTitleAudHover ? 'rgba(25, 45, 75, 0.85)' : 'rgba(8, 16, 30, 0.6)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(titleAudX, titleAudY, titleAudW, titleAudH, 6);
  else ctx.rect(titleAudX, titleAudY, titleAudW, titleAudH);
  ctx.fill();
  ctx.strokeStyle = isTitleAudHover ? '#ffffff' : tAudCol;
  ctx.lineWidth = isTitleAudHover ? 2 : 1.2;
  ctx.stroke();
  drawIcon(audioMuted ? 'mute' : 'audio', titleAudX + 18, titleAudY + 15, 12, isTitleAudHover ? '#ffffff' : tAudCol);
  ctx.textAlign = 'left';
  ctx.font = 'bold 10px ui-monospace,monospace';
  ctx.fillStyle = isTitleAudHover ? '#ffffff' : tAudCol;
  ctx.fillText(audioMuted ? 'MUTED [M]' : 'AUDIO [M]', titleAudX + 34, titleAudY + 19);
  ctx.restore();

  // If unlocked, display golden badge to access God Mode anytime
  if (G.godModeUnlocked){
    var gbw = 420, gbh = 26;
    var gbx = (W - gbw)/2, gby = H*0.42;
    G.titleGodModeBadgeRect = { x: gbx, y: gby, w: gbw, h: gbh };
    var isHoverGb = mouse.active && mouse.x >= gbx && mouse.x <= gbx + gbw && mouse.y >= gby && mouse.y <= gby + gbh;
    ctx.save();
    ctx.fillStyle = isHoverGb ? 'rgba(255, 224, 102, 0.35)' : 'rgba(255, 224, 102, 0.15)';
    ctx.strokeStyle = isHoverGb ? '#ffffff' : '#ffe066';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(gbx, gby, gbw, gbh, 5);
    else ctx.rect(gbx, gby, gbw, gbh);
    ctx.fill(); ctx.stroke();
    drawIcon('chip', W/2 - 190, gby + 13, 12, isHoverGb ? '#ffffff' : '#ffe066');
    ctx.textAlign = 'center';
    ctx.fillStyle = isHoverGb ? '#ffffff' : '#ffe066';
    ctx.font = 'bold 11px ui-monospace,monospace';
    ctx.fillText('DEBUG KERNEL ACTIVE // PRESS [G] TO CONFIGURE', W/2 + 8, gby + 17);
    ctx.restore();
  }

  /* demo models */
  var demoY = H*0.48;
  var demos = [['drifter',-150],['splitter',-75],['shooter',0],['brute',80],['shard',150]];
  for (var d = 0; d < demos.length; d++){
    var dd = demos[d];
    var fake = { type:demos[d][0], x:W/2 + dd[1], y:demoY,
      ang:Math.sin(G.t*1.4 + d)*0.5, r:ENEMY_TYPES[demos[d][0]].r,
      color:ENEMY_TYPES[demos[d][0]].color, flash:0, squash:0, hitAng:0,
      spawn:1, shootT:1, hp:1, maxhp:1 };
    drawEnemyModel(fake);
  }

  if (HIGH_SCORE.kills > 0){
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 12px ui-monospace,monospace';
    var maxLvl = HIGH_SCORE.level || 1;
    ctx.fillText('RECORD: LEVEL ' + maxLvl + '  •  ' + HIGH_SCORE.kills + ' KILLS  •  MAX x' + HIGH_SCORE.streak + ' STREAK', W/2, H*0.54);
  }

  var subFontSz = Math.min(14, Math.max(9, Math.floor(W / 65)));
  ctx.fillStyle = '#9fb6c8';
  ctx.font = subFontSz + 'px ui-monospace,monospace';
  ctx.fillText('repel 5 hostile waves  •  stabilize combat enhancements  •  breach stasis egg  •  destroy the titan', W/2, H*0.58);

  var ctrlFontSz = Math.min(15, Math.max(10, Math.floor(W / 58)));
  ctx.fillStyle = '#35f0ff';
  ctx.font = 'bold ' + ctrlFontSz + 'px ui-monospace,monospace';
  ctx.fillText('[WASD] MOVE   •   [ARROWS] DIRECTIONAL FIRE   •   [SPACE] DASH   •   [Q] SKILL   •   [P] PAUSE', W/2, H*0.63);

  ctx.fillStyle = '#7de8ff';
  ctx.font = '11px ui-monospace,monospace';
  ctx.fillText('TACTICAL VECTOR AIM ASSIST ACTIVE', W/2, H*0.665);

  G.titleAutoAimRect = null;

  // Mission Action Buttons: START MISSION [SPACE] & TRAINING ROOM [X]
  var actBtnW = Math.min(200, (W - 50) / 2);
  var actBtnH = 46;
  var actGap = 16;
  var actY = H * 0.71;

  // 1. Start Mission Button
  var startX = W / 2 - actBtnW - actGap / 2;
  G.titleStartRect = { x: startX, y: actY, w: actBtnW, h: actBtnH };
  var isHoverStart = mouse.active && mouse.x >= startX && mouse.x <= startX + actBtnW && mouse.y >= actY && mouse.y <= actY + actBtnH;
  ctx.save();
  ctx.fillStyle = isHoverStart ? 'rgba(53, 240, 255, 0.35)' : 'rgba(53, 240, 255, 0.14)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(startX, actY, actBtnW, actBtnH, 8);
  else ctx.rect(startX, actY, actBtnW, actBtnH);
  ctx.fill();
  ctx.strokeStyle = isHoverStart ? '#ffffff' : '#35f0ff';
  ctx.lineWidth = isHoverStart ? 2.5 : 1.5;
  ctx.stroke();

  // Tactile 3D button bevel
  ctx.fillStyle = isHoverStart ? 'rgba(255, 255, 255, 0.5)' : 'rgba(255, 255, 255, 0.22)';
  ctx.fillRect(startX + 4, actY + 1, actBtnW - 8, 1);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(startX + 4, actY + actBtnH - 1, actBtnW - 8, 1);

  drawIcon('play', startX + 24, actY + 22, 14, isHoverStart ? '#ffffff' : '#35f0ff');
  ctx.textAlign = 'left';
  ctx.font = 'bold 13px ui-monospace,monospace';
  ctx.fillStyle = isHoverStart ? '#ffffff' : '#35f0ff';
  ctx.fillText('START MISSION', startX + 42, actY + 20);
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillStyle = isHoverStart ? '#ffffff' : '#829bb0';
  ctx.fillText('[SPACE] / [ENTER]', startX + 42, actY + 34);
  ctx.restore();

  // 2. Training Room Button
  var trnX = W / 2 + actGap / 2;
  G.titleTrainingRect = { x: trnX, y: actY, w: actBtnW, h: actBtnH };
  var isHoverTrn = mouse.active && mouse.x >= trnX && mouse.x <= trnX + actBtnW && mouse.y >= actY && mouse.y <= actY + actBtnH;
  ctx.save();
  ctx.fillStyle = isHoverTrn ? 'rgba(224, 170, 255, 0.35)' : 'rgba(224, 170, 255, 0.14)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(trnX, actY, actBtnW, actBtnH, 8);
  else ctx.rect(trnX, actY, actBtnW, actBtnH);
  ctx.fill();
  ctx.strokeStyle = isHoverTrn ? '#ffffff' : '#e0aaff';
  ctx.lineWidth = isHoverTrn ? 2.5 : 1.5;
  ctx.stroke();

  // Tactile 3D button bevel
  ctx.fillStyle = isHoverTrn ? 'rgba(255, 255, 255, 0.5)' : 'rgba(255, 255, 255, 0.22)';
  ctx.fillRect(trnX + 4, actY + 1, actBtnW - 8, 1);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(trnX + 4, actY + actBtnH - 1, actBtnW - 8, 1);

  drawIcon('target', trnX + 24, actY + 22, 14, isHoverTrn ? '#ffffff' : '#e0aaff');
  ctx.textAlign = 'left';
  ctx.font = 'bold 13px ui-monospace,monospace';
  ctx.fillStyle = isHoverTrn ? '#ffffff' : '#e0aaff';
  ctx.fillText('TRAINING ROOM', trnX + 42, actY + 20);
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillStyle = isHoverTrn ? '#ffffff' : '#829bb0';
  ctx.fillText('CLICK OR PRESS [X]', trnX + 42, actY + 34);
  ctx.restore();

  // Tactile title hover chime (distinct button tracking)
  var curTitleHoverId = isHoverStart ? 'start' : (isHoverTrn ? 'trn' : (isTitleAudHover ? 'aud' : (isHoverGb ? 'god' : null)));
  if (curTitleHoverId){
    if (G._lastTitleHoverId !== curTitleHoverId){
      G._lastTitleHoverId = curTitleHoverId;
      if (sound && sound.hover) sound.hover();
    }
  } else {
    G._lastTitleHoverId = null;
  }
  updateCursor();
}

var last = 0;
function loop(t){
  if (!last) last = t;
  var raw = Math.min(0.033, (t - last)/1000) || 0;
  last = t;

  if (window.music && music.tick) music.tick(raw);
  if (typeof pollGamepad === 'function') pollGamepad(raw);

  if (G && (G.state === 'pause' || G.state === 'godmode')){
    if (G.state === 'pause') G.pauseT = (G.pauseT || 0) + raw;
    render();
    requestAnimationFrame(loop);
    return;
  }

  if (G.hitstop > 0){ G.hitstop -= raw; }
  G.slow = 0;

  var scale = 1;
  if (G.hitstop > 0) scale = 0.05;

  G.flash = Math.max(0, G.flash - raw*3.2);
  G.vig = Math.max(0, G.vig - raw*2.2);

  update(raw * scale);
  render();
  requestAnimationFrame(loop);
}
log('5 ok');
requestAnimationFrame(loop);
setTimeout(function(){ if (!hadError) boot.style.display = 'none'; }, 1500);
</script>
</body>
</html>
